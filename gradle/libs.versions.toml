[versions]
minecraft = "1.21.11"
folia-api = "1.21.11-R0.1-SNAPSHOT"

run-task = "3.0.2"

# A szerver által bundle-ölt Log4j2-höz csak fordításhoz kell (compileOnly) — a Filter API
# verziók közt stabil, futásidőben a Paper saját példánya él.
log4j = "2.24.1"

# Soft-dependenciák (compileOnly — futásidőben opcionálisak). A PlaceholderAPI API-pin a
# class-spec-dependencies.lock.yml 1.21.11 runtime pinjével azonos. A LibsDisguises hidak
# tisztán reflexiósak; a régebbi compile-only artifact csak build-kompatibilitási baseline,
# a tényleges dev/runtime verziót a lock (11.0.18) kezeli.
placeholderapi = "2.12.3"
libsdisguises = "10.0.44"

[libraries]
folia-api = { module = "dev.folia:folia-api", version.ref = "folia-api" }
log4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j" }
placeholderapi = { module = "me.clip:placeholderapi", version.ref = "placeholderapi" }
libsdisguises = { module = "LibsDisguises:LibsDisguises", version.ref = "libsdisguises" }

[plugins]
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run-task" }
