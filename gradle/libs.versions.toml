[versions]
minecraft = "1.21.11"
folia-api = "1.21.11-R0.1-SNAPSHOT"

run-task = "3.0.2"

# Soft-dependenciák (compileOnly — futásidőben opcionálisak). A verziókat a szerveren
# telepített pluginokhoz igazítsd, ha eltér.
placeholderapi = "2.11.6"     # a szerveren PlaceholderAPI 2.12.2 fut — az API visszafelé kompatibilis
libsdisguises = "10.0.44"     # csak ha LibsDisguises is fel lesz telepítve (Druida-formák vizuálja)

[libraries]
folia-api = { module = "dev.folia:folia-api", version.ref = "folia-api" }
placeholderapi = { module = "me.clip:placeholderapi", version.ref = "placeholderapi" }
libsdisguises = { module = "LibsDisguises:LibsDisguises", version.ref = "libsdisguises" }

[plugins]
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run-task" }
