name: Equipment Final Exact Head

on:
  pull_request:
    branches:
      - feature/vanilla-crafting-boundary
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-attribute-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout equipment branch for one-shot regression contract refresh
        uses: actions/checkout@v4
        with:
          ref: feature/equipment-2
          fetch-depth: 0
          persist-credentials: true
      - name: Replace stale ItemMeta implementation assertions with the proven Paper component contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/regression/java/hu/taliann/icesmp/itemization/EquipmentDomainRegressionSuite.java')
          source = path.read_text()
          old = '''        check(factory.contains("applyCanonicalAttributeModifiers"),
                  "canonical attribute path is explicit");
          check(factory.contains("applyAttributeModifiers(item, specs, appendStatLore, false)"),
                  "canonical attribute path disables Material default seeding");
          check(factory.contains("meta.setAttributeModifiers(com.google.common.collect.ArrayListMultimap.create())"),
                  "canonical zero-stat/suppressed path owns an explicit empty attribute component");
'''
          new = '''        check(factory.contains("applyCanonicalAttributeModifiers"),
                  "canonical attribute path is explicit");
          final int canonicalStart = factory.indexOf("public static boolean applyCanonicalAttributeModifiers");
          final int canonicalEnd = factory.indexOf("private static boolean applyAttributeModifiers", canonicalStart);
          check(canonicalStart >= 0 && canonicalEnd > canonicalStart,
                  "canonical attribute writer source boundary is present");
          final String canonicalWriter = factory.substring(canonicalStart, canonicalEnd);
          check(canonicalWriter.contains("ItemAttributeModifiers.itemAttributes()"),
                  "canonical attribute path builds a Paper valued ATTRIBUTE_MODIFIERS component");
          check(canonicalWriter.contains("item.setData(DataComponentTypes.ATTRIBUTE_MODIFIERS, component)"),
                  "canonical zero/non-zero projection explicitly installs the Paper component");
          check(!canonicalWriter.contains("seedDefaultAttributeModifiers"),
                  "canonical attribute writer never seeds backing Material defaults");
'''
          if source.count(old) != 1:
              raise SystemExit('stale attribute regression anchor mismatch')
          path.write_text(source.replace(old, new))
          PY
          # Remove this one-shot writer from the final tree; keep the exact-head gate read-only.
          git show HEAD^:.github/workflows/equipment-final-exact.yml > .github/workflows/equipment-final-exact.yml
          git config user.name "Csik Milán"
          git config user.email "81396861+MilCsik09@users.noreply.github.com"
          git add src/regression/java/hu/taliann/icesmp/itemization/EquipmentDomainRegressionSuite.java .github/workflows/equipment-final-exact.yml
          git diff --cached --check
          git commit -m "test(equipment): align attribute regression with Paper component authority"
          git push origin HEAD:feature/equipment-2

  exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact equipment head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact parent and clean patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/vanilla-crafting-boundary:refs/remotes/origin/feature/vanilla-crafting-boundary
          test "$(git merge-base HEAD refs/remotes/origin/feature/vanilla-crafting-boundary)" = "$(git rev-parse refs/remotes/origin/feature/vanilla-crafting-boundary)"
          git diff --check "refs/remotes/origin/feature/vanilla-crafting-boundary...HEAD"
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install repository audit dependencies
        run: python -m pip install --disable-pip-version-check 'PyYAML>=6.0,<7.0' 'Pillow==11.3.0'
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Clean build and stacked behavioral regressions
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean build --console=plain --no-daemon --stacktrace
          ./gradlew equipmentDomainRegressionTest itemizationDomainRegressionTest \
            vanillaCraftingBoundaryRegressionTest runeLifecycleRegressionTest \
            playerProfileFullAuthorityRegressionTest professionRecipeAuditRegressionTest \
            configStartupRegressionTest --no-daemon --console=plain
      - name: Source authority and repository consistency
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_consistency.py
          python3 scripts/test_player_profile_authority.py
          python3 scripts/check_player_profile_authority.py --root . --write-report build/player-profile-authority-equipment-final.json
          python3 scripts/check_markdown_links.py
      - name: Require clean tested worktree
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
