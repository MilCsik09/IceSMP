name: Fix Long-Term Catalog Legacy Set Anchor

on:
  push:
    branches:
      - feature/equipment-catalog-expansion

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'PyYAML>=6.0,<7.0'
      - name: Patch generator and rematerialize
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/generate_long_term_equipment_catalog.py')
          text = p.read_text(encoding='utf-8')
          old = '''                    templates[ident] = patch\n'''
          new = '''                    if line.get("set"):\n                        patch["set-id"] = line["set"]\n                    templates[ident] = patch\n'''
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit('legacy-anchor generator seam drifted')
              p.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python3 scripts/generate_long_term_equipment_catalog.py --write
          python3 scripts/generate_long_term_equipment_catalog.py --check
          python3 scripts/audit_long_term_equipment_catalog.py --require-eight-sets
          if git diff --quiet -- scripts/generate_long_term_equipment_catalog.py src/main/resources/config/equipment-catalog-expansion.yml; then
            echo 'Legacy set anchor already materialized.'
            exit 0
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/generate_long_term_equipment_catalog.py src/main/resources/config/equipment-catalog-expansion.yml
          git commit -m 'fix(equipment): preserve mechanical set on legacy anchor'
          git push origin HEAD:feature/equipment-catalog-expansion
