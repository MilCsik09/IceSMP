name: Claim Y restore gate

on:
  push:
    branches:
      - fix/runtime-hardening-audit-20260803
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: claim-y-restore-${{ github.ref }}
  cancel-in-progress: false

jobs:
  restore-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout authenticated feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/runtime-hardening-audit-20260803
          fetch-depth: 0
          lfs: true

      - name: Verify ancestry and clean tree
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 7529d077f019916700f402e335fb4a715c59c2dd HEAD
          git status --short --branch
          test -z "$(git status --porcelain)"

      - name: Apply original bounded Y behaviour
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_claim_y_restore.py
          rm .github/scripts/apply_claim_y_restore.py
          rm .github/workflows/claim-y-restore.yml
          git diff --check
          git diff --stat

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run full clean build and regressions
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean check --console=plain --no-daemon --stacktrace

      - name: Run repository validation gates
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_gui_icons.py
          python3 scripts/check_consistency.py
          git diff --check
          test ! -e .github/scripts/apply_claim_y_restore.py
          test ! -e .github/workflows/claim-y-restore.yml

      - name: Commit and push without force
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            src/main/java/hu/taliann/icesmp/managers/ClaimManager.java \
            src/main/java/hu/taliann/icesmp/utils/DisplayFxUtil.java \
            src/main/java/hu/taliann/icesmp/commands/ClaimCommand.java \
            src/regression/java/hu/taliann/icesmp/runtime/RuntimeHardeningRegressionSuite.java \
            docs/RUNTIME_HARDENING_AUDIT.md
          git add -u -- \
            .github/scripts/apply_claim_y_restore.py \
            .github/workflows/claim-y-restore.yml
          git diff --cached --check
          git diff --cached --stat
          test -n "$(git diff --cached --name-only)"
          git commit -m "fix: restore bounded claim Y ranges"
          git push origin HEAD:fix/runtime-hardening-audit-20260803
