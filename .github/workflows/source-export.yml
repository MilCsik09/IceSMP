name: Review cache export

on:
  push:
    branches:
      - codex/source-export-45
  pull_request:
    branches:
      - claude/projekt-audit-u0hkcz

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Populate Gradle distribution and dependency cache
        run: ./gradlew clean build --no-daemon --stacktrace
      - name: Package Gradle home
        run: tar -C "$HOME" -czf "$RUNNER_TEMP/gradle-home.tar.gz" .gradle
      - name: Upload Gradle cache
        uses: actions/upload-artifact@v4
        with:
          name: icesmp-gradle-home
          path: ${{ runner.temp }}/gradle-home.tar.gz
          retention-days: 1
