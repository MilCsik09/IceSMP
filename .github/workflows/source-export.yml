name: Publish reviewed moderation fix

on:
  pull_request:
    types: [reopened]
    branches:
      - claude/projekt-audit-u0hkcz

permissions:
  contents: write

jobs:
  publish:
    if: github.head_ref == 'codex/source-export-45'
    runs-on: ubuntu-latest
    steps:
      - name: Check out verified patch payload
        uses: actions/checkout@v4
        with:
          path: publisher
      - name: Check out moderation feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/native-moderation-suite
          fetch-depth: 0
          path: work
      - name: Verify lease and apply reviewed patch
        env:
          EXPECTED_HEAD: 788a8f019d84648a8155652f356d074ea29b647a
          EXPECTED_PATCH_SHA256: fa80f3b26d02516509678a16242e2bfa4a0d95b4e8abddc25570213fc9fad67d
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/work"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          cat "$GITHUB_WORKSPACE/publisher/.review/pr45.patch.gz.b64.part"{1..6} > "$RUNNER_TEMP/patch.b64"
          base64 --decode "$RUNNER_TEMP/patch.b64" > "$RUNNER_TEMP/patch.gz"
          gzip -dc "$RUNNER_TEMP/patch.gz" > "$RUNNER_TEMP/review.patch"
          echo "$EXPECTED_PATCH_SHA256  $RUNNER_TEMP/review.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/review.patch"
          git apply --index "$RUNNER_TEMP/review.patch"
          git diff --cached --check
          git config user.name "OpenAI Codex Review"
          git config user.email "codex-review@openai.invalid"
          git commit -m "fix(moderation): close lifecycle and ownership review gaps"
          git push origin HEAD:feature/native-moderation-suite
          git rev-parse HEAD | tee "$RUNNER_TEMP/review-commit-sha"
      - name: Upload published commit SHA
        uses: actions/upload-artifact@v4
        with:
          name: moderation-review-publish
          path: ${{ runner.temp }}/review-commit-sha
          retention-days: 1
