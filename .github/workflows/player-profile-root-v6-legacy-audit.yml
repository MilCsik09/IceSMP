name: PlayerProfile recovered concise legacy-authority audit (temporary)

on:
  pull_request:
    branches:
      - agent/player-profile-root-reconstruct-20260803-v6
    paths:
      - .github/player-profile-root-v6-legacy-audit-trigger.txt
  workflow_dispatch:

permissions:
  contents: read

env:
  RECOVERY_BRANCH: agent/player-profile-root-recovered-20260803-v4
  EXPECTED_RECOVERY_HEAD: 258ea27e0ba96cbbae0d9f7e39c6b20ee444d480
  TARGET_BRANCH: rework/class-spec-profile-v2
  EXPECTED_TARGET_HEAD: f25e7e600f418724dd2341e39387a0fa5c0625de

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact authenticated recovery history
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RECOVERY_BRANCH }}
          fetch-depth: 0
          persist-credentials: false

      - name: Emit concise machine-readable legacy authority report
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_RECOVERY_HEAD"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$EXPECTED_TARGET_HEAD"

          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          symbols = (
              "ClassProfile",
              "ClassProfileCodec",
              "ClassProfileRepository",
              "ClassProfileLifecycleService",
              "ClassProfileMutationStore",
              "BukkitClassProfileSessionBridge",
              "YamlClassProfileRepository",
              "RepositoryMutationStoreAdapter",
          )
          roots = (Path("src/main/java"), Path("src/regression/java"))
          files = [p for root in roots for p in root.rglob("*.java")]
          files.append(Path("build.gradle.kts"))
          definitions = {}
          references = []
          for path in sorted(files):
              text = path.read_text(encoding="utf-8")
              lines = text.splitlines()
              for symbol in symbols:
                  definition_pattern = re.compile(
                      rf"\b(?:class|interface|record|enum)\s+{re.escape(symbol)}\b"
                  )
                  for number, line in enumerate(lines, 1):
                      if symbol not in line:
                          continue
                      item = {
                          "path": str(path),
                          "line": number,
                          "symbol": symbol,
                          "text": line.strip(),
                      }
                      if definition_pattern.search(line):
                          definitions.setdefault(symbol, []).append(item)
                      else:
                          references.append(item)

          candidates = sorted({
              item["path"] for values in definitions.values() for item in values
          })
          new_counterparts = sorted(
              str(path) for root in roots for path in root.rglob("*.java")
              if re.search(
                  r"ClassSpecSection|PlayerProfile|BukkitClassSpecSectionSessionBridge",
                  path.name,
              )
          )
          report = {
              "recovery_head": "258ea27e0ba96cbbae0d9f7e39c6b20ee444d480",
              "target_head": "f25e7e600f418724dd2341e39387a0fa5c0625de",
              "definition_files": candidates,
              "definitions": definitions,
              "references_excluding_definitions": references,
              "new_counterpart_files": new_counterparts,
              "counts": {
                  "definition_files": len(candidates),
                  "references": len(references),
                  "new_counterparts": len(new_counterparts),
              },
          }
          print("LEGACY_AUTHORITY_REPORT=" + json.dumps(report, sort_keys=True))
          PY
