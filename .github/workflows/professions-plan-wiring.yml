name: Professions Plan Wiring

on:
  push:
    branches: [feature/professions-2]

permissions:
  contents: write

jobs:
  wire:
    if: ${{ github.event.head_commit.message == 'ci(professions): wire shared effective craft plan' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact craft-plan wiring
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('src/main/java/hu/taliann/icesmp/listeners/ProfessionRecipeBookListener.java')
          s=p.read_text()
          old='''        final ProfessionRecipeCatalog.EconomyMetadata economy = catalog.economy(recipe.id());
        final int batches = batchRequested && economy.batchable() && recipe.templateId() == null
                && recipe.affixTier() == null ? Math.min(5, economy.batchLimit()) : 1;
        if (!hasIngredients(player, recipe)) {
            player.sendMessage(messageManager.get("profession-recipe-missing", "&cNincs meg minden hozzávaló ehhez a recepthez."));
            return;
        }
'''
          new='''        final ProfessionRecipeCatalog.EconomyMetadata economy = catalog.economy(recipe.id());
        final int batches = batchRequested && economy.batchable() && recipe.templateId() == null
                && recipe.affixTier() == null ? Math.min(5, economy.batchLimit()) : 1;
        final hu.taliann.icesmp.professions.ProfessionSpecializationEconomyPolicy.Effect specialization =
                hu.taliann.icesmp.professions.ProfessionSpecializationEconomyPolicy.effectFor(player, recipe);
        final hu.taliann.icesmp.professions.ProfessionEffectiveCraftPlan plan =
                hu.taliann.icesmp.professions.ProfessionEffectiveCraftPlan.of(recipe, specialization, batches);
        if (!hasIngredients(player, plan)) {
            player.sendMessage(messageManager.get("profession-recipe-missing", "&cNincs meg minden hozzávaló ehhez a recepthez."));
            return;
        }
'''
          if s.count(old)!=1: raise SystemExit('listener preflight anchor mismatch')
          s=s.replace(old,new)
          old='''        final var transaction = craftTransaction.apply(player, recipe, batches, outputs);'''
          new='''        final var transaction = craftTransaction.apply(player, plan, outputs);'''
          if s.count(old)!=1: raise SystemExit('listener transaction anchor mismatch')
          s=s.replace(old,new)
          start=s.index('    private boolean hasIngredients(final Player player, final ProfessionRecipeCatalog.Recipe recipe) {')
          end=s.index('    private int countUnique(', start)
          replacement='''    private boolean hasIngredients(final Player player,
                                   final hu.taliann.icesmp.professions.ProfessionEffectiveCraftPlan plan) {
        for (final Map.Entry<Material, Integer> entry : plan.materialInputs().entrySet()) {
            if (hu.taliann.icesmp.utils.PlainIngredients.count(
                    player, entry.getKey(), uniqueMaterials) < entry.getValue()) return false;
        }
        for (final Map.Entry<String, Integer> entry : plan.uniqueInputs().entrySet()) {
            if (countUnique(player, entry.getKey()) < entry.getValue()) return false;
        }
        return true;
    }

'''
          s=s[:start]+replacement+s[end:]
          p.write_text(s)

          p=Path('src/main/java/hu/taliann/icesmp/gui/ProfessionRecipeGUI.java')
          s=p.read_text()
          old='''        final boolean learned = !recipe.blueprint()
                || professionManager.hasLearnedRecipe(player, recipe.id());
        final boolean hasMats = hasIngredients(player, recipe, uniqueMaterials);
        final boolean craftable = levelOk && learned && hasMats;
        final ProfessionRecipeCatalog.EconomyMetadata economy = catalog.economy(recipe.id());
        final ProfessionSpecializationEconomyPolicy.Effect specialization =
                ProfessionSpecializationEconomyPolicy.effectFor(player, recipe);
'''
          new='''        final boolean learned = !recipe.blueprint()
                || professionManager.hasLearnedRecipe(player, recipe.id());
        final ProfessionRecipeCatalog.EconomyMetadata economy = catalog.economy(recipe.id());
        final ProfessionSpecializationEconomyPolicy.Effect specialization =
                ProfessionSpecializationEconomyPolicy.effectFor(player, recipe);
        final hu.taliann.icesmp.professions.ProfessionEffectiveCraftPlan plan =
                hu.taliann.icesmp.professions.ProfessionEffectiveCraftPlan.of(recipe, specialization, 1);
        final boolean hasMats = hasIngredients(player, plan, uniqueMaterials);
        final boolean craftable = levelOk && learned && hasMats;
'''
          if s.count(old)!=1: raise SystemExit('gui plan anchor mismatch')
          s=s.replace(old,new)
          s=s.replace('for (final Map.Entry<Material, Integer> entry : recipe.ingredients().entrySet()) {\n            final int have = countMaterial',
                      'for (final Map.Entry<Material, Integer> entry : plan.materialInputs().entrySet()) {\n            final int have = countMaterial',1)
          s=s.replace('for (final Map.Entry<String, Integer> entry : recipe.uniqueIngredients().entrySet()) {\n            final int have = countUnique',
                      'for (final Map.Entry<String, Integer> entry : plan.uniqueInputs().entrySet()) {\n            final int have = countUnique',1)
          old='''        if (economy.batchable()) {
            lore.add(Component.text("⇧ Shift+katt: 5-ös batch (max " + economy.batchLimit() + ")",
                    NamedTextColor.GOLD).decoration(TextDecoration.ITALIC, false));
        }
'''
          new='''        if (economy.batchable()) {
            final int maxCraftable = maxCraftableBatches(player, recipe, specialization,
                    economy.batchLimit(), uniqueMaterials);
            lore.add(Component.text("⇧ Shift+katt: 5-ös batch (limit " + economy.batchLimit()
                            + " • most max " + maxCraftable + ")",
                    NamedTextColor.GOLD).decoration(TextDecoration.ITALIC, false));
        }
'''
          if s.count(old)!=1: raise SystemExit('gui batch anchor mismatch')
          s=s.replace(old,new)
          start=s.index('    private static boolean hasIngredients(final Player player,')
          end=s.index('    public static int countUnique(', start)
          replacement='''    private static boolean hasIngredients(final Player player,
                                          final hu.taliann.icesmp.professions.ProfessionEffectiveCraftPlan plan,
                                          final hu.taliann.icesmp.items.UniqueMaterialFactory uniqueMaterials) {
        for (final Map.Entry<Material, Integer> entry : plan.materialInputs().entrySet()) {
            if (countMaterial(player, entry.getKey(), uniqueMaterials) < entry.getValue()) return false;
        }
        for (final Map.Entry<String, Integer> entry : plan.uniqueInputs().entrySet()) {
            if (countUnique(player, entry.getKey(), uniqueMaterials) < entry.getValue()) return false;
        }
        return true;
    }

    private static int maxCraftableBatches(final Player player,
                                            final ProfessionRecipeCatalog.Recipe recipe,
                                            final ProfessionSpecializationEconomyPolicy.Effect specialization,
                                            final int limit,
                                            final hu.taliann.icesmp.items.UniqueMaterialFactory uniqueMaterials) {
        int result = 0;
        for (int candidate = 1; candidate <= Math.max(1, Math.min(64, limit)); candidate++) {
            final var candidatePlan = hu.taliann.icesmp.professions.ProfessionEffectiveCraftPlan.of(
                    recipe, specialization, candidate);
            if (!hasIngredients(player, candidatePlan, uniqueMaterials)) break;
            result = candidate;
        }
        return result;
    }

'''
          s=s[:start]+replacement+s[end:]
          p.write_text(s)

          p=Path('src/regression/java/hu/taliann/icesmp/professions/Professions2RegressionSuite.java')
          s=p.read_text()
          anchor='''        professionSpecializationRolesAreCompleteAndDiverse();
        System.out.println("Professions2RegressionSuite: OK");'''
          repl='''        professionSpecializationRolesAreCompleteAndDiverse();
        effectiveCraftPlanUsesPerBatchRounding();
        System.out.println("Professions2RegressionSuite: OK");'''
          if s.count(anchor)!=1: raise SystemExit('regression main anchor mismatch')
          s=s.replace(anchor,repl)
          marker='''    private static void require(final boolean condition, final String message) {'''
          method='''    private static void effectiveCraftPlanUsesPerBatchRounding() {
        final var efficiency = new ProfessionSpecializationEconomyPolicy.Effect(
                ProfessionSpecializationEconomyPolicy.Role.PROCESSING_EFFICIENCY,
                "regression", 0.90D, 1.0D);
        require(ProfessionEffectiveCraftPlan.effectiveInput(2, efficiency, 1) == 2,
                "single craft must ceil its own 10% efficiency result");
        require(ProfessionEffectiveCraftPlan.effectiveInput(2, efficiency, 2) == 4,
                "two-batch craft must equal two single crafts");
        require(ProfessionEffectiveCraftPlan.effectiveInput(2, efficiency, 5) == 10,
                "five-batch craft must not gain a rounding discount");
        require(ProfessionEffectiveCraftPlan.effectiveInput(10, efficiency, 5) == 45,
                "per-batch efficiency still applies when each batch crosses the rounding boundary");
    }

'''
          if s.count(marker)!=1: raise SystemExit('regression method anchor mismatch')
          s=s.replace(marker,method+marker)
          p.write_text(s)
          PY
          rm .github/workflows/professions-plan-wiring.yml
          git config user.name "Csik Milán"
          git config user.email "81396861+MilCsik09@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(professions): wire shared effective craft plan"
          git push origin HEAD:feature/professions-2
