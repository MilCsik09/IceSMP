name: IceSMP crate-after-sit publisher

on:
  pull_request:
    branches:
      - claude/projekt-audit-u0hkcz

permissions:
  contents: write

jobs:
  publish:
    name: Merge, verify and publish crate after sit
    if: github.head_ref == 'agent/crate-after-sit-publisher'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout publisher transport
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build exact integration and publish with lease
        shell: bash
        run: |
          set -euo pipefail
          TARGET_BRANCH=claude/projekt-audit-u0hkcz
          TARGET_SHA=2432e031a1f63fa4d77bcc5ac25245de597b2675
          CRATE_BRANCH=feature/native-crates-completion
          CRATE_SHA=11fcaffa2903e24d275c9466c2fdff52b90ce1fb
          RESOLVER_SHA=1f057fa3e02a7f8f632acb38821d76677703c1ca28c06b3ae0687167fe08803f
          EXPECTED_TREE=d6de952cac0ae1ab881d0942e434ae311d40679c

          remote_target=$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')
          remote_crate=$(git ls-remote origin "refs/heads/$CRATE_BRANCH" | awk '{print $1}')
          test "$remote_target" = "$TARGET_SHA"
          test "$remote_crate" = "$CRATE_SHA"

          echo "$RESOLVER_SHA  .review/resolve_crate_after_sit.py" | sha256sum --check --strict
          cp .review/resolve_crate_after_sit.py /tmp/resolve_crate_after_sit.py

          git fetch origin \
            "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH" \
            "+refs/heads/$CRATE_BRANCH:refs/remotes/origin/$CRATE_BRANCH"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$TARGET_SHA"
          test "$(git rev-parse origin/$CRATE_BRANCH)" = "$CRATE_SHA"

          git config user.name "IceSMP review automation"
          git config user.email "noreply@github.com"
          git checkout -B crate-after-sit "$TARGET_SHA"
          set +e
          git merge --no-commit --no-ff "$CRATE_SHA"
          merge_rc=$?
          set -e
          test "$merge_rc" -eq 1

          python3 /tmp/resolve_crate_after_sit.py
          git checkout "$TARGET_SHA" -- .github/workflows/ci.yml
          git add -A
          test -z "$(git diff --name-only --diff-filter=U)"
          ! grep -RInE '^(<<<<<<<|=======|>>>>>>>)' \
            CHANGELOG.md PLAYTEST.md build.gradle.kts docs src/main || false
          git commit -m "merge: integrate reviewed crate lifecycle after sit-only"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git rev-list --count "$TARGET_SHA..HEAD")" = "4"

          ./gradlew crateRegressionTest sitRegressionTest --no-daemon --stacktrace
          ./gradlew clean build --no-daemon --stacktrace --no-configuration-cache
          python3 scripts/check_consistency.py
          git diff --check "$TARGET_SHA...HEAD"

          remote_target=$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')
          remote_crate=$(git ls-remote origin "refs/heads/$CRATE_BRANCH" | awk '{print $1}')
          test "$remote_target" = "$TARGET_SHA"
          test "$remote_crate" = "$CRATE_SHA"
          git push origin "HEAD:refs/heads/$CRATE_BRANCH" \
            --force-with-lease="refs/heads/$CRATE_BRANCH:$CRATE_SHA"
