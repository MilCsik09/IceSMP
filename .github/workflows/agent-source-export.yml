name: Agent Source Export

on:
  pull_request:
    branches:
      - claude/projekt-audit-u0hkcz
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    name: Export repository snapshot and build cache
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Warm build dependencies
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean build --no-daemon --stacktrace
      - name: Package source and Gradle home
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude='./.git' -czf /tmp/icesmp-source.tar.gz .
          tar --exclude='.gradle/daemon' --exclude='.gradle/workers' --exclude='.gradle/notifications' -czf /tmp/gradle-home.tar.gz -C "$HOME" .gradle
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: icesmp-source-f4e82263-v2
          path: /tmp/icesmp-source.tar.gz
          if-no-files-found: error
          retention-days: 1
      - name: Upload Gradle home
        uses: actions/upload-artifact@v4
        with:
          name: icesmp-gradle-home-f4e82263
          path: /tmp/gradle-home.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
