name: Agent Source Export

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - claude/projekt-audit-u0hkcz
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    name: Export current AFK source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout AFK branch
        uses: actions/checkout@v4
        with:
          ref: 66b2a362cdefb557e66c2d518d234b32db97e0ba
          fetch-depth: 0

      - name: Verify exact AFK head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "66b2a362cdefb557e66c2d518d234b32db97e0ba"

      - name: Package source
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude='./.git' \
            --exclude='./.gradle' \
            --exclude='./build' \
            --exclude='./Other' \
            -czf /tmp/icesmp-afk-source.tar.gz .

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: icesmp-afk-source-66b2a36
          path: /tmp/icesmp-afk-source.tar.gz
          if-no-files-found: error
          retention-days: 1
