name: Agent AFK Patch Publisher

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - claude/projekt-audit-u0hkcz
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Validate and publish native AFK commits
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout publisher branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and apply native AFK patch
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=.github/agent-patches-afk/afk.mbox.gz.b64
          test "$(wc -c < "$SOURCE")" -eq 60060
          base64 --decode "$SOURCE" > /tmp/afk.mbox.gz
          echo "72a57e3947328e4ae04b0f579c58058c0086d1388ccda584d2713af9631b8a44  /tmp/afk.mbox.gz" | sha256sum -c -
          gzip -t /tmp/afk.mbox.gz
          gzip -dc /tmp/afk.mbox.gz > /tmp/afk.mbox
          git config user.name "IceSMP Automation"
          git config user.email "actions@users.noreply.github.com"
          git checkout --detach f4e82263d35c645a053eccac09a3ad254a36ed90
          git am /tmp/afk.mbox
          git push --force-with-lease=refs/heads/feature/native-afk-zones:f4e82263d35c645a053eccac09a3ad254a36ed90 origin HEAD:refs/heads/feature/native-afk-zones
