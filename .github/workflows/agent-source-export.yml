name: Agent MOTD Publisher

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - claude/projekt-audit-u0hkcz
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Validate and publish native MOTD commits
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout publisher branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and apply native MOTD patch
        shell: bash
        run: |
          set -euo pipefail
          echo "462d682faaba3f9f7b08365869a18470029935d32a806e31d98ee090e524d82e  .github/agent-patches-motd/chunks/part00" | sha256sum -c -
          echo "2bf46094d2252bea8c0c6cacd90d26dc00cbfce9a22a1b24b9127a8d6ad3618b  .github/agent-patches-motd/chunks/part01" | sha256sum -c -
          echo "9dcd3bdf214faea3cc8e70312428923e937bc428486cf3959c193716dce8f865  .github/agent-patches-motd/chunks/part02" | sha256sum -c -
          echo "9290a0f89b0123739db113f81021a4babad58a9d4896cfa6e4f8a2dc5b8c3559  .github/agent-patches-motd/chunks/part03" | sha256sum -c -
          echo "6b3c140cf3b7c67604e538ce4950f224d1c5e30181cd0544f51fa6ae3909915f  .github/agent-patches-motd/chunks/part04" | sha256sum -c -
          echo "6e3eaf1f01666155e3b938353ee26216cc649b0547632a851323fef42b82d800  .github/agent-patches-motd/chunks/part05" | sha256sum -c -
          echo "b3c3871fc163e6e54875e26ca460a672477e45476a82e9bda23bbe235270449c  .github/agent-patches-motd/chunks/part06" | sha256sum -c -
          echo "f426875bef9273ad54f6a30aad361c0327b94618d31fb1243c58bdcbd09ed3cb  .github/agent-patches-motd/chunks/part07" | sha256sum -c -
          echo "03a5ae779c7bb254ea989b27cc8f7871695d8e7d6d1ef00420aafa4baa428b20  .github/agent-patches-motd/chunks/part08" | sha256sum -c -
          cat .github/agent-patches-motd/chunks/part* > /tmp/motd.mbox.gz.b64
          test "$(wc -c < /tmp/motd.mbox.gz.b64)" -eq 35400
          base64 --decode /tmp/motd.mbox.gz.b64 > /tmp/motd.mbox.gz
          echo "f1aafd8c3d8aac4ba6cac3c5191d7a802b213d234748db1cbdaa634642686760  /tmp/motd.mbox.gz" | sha256sum -c -
          gzip -t /tmp/motd.mbox.gz
          gzip -dc /tmp/motd.mbox.gz > /tmp/motd.mbox
          echo "30b9d2b167a24eb9dcb6b79d1891db9adfec980279991757b953de08fbeaa014  /tmp/motd.mbox" | sha256sum -c -
          git config user.name "IceSMP Automation"
          git config user.email "actions@users.noreply.github.com"
          git checkout --detach 5449dc726c785d5ee1305c457046daa1e60879fc
          git am /tmp/motd.mbox
          git push --force-with-lease=refs/heads/feature/native-motd-completion:5449dc726c785d5ee1305c457046daa1e60879fc origin HEAD:refs/heads/feature/native-motd-completion
