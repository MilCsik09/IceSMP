name: Agent Source Export

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - claude/projekt-audit-u0hkcz
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    name: Export current moderation source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout moderation branch
        uses: actions/checkout@v4
        with:
          ref: feature/native-moderation-suite
          fetch-depth: 0

      - name: Verify exact moderation head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "5449dc726c785d5ee1305c457046daa1e60879fc"

      - name: Package source
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude='./.git' \
            --exclude='./.gradle' \
            --exclude='./build' \
            --exclude='./Other' \
            -czf /tmp/icesmp-moderation-source.tar.gz .

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: icesmp-moderation-source-5449dc7
          path: /tmp/icesmp-moderation-source.tar.gz
          if-no-files-found: error
          retention-days: 1
