name: Agent Patch Publisher

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - claude/projekt-audit-u0hkcz
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Validate and publish moderation commits
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout publisher branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate and apply moderation patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/agent-patches-v2/moderation.part* > /tmp/moderation.patch.gz.b64
          test "$(wc -c < /tmp/moderation.patch.gz.b64)" -eq 92616
          base64 --decode /tmp/moderation.patch.gz.b64 > /tmp/moderation.patch.gz
          echo "000a906053bbf7a634ec0faf859397c7533850e623881034160118ccb3cf6437  /tmp/moderation.patch.gz" | sha256sum -c -
          gzip -t /tmp/moderation.patch.gz
          gzip -dc /tmp/moderation.patch.gz > /tmp/moderation.mbox
          git config user.name "IceSMP Automation"
          git config user.email "actions@users.noreply.github.com"
          git checkout --detach f4e82263d35c645a053eccac09a3ad254a36ed90
          git am /tmp/moderation.mbox
          git push --force-with-lease=refs/heads/feature/native-moderation-suite:f4e82263d35c645a053eccac09a3ad254a36ed90 origin HEAD:refs/heads/feature/native-moderation-suite
