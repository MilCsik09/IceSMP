name: Agent Sit Publisher

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - claude/projekt-audit-u0hkcz
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Validate and publish native sit commits
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout publisher branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and apply native sit patch
        shell: bash
        run: |
          set -euo pipefail
          echo "8db2530ac2c1f85ae48595230b369402f18bc7cda9799b32901b1864297574a6  .github/agent-patches-sit/chunks/part00a" | sha256sum -c -
          echo "ea59809d3d2b6530237b98d492ccc2d01f5dfab810ebaf88378fe6f5fc9a78ea  .github/agent-patches-sit/chunks/part00b" | sha256sum -c -
          echo "d0ce94fc8329ad7fd0230d811016949d08e437014eb9a9ffe49186280498cd74  .github/agent-patches-sit/chunks/part01" | sha256sum -c -
          echo "984d10d37033547af33d8857eb1f4af1d883d19a0d485e8044046627273ec0ff  .github/agent-patches-sit/chunks/part02" | sha256sum -c -
          echo "8e29ff656d0efb769daab1066266fbd05282da6289eee9f3036efc16425c68e2  .github/agent-patches-sit/chunks/part03" | sha256sum -c -
          echo "8910e4c2e5f488b6203a5fc13d958dfc52242ffa135c29624ee74d6ca0a284c7  .github/agent-patches-sit/chunks/part04" | sha256sum -c -
          echo "d03712f80c64573a634e35bfb1e7d4449ce42ca5e2670f71ec6ef8bf6114b514  .github/agent-patches-sit/chunks/part05" | sha256sum -c -
          cat .github/agent-patches-sit/chunks/part* > /tmp/sit.mbox.gz.b64
          test "$(wc -c < /tmp/sit.mbox.gz.b64)" -eq 50688
          base64 --decode /tmp/sit.mbox.gz.b64 > /tmp/sit.mbox.gz
          echo "4e65ec25a7dd957238ffbb04ebbd50fc49a5a75245fe62f77c2cea5189626845  /tmp/sit.mbox.gz" | sha256sum -c -
          gzip -t /tmp/sit.mbox.gz
          gzip -dc /tmp/sit.mbox.gz > /tmp/sit.mbox
          git config user.name "IceSMP Automation"
          git config user.email "actions@users.noreply.github.com"
          git checkout --detach f4e82263d35c645a053eccac09a3ad254a36ed90
          git am /tmp/sit.mbox
          git push --force-with-lease=refs/heads/feature/native-sit-poses:f4e82263d35c645a053eccac09a3ad254a36ed90 origin HEAD:refs/heads/feature/native-sit-poses
