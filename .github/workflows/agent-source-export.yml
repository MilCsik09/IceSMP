name: Agent Crate Publisher

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - claude/projekt-audit-u0hkcz
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Validate and publish native crate commits
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout publisher branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and apply native crate patch
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c <<'CHECKSUMS'
          096494166c61717692d6d993fffce2799eb57358f57d11da816e8982c62d6780  .github/agent-patches-crates/chunks/part00
          44c00e40829a99c8a166e8c638999ddef0ddde066851ac99872e663a0b818388  .github/agent-patches-crates/chunks/part01
          acdfe7129aa20917edc17d63c7ecd960c2ffc1749ef9bdc6fbb9b6ee392b6fa4  .github/agent-patches-crates/chunks/part02
          542fb3d90c158729f49db57600218e648bc5dc31456b9568b7862728614743e3  .github/agent-patches-crates/chunks/part03
          b0c13f13e5ff003a3f633a7ac160fa56f0e51aa9896c7786753562f8ced84856  .github/agent-patches-crates/chunks/part04
          83ed7b391f1e781bddb49e274f8cd0a5fc1e4a6c8b5c9ab6cc672c2c50229dc8  .github/agent-patches-crates/chunks/part05
          a066d065a766f1a515d05ee61b25fb57355888400d1c31aebd27e25370f2dfc1  .github/agent-patches-crates/chunks/part06
          b4d735ac5c6809ef1422f6136889dc21af0125cd86ca39a7a478f8b62f2ce451  .github/agent-patches-crates/chunks/part07
          0faefb615647d45954a0be755667ea8081932c9f2777ee2be84c78923e5d07f4  .github/agent-patches-crates/chunks/part08
          5b81b5f69f3e2577fb2edb82dc3e7d90c07f34555ecba0b008b0d432d6224276  .github/agent-patches-crates/chunks/part09
          dd9038f4d19b7418d82bb0d39bd132e28ad86421874dd14105ae0d0914ba5da3  .github/agent-patches-crates/chunks/part10
          c482d4c439ef90269e8514e4e96eb33d7c27c2ac9183d2550d5613cd571d007e  .github/agent-patches-crates/chunks/part11
          24865db00a8076e7f8fe0b224c672018ac5def6bc0f0e3cec7f9ac5f56ad868  .github/agent-patches-crates/chunks/part12
          7a11fae94b4998db1d40e52113830a5ae9afe7fc771eaf991b751415349492e7  .github/agent-patches-crates/chunks/part13
          6b6848d8675318993bec1ac9520166e86d6b441e0f8cac0ec23b8e68350ee81f  .github/agent-patches-crates/chunks/part14
          CHECKSUMS
          cat .github/agent-patches-crates/chunks/part* > /tmp/crates.mbox.gz.b64
          test "$(wc -c < /tmp/crates.mbox.gz.b64)" -eq 74328
          base64 --decode /tmp/crates.mbox.gz.b64 > /tmp/crates.mbox.gz
          echo "68002d7fc9f90bf1ce9b326648d87a856e54a6c189bfa46a5fdf7fcad543fc6b  /tmp/crates.mbox.gz" | sha256sum -c -
          gzip -t /tmp/crates.mbox.gz
          gzip -dc /tmp/crates.mbox.gz > /tmp/crates.mbox
          echo "e74cd11babe78d2910d1faf21b0099009fbc7303302ea5cfdd1cb1f3eda1532c  /tmp/crates.mbox" | sha256sum -c -
          git config user.name "IceSMP Automation"
          git config user.email "actions@users.noreply.github.com"
          git checkout --detach f4e82263d35c645a053eccac09a3ad254a36ed90
          git am /tmp/crates.mbox
          test "$(git log -1 --format=%s)" = "ci: run checks for native crate PRs"
          test "$(git log -2 --format=%s | tail -1)" = "docs(crates): document native crate replacement"
          test "$(git log -3 --format=%s | tail -1)" = "feat(crates): complete native crate lifecycle"
          git push --force-with-lease=refs/heads/feature/native-crates-completion:f4e82263d35c645a053eccac09a3ad254a36ed90 origin HEAD:refs/heads/feature/native-crates-completion
