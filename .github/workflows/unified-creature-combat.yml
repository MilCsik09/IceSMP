name: Unified Creature Combat Profiles

on:
  push:
    branches:
      - feature/unified-creature-combat-profiles
  pull_request:
    branches:
      - feature/combat-encounter-recalibration

permissions:
  contents: read

jobs:
  exact-head-unified-creatures:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout exact child head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 256
          persist-credentials: false

      - name: Verify exact stacked parent and merge-base
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PARENT: feature/combat-encounter-recalibration
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"
          git fetch --no-tags --depth=256 origin "${PARENT}:refs/remotes/origin/${PARENT}"
          parent_sha=$(git rev-parse "refs/remotes/origin/${PARENT}")
          merge_base=$(git merge-base HEAD "refs/remotes/origin/${PARENT}")
          read behind ahead < <(git rev-list --left-right --count "refs/remotes/origin/${PARENT}...HEAD")
          test "${merge_base}" = "${parent_sha}"
          test "${behind}" = "0"
          test "${ahead}" -gt "0"
          mkdir -p build/reports/unified-creature-combat
          printf '{"child":"%s","parent":"%s","merge_base":"%s","behind":0,"ahead":%s}\n' \
            "${EXPECTED_HEAD}" "${parent_sha}" "${merge_base}" "${ahead}" \
            > build/reports/unified-creature-combat/final-topology.json
          echo "CREATURE_PARENT_SHA=${parent_sha}" >> "${GITHUB_ENV}"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install report dependencies
        run: python -m pip install --disable-pip-version-check 'PyYAML>=6.0,<7.0' 'Pillow==11.3.0'

      - name: Validate creature matrix and deterministic evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_unified_creature_combat.py --check \
            --output build/reports/unified-creature-combat
          python3 scripts/audit_combat_encounter_foundation.py --check \
            --output build/reports/unified-creature-combat
          python3 scripts/test_progression_balance.py
          python3 scripts/check_consistency.py

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Full build and cumulative regressions
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean build unifiedCreatureCombatAudit combatEncounterFoundationAudit \
            mobEncounterDomainRegressionTest mobRuntimeSourceRegressionTest \
            itemizationDomainRegressionTest equipmentDomainRegressionTest \
            targetFrameRegressionTest advancedConfigMenuRegressionTest \
            --no-daemon --console=plain | tee gradle-unified-creature-combat.log

      - name: Paper 1.21.11 creature authority runtime proof
        shell: bash
        timeout-minutes: 12
        env:
          JAVA_TOOL_OPTIONS: >-
            -Dicesmp.source-integrity-runtime=true
            -Dicesmp.combat-evidence-dir=${{ github.workspace }}/build/reports/unified-creature-combat
        run: |
          set -euo pipefail
          rm -rf run
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          set +e
          timeout --signal=INT --kill-after=20s 420s ./gradlew --no-daemon --console=plain \
            --init-script scripts/source_integrity_runtime.init.gradle runServer \
            2>&1 | tee paper-unified-creature-combat.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ ${status} -ne 0 && ${status} -ne 124 && ${status} -ne 130 ]]; then
            exit "${status}"
          fi
          grep -E "Running the server|Starting minecraft server version 1\.21\.11|Done \(" \
            paper-unified-creature-combat.log
          grep -F 'ICESMP_SOURCE_INTEGRITY_RUNTIME_PROBE_PASS' paper-unified-creature-combat.log
          ! grep -F 'ICESMP_SOURCE_INTEGRITY_RUNTIME_PROBE_FAIL' paper-unified-creature-combat.log
          ! grep -E "Could not load.*IceSMP|Error occurred while enabling IceSMP|Exception.*IceSMP" \
            paper-unified-creature-combat.log
          test -s build/reports/unified-creature-combat/creature-runtime-report.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("build/reports/unified-creature-combat/creature-runtime-report.json").read_text())
          assert report["runtime"] == "Paper 1.21.11"
          assert report["inventory_exact"] is True
          assert report["supported_species_count"] >= 80
          assert {row["entity_type"] for row in report["representative_profiles"]} == {
              "COW", "RABBIT", "GOAT", "BEE", "WOLF", "ZOMBIE", "SKELETON"
          }
          PY
          cp paper-unified-creature-combat.log \
            build/reports/unified-creature-combat/runtime-proof.log

      - name: Recreate exact-head closure and repository checks
        shell: bash
        run: |
          set -euo pipefail
          child_sha=$(git rev-parse HEAD)
          merge_base=$(git merge-base HEAD "${CREATURE_PARENT_SHA}")
          read behind ahead < <(git rev-list --left-right --count "${CREATURE_PARENT_SHA}...HEAD")
          test "${merge_base}" = "${CREATURE_PARENT_SHA}"
          test "${behind}" = "0"
          printf '{"child":"%s","parent":"%s","merge_base":"%s","behind":0,"ahead":%s}\n' \
            "${child_sha}" "${CREATURE_PARENT_SHA}" "${merge_base}" "${ahead}" \
            > build/reports/unified-creature-combat/final-topology.json
          python3 scripts/audit_unified_creature_combat.py --check \
            --output build/reports/unified-creature-combat
          python3 scripts/audit_combat_encounter_foundation.py --check \
            --output build/reports/unified-creature-combat
          python3 scripts/test_resource_pack.py
          python3 scripts/check_consistency.py
          python3 scripts/check_documentation_coverage.py
          python3 scripts/check_markdown_links.py

      - name: Assemble immutable evidence bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle=build/reports/unified-creature-combat/bundle
          mkdir -p "${bundle}"
          cp docs/development/combat-balance-authority.json "${bundle}/"
          cp build/reports/unified-creature-combat/*.json "${bundle}/"
          cp build/reports/unified-creature-combat/runtime-proof.log "${bundle}/"
          cp gradle-unified-creature-combat.log "${bundle}/"
          find "${bundle}" -type f -print0 | sort -z | xargs -0 sha256sum > "${bundle}/SHA256SUMS"

      - name: Upload exact-head creature evidence
        uses: actions/upload-artifact@v4
        with:
          name: unified-creature-combat-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/reports/unified-creature-combat/bundle
          if-no-files-found: error
          retention-days: 30

      - name: Prove tracked checkout remains clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
