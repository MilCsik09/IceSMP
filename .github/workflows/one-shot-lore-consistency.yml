name: One-shot lore consistency migration

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Teach consistency check about split lore help
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("scripts/check_consistency.py")
          source = path.read_text()
          old = '''    _usage = re.search(r"/lore <([a-z0-9|-]+)>", _lore_src)
              _usage_topics = set(_usage.group(1).split("|")) if _usage else set()'''
          new = '''    # Az olvasható, több soros súgó minden témát külön `/lore tema` alakban sorol.
              # A korábbi egyetlen `<a|b|c>` lista továbbra is támogatott a régi branchekhez.
              _usage_topics = set(re.findall(r"/lore ([a-z0-9-]+)", _lore_src))
              _legacy_usage = re.search(r"/lore <([a-z0-9|-]+)>", _lore_src)
              if _legacy_usage:
                  _usage_topics.update(_legacy_usage.group(1).split("|"))'''

          def restore(value: str) -> str:
              lines = value.splitlines()
              baseline = len(lines[0]) - len(lines[0].lstrip())
              return "\n".join([lines[0]] + [(" " * baseline) + line for line in lines[1:]])

          if old in source:
              source = source.replace(old, new, 1)
          else:
              old_fixed = restore(old)
              new_fixed = restore(new)
              if old_fixed not in source:
                  if "_legacy_usage = re.search" in source:
                      print("Consistency migration already applied.")
                      raise SystemExit(0)
                  raise SystemExit("Could not locate legacy lore usage parser")
              source = source.replace(old_fixed, new_fixed, 1)
          path.write_text(source)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check_consistency.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: validate split lore usage lines"
          git push origin HEAD:${{ github.head_ref }}
