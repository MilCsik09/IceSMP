name: One-shot configurable corruption migration

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Remove corruption hard ceilings from packaged config
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("src/main/resources/config/world.yml")
          source = path.read_text()
          if "absolute-mob-cap:" not in source:
              print("Corruption config already migrated.")
              raise SystemExit(0)

          pattern = re.compile(
              r"  min-world-spawn-distance: 384[^\n]*\n"
              r"  legacy-cleanup-seconds: 1800[^\n]*\n"
              r"  initial-radius: 12\.0\n"
              r"  radius-cap: 40\.0\n"
              r"  absolute-radius-cap: 40\.0[^\n]*\n"
              r"  spread-per-night: 2\.0\n"
              r"  absolute-spread-per-night: 2\.0\n"
              r"  mob-cap: 6[^\n]*\n"
              r"  absolute-mob-cap: 8[^\n]*\n"
              r"  spawn-batch: 1\n"
              r"  mob-lifespan-seconds: 300[^\n]*\n"
              r"  mob-level: 4\n"
              r"  absolute-mob-level: 5\n")
          replacement = '''  min-world-spawn-distance: 384 # 0 = nincs spawn-kizárás
  spawn-grace-seconds: 10     # párhuzamos spawnpróbák közti foglalási idő
  tracking-padding: 16.0      # aktív góc entitás-visszavételi keresési ráhagyása
  legacy-cleanup-seconds: 1800 # 0 = nincs marker nélküli legacy takarítási ablak
  legacy-cleanup-padding: 32.0
  initial-radius: 12.0
  radius-cap: 40.0            # 0 vagy negatív = korlátlan növekedés
  spread-per-night: 2.0
  mob-cap: 6                  # 0 vagy negatív = fajzat-spawn kikapcsolva
  spawn-batch: 1
  mob-types: [ "ZOMBIE", "SKELETON", "WITHER_SKELETON", "PHANTOM" ]
  mob-level-bonus: 4          # normál helyfüggő mob-szint + ez az érték
  mob-glowing: true
  mob-persistent: false
  mob-remove-when-far-away: true
  mob-lifespan-seconds: 300   # 0 vagy negatív = nincs időzített despawn
'''
          updated, count = pattern.subn(replacement, source, count=1)
          if count != 1:
              raise SystemExit(f"world.yml corruption block match count: {count}")
          path.write_text(updated)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/resources/config/world.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: remove corruption hard ceilings from config"
          git push origin HEAD:${{ github.head_ref }}
