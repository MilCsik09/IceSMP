name: Gameplay Bootstrap Integrity Hardening

on:
  pull_request:
    branches:
      - feature/config-content-command-surface-2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gameplay-bootstrap-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  java21-and-evidence:
    name: Java 21 full regression and evidence
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact tested head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          'PyYAML>=6.0,<7.0'
          'Pillow==11.3.0'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4

      - name: Validate bounded authority matrices
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD e5e0f3ee15d3b06b4636084f0aab4f0924ab6bf2)" = e5e0f3ee15d3b06b4636084f0aab4f0924ab6bf2
          python3 scripts/audit_gameplay_bootstrap_integrity.py --check
          python3 scripts/audit_config_content_command_surface.py --check
          python3 scripts/check_consistency.py
          python3 scripts/test_progression_balance.py
          python3 scripts/test_professions_2_economy.py
          python3 scripts/audit_combat_encounter_foundation.py --check
          python3 scripts/audit_enemy_worldboss_rework.py --check
          python3 scripts/resource_pack.py validate
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          git diff --check e5e0f3ee15d3b06b4636084f0aab4f0924ab6bf2...HEAD

      - name: Clean Java 21 build and full regressions
        run: |
          set -o pipefail
          ./gradlew clean build --console=plain --no-daemon --stacktrace | tee gradle-build.log
          grep -F 'Gameplay/bootstrap integrity regression suite passed.' gradle-build.log

  missing-fancynpcs:
    name: Missing FancyNpcs fails closed
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime build dependencies
        run: python -m pip install --disable-pip-version-check 'Pillow==11.3.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Start without the required dependency
        shell: bash
        run: |
          set -u
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          set +e
          timeout 180s ./gradlew --no-daemon --console=plain runServer > missing-fancynpcs.log 2>&1
          status=$?
          set -e
          test "$status" -eq 124 || test "$status" -eq 0
          grep -F 'FancyNpcs' missing-fancynpcs.log
          ! grep -F 'ICESMP_GAMEPLAY_BOOTSTRAP_INTEGRITY_RUNTIME_PROBE_PASS' missing-fancynpcs.log
          ! grep -F 'FancyNpcs quest-bridge bekapcsolva' missing-fancynpcs.log

  incompatible-fancynpcs:
    name: Incompatible FancyNpcs fails closed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime build dependencies
        run: python -m pip install --disable-pip-version-check 'Pillow==11.3.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build incompatible dependency fixture
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew compileJava --no-daemon --console=plain
          fixture=build/incompatible-fancynpcs
          mkdir -p "$fixture/src/test" "$fixture/classes" run/plugins
          printf '%s\n' \
            'package test;' \
            'public final class IncompatibleFancyNpcs extends org.bukkit.plugin.java.JavaPlugin {}' \
            > "$fixture/src/test/IncompatibleFancyNpcs.java"
          fixture_cp=$(find "$GRADLE_USER_HOME/caches/modules-2/files-2.1" \
            -type f -name '*.jar' ! -name '*sources*' ! -name '*javadoc*' -print | sort | paste -sd ':' -)
          test -n "$fixture_cp"
          javac -cp "$fixture_cp" -d "$fixture/classes" "$fixture/src/test/IncompatibleFancyNpcs.java"
          printf '%s\n' \
            'name: FancyNpcs' \
            'version: 0.0.0' \
            'main: test.IncompatibleFancyNpcs' \
            'api-version: 1.21' \
            > "$fixture/classes/plugin.yml"
          jar --create --file run/plugins/FancyNpcs-incompatible.jar -C "$fixture/classes" .
          printf 'eula=true\n' > run/eula.txt
      - name: Require deterministic version preflight failure
        shell: bash
        run: |
          set -u
          set +e
          timeout 180s ./gradlew --no-daemon --console=plain runServer > incompatible-fancynpcs.log 2>&1
          status=$?
          set -e
          test "$status" -eq 124 || test "$status" -eq 0
          grep -F 'Class/spec dependency HIBA: FancyNpcs' incompatible-fancynpcs.log
          grep -F '0.0.0' incompatible-fancynpcs.log
          ! grep -F 'FancyNpcs quest-bridge bekapcsolva' incompatible-fancynpcs.log

  paper-runtime:
    name: Paper 1.21.11 runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime build dependencies
        run: python -m pip install --disable-pip-version-check 'Pillow==11.3.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run compatible FancyNpcs production profile
        env:
          JAVA_TOOL_OPTIONS: -Dicesmp.gameplay-bootstrap-integrity-runtime=true
        run: |
          set -o pipefail
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          timeout 480s ./gradlew --no-daemon --console=plain \
            --init-script scripts/source_integrity_runtime.init.gradle runServer \
            | tee paper-hardening.log
      - name: Require Paper runtime markers
        if: always()
        run: |
          grep -F 'FancyNpcs quest-bridge bekapcsolva' paper-hardening.log
          grep -F 'ICESMP_GAMEPLAY_BOOTSTRAP_INTEGRITY_RUNTIME_PROBE_PASS' paper-hardening.log
          grep -F 'ICESMP_STATIC_FACADE_TEARDOWN_RUNTIME_PROBE_PASS' paper-hardening.log
          ! grep -F 'ICESMP_GAMEPLAY_BOOTSTRAP_INTEGRITY_RUNTIME_PROBE_FAIL' paper-hardening.log
          ! grep -F 'ICESMP_STATIC_FACADE_TEARDOWN_RUNTIME_PROBE_FAIL' paper-hardening.log

  folia-runtime:
    name: Folia 1.21.11 runtime
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime build dependencies
        run: python -m pip install --disable-pip-version-check 'Pillow==11.3.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run lock-pinned Folia profile
        env:
          JAVA_TOOL_OPTIONS: -Dicesmp.gameplay-bootstrap-integrity-runtime=true
        run: |
          set -o pipefail
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          timeout 600s ./gradlew --no-daemon --console=plain \
            --init-script gradle/run-folia.init.gradle runFolia \
            | tee folia-hardening.log
      - name: Require Folia runtime markers
        if: always()
        run: |
          grep -F 'FancyNpcs quest-bridge bekapcsolva' folia-hardening.log
          grep -F 'ICESMP_GAMEPLAY_BOOTSTRAP_INTEGRITY_RUNTIME_PROBE_PASS' folia-hardening.log
          grep -F 'ICESMP_STATIC_FACADE_TEARDOWN_RUNTIME_PROBE_PASS' folia-hardening.log
          ! grep -F 'ICESMP_GAMEPLAY_BOOTSTRAP_INTEGRITY_RUNTIME_PROBE_FAIL' folia-hardening.log
          ! grep -F 'ICESMP_STATIC_FACADE_TEARDOWN_RUNTIME_PROBE_FAIL' folia-hardening.log
