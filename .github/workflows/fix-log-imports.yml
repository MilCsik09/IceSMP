name: Fix log-fix imports

on:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/fix-log-imports.yml'

permissions:
  contents: write

jobs:
  fix-imports:
    if: github.head_ref == 'fix/log-errors-2026-08-02'
    runs-on: ubuntu-latest
    steps:
      - name: Check out writable feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/log-errors-2026-08-02
          fetch-depth: 0

      - name: Add missing Java imports
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/main/java/hu/taliann/icesmp/items/ItemDataFactory.java')
          source = path.read_text(encoding='utf-8')
          old = 'import java.util.ArrayList;\nimport java.util.List;\nimport java.util.Locale;\n'
          new = ('import java.util.ArrayList;\n'
                 'import java.util.Collection;\n'
                 'import java.util.List;\n'
                 'import java.util.Locale;\n'
                 'import java.util.Map;\n')
          if old not in source:
              raise SystemExit('Expected import block not found')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check

      - name: Commit and push without force
        shell: bash
        run: |
          git config user.name 'Csik Milán'
          git config user.email '81396861+MilCsik09@users.noreply.github.com'
          git add src/main/java/hu/taliann/icesmp/items/ItemDataFactory.java
          git commit -m 'fix(build): import collection types for attribute merge'
          git push origin HEAD:fix/log-errors-2026-08-02
