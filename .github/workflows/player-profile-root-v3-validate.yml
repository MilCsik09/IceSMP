name: PlayerProfile root payload validation (temporary)

on:
  push:
    branches:
      - agent/player-profile-root-publisher-20260803-v3
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out payload branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify payload chunks and complete patch
        id: verify
        shell: bash
        run: |
          set -uo pipefail
          ROOT='.github/player-profile-root-v3'
          WORK='/tmp/player-profile-root-v3'
          rm -rf "$WORK"
          mkdir -p "$WORK/chunks"
          : > "$WORK/problems.txt"

          while read -r index expected_size expected_sha; do
            [[ "$index" =~ ^[0-9]{2}$ ]] || continue
            mapfile -t parts < <(find "$ROOT" -maxdepth 1 -type f -name "${index}*.b64" -print | sort)
            if (( ${#parts[@]} == 0 )); then
              printf '%s\n' "${index}:missing" >> "$WORK/problems.txt"
              continue
            fi

            cat "${parts[@]}" | tr -d '[:space:]' > "$WORK/chunks/${index}.b64"
            if ! base64 --decode "$WORK/chunks/${index}.b64" > "$WORK/chunks/${index}.bin"; then
              printf '%s\n' "${index}:invalid-base64" >> "$WORK/problems.txt"
              continue
            fi

            actual_size=$(stat -c '%s' "$WORK/chunks/${index}.bin")
            actual_sha=$(sha256sum "$WORK/chunks/${index}.bin" | awk '{print $1}')
            if [[ "$actual_size" != "$expected_size" || "$actual_sha" != "$expected_sha" ]]; then
              printf '%s\n' "${index}:size=${actual_size}/${expected_size},sha=${actual_sha}/${expected_sha}" >> "$WORK/problems.txt"
            fi
          done < "$ROOT/manifest.txt"

          expected_compressed=$(awk '$1 == "compressed-sha256" {print $2}' "$ROOT/manifest.txt")
          expected_patch=$(awk '$1 == "patch-sha256" {print $2}' "$ROOT/manifest.txt")

          if [[ ! -s "$WORK/problems.txt" ]]; then
            for index in $(seq -w 0 20); do
              cat "$WORK/chunks/${index}.bin"
            done > "$WORK/root.patch.xz"

            actual_compressed=$(sha256sum "$WORK/root.patch.xz" | awk '{print $1}')
            if [[ "$actual_compressed" != "$expected_compressed" ]]; then
              printf '%s\n' "whole-xz:sha=${actual_compressed}/${expected_compressed}" >> "$WORK/problems.txt"
            elif ! xz --test "$WORK/root.patch.xz"; then
              printf '%s\n' 'whole-xz:invalid-stream' >> "$WORK/problems.txt"
            else
              xz --decompress --stdout "$WORK/root.patch.xz" > "$WORK/root.patch"
              actual_patch=$(sha256sum "$WORK/root.patch" | awk '{print $1}')
              if [[ "$actual_patch" != "$expected_patch" ]]; then
                printf '%s\n' "patch:sha=${actual_patch}/${expected_patch}" >> "$WORK/problems.txt"
              fi
            fi
          fi

          if [[ -s "$WORK/problems.txt" ]]; then
            printf 'FAIL\n' > "$WORK/status.txt"
          else
            printf 'PASS\n' > "$WORK/status.txt"
          fi

          {
            echo '## PPROOT3 payload validation'
            echo
            echo "- run: \`${GITHUB_RUN_ID}\`"
            echo "- workflow SHA: \`${GITHUB_SHA}\`"
            echo "- status: **$(cat "$WORK/status.txt")**"
            echo
            if [[ -s "$WORK/problems.txt" ]]; then
              echo 'Problems:'
              echo '```text'
              cat "$WORK/problems.txt"
              echo '```'
            else
              echo "- compressed SHA-256: \`${expected_compressed}\`"
              echo "- patch SHA-256: \`${expected_patch}\`"
              echo '- all 21 chunks, XZ stream and uncompressed patch verified'
            fi
          } > "$WORK/report.md"

          cat "$WORK/report.md"

      - name: Publish validation result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/79/comments" \
            -f body="$(cat /tmp/player-profile-root-v3/report.md)"

      - name: Enforce validation
        if: always()
        shell: bash
        run: test "$(cat /tmp/player-profile-root-v3/status.txt)" = 'PASS'
