name: Log fix finalize

on:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/log-fix-finalize.yml'

permissions:
  contents: write

jobs:
  apply-final-fixes:
    if: github.head_ref == 'fix/log-errors-2026-08-02'
    runs-on: ubuntu-latest
    steps:
      - name: Check out current feature head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Align CI and operator runbooks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          ci = Path('.github/workflows/ci.yml')
          text = ci.read_text()
          old_build = """      - name: Clean build
                shell: bash
                run: |
                  set -euo pipefail
                  ./gradlew clean build --no-daemon --stacktrace | tee gradle-build.log

          """
          new_build = """      - name: Clean unit tests
                shell: bash
                run: |
                  set -euo pipefail
                  ./gradlew clean test --no-daemon --stacktrace | tee gradle-test.log

              - name: Full build and regression gates
                shell: bash
                run: |
                  set -euo pipefail
                  ./gradlew build --no-daemon --stacktrace | tee gradle-build.log

          """
          if old_build not in text:
              raise SystemExit('CI clean-build block not found')
          ci.write_text(text.replace(old_build, new_build))

          replacements = {
              'ROADMAP.md': [('/quest admin npcs refresh', '/quest admin validatenpcs')],
              'docs/LATEST_CHANGES.md': [('/quest admin npcs [refresh]', '/quest admin validatenpcs')],
              'docs/BUILDER_GUIDE.md': [
                  ('/quest admin npcs refresh\n/quest admin npcs', '/quest admin validatenpcs'),
                  ('`REMOTE_NOT_CACHED`', '`CACHE_MISSING` vagy `CACHE_INVALID`'),
              ],
              'docs/ADMIN_GUIDE.md': [
                  ('/quest admin npcs\n/quest admin npcs refresh', '/quest admin validatenpcs'),
                  ('Az első parancs a legutóbbi mérést mutatja; a `refresh` újraolvassa', 'A parancs újraolvassa'),
                  ('./gradlew relicRefreshRegressionTest', './gradlew relicItemRefreshRegressionTest\n./gradlew relicRefreshPipelineRegressionTest'),
                  ('./gradlew escortShutdownRegressionTest', './gradlew lifecycleShutdownRegressionTest'),
                  ('./gradlew questNpcOperationsRegressionTest', './gradlew questNpcValidationRegressionTest'),
                  ('./gradlew logIncidentRegressionTest', './gradlew resourcePackRegressionTest\npython3 scripts/validate_fancynpcs_snapshot.py\npython3 -m unittest scripts.tests.test_validate_fancynpcs_snapshot'),
              ],
          }
          for filename, pairs in replacements.items():
              path = Path(filename)
              body = path.read_text()
              for old, new in pairs:
                  if old not in body:
                      raise SystemExit(f'missing runbook replacement in {filename}: {old!r}')
                  body = body.replace(old, new)
              path.write_text(body)
          PY

          rm -- .github/log-fix-finalize-payload.b64.00 \
                 .github/log-fix-finalize-payload.b64.01 \
                 .github/workflows/log-fix-finalize.yml

      - name: Verify final files before publishing
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest scripts.tests.test_validate_fancynpcs_snapshot -v
          python3 scripts/validate_fancynpcs_snapshot.py
          python3 scripts/check_consistency.py
          git diff --check

      - name: Commit and fast-forward push
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            .github/workflows/ci.yml \
            ROADMAP.md \
            docs/ADMIN_GUIDE.md \
            docs/BUILDER_GUIDE.md \
            docs/LATEST_CHANGES.md \
            .github/log-fix-finalize-payload.b64.00 \
            .github/log-fix-finalize-payload.b64.01 \
            .github/workflows/log-fix-finalize.yml
          git commit -m 'fix(operations): align CI commands and operator runbook'
          git push origin "HEAD:${HEAD_BRANCH}"
