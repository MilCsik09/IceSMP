name: PlayerProfile recovered platform regressions (temporary)

on:
  pull_request:
    branches:
      - agent/player-profile-root-reconstruct-20260803-v6
    paths:
      - .github/player-profile-root-v6-trigger.txt
  workflow_dispatch:

permissions:
  contents: write

env:
  RECOVERY_BRANCH: agent/player-profile-root-recovered-20260803-v4
  EXPECTED_RECOVERY_HEAD: 4b98fc92c44e06784e38a59c6680d1e9660fafea
  TARGET_BRANCH: rework/class-spec-profile-v2
  EXPECTED_TARGET_HEAD: f25e7e600f418724dd2341e39387a0fa5c0625de

jobs:
  restore-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out authenticated recovery history
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RECOVERY_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Restore PlayerProfile domain, YAML, transaction and API suites
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_RECOVERY_HEAD"
          git fetch --no-tags origin "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$EXPECTED_TARGET_HEAD"

          DOMAIN=src/regression/java/hu/taliann/icesmp/playerprofile/domain/PlayerProfileDomainRegressionSuite.java
          YAML=src/regression/java/hu/taliann/icesmp/playerprofile/persistence/PlayerProfileYamlRegressionSuite.java
          TX=src/regression/java/hu/taliann/icesmp/playerprofile/transaction/PlayerProfileTransactionRegressionSuite.java
          API=src/regression/java/hu/taliann/icesmp/playerprofile/api/PlayerProfileApiRegressionSuite.java
          for file in "$DOMAIN" "$YAML" "$TX" "$API"; do
            test ! -e "$file"
            mkdir -p "$(dirname "$file")"
          done

          cat > "$DOMAIN" <<'JAVA'
          package hu.taliann.icesmp.playerprofile.domain;

          import hu.taliann.icesmp.playerprofile.domain.section.*;
          import java.lang.reflect.RecordComponent;
          import java.time.Instant;
          import java.util.*;

          public final class PlayerProfileDomainRegressionSuite {
              private static final UUID PLAYER = UUID.fromString("00000000-0000-0000-0000-000000001001");
              private static final Instant NOW = Instant.parse("2026-08-03T12:00:00Z");
              private static int assertions;

              private PlayerProfileDomainRegressionSuite() { }

              public static void main(String[] args) {
                  greenfieldContainsEverySection();
                  replacementAndRevisionRules();
                  healthIsolation();
                  extensionsAndCollectionsAreImmutable();
                  boundsAndStableIds();
                  domainContainsNoBukkitObjects();
                  System.out.println("PlayerProfile domain regression suite passed. assertions=" + assertions);
              }

              private static void greenfieldContainsEverySection() {
                  PlayerProfileSnapshot p = PlayerProfileSnapshot.greenfield(PLAYER, NOW);
                  check(p.playerId().equals(PLAYER), "owner");
                  check(p.profileRevision() == 0, "greenfield revision");
                  check(p.createdAt().equals(NOW) && p.updatedAt().equals(NOW), "timestamps");
                  check(p.sectionMap().size() == ProfileSectionId.values().length, "all sections");
                  check(p.sectionRevisions().size() == ProfileSectionId.values().length, "all revisions");
                  for (ProfileSectionId id : ProfileSectionId.values()) {
                      ProfileSectionSnapshot<?> section = p.section(id).orElseThrow();
                      check(section.sectionId() == id, "section id " + id.id());
                      check(section.value().sectionId() == id, "value id " + id.id());
                      check(section.schema() == id.currentSchema(), "schema " + id.id());
                      check(section.revision() == 0, "revision " + id.id());
                      check(section.health().usable(), "health " + id.id());
                      check(p.sectionRevisions().get(id).revision() == 0, "revision map " + id.id());
                  }
                  check(p.health().status() == ProfileHealth.Status.HEALTHY, "greenfield healthy");
                  expect(UnsupportedOperationException.class,
                          () -> p.sectionMap().put(ProfileSectionId.IDENTITY, p.identity()));
                  expect(UnsupportedOperationException.class,
                          () -> p.sectionRevisions().put(ProfileSectionId.IDENTITY, new SectionRevision(1, 1)));
              }

              private static void replacementAndRevisionRules() {
                  PlayerProfileSnapshot p = PlayerProfileSnapshot.greenfield(PLAYER, NOW);
                  PreferenceSection current = p.preferences().value();
                  PreferenceSection nextValue = new PreferenceSection(
                          "en_US", current.hudEnabled(), current.scoreboardEnabled(),
                          current.notificationsEnabled(), current.publicProfile(),
                          current.publicCompanion(), current.publicAchievements(),
                          current.publicClassFactionSpec(), true, Map.of("theme", "compact"),
                          Map.of("future", Map.of("enabled", true)));
                  ProfileSectionSnapshot<PreferenceSection> next = new ProfileSectionSnapshot<>(
                          ProfileSectionId.PREFERENCES, p.preferences().schema(), 1,
                          NOW.plusSeconds(1), nextValue, SectionHealth.healthy(),
                          Map.of("future-root", List.of("a", "b")));
                  PlayerProfileSnapshot changed = p.withSection(next, 1, NOW.plusSeconds(1));
                  check(changed.profileRevision() == 1, "profile revision advanced");
                  check(changed.preferences().revision() == 1, "section revision advanced");
                  check(changed.preferences().value().language().equals("en_US"), "value replaced");
                  check(changed.identity().equals(p.identity()), "unrelated section stable");
                  expect(IllegalArgumentException.class,
                          () -> p.withSection(next, 2, NOW.plusSeconds(1)));
                  expect(IllegalArgumentException.class, () -> new ProfileSectionSnapshot<>(
                          ProfileSectionId.PREFERENCES, 1, 0, NOW,
                          IdentitySection.empty(NOW.toEpochMilli()), SectionHealth.healthy()));
                  expect(IllegalArgumentException.class, () -> new PlayerProfileSnapshot(
                          PLAYER, 0, NOW.plusSeconds(1), NOW, p.sectionRevisions(),
                          p.identity(), p.lifecycle(), p.onboarding(), p.faction(), p.economy(),
                          p.classSpec(), p.professions(), p.spellbook(), p.talents(), p.quests(),
                          p.companions(), p.relics(), p.achievements(), p.statistics(), p.preferences(),
                          p.socialLinks(), p.moderation(), p.operations(), p.health()));
              }

              private static void healthIsolation() {
                  PlayerProfileSnapshot p = PlayerProfileSnapshot.greenfield(PLAYER, NOW);
                  EnumMap<ProfileSectionId, ProfileSectionSnapshot<?>> sections =
                          new EnumMap<>(p.sectionMap());
                  ProfileSectionSnapshot<?> stats = p.statistics();
                  sections.put(ProfileSectionId.STATISTICS, new ProfileSectionSnapshot<>(
                          ProfileSectionId.STATISTICS, stats.schema(), stats.revision(), stats.updatedAt(),
                          stats.value(), SectionHealth.quarantined("bad stats", "evidence-stats"),
                          stats.extensions()));
                  PlayerProfileSnapshot partial = PlayerProfileSnapshot.fromMap(
                          PLAYER, 0, NOW, NOW, sections);
                  check(partial.health().status() == ProfileHealth.Status.PARTIAL, "partial health");
                  check(partial.health().usable(), "partial profile usable");
                  check(partial.classSpec().health().usable(), "class spec remains usable");
                  check(!partial.statistics().health().usable(), "statistics blocked");

                  ProfileSectionSnapshot<?> identity = p.identity();
                  sections.put(ProfileSectionId.IDENTITY, new ProfileSectionSnapshot<>(
                          ProfileSectionId.IDENTITY, identity.schema(), identity.revision(), identity.updatedAt(),
                          identity.value(), SectionHealth.quarantined("bad identity", "evidence-identity"),
                          identity.extensions()));
                  PlayerProfileSnapshot blocked = PlayerProfileSnapshot.fromMap(
                          PLAYER, 0, NOW, NOW, sections);
                  check(blocked.health().status() == ProfileHealth.Status.BLOCKED, "identity blocks profile");
                  check(!blocked.health().usable(), "blocked profile unusable");
                  expect(IllegalArgumentException.class,
                          () -> SectionHealth.quarantined("missing evidence", ""));
              }

              @SuppressWarnings("unchecked")
              private static void extensionsAndCollectionsAreImmutable() {
                  List<String> nested = new ArrayList<>(List.of("first"));
                  Map<String, Object> extensions = new LinkedHashMap<>();
                  extensions.put("future-list", nested);
                  ProfileSectionSnapshot<PreferenceSection> section = new ProfileSectionSnapshot<>(
                          ProfileSectionId.PREFERENCES, 1, 0, NOW, PreferenceSection.empty(0),
                          SectionHealth.healthy(), extensions);
                  nested.add("second");
                  List<Object> stored = (List<Object>) section.extensions().get("future-list");
                  check(stored.size() == 1, "nested extension copied");
                  expect(UnsupportedOperationException.class, () -> stored.add("third"));
                  expect(UnsupportedOperationException.class,
                          () -> section.extensions().put("other", true));

                  EconomySection economy = new EconomySection(
                          new LinkedHashMap<>(Map.of("coins", 5L)), 10,
                          Map.of("dark", 2L), Map.of(), Set.of(), Map.of());
                  expect(UnsupportedOperationException.class,
                          () -> economy.wallets().put("other", 1L));
                  check(economy.wallets().get("coins") == 5L, "wallet copied");
              }

              private static void boundsAndStableIds() {
                  check(ProfileSectionId.parse("CLASS_SPEC") == ProfileSectionId.CLASS_SPEC,
                          "normalized section id");
                  check(ProfileSectionId.SOCIAL_LINKS.fileName().equals("social-links.yml"),
                          "stable filename");
                  expect(IllegalArgumentException.class, () -> ProfileSectionId.parse("unknown"));
                  expect(IllegalArgumentException.class,
                          () -> new EconomySection(Map.of("coins", -1L), 0, Map.of(), Map.of(), Set.of(), Map.of()));
                  expect(IllegalArgumentException.class,
                          () -> new ModerationSection(Set.of(), -1, Set.of(), Map.of(), Map.of()));
                  Map<String, String> tooMany = new LinkedHashMap<>();
                  for (int i = 0; i < 129; i++) tooMany.put("key-" + i, "value");
                  expect(IllegalArgumentException.class, () -> new PreferenceSection(
                          "hu_HU", true, true, true, true, true, true, true, false,
                          tooMany, Map.of()));
                  expect(IllegalArgumentException.class, () -> new PlayerProfileOperation(
                          "", "type", PlayerProfileOperation.Status.COMMITTED, "fingerprint",
                          NOW, NOW, Map.of()));
              }

              private static void domainContainsNoBukkitObjects() {
                  Class<?>[] records = {
                          PlayerProfileSnapshot.class, ProfileSectionSnapshot.class,
                          IdentitySection.class, LifecycleSection.class, OnboardingSection.class,
                          FactionSection.class, EconomySection.class, ClassSpecSection.class,
                          ProfessionSection.class, SpellbookSection.class, TalentSection.class,
                          QuestSection.class, CompanionSection.class, RelicSection.class,
                          AchievementSection.class, StatisticsSection.class, PreferenceSection.class,
                          SocialLinkSection.class, ModerationSection.class, OperationSection.class
                  };
                  for (Class<?> type : records) {
                      check(type.isRecord(), "record " + type.getSimpleName());
                      for (RecordComponent component : type.getRecordComponents()) {
                          check(!component.getType().getName().startsWith("org.bukkit."),
                                  "no Bukkit component " + type.getSimpleName() + '.' + component.getName());
                      }
                  }
              }

              private static void check(boolean value, String message) {
                  assertions++;
                  if (!value) throw new AssertionError(message);
              }

              private static void expect(Class<? extends Throwable> expected, Throwing action) {
                  assertions++;
                  try {
                      action.run();
                      throw new AssertionError("Expected " + expected.getSimpleName());
                  } catch (Throwable failure) {
                      if (!expected.isInstance(failure)) {
                          throw new AssertionError("Expected " + expected.getSimpleName()
                                  + " but got " + failure, failure);
                      }
                  }
              }

              @FunctionalInterface private interface Throwing { void run() throws Exception; }
          }
          JAVA

          cat > "$YAML" <<'JAVA'
          package hu.taliann.icesmp.playerprofile.persistence;

          import hu.taliann.icesmp.playerprofile.domain.*;
          import hu.taliann.icesmp.playerprofile.domain.section.*;
          import java.nio.charset.StandardCharsets;
          import java.nio.file.*;
          import java.time.*;
          import java.util.*;
          import java.util.concurrent.*;

          public final class PlayerProfileYamlRegressionSuite {
              private static final UUID PLAYER = UUID.fromString("00000000-0000-0000-0000-000000001101");
              private static final Instant NOW = Instant.parse("2026-08-03T13:00:00Z");
              private static final Clock CLOCK = Clock.fixed(NOW, ZoneOffset.UTC);
              private static int assertions;

              private PlayerProfileYamlRegressionSuite() { }

              public static void main(String[] args) throws Exception {
                  greenfieldStructuredRoundTrip();
                  sectionCasAndExtensions();
                  quarantineIsolationAndRecovery();
                  invalidUtf8OversizeOwnerAndTempRecovery();
                  strictStructuredCodecPolicies();
                  System.out.println("PlayerProfile YAML regression suite passed. assertions=" + assertions);
              }

              private static void greenfieldStructuredRoundTrip() throws Exception {
                  Path root = Files.createTempDirectory("pp-yaml-greenfield-");
                  YamlPlayerProfileRepository repo = repository(root);
                  try {
                      UUID missing = UUID.randomUUID();
                      check(join(repo.find(missing)).isEmpty(), "find missing remains empty");
                      check(!Files.exists(root.resolve(missing.toString())), "read does not initialize");

                      PlayerProfileSnapshot first = join(repo.load(PLAYER));
                      Path dir = root.resolve(PLAYER.toString());
                      check(first.profileRevision() == 0, "greenfield profile revision");
                      check(Files.isRegularFile(dir.resolve("manifest.yml")), "manifest written");
                      for (ProfileSectionId id : ProfileSectionId.values()) {
                          check(Files.isRegularFile(dir.resolve(id.fileName())), "section file " + id.id());
                      }
                      String manifest = Files.readString(dir.resolve("manifest.yml"));
                      String classSpec = Files.readString(dir.resolve("class-spec.yml"));
                      check(manifest.contains("format: ICESMP-PLAYER-PROFILE"), "manifest format");
                      check(manifest.contains("profile-revision: 0"), "manifest revision");
                      check(classSpec.contains("format: ICESMP-PLAYER-PROFILE-SECTION"), "section format");
                      check(classSpec.contains("section: class-spec"), "section id");
                      check(!classSpec.contains("ICS2") && !classSpec.contains("payload:"),
                              "no opaque class-spec blob");
                      try (var paths = Files.walk(dir)) {
                          check(paths.noneMatch(p -> p.getFileName().toString().endsWith(".b64")),
                                  "no Base64 payload files");
                      }
                      repo.invalidate(PLAYER);
                      PlayerProfileSnapshot second = join(repo.load(PLAYER));
                      check(second.sectionMap().size() == ProfileSectionId.values().length,
                              "roundtrip section count");
                      check(second.sectionRevisions().equals(first.sectionRevisions()),
                              "roundtrip revisions");
                  } finally {
                      shutdown(repo);
                  }
              }

              private static void sectionCasAndExtensions() throws Exception {
                  Path root = Files.createTempDirectory("pp-yaml-cas-");
                  YamlPlayerProfileRepository repo = repository(root);
                  try {
                      PlayerProfileSnapshot p = join(repo.load(PLAYER));
                      PreferenceSection current = p.preferences().value();
                      PreferenceSection value = new PreferenceSection(
                              "en_US", true, false, true, true, true, true, true, true,
                              Map.of("theme", "compact"), Map.of("future-data", List.of("x")));
                      ProfileSectionSnapshot<PreferenceSection> next = new ProfileSectionSnapshot<>(
                              ProfileSectionId.PREFERENCES, p.preferences().schema(), 1,
                              NOW.plusSeconds(1), value, SectionHealth.healthy(),
                              Map.of("future-root", Map.of("enabled", true)));
                      PlayerProfileRepository.SectionSaveResult committed = join(repo.saveSection(
                              PLAYER, ProfileSectionId.PREFERENCES, 0, 0, next));
                      check(committed.status() == PlayerProfileRepository.SectionSaveResult.Status.COMMITTED,
                              "CAS commit");
                      check(committed.snapshot().profileRevision() == 1, "generation increment");
                      check(committed.snapshot().preferences().revision() == 1, "section increment");

                      PlayerProfileRepository.SectionSaveResult stale = join(repo.saveSection(
                              PLAYER, ProfileSectionId.PREFERENCES, 0, next));
                      check(stale.status() == PlayerProfileRepository.SectionSaveResult.Status.STALE_REVISION,
                              "stale revision rejected");

                      ProfileSectionSnapshot<PreferenceSection> skipped = new ProfileSectionSnapshot<>(
                              ProfileSectionId.PREFERENCES, 1, 3, NOW, value,
                              SectionHealth.healthy(), next.extensions());
                      PlayerProfileRepository.SectionSaveResult rejected = join(repo.saveSection(
                              PLAYER, ProfileSectionId.PREFERENCES, 1, skipped));
                      check(rejected.status() == PlayerProfileRepository.SectionSaveResult.Status.REJECTED,
                              "skipped revision rejected");

                      ProfileSectionSnapshot<PreferenceSection> revisionTwo = new ProfileSectionSnapshot<>(
                              ProfileSectionId.PREFERENCES, 1, 2, NOW, value,
                              SectionHealth.healthy(), next.extensions());
                      PlayerProfileRepository.SectionSaveResult staleGeneration = join(repo.saveSection(
                              PLAYER, ProfileSectionId.PREFERENCES, 1, 0, revisionTwo));
                      check(staleGeneration.status()
                                      == PlayerProfileRepository.SectionSaveResult.Status.STALE_GENERATION,
                              "stale generation rejected");

                      repo.invalidate(PLAYER);
                      PlayerProfileSnapshot loaded = join(repo.load(PLAYER));
                      check(loaded.preferences().extensions().containsKey("future-root"),
                              "unknown root extension preserved");
                      check(loaded.preferences().value().extensions().containsKey("future-data"),
                              "unknown data extension preserved");
                      check(loaded.preferences().value().language().equals("en_US"), "structured data roundtrip");
                  } finally {
                      shutdown(repo);
                  }
              }

              private static void quarantineIsolationAndRecovery() throws Exception {
                  Path root = Files.createTempDirectory("pp-yaml-quarantine-");
                  YamlPlayerProfileRepository repo = repository(root);
                  try {
                      join(repo.load(PLAYER));
                      PlayerProfileRepository.QuarantineResult quarantined = join(repo.quarantineSection(
                              PLAYER, ProfileSectionId.STATISTICS,
                              "corrupt-statistics".getBytes(StandardCharsets.UTF_8), "bad stats"));
                      check(quarantined.snapshot().health().status() == ProfileHealth.Status.PARTIAL,
                              "section quarantine is partial");
                      check(!quarantined.snapshot().statistics().health().usable(), "statistics blocked");
                      check(quarantined.snapshot().classSpec().health().usable(), "class spec remains usable");
                      Path evidence = root.resolve(PLAYER.toString()).resolve("quarantine")
                              .resolve("statistics").resolve(quarantined.evidenceId() + ".evidence");
                      check(Files.isRegularFile(evidence), "evidence preserved");

                      PlayerProfileRepository.RecoveryResult recovered = join(repo.recoverSection(
                              PLAYER, ProfileSectionId.STATISTICS,
                              quarantined.evidenceId(), "audit-1"));
                      check(!recovered.idempotent(), "first recovery mutates");
                      check(recovered.snapshot().statistics().health().usable(), "recovered usable");
                      check(recovered.snapshot().statistics().health().recoveryAuditId().equals("audit-1"),
                              "audit retained");
                      check(Files.isRegularFile(evidence), "recovery never deletes evidence");

                      PlayerProfileRepository.RecoveryResult replay = join(repo.recoverSection(
                              PLAYER, ProfileSectionId.STATISTICS,
                              quarantined.evidenceId(), "audit-1"));
                      check(replay.idempotent(), "recovery replay idempotent");
                  } finally {
                      shutdown(repo);
                  }
              }

              private static void invalidUtf8OversizeOwnerAndTempRecovery() throws Exception {
                  Path root = Files.createTempDirectory("pp-yaml-invalid-");
                  YamlPlayerProfileRepository repo = repository(root);
                  try {
                      UUID invalid = UUID.randomUUID();
                      join(repo.load(invalid));
                      Path invalidDir = root.resolve(invalid.toString());
                      Path orphan = invalidDir.resolve("preferences.yml.tmp-orphan");
                      Files.writeString(orphan, "orphan");
                      Files.write(invalidDir.resolve("preferences.yml"), new byte[]{(byte) 0xC3, 0x28});
                      repo.invalidate(invalid);
                      PlayerProfileSnapshot partial = join(repo.load(invalid));
                      check(!Files.exists(orphan), "orphan temp cleaned");
                      check(!partial.preferences().health().usable(), "invalid UTF-8 quarantined");
                      check(partial.classSpec().health().usable(), "unrelated section survives UTF-8 error");

                      UUID oversized = UUID.randomUUID();
                      join(repo.load(oversized));
                      Path stats = root.resolve(oversized.toString()).resolve("statistics.yml");
                      Files.write(stats, new byte[(int) YamlPlayerProfileRepository.MAX_YAML_BYTES + 1]);
                      repo.invalidate(oversized);
                      PlayerProfileSnapshot oversizedProfile = join(repo.load(oversized));
                      check(!oversizedProfile.statistics().health().usable(), "oversized section quarantined");

                      UUID owner = UUID.randomUUID();
                      join(repo.load(owner));
                      Path manifest = root.resolve(owner.toString()).resolve("manifest.yml");
                      String content = Files.readString(manifest).replace(owner.toString(), UUID.randomUUID().toString());
                      Files.writeString(manifest, content);
                      repo.invalidate(owner);
                      expectStage(IllegalArgumentException.class, repo.load(owner));
                  } finally {
                      shutdown(repo);
                  }
              }

              @SuppressWarnings("unchecked")
              private static void strictStructuredCodecPolicies() {
                  ProfileSectionSnapshot<PreferenceSection> section = new ProfileSectionSnapshot<>(
                          ProfileSectionId.PREFERENCES, 1, 0, NOW,
                          PreferenceSection.empty(0), SectionHealth.healthy(),
                          Map.of("future", Map.of("number", 7L)));
                  Map<String, Object> encoded = StructuredPlayerProfileYaml.encodeSection(section);
                  ProfileSectionSnapshot<?> decoded = StructuredPlayerProfileYaml.decodeSection(
                          ProfileSectionId.PREFERENCES, encoded);
                  check(decoded.extensions().containsKey("future"), "structured extension roundtrip");

                  Map<String, Object> missingOptional = new LinkedHashMap<>(encoded);
                  Map<String, Object> data = new LinkedHashMap<>((Map<String, Object>) missingOptional.get("data"));
                  data.remove("values");
                  data.remove("extensions");
                  missingOptional.put("data", data);
                  PreferenceSection defaults = (PreferenceSection) StructuredPlayerProfileYaml.decodeSection(
                          ProfileSectionId.PREFERENCES, missingOptional).value();
                  check(defaults.values().isEmpty(), "missing optional map defaults empty");

                  Map<String, Object> futureSchema = new LinkedHashMap<>(encoded);
                  futureSchema.put("schema", 2);
                  expect(IllegalArgumentException.class, () -> StructuredPlayerProfileYaml.decodeSection(
                          ProfileSectionId.PREFERENCES, futureSchema));

                  Map<String, Object> invalidType = new LinkedHashMap<>(encoded);
                  Map<String, Object> badData = new LinkedHashMap<>((Map<String, Object>) invalidType.get("data"));
                  badData.put("language", 42);
                  invalidType.put("data", badData);
                  expect(IllegalArgumentException.class, () -> StructuredPlayerProfileYaml.decodeSection(
                          ProfileSectionId.PREFERENCES, invalidType));
              }

              private static YamlPlayerProfileRepository repository(Path root) {
                  return new YamlPlayerProfileRepository(root, CLOCK,
                          Executors.newVirtualThreadPerTaskExecutor());
              }

              private static <T> T join(CompletionStage<T> stage) {
                  return stage.toCompletableFuture().join();
              }

              private static void shutdown(YamlPlayerProfileRepository repo) {
                  join(repo.shutdown(Duration.ofSeconds(5)));
              }

              private static void expectStage(Class<? extends Throwable> expected, CompletionStage<?> stage) {
                  assertions++;
                  try {
                      stage.toCompletableFuture().join();
                      throw new AssertionError("Expected " + expected.getSimpleName());
                  } catch (CompletionException failure) {
                      Throwable cause = failure.getCause();
                      if (!expected.isInstance(cause)) {
                          throw new AssertionError("Expected " + expected.getSimpleName()
                                  + " but got " + cause, cause);
                      }
                  }
              }

              private static void check(boolean value, String message) {
                  assertions++;
                  if (!value) throw new AssertionError(message);
              }

              private static void expect(Class<? extends Throwable> expected, Throwing action) {
                  assertions++;
                  try {
                      action.run();
                      throw new AssertionError("Expected " + expected.getSimpleName());
                  } catch (Throwable failure) {
                      if (!expected.isInstance(failure)) {
                          throw new AssertionError("Expected " + expected.getSimpleName()
                                  + " but got " + failure, failure);
                      }
                  }
              }

              @FunctionalInterface private interface Throwing { void run() throws Exception; }
          }
          JAVA

          cat > "$TX" <<'JAVA'
          package hu.taliann.icesmp.playerprofile.transaction;

          import hu.taliann.icesmp.playerprofile.domain.*;
          import hu.taliann.icesmp.playerprofile.domain.section.*;
          import hu.taliann.icesmp.playerprofile.persistence.*;
          import java.io.IOException;
          import java.nio.file.*;
          import java.time.*;
          import java.util.*;
          import java.util.concurrent.*;
          import java.util.concurrent.atomic.AtomicBoolean;

          public final class PlayerProfileTransactionRegressionSuite {
              private static final UUID PLAYER = UUID.fromString("00000000-0000-0000-0000-000000001201");
              private static final Instant NOW = Instant.parse("2026-08-03T14:00:00Z");
              private static final Clock CLOCK = Clock.fixed(NOW, ZoneOffset.UTC);
              private static int assertions;

              private PlayerProfileTransactionRegressionSuite() { }

              public static void main(String[] args) throws Exception {
                  crossSectionCommitAndIdempotency();
                  invalidPlansAndStaleRevision();
                  parallelSectionCas();
                  crashBeforeManifestRollsBack();
                  crashAfterManifestFinalizes();
                  System.out.println("PlayerProfile transaction regression suite passed. assertions=" + assertions);
              }

              private static void crossSectionCommitAndIdempotency() throws Exception {
                  Path root = Files.createTempDirectory("pp-tx-success-");
                  YamlPlayerProfileRepository repo = repository(root, YamlPlayerProfileRepository.FaultInjector.none());
                  try {
                      join(repo.load(PLAYER));
                      YamlPlayerProfileTransactionManager tx = new YamlPlayerProfileTransactionManager(repo, CLOCK);
                      String result = join(tx.execute(PLAYER,
                              p -> rewardPlan(p, "quest-reward-1", "quest-1-100", 100)));
                      check(result.equals("credited"), "transaction result");
                      PlayerProfileSnapshot committed = join(repo.load(PLAYER));
                      check(committed.profileRevision() == 1, "one global generation");
                      check(committed.economy().revision() == 1, "economy revision");
                      check(committed.quests().revision() == 1, "quest revision");
                      check(committed.operations().revision() == 1, "operation revision");
                      check(committed.economy().value().wallets().get("coins") == 100L, "wallet credited");
                      check(committed.quests().value().completed().contains("quest-1"), "quest completed");
                      PlayerProfileOperation receipt = committed.operations().value().operations()
                              .get("quest-reward-1");
                      check(receipt != null && receipt.status() == PlayerProfileOperation.Status.COMMITTED,
                              "committed receipt");

                      String replay = join(tx.execute(PLAYER,
                              p -> rewardPlan(p, "quest-reward-1", "quest-1-100", 100)));
                      check(replay.equals("credited"), "idempotent replay result");
                      PlayerProfileSnapshot unchanged = join(repo.load(PLAYER));
                      check(unchanged.profileRevision() == 1, "replay does not commit again");
                      check(unchanged.economy().value().wallets().get("coins") == 100L,
                              "replay does not double credit");

                      expectStage(IllegalStateException.class, tx.execute(PLAYER,
                              p -> rewardPlan(p, "quest-reward-1", "different-fingerprint", 100)));
                  } finally {
                      shutdown(repo);
                  }
              }

              private static void invalidPlansAndStaleRevision() throws Exception {
                  Path root = Files.createTempDirectory("pp-tx-invalid-");
                  YamlPlayerProfileRepository repo = repository(root, YamlPlayerProfileRepository.FaultInjector.none());
                  try {
                      PlayerProfileSnapshot p = join(repo.load(PLAYER));
                      EconomySection economy = withCoins(p.economy().value(), 1);
                      PlayerProfileTransactionManager.SectionUpdate update =
                              new PlayerProfileTransactionManager.SectionUpdate(
                                      ProfileSectionId.ECONOMY, p.economy().revision(), economy);
                      expect(IllegalArgumentException.class, () ->
                              new PlayerProfileTransactionManager.TransactionPlan<>(
                                      "duplicate", "test", "fingerprint", List.of(update, update), "x"));
                      expect(IllegalArgumentException.class, () ->
                              new PlayerProfileTransactionManager.TransactionPlan<>(
                                      "empty", "test", "fingerprint", List.of(), "x"));

                      YamlPlayerProfileTransactionManager tx = new YamlPlayerProfileTransactionManager(repo, CLOCK);
                      expectStage(IllegalStateException.class, tx.execute(PLAYER, snapshot ->
                              new PlayerProfileTransactionManager.TransactionPlan<>(
                                      "stale", "test", "stale-fingerprint",
                                      List.of(new PlayerProfileTransactionManager.SectionUpdate(
                                              ProfileSectionId.ECONOMY,
                                              snapshot.economy().revision() + 1,
                                              withCoins(snapshot.economy().value(), 1))), "x")));
                  } finally {
                      shutdown(repo);
                  }
              }

              private static void parallelSectionCas() throws Exception {
                  Path root = Files.createTempDirectory("pp-tx-parallel-");
                  YamlPlayerProfileRepository repo = repository(root, YamlPlayerProfileRepository.FaultInjector.none());
                  try {
                      PlayerProfileSnapshot p = join(repo.load(PLAYER));
                      ProfileSectionSnapshot<EconomySection> economy = new ProfileSectionSnapshot<>(
                              ProfileSectionId.ECONOMY, 1, 1, NOW,
                              withCoins(p.economy().value(), 10), SectionHealth.healthy());
                      ProfileSectionSnapshot<QuestSection> quests = new ProfileSectionSnapshot<>(
                              ProfileSectionId.QUESTS, 1, 1, NOW,
                              completedQuest(p.quests().value()), SectionHealth.healthy());
                      CompletableFuture<PlayerProfileRepository.SectionSaveResult> first = repo.saveSection(
                              PLAYER, ProfileSectionId.ECONOMY, 0, economy).toCompletableFuture();
                      CompletableFuture<PlayerProfileRepository.SectionSaveResult> second = repo.saveSection(
                              PLAYER, ProfileSectionId.QUESTS, 0, quests).toCompletableFuture();
                      check(first.join().status() == PlayerProfileRepository.SectionSaveResult.Status.COMMITTED,
                              "economy parallel commit");
                      check(second.join().status() == PlayerProfileRepository.SectionSaveResult.Status.COMMITTED,
                              "quest parallel commit");
                      PlayerProfileSnapshot both = join(repo.load(PLAYER));
                      check(both.profileRevision() == 2, "different sections independently commit");

                      ProfileSectionSnapshot<EconomySection> a = new ProfileSectionSnapshot<>(
                              ProfileSectionId.ECONOMY, 1, 2, NOW,
                              withCoins(both.economy().value(), 11), SectionHealth.healthy());
                      ProfileSectionSnapshot<EconomySection> b = new ProfileSectionSnapshot<>(
                              ProfileSectionId.ECONOMY, 1, 2, NOW,
                              withCoins(both.economy().value(), 12), SectionHealth.healthy());
                      CompletableFuture<PlayerProfileRepository.SectionSaveResult> sameA = repo.saveSection(
                              PLAYER, ProfileSectionId.ECONOMY, 1, a).toCompletableFuture();
                      CompletableFuture<PlayerProfileRepository.SectionSaveResult> sameB = repo.saveSection(
                              PLAYER, ProfileSectionId.ECONOMY, 1, b).toCompletableFuture();
                      Set<PlayerProfileRepository.SectionSaveResult.Status> statuses = Set.of(
                              sameA.join().status(), sameB.join().status());
                      check(statuses.contains(PlayerProfileRepository.SectionSaveResult.Status.COMMITTED),
                              "one same-section writer commits");
                      check(statuses.contains(PlayerProfileRepository.SectionSaveResult.Status.STALE_REVISION),
                              "one same-section writer is stale");
                  } finally {
                      shutdown(repo);
                  }
              }

              private static void crashBeforeManifestRollsBack() throws Exception {
                  Path root = Files.createTempDirectory("pp-tx-before-manifest-");
                  AtomicBoolean once = new AtomicBoolean();
                  YamlPlayerProfileRepository.FaultInjector fault = new YamlPlayerProfileRepository.FaultInjector() {
                      @Override public void afterSectionsMovedBeforeManifest(UUID id, Set<ProfileSectionId> changed)
                              throws IOException {
                          if (once.compareAndSet(false, true)) throw new IOException("crash-before-manifest");
                      }
                      @Override public void afterManifestMovedBeforeCleanup(UUID id, Set<ProfileSectionId> changed) { }
                  };
                  YamlPlayerProfileRepository crashed = repository(root, fault);
                  join(crashed.load(PLAYER));
                  YamlPlayerProfileTransactionManager tx = new YamlPlayerProfileTransactionManager(crashed, CLOCK);
                  expectStage(IOException.class, tx.execute(PLAYER,
                          p -> rewardPlan(p, "crash-before", "before-fingerprint", 50)));
                  shutdown(crashed);

                  YamlPlayerProfileRepository recovered = repository(root,
                          YamlPlayerProfileRepository.FaultInjector.none());
                  try {
                      PlayerProfileSnapshot p = join(recovered.load(PLAYER));
                      check(p.profileRevision() == 0, "pre-manifest crash rolled back generation");
                      check(p.economy().value().wallets().isEmpty(), "pre-manifest wallet rolled back");
                      check(!p.operations().value().operations().containsKey("crash-before"),
                              "pre-manifest receipt rolled back");
                      check(walEmpty(root.resolve(PLAYER.toString()).resolve("wal")), "rollback WAL cleaned");
                  } finally {
                      shutdown(recovered);
                  }
              }

              private static void crashAfterManifestFinalizes() throws Exception {
                  Path root = Files.createTempDirectory("pp-tx-after-manifest-");
                  AtomicBoolean once = new AtomicBoolean();
                  YamlPlayerProfileRepository.FaultInjector fault = new YamlPlayerProfileRepository.FaultInjector() {
                      @Override public void afterSectionsMovedBeforeManifest(UUID id, Set<ProfileSectionId> changed) { }
                      @Override public void afterManifestMovedBeforeCleanup(UUID id, Set<ProfileSectionId> changed)
                              throws IOException {
                          if (once.compareAndSet(false, true)) throw new IOException("crash-after-manifest");
                      }
                  };
                  YamlPlayerProfileRepository crashed = repository(root, fault);
                  join(crashed.load(PLAYER));
                  YamlPlayerProfileTransactionManager tx = new YamlPlayerProfileTransactionManager(crashed, CLOCK);
                  expectStage(IOException.class, tx.execute(PLAYER,
                          p -> rewardPlan(p, "crash-after", "after-fingerprint", 75)));
                  shutdown(crashed);

                  YamlPlayerProfileRepository recovered = repository(root,
                          YamlPlayerProfileRepository.FaultInjector.none());
                  try {
                      PlayerProfileSnapshot p = join(recovered.load(PLAYER));
                      check(p.profileRevision() == 1, "post-manifest commit retained");
                      check(p.economy().value().wallets().get("coins") == 75L,
                              "post-manifest wallet retained");
                      check(p.operations().value().operations().containsKey("crash-after"),
                              "post-manifest receipt retained");
                      check(walEmpty(root.resolve(PLAYER.toString()).resolve("wal")), "finalized WAL cleaned");
                      YamlPlayerProfileTransactionManager replayManager =
                              new YamlPlayerProfileTransactionManager(recovered, CLOCK);
                      check(join(replayManager.execute(PLAYER,
                                      current -> rewardPlan(current, "crash-after", "after-fingerprint", 75)))
                                      .equals("credited"),
                              "post-manifest retry idempotent");
                      check(join(recovered.load(PLAYER)).profileRevision() == 1,
                              "post-manifest retry does not duplicate");
                  } finally {
                      shutdown(recovered);
                  }
              }

              private static PlayerProfileTransactionManager.TransactionPlan<String> rewardPlan(
                      PlayerProfileSnapshot p, String operationId, String fingerprint, long amount) {
                  EconomySection economy = withCoins(p.economy().value(), amount);
                  QuestSection quests = completedQuest(p.quests().value());
                  return new PlayerProfileTransactionManager.TransactionPlan<>(
                          operationId, "quest-reward", fingerprint,
                          List.of(
                                  new PlayerProfileTransactionManager.SectionUpdate(
                                          ProfileSectionId.ECONOMY, p.economy().revision(), economy),
                                  new PlayerProfileTransactionManager.SectionUpdate(
                                          ProfileSectionId.QUESTS, p.quests().revision(), quests)),
                          "credited");
              }

              private static EconomySection withCoins(EconomySection current, long amount) {
                  Map<String, Long> wallets = new LinkedHashMap<>(current.wallets());
                  wallets.put("coins", Math.addExact(wallets.getOrDefault("coins", 0L), amount));
                  return new EconomySection(wallets, current.bankBalance(), current.debts(),
                          current.pendingRewards(), current.operationReceipts(), current.extensions());
              }

              private static QuestSection completedQuest(QuestSection current) {
                  Set<String> completed = new LinkedHashSet<>(current.completed());
                  completed.add("quest-1");
                  Set<String> receipts = new LinkedHashSet<>(current.rewardReceipts());
                  receipts.add("quest-1-reward");
                  return new QuestSection(current.active(), completed, receipts, current.cooldowns(),
                          current.communityContributions(), current.claimableRewards(), current.extensions());
              }

              private static boolean walEmpty(Path wal) throws IOException {
                  if (!Files.isDirectory(wal)) return true;
                  try (var entries = Files.list(wal)) { return entries.findAny().isEmpty(); }
              }

              private static YamlPlayerProfileRepository repository(
                      Path root, YamlPlayerProfileRepository.FaultInjector fault) {
                  return new YamlPlayerProfileRepository(root, CLOCK,
                          Executors.newVirtualThreadPerTaskExecutor(), fault);
              }

              private static <T> T join(CompletionStage<T> stage) {
                  return stage.toCompletableFuture().join();
              }

              private static void shutdown(YamlPlayerProfileRepository repo) {
                  join(repo.shutdown(Duration.ofSeconds(5)));
              }

              private static void expectStage(Class<? extends Throwable> expected, CompletionStage<?> stage) {
                  assertions++;
                  try {
                      stage.toCompletableFuture().join();
                      throw new AssertionError("Expected " + expected.getSimpleName());
                  } catch (CompletionException failure) {
                      Throwable cause = failure.getCause();
                      if (!expected.isInstance(cause)) {
                          throw new AssertionError("Expected " + expected.getSimpleName()
                                  + " but got " + cause, cause);
                      }
                  }
              }

              private static void check(boolean value, String message) {
                  assertions++;
                  if (!value) throw new AssertionError(message);
              }

              private static void expect(Class<? extends Throwable> expected, Throwing action) {
                  assertions++;
                  try {
                      action.run();
                      throw new AssertionError("Expected " + expected.getSimpleName());
                  } catch (Throwable failure) {
                      if (!expected.isInstance(failure)) {
                          throw new AssertionError("Expected " + expected.getSimpleName()
                                  + " but got " + failure, failure);
                      }
                  }
              }

              @FunctionalInterface private interface Throwing { void run() throws Exception; }
          }
