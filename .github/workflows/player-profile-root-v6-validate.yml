name: PlayerProfile recovered regression port (temporary)

on:
  pull_request:
    branches:
      - agent/player-profile-root-reconstruct-20260803-v6
    paths:
      - .github/player-profile-root-v6-trigger.txt
  workflow_dispatch:

permissions:
  contents: write

env:
  RECOVERY_BRANCH: agent/player-profile-root-recovered-20260803-v4
  EXPECTED_RECOVERY_HEAD: d19d0c3ada1bbaf55a181f89b51dc0e6e4dee8dc
  TARGET_BRANCH: rework/class-spec-profile-v2
  EXPECTED_TARGET_HEAD: f25e7e600f418724dd2341e39387a0fa5c0625de

jobs:
  port-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out authenticated recovery history
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RECOVERY_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Port class/spec application regression to ClassSpecSection and push
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_RECOVERY_HEAD=$(git rev-parse HEAD)
          test "$ACTUAL_RECOVERY_HEAD" = "$EXPECTED_RECOVERY_HEAD"
          git fetch --no-tags origin "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$EXPECTED_TARGET_HEAD"

          FILE=src/regression/java/hu/taliann/icesmp/classspec/application/ClassSpecApplicationRegressionSuite.java
          test "$(grep -o 'ClassProfile' "$FILE" | wc -l)" -gt 0
          test "$(grep -o 'ClassProfileMutationStore' "$FILE" | wc -l)" -eq 1
          ! grep -q 'ClassSpecSection' "$FILE"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          marker = "import hu.taliann.icesmp.classspec.domain.*;\n"
          if text.count(marker) != 1:
              raise SystemExit("unexpected classspec domain import marker count")
          text = text.replace(
              marker,
              marker + "import hu.taliann.icesmp.playerprofile.domain.section.ClassSpecSection;\n",
          )
          text = text.replace("ClassProfileMutationStore", "ClassSpecSectionMutationStore")
          text = text.replace("ClassProfile", "ClassSpecSection")
          text = text.replace("ClassSpecSection.empty(PLAYER,0)", "ClassSpecSection.empty(0)")
          text = text.replace("ClassSpecSection.builder(PLAYER)", "ClassSpecSection.builder()")
          path.write_text(text, encoding="utf-8", newline="\n")
          PY

          ! grep -nE 'ClassProfile|ClassProfileMutationStore|empty\(PLAYER|builder\(PLAYER' "$FILE"
          test "$(grep -o 'ClassSpecSectionMutationStore' "$FILE" | wc -l)" -eq 1
          test "$(grep -o 'ClassSpecSection' "$FILE" | wc -l)" -ge 10
          git diff --check
          git status --short
          git diff --stat
          git diff -- "$FILE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "test(player-profile): port class-spec application regressions"

          REMOTE_RECOVERY_HEAD=$(git ls-remote origin "refs/heads/${RECOVERY_BRANCH}" | awk '{print $1}')
          test "$REMOTE_RECOVERY_HEAD" = "$EXPECTED_RECOVERY_HEAD"
          git push origin "HEAD:refs/heads/${RECOVERY_BRANCH}"

      - name: Java 21 clean build and PlayerProfile regressions
        shell: bash
        run: |
          set -o pipefail
          ./gradlew clean build --no-daemon --stacktrace | tee /tmp/player-profile-root-build.log

      - name: Run repository-level PlayerProfile guards
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_player_profile_authority.py
          python3 scripts/test_player_profile_authority.py
          python3 scripts/check_player_profile_openapi.py
          python3 scripts/check_consistency.py
          python3 scripts/check_markdown_links.py --root .
          python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
          git diff --check "$EXPECTED_TARGET_HEAD...HEAD"
