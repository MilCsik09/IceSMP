          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DOMAIN" "$YAML" "$TX" "$API"
          git commit -m "test(player-profile): restore platform regression suites"

          REMOTE_RECOVERY_HEAD=$(git ls-remote origin "refs/heads/${RECOVERY_BRANCH}" | awk '{print $1}')
          test "$REMOTE_RECOVERY_HEAD" = "$EXPECTED_RECOVERY_HEAD"
          git push origin "HEAD:refs/heads/${RECOVERY_BRANCH}"

      - name: Java 21 clean build and all PlayerProfile regressions
        shell: bash
        run: |
          set -o pipefail
          ./gradlew clean build --no-daemon --stacktrace | tee /tmp/player-profile-root-build.log

      - name: Verify PlayerProfile regression markers
        shell: bash
        run: |
          set -euo pipefail
          grep -F "PlayerProfile domain regression suite passed." /tmp/player-profile-root-build.log
          grep -F "PlayerProfile YAML regression suite passed." /tmp/player-profile-root-build.log
          grep -F "PlayerProfile transaction regression suite passed." /tmp/player-profile-root-build.log
          grep -F "PlayerProfile API regression suite passed." /tmp/player-profile-root-build.log
          grep -F "ClassSpecSection lifecycle regression suite passed." /tmp/player-profile-root-build.log
          grep -F "ClassSpecSection v2 domain regression tests passed." /tmp/player-profile-root-build.log

      - name: Run repository-level PlayerProfile guards
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_player_profile_authority.py
          python3 scripts/test_player_profile_authority.py
          python3 scripts/check_player_profile_openapi.py
          python3 scripts/check_consistency.py
          python3 scripts/check_markdown_links.py --root .
          python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
          git diff --check "$EXPECTED_TARGET_HEAD...HEAD"
