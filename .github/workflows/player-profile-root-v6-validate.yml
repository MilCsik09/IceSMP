name: PlayerProfile root verified-prefix patch recovery (temporary)

on:
  pull_request:
    branches:
      - agent/player-profile-root-reconstruct-20260803-v6
    paths:
      - .github/player-profile-root-v6-trigger.txt
  workflow_dispatch:

permissions:
  contents: write
  issues: read

env:
  PAYLOAD_ISSUE: "79"
  VALIDATION_BRANCH: agent/player-profile-root-reconstruct-20260803-v6
  TARGET_BRANCH: rework/class-spec-profile-v2
  EXPECTED_TARGET_HEAD: f25e7e600f418724dd2341e39387a0fa5c0625de
  RECOVERY_BRANCH: agent/player-profile-root-recovered-20260803-v2

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out authenticated Git history
        uses: actions/checkout@v4
        with:
          ref: ${{ env.VALIDATION_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Recover complete unified-diff blocks from verified payload prefix
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT=/tmp/player-profile-root-prefix
          BLOCKS="$ROOT/blocks"
          rm -rf "$ROOT"
          mkdir -p "$BLOCKS"

          gh api "repos/${GITHUB_REPOSITORY}/issues/${PAYLOAD_ISSUE}/comments?per_page=100" > "$ROOT/comments.json"
          python3 .github/player-profile-root-v6/recover_prefix.py "$ROOT/comments.json" "$ROOT"

          set +e
          xz --decompress --stdout "$ROOT/root-prefix.xz" > "$ROOT/partial.patch" 2> "$ROOT/xz-error.txt"
          XZ_RC=$?
          set -e
          test -s "$ROOT/partial.patch"
          echo "Expected truncated XZ exit code: $XZ_RC"
          cat "$ROOT/xz-error.txt" || true

          python3 - "$ROOT/partial.patch" "$BLOCKS" "$ROOT/prefix-report.json" <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import pathlib
          import re
          import sys

          patch_path = pathlib.Path(sys.argv[1])
          blocks_dir = pathlib.Path(sys.argv[2])
          report_path = pathlib.Path(sys.argv[3])
          raw = patch_path.read_bytes()
          if b"\x00" in raw:
              raise SystemExit("partial patch contains NUL bytes")
          text = raw.decode("utf-8", errors="strict")
          matches = list(re.finditer(r"(?m)^diff --git a/.+ b/.+\n", text))
          if not matches:
              raise SystemExit("no diff --git headers recovered")
          prelude = text[:matches[0].start()]
          if prelude.strip():
              raise SystemExit(f"unexpected patch prelude: {prelude[:200]!r}")

          headers = []
          for index, match in enumerate(matches):
              start = match.start()
              end = matches[index + 1].start() if index + 1 < len(matches) else len(text)
              block = text[start:end]
              path = blocks_dir / f"{index:04d}.patch"
              path.write_text(block, encoding="utf-8")
              headers.append({
                  "index": index,
                  "header": match.group(0).strip(),
                  "bytes": len(block.encode("utf-8")),
                  "sha256": hashlib.sha256(block.encode("utf-8")).hexdigest(),
              })

          report = {
              "partial_bytes": len(raw),
              "partial_sha256": hashlib.sha256(raw).hexdigest(),
              "block_count": len(headers),
              "blocks": headers,
          }
          report_path.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

          git fetch --no-tags origin "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          ACTUAL_TARGET_HEAD=$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")
          echo "Verified target head: $ACTUAL_TARGET_HEAD"
          test "$ACTUAL_TARGET_HEAD" = "$EXPECTED_TARGET_HEAD"

          if git ls-remote --exit-code --heads origin "refs/heads/${RECOVERY_BRANCH}" >/dev/null 2>&1; then
            echo "Recovery branch already exists; refusing overwrite." >&2
            exit 1
          fi

          git switch --detach "$ACTUAL_TARGET_HEAD"
          git switch -c "$RECOVERY_BRANCH"
          git reset --hard "$ACTUAL_TARGET_HEAD"
          git clean -fdx

          APPLIED=0
          FAILED_BLOCK=""
          : > "$ROOT/applied-blocks.txt"
          for block in "$BLOCKS"/*.patch; do
            header=$(head -n 1 "$block")
            if git apply --check --index "$block"; then
              git apply --index "$block"
              printf '%s\t%s\n' "$(basename "$block")" "$header" | tee -a "$ROOT/applied-blocks.txt"
              APPLIED=$((APPLIED + 1))
            else
              FAILED_BLOCK=$(basename "$block")
              echo "Stopped before incomplete/non-applicable block: $FAILED_BLOCK — $header"
              break
            fi
          done
          test "$APPLIED" -gt 0

          rm -rf \
            .github/player-profile-root-payload \
            .github/profile-v2-finalize \
            .github/profile-v2-finalize-v2 \
            .github/profile-v2-finalize-v3 \
            .github/profile-v2-finalize-v4 \
            .github/profile-v2-finalize-v5
          rm -f \
            .github/workflows/player-profile-bootstrap-checkout.yml \
            .github/player-profile-bootstrap-trigger.txt \
            .github/player-profile-bootstrap-run.txt \
            .github/workflows/profile-v2-source-export.yml \
            .github/workflows/profile-v2-payload-check.yml \
            gradle-build.log \
            gradle-check.log

          git add -A
          git diff --cached --check

          if git diff --cached --name-only | grep -E '(^|/)(player-profile-root-v6|player-profile-root-payload|profile-v2-finalize)|\.b64$|gradle-(build|check)\.log$'; then
            echo "Temporary payload or build artifact reached the recovery index." >&2
            exit 1
          fi

          echo "=== recovered prefix summary ==="
          echo "Applied blocks: $APPLIED"
          echo "First rejected block: ${FAILED_BLOCK:-none}"
          git status --short
          git diff --cached --stat
          git diff --cached --name-status

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "wip(player-profile): recover verified root platform patch prefix"
          git push origin "HEAD:refs/heads/${RECOVERY_BRANCH}"

      - name: Build recovered prefix on Java 21
        shell: bash
        run: |
          set +e
          ./gradlew clean build --no-daemon --stacktrace > /tmp/player-profile-recovery-build.log 2>&1
          BUILD_RC=$?
          set -e
          echo "=== Gradle clean build tail ==="
          tail -n 500 /tmp/player-profile-recovery-build.log
          exit "$BUILD_RC"
