name: PlayerProfile recovered root compile hardening (temporary)

on:
  pull_request:
    branches:
      - agent/player-profile-root-reconstruct-20260803-v6
    paths:
      - .github/player-profile-root-v6-trigger.txt
  workflow_dispatch:

permissions:
  contents: write

env:
  RECOVERY_BRANCH: agent/player-profile-root-recovered-20260803-v4
  EXPECTED_RECOVERY_HEAD: bf3e40ca5cc6b46f9b5af5cc36f374f63347e7ef
  TARGET_BRANCH: rework/class-spec-profile-v2
  EXPECTED_TARGET_HEAD: f25e7e600f418724dd2341e39387a0fa5c0625de

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out authenticated recovery history
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RECOVERY_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Replace obsolete reset call-site name and push fast-forward commit
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_RECOVERY_HEAD=$(git rev-parse HEAD)
          test "$ACTUAL_RECOVERY_HEAD" = "$EXPECTED_RECOVERY_HEAD"
          git fetch --no-tags origin "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$EXPECTED_TARGET_HEAD"

          FILES=(
            src/main/java/hu/taliann/icesmp/commands/SpecCommand.java
            src/main/java/hu/taliann/icesmp/commands/job/JobAdminSubcommand.java
          )
          BEFORE=$(grep -h -o 'resetClassSpecSectionV2' "${FILES[@]}" | wc -l)
          test "$BEFORE" -eq 2
          perl -pi -e 's/resetClassSpecSectionV2/resetClassSpecSection/g' "${FILES[@]}"
          ! grep -R --line-number --fixed-strings 'resetClassSpecSectionV2' "${FILES[@]}"
          AFTER=$(grep -h -o 'resetClassSpecSection(' "${FILES[@]}" | wc -l)
          test "$AFTER" -ge 2

          git diff --check
          git diff --exit-code -- src/main/java/hu/taliann/icesmp/managers/SpecializationManager.java
          git status --short
          git diff --stat
          git diff -- "${FILES[@]}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${FILES[@]}"
          git commit -m "fix(player-profile): use canonical class-spec reset gateway"

          REMOTE_RECOVERY_HEAD=$(git ls-remote origin "refs/heads/${RECOVERY_BRANCH}" | awk '{print $1}')
          test "$REMOTE_RECOVERY_HEAD" = "$EXPECTED_RECOVERY_HEAD"
          git push origin "HEAD:refs/heads/${RECOVERY_BRANCH}"

      - name: Java 21 clean build and PlayerProfile regressions
        shell: bash
        run: |
          set -o pipefail
          ./gradlew clean build --no-daemon --stacktrace | tee /tmp/player-profile-root-build.log

      - name: Run repository-level PlayerProfile guards
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_player_profile_authority.py
          python3 scripts/test_player_profile_authority.py
          python3 scripts/check_player_profile_openapi.py
          python3 scripts/check_consistency.py
          python3 scripts/check_markdown_links.py --root .
          python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
          git diff --check "$EXPECTED_TARGET_HEAD...HEAD"
