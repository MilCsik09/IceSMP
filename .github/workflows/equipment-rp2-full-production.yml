name: Equipment RP2 Full Production

on:
  push:
    branches:
      - feature/equipment-rp2-full-production
  pull_request:
    branches:
      - feature/equipment-rp2-art-bible-pilot
    paths:
      - "resource-pack/**"
      - "src/main/resources/config/equipment-catalog-expansion.yml"
      - "src/main/resources/equipment-rp2-production.properties"
      - "src/main/java/hu/taliann/icesmp/items/WearablePresentation.java"
      - "src/main/java/hu/taliann/icesmp/itemization/PaperSourceIntegrityRuntimeProbe.java"
      - "src/regression/java/hu/taliann/icesmp/resourcepack/**"
      - "scripts/generate_equipment_rp2_*"
      - "scripts/generate_long_term_equipment_catalog.py"
      - "scripts/validate_equipment_rp2_production.py"
      - "scripts/validate_equipment_rp2_gameplay_immutability.py"
      - "scripts/tests/test_equipment_rp2_asset_audit.py"
      - "docs/development/equipment-rp2-*"
      - ".github/workflows/equipment-rp2-full-production.yml"

permissions:
  contents: read

jobs:
  exact-head-full-production:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact child head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 256
          persist-credentials: false

      - name: Verify exact stacked parent and merge-base
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"
          git fetch --no-tags --depth=256 origin \
            feature/equipment-rp2-art-bible-pilot:refs/remotes/origin/feature/equipment-rp2-art-bible-pilot
          parent_sha=$(git rev-parse refs/remotes/origin/feature/equipment-rp2-art-bible-pilot)
          merge_base=$(git merge-base HEAD refs/remotes/origin/feature/equipment-rp2-art-bible-pilot)
          test "${merge_base}" = "${parent_sha}"
          read behind ahead < <(git rev-list --left-right --count \
            refs/remotes/origin/feature/equipment-rp2-art-bible-pilot...HEAD)
          test "${behind}" = "0"
          test "${ahead}" -gt "0"
          printf '%s\n' \
            "EQUIPMENT_RP2_C_HEAD=${EXPECTED_HEAD}" \
            "EQUIPMENT_RP2_B_PARENT=${parent_sha}" \
            "EQUIPMENT_RP2_C_MERGE_BASE=${merge_base}" \
            "EQUIPMENT_RP2_C_AHEAD=${ahead}"
          mkdir -p build/reports/equipment-rp2-c
          printf '{"child":"%s","parent":"%s","merge_base":"%s","behind":0,"ahead":%s}\n' \
            "${EXPECTED_HEAD}" "${parent_sha}" "${merge_base}" "${ahead}" \
            > build/reports/equipment-rp2-c/final-topology.json
          echo "RP2_PARENT_SHA=${parent_sha}" >> "${GITHUB_ENV}"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install asset validation dependencies
        run: python -m pip install --disable-pip-version-check 'PyYAML>=6.0,<7.0' 'Pillow==11.3.0'

      - name: Validate full production authority and generated assets
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate_equipment_rp2_art_bible.py --check \
            --collision-output build/reports/equipment-rp2-c/collision-audit.json
          python3 scripts/generate_equipment_rp2_pilot.py --check
          python3 scripts/generate_equipment_rp2_production.py --check
          python3 scripts/generate_long_term_equipment_catalog.py --check
          python3 scripts/validate_equipment_rp2_gameplay_immutability.py \
            --baseline "${RP2_PARENT_SHA}" \
            --output build/reports/equipment-rp2-c/gameplay-immutability.json
          python3 scripts/validate_equipment_rp2_production.py --enforce \
            | tee build/reports/equipment-rp2-c/validation-summary.json
          python3 scripts/equipment_rp2_asset_audit.py
          python3 scripts/generate_equipment_rp2_manifests.py --enforce
          python3 scripts/generate_equipment_rp2_docs.py --check
          sha256sum docs/development/equipment-rp2-art-bible.json \
            > build/reports/equipment-rp2-c/art-bible.sha256

      - name: Validate complete resource pack and repository consistency
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_resource_pack.py
          python3 scripts/resource_pack.py validate --source resource-pack
          python3 scripts/audit_equipment_assets.py
          python3 scripts/check_consistency.py
          python3 scripts/check_documentation_coverage.py
          python3 scripts/check_markdown_links.py

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Java build and cumulative gameplay regressions
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean build resourcePackRegressionTest \
            itemizationDomainRegressionTest vanillaCraftingBoundaryRegressionTest \
            equipmentDomainRegressionTest professions2RegressionTest \
            runeLifecycleRegressionTest playerProfileFullAuthorityRegressionTest \
            --no-daemon --console=plain

      - name: Paper 1.21.11 runtime proof
        shell: bash
        timeout-minutes: 12
        env:
          JAVA_TOOL_OPTIONS: -Dicesmp.source-integrity-runtime=true
        run: |
          set -euo pipefail
          rm -rf run
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          set +e
          timeout --signal=INT --kill-after=20s 420s ./gradlew --no-daemon --console=plain \
            --init-script scripts/source_integrity_runtime.init.gradle runServer \
            2>&1 | tee paper-rp2-production.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ ${status} -ne 0 && ${status} -ne 124 && ${status} -ne 130 ]]; then
            exit "${status}"
          fi
          grep -E "Running the server|Starting minecraft server version 1\.21\.11|Done \(" paper-rp2-production.log
          grep -F 'ICESMP_SOURCE_INTEGRITY_RUNTIME_PROBE_PASS' paper-rp2-production.log
          ! grep -F 'ICESMP_SOURCE_INTEGRITY_RUNTIME_PROBE_FAIL' paper-rp2-production.log
          ! grep -E "Could not load.*IceSMP|Error occurred while enabling IceSMP|Exception.*IceSMP" paper-rp2-production.log
          mkdir -p build/reports/equipment-rp2-c
          cp paper-rp2-production.log build/reports/equipment-rp2-c/runtime-proof.log

      - name: Recreate exact-head machine-readable closure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/equipment-rp2-c
          python3 scripts/generate_equipment_rp2_art_bible.py --check \
            --collision-output build/reports/equipment-rp2-c/collision-audit.json
          python3 scripts/equipment_rp2_asset_audit.py
          python3 scripts/generate_equipment_rp2_manifests.py --enforce
          python3 scripts/generate_equipment_rp2_docs.py --check
          python3 scripts/validate_equipment_rp2_production.py --enforce \
            | tee build/reports/equipment-rp2-c/validation-summary.json
          sha256sum docs/development/equipment-rp2-art-bible.json \
            > build/reports/equipment-rp2-c/art-bible.sha256

      - name: Assemble immutable evidence bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle=build/reports/equipment-rp2-c/bundle
          mkdir -p "${bundle}/evidence"
          cp docs/development/equipment-rp2-art-bible.json "${bundle}/"
          cp docs/development/equipment-rp2-production-manifest.json "${bundle}/"
          cp docs/development/equipment-rp2-production-asset-graph.json "${bundle}/"
          cp docs/development/equipment-rp2-final-authority.json "${bundle}/"
          cp docs/development/equipment-rp2-production-evidence/index.json "${bundle}/evidence/"
          cp docs/development/equipment-rp2-production-evidence/*-sheet.png "${bundle}/evidence/"
          cp docs/development/equipment-rp2-production-evidence/*-overview.png "${bundle}/evidence/"
          cp docs/development/equipment-rp2-production-evidence/family-comparison.png "${bundle}/evidence/"
          cp docs/development/equipment-rp2-production-evidence/progression-comparison.png "${bundle}/evidence/"
          cp docs/development/equipment-rp2-production-evidence/scale-readability.png "${bundle}/evidence/"
          cp docs/development/equipment-rp2-production-evidence/mechanical-sets.png "${bundle}/evidence/"
          cp docs/development/equipment-rp2-production-evidence/boss-prestige-examples.png "${bundle}/evidence/"
          cp build/reports/equipment-rp2/asset-audit.json "${bundle}/"
          cp build/reports/equipment-rp2-c/validation-summary.json "${bundle}/"
          cp build/reports/equipment-rp2-c/collision-audit.json "${bundle}/"
          cp build/reports/equipment-rp2-c/art-bible.sha256 "${bundle}/"
          cp build/reports/equipment-rp2-c/final-topology.json "${bundle}/"
          cp build/reports/equipment-rp2-c/gameplay-immutability.json "${bundle}/"
          cp build/reports/equipment-rp2-c/runtime-proof.log "${bundle}/"
          find "${bundle}" -type f -print0 | sort -z | xargs -0 sha256sum > "${bundle}/SHA256SUMS"

      - name: Upload RP2-C evidence
        uses: actions/upload-artifact@v4
        with:
          name: equipment-rp2-c-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/reports/equipment-rp2-c/bundle
          if-no-files-found: error
          retention-days: 30

      - name: Prove tracked checkout remains clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
