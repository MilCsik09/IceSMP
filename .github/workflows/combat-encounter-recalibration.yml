name: Combat Encounter Recalibration

on:
  push:
    branches:
      - feature/combat-encounter-recalibration
  pull_request:
    branches:
      - feature/equipment-rp2-full-production

permissions:
  contents: read

jobs:
  exact-head-combat-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout exact child head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 256
          persist-credentials: false

      - name: Verify exact stacked parent and merge-base
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PARENT: feature/equipment-rp2-full-production
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"
          git fetch --no-tags --depth=256 origin "${PARENT}:refs/remotes/origin/${PARENT}"
          parent_sha=$(git rev-parse "refs/remotes/origin/${PARENT}")
          merge_base=$(git merge-base HEAD "refs/remotes/origin/${PARENT}")
          read behind ahead < <(git rev-list --left-right --count "refs/remotes/origin/${PARENT}...HEAD")
          test "${merge_base}" = "${parent_sha}"
          test "${behind}" = "0"
          test "${ahead}" -gt "0"
          mkdir -p build/reports/combat-foundation
          printf '{"child":"%s","parent":"%s","merge_base":"%s","behind":0,"ahead":%s}\n' \
            "${EXPECTED_HEAD}" "${parent_sha}" "${merge_base}" "${ahead}" \
            > build/reports/combat-foundation/final-topology.json
          echo "COMBAT_PARENT_SHA=${parent_sha}" >> "${GITHUB_ENV}"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install report dependencies
        run: python -m pip install --disable-pip-version-check 'PyYAML>=6.0,<7.0' 'Pillow==11.3.0'

      - name: Validate authored catalog and deterministic balance evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_long_term_equipment_catalog.py --require-eight-sets \
            --output build/reports/combat-foundation/equipment-catalog.json
          python3 scripts/audit_combat_encounter_foundation.py --check \
            --output build/reports/combat-foundation
          python3 scripts/test_progression_balance.py

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Full build and cumulative gameplay regressions
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean build combatEncounterFoundationAudit \
            itemizationDomainRegressionTest equipmentDomainRegressionTest \
            mobEncounterDomainRegressionTest mobRuntimeSourceRegressionTest \
            configGuiCoverageRegressionTest advancedConfigMenuRegressionTest \
            --no-daemon --console=plain | tee gradle-combat-foundation.log

      - name: Paper 1.21.11 vanilla denominator and runtime proof
        shell: bash
        timeout-minutes: 12
        env:
          JAVA_TOOL_OPTIONS: >-
            -Dicesmp.source-integrity-runtime=true
            -Dicesmp.combat-evidence-dir=${{ github.workspace }}/build/reports/combat-foundation
        run: |
          set -euo pipefail
          rm -rf run
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          set +e
          timeout --signal=INT --kill-after=20s 420s ./gradlew --no-daemon --console=plain \
            --init-script scripts/source_integrity_runtime.init.gradle runServer \
            2>&1 | tee paper-combat-foundation.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ ${status} -ne 0 && ${status} -ne 124 && ${status} -ne 130 ]]; then
            exit "${status}"
          fi
          grep -E "Running the server|Starting minecraft server version 1\.21\.11|Done \(" paper-combat-foundation.log
          grep -F 'ICESMP_SOURCE_INTEGRITY_RUNTIME_PROBE_PASS' paper-combat-foundation.log
          ! grep -F 'ICESMP_SOURCE_INTEGRITY_RUNTIME_PROBE_FAIL' paper-combat-foundation.log
          ! grep -E "Could not load.*IceSMP|Error occurred while enabling IceSMP|Exception.*IceSMP" paper-combat-foundation.log
          test -s build/reports/combat-foundation/vanilla-runtime-benchmark.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("build/reports/combat-foundation/vanilla-runtime-benchmark.json").read_text())
          assert report["runtime"] == "Paper 1.21.11"
          assert len(report["items"]) == 38
          assert any(row["material"] == "NETHERITE_CHESTPLATE" and row["armor"] > 0 for row in report["items"])
          assert any(row["material"] == "NETHERITE_SWORD" and row["attack_damage_modifier"] > 0 for row in report["items"])
          PY
          python3 scripts/audit_combat_encounter_foundation.py --check \
            --output build/reports/combat-foundation \
            --runtime-benchmark build/reports/combat-foundation/vanilla-runtime-benchmark.json
          test -s build/reports/combat-foundation/combat-items-runtime.json
          cp paper-combat-foundation.log build/reports/combat-foundation/runtime-proof.log

      - name: Recreate exact-head closure and repository checks
        shell: bash
        run: |
          set -euo pipefail
          child_sha=$(git rev-parse HEAD)
          merge_base=$(git merge-base HEAD "${COMBAT_PARENT_SHA}")
          read behind ahead < <(git rev-list --left-right --count "${COMBAT_PARENT_SHA}...HEAD")
          test "${merge_base}" = "${COMBAT_PARENT_SHA}"
          test "${behind}" = "0"
          printf '{"child":"%s","parent":"%s","merge_base":"%s","behind":0,"ahead":%s}\n' \
            "${child_sha}" "${COMBAT_PARENT_SHA}" "${merge_base}" "${ahead}" \
            > build/reports/combat-foundation/final-topology.json
          python3 scripts/audit_long_term_equipment_catalog.py --require-eight-sets \
            --output build/reports/combat-foundation/equipment-catalog-final.json
          python3 scripts/audit_combat_encounter_foundation.py --check \
            --output build/reports/combat-foundation
          python3 scripts/test_resource_pack.py
          python3 scripts/audit_equipment_assets.py
          python3 scripts/check_consistency.py
          python3 scripts/check_documentation_coverage.py
          python3 scripts/check_markdown_links.py

      - name: Assemble immutable evidence bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle=build/reports/combat-foundation/bundle
          mkdir -p "${bundle}"
          cp docs/development/combat-balance-authority.json "${bundle}/"
          cp build/reports/combat-foundation/*.json "${bundle}/"
          cp build/reports/combat-foundation/runtime-proof.log "${bundle}/"
          cp gradle-combat-foundation.log "${bundle}/"
          find "${bundle}" -type f -print0 | sort -z | xargs -0 sha256sum > "${bundle}/SHA256SUMS"

      - name: Upload exact-head combat evidence
        uses: actions/upload-artifact@v4
        with:
          name: combat-encounter-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/reports/combat-foundation/bundle
          if-no-files-found: error
          retention-days: 30

      - name: Prove tracked checkout remains clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
