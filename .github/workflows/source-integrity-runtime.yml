name: Source Integrity Paper Runtime

on:
  pull_request:
    branches:
      - feature/vanilla-crafting-boundary
      - feature/equipment-2
      - feature/professions-2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare isolated Paper runtime
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
      - name: Run Paper 1.21.11 source-integrity probe
        env:
          JAVA_TOOL_OPTIONS: -Dicesmp.source-integrity-runtime=true
        run: |
          set -o pipefail
          timeout 420s ./gradlew --no-daemon --console=plain \
            --init-script scripts/source_integrity_runtime.init.gradle runServer \
            | tee paper-source-integrity.log
      - name: Require runtime proof marker
        if: always()
        run: |
          grep -F 'ICESMP_SOURCE_INTEGRITY_RUNTIME_PROBE_PASS' paper-source-integrity.log
          ! grep -F 'ICESMP_SOURCE_INTEGRITY_RUNTIME_PROBE_FAIL' paper-source-integrity.log
