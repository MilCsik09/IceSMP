name: Publish resource pack to R2
run-name: >-
  Resource pack ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event_name == 'pull_request' && 'validate-only' || 'publish') }}
  @ ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Futtatási mód"
        required: true
        default: publish
        type: choice
        options:
          - validate-only
          - r2-preflight
          - publish
      public_base_url:
        description: "Publikus R2 custom-domain alapcím"
        required: true
        default: "https://assets.icesmp.taliann.dev"
        type: string
  pull_request:
    paths:
      - "resource-pack/**"
      - "!resource-pack/README.md"
      - "scripts/resource_pack.py"
      - "scripts/test_resource_pack.py"
      - "scripts/generate_icesmp_hud_assets.py"
      - "gradle/run-folia.init.gradle"
      - "build.gradle.kts"
      - ".github/workflows/resource-pack-r2.yml"
  push:
    branches:
      - master
    paths:
      - "resource-pack/**"
      - "!resource-pack/README.md"
      - "scripts/resource_pack.py"
      - "scripts/test_resource_pack.py"
      - "scripts/generate_icesmp_hud_assets.py"
      - "gradle/run-folia.init.gradle"
      - "build.gradle.kts"
      - ".github/workflows/resource-pack-r2.yml"

permissions:
  contents: write

concurrency:
  group: resource-pack-r2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXECUTION_MODE: >-
        ${{ github.event_name == 'workflow_dispatch' && inputs.mode
        || (github.event_name == 'pull_request' && 'validate-only' || 'publish') }}
      PACK_DIR: resource-pack
      PACK_OUTPUT: build/resource-pack/icesmp.zip
      METADATA_FILE: src/main/resources/resource-pack.properties
      PUBLIC_BASE_URL: >-
        ${{ github.event_name == 'workflow_dispatch' && inputs.public_base_url
        || 'https://assets.icesmp.taliann.dev' }}
      OBJECT_PREFIX: resource-packs
      EXTERNAL_BASE_URL: https://download.mc-packs.net/pack/4900b0a9bed8db710143393916db3687e01def54.zip
      EXTERNAL_BASE_SHA1: 4900b0a9bed8db710143393916db3687e01def54
      EXTERNAL_BASE_PATH: build/resource-pack/external-base.zip
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REGION: auto
      AWS_EC2_METADATA_DISABLED: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.RESOURCE_PACK_PUSH_TOKEN || github.token }}

      - name: Describe execution
        shell: bash
        run: |
          {
            echo "Mode: ${EXECUTION_MODE}"
            echo "Ref: ${GITHUB_REF}"
            echo "Public base URL: ${PUBLIC_BASE_URL}"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Guard production publish source
        if: env.EXECUTION_MODE == 'publish'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "::error title=Production publish requires master::Select the master branch in the Run workflow menu, or use r2-preflight for a feature branch."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deterministic HUD asset tooling
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Test pack tooling
        run: python3 scripts/test_resource_pack.py

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Validate first-party IceSMP HUD
        run: ./gradlew validateIceSmpHudPackage iceSmpHudRegressionTest auditIceSmpHudAssets --no-daemon --console=plain

      - name: Fetch and verify immutable external base pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$EXTERNAL_BASE_PATH")"
          curl --fail --silent --show-error --location --retry 5 \
            "$EXTERNAL_BASE_URL" --output "$EXTERNAL_BASE_PATH"
          echo "${EXTERNAL_BASE_SHA1}  ${EXTERNAL_BASE_PATH}" | sha1sum --check --strict

      - name: Deterministically merge first-party HUD pack and stage SHA-1
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew stageMergedResourcePackForR2 \
            -PicesmpExternalPack="$EXTERNAL_BASE_PATH" \
            --configuration-cache --no-daemon --console=plain
          source build/resource-pack/merged.properties
          FILE_NAME="icesmp-${sha1}.zip"
          OBJECT_KEY="${OBJECT_PREFIX}/${FILE_NAME}"
          {
            echo "sha1=${sha1}"
            echo "size=${size}"
            echo "file_name=${FILE_NAME}"
            echo "object_key=${OBJECT_KEY}"
            echo "url=${PUBLIC_BASE_URL%/}/${OBJECT_KEY}"
          } >> "$GITHUB_OUTPUT"

      - name: Validate public custom-domain DNS
        if: env.EXECUTION_MODE == 'publish'
        shell: bash
        run: |
          set -euo pipefail
          PUBLIC_HOST="$(python3 - <<'PY'
          import os
          from urllib.parse import urlparse

          parsed = urlparse(os.environ["PUBLIC_BASE_URL"])
          if parsed.scheme != "https" or not parsed.hostname:
              raise SystemExit("PUBLIC_BASE_URL must be an absolute HTTPS URL")
          print(parsed.hostname)
          PY
          )"

          resolved=0
          for attempt in {1..12}; do
            if getent ahosts "$PUBLIC_HOST" >/dev/null 2>&1; then
              resolved=1
              break
            fi
            echo "Waiting for DNS: ${PUBLIC_HOST} (${attempt}/12)"
            sleep 5
          done

          if [[ "$resolved" != "1" ]]; then
            echo "::error title=Public R2 domain does not resolve::${PUBLIC_HOST} has no DNS result. Attach it under Cloudflare R2 > icesmp > Settings > Custom Domains before publishing."
            exit 1
          fi

      - name: Validate R2 credentials and bucket access
        if: env.EXECUTION_MODE != 'validate-only'
        shell: bash
        run: |
          set -euo pipefail
          for variable in R2_ACCOUNT_ID R2_BUCKET_NAME AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            if [[ -z "${!variable:-}" ]]; then
              echo "::error title=Missing R2 secret::${variable} is empty."
              exit 1
            fi
          done

          aws --version
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3api list-objects-v2 \
            --bucket "$R2_BUCKET_NAME" \
            --max-keys 1 \
            --endpoint-url "$ENDPOINT" \
            >/dev/null

      - name: Upload immutable pack version
        if: env.EXECUTION_MODE != 'validate-only'
        env:
          OBJECT_KEY: ${{ steps.pack.outputs.object_key }}
          PACK_SIZE: ${{ steps.pack.outputs.size }}
        shell: bash
        run: |
          set -euo pipefail
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

          aws s3 cp "$PACK_OUTPUT" "s3://${R2_BUCKET_NAME}/${OBJECT_KEY}" \
            --endpoint-url "$ENDPOINT" \
            --content-type application/zip \
            --cache-control "public,max-age=31536000,immutable" \
            --only-show-errors

          REMOTE_SIZE="$(aws s3api head-object \
            --bucket "$R2_BUCKET_NAME" \
            --key "$OBJECT_KEY" \
            --endpoint-url "$ENDPOINT" \
            --query ContentLength \
            --output text)"
          if [[ "$REMOTE_SIZE" != "$PACK_SIZE" ]]; then
            echo "::error title=R2 object size mismatch::Expected ${PACK_SIZE} bytes, got ${REMOTE_SIZE}."
            exit 1
          fi

      - name: Verify the public immutable URL end to end
        if: env.EXECUTION_MODE == 'publish'
        env:
          PACK_URL: ${{ steps.pack.outputs.url }}
          PACK_SHA1: ${{ steps.pack.outputs.sha1 }}
        shell: bash
        run: |
          set -euo pipefail
          if ! curl --fail --silent --show-error --location \
            --retry 12 --retry-all-errors --retry-delay 5 \
            "$PACK_URL" --output build/resource-pack/public-copy.zip; then
            echo "::error title=Public resource-pack download failed::Verify that ${PUBLIC_BASE_URL} is an active custom domain of the ${R2_BUCKET_NAME} R2 bucket."
            exit 1
          fi
          echo "${PACK_SHA1}  build/resource-pack/public-copy.zip" | sha1sum --check --strict

      - name: Publish latest alias and manifest
        if: env.EXECUTION_MODE == 'publish'
        env:
          PACK_URL: ${{ steps.pack.outputs.url }}
          PACK_SHA1: ${{ steps.pack.outputs.sha1 }}
          PACK_SIZE: ${{ steps.pack.outputs.size }}
        shell: bash
        run: |
          set -euo pipefail
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          MANIFEST="build/resource-pack/manifest.json"

          aws s3 cp "$PACK_OUTPUT" "s3://${R2_BUCKET_NAME}/${OBJECT_PREFIX}/latest.zip" \
            --endpoint-url "$ENDPOINT" \
            --content-type application/zip \
            --cache-control "no-cache,max-age=0,must-revalidate" \
            --only-show-errors

          python3 scripts/resource_pack.py manifest \
            --output "$MANIFEST" \
            --url "$PACK_URL" \
            --sha1 "$PACK_SHA1" \
            --size "$PACK_SIZE" \
            --commit "$GITHUB_SHA"

          aws s3 cp "$MANIFEST" "s3://${R2_BUCKET_NAME}/${OBJECT_PREFIX}/manifest.json" \
            --endpoint-url "$ENDPOINT" \
            --content-type application/json \
            --cache-control "no-cache,max-age=0,must-revalidate" \
            --only-show-errors

      - name: Update bundled plugin fallback metadata
        if: env.EXECUTION_MODE == 'publish'
        env:
          PACK_URL: ${{ steps.pack.outputs.url }}
          PACK_SHA1: ${{ steps.pack.outputs.sha1 }}
        run: |
          python3 scripts/resource_pack.py update-metadata \
            --metadata "$METADATA_FILE" \
            --url "$PACK_URL" \
            --sha1 "$PACK_SHA1"

      - name: Commit generated fallback metadata
        if: env.EXECUTION_MODE == 'publish' && github.ref == 'refs/heads/master'
        env:
          PACK_SHA1: ${{ steps.pack.outputs.sha1 }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- "$METADATA_FILE"; then
            echo "Bundled plugin metadata already points at this immutable pack."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$METADATA_FILE"
          git commit -m "Update resource pack to ${PACK_SHA1}"

          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master

      - name: Write result summary
        if: always()
        shell: bash
        env:
          PACK_URL: ${{ steps.pack.outputs.url }}
          PACK_SHA1: ${{ steps.pack.outputs.sha1 }}
        run: |
          {
            echo
            echo "## Resource-pack result"
            echo
            echo "- Mode: \`${EXECUTION_MODE}\`"
            echo "- SHA-1: \`${PACK_SHA1:-not-built}\`"
            echo "- Public URL: \`${PACK_URL:-not-built}\`"
            case "$EXECUTION_MODE" in
              validate-only)
                echo "- R2 was not accessed."
                ;;
              r2-preflight)
                echo "- Immutable object upload and S3 verification completed; public alias, manifest and plugin metadata were not changed."
                ;;
              publish)
                echo "- Full production publish was requested."
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
