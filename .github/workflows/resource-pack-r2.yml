name: Publish resource pack to R2

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "resource-pack/**"
      - ".github/workflows/resource-pack-r2.yml"

permissions:
  contents: write

concurrency:
  group: resource-pack-r2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PACK_DIR: resource-pack
      CONFIG_FILE: src/main/resources/config.yml
      PUBLIC_BASE_URL: https://icesmp.taliann.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate resource pack source
        run: |
          test -f "$PACK_DIR/pack.mcmeta" || {
            echo "Missing $PACK_DIR/pack.mcmeta. Store the unpacked pack under resource-pack/." >&2
            exit 1
          }

      - name: Build deterministic ZIP and SHA-1
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/resource-pack
          find "$PACK_DIR" -exec touch -d '@0' {} +
          (
            cd "$PACK_DIR"
            find . -type f -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 zip -X -q "../resource-pack/icesmp.zip"
          )
          SHA1="$(sha1sum build/resource-pack/icesmp.zip | awk '{print $1}')"
          FILE_NAME="icesmp-${SHA1}.zip"
          mv build/resource-pack/icesmp.zip "build/resource-pack/${FILE_NAME}"
          echo "sha1=${SHA1}" >> "$GITHUB_OUTPUT"
          echo "file_name=${FILE_NAME}" >> "$GITHUB_OUTPUT"
          echo "url=${PUBLIC_BASE_URL}/${FILE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS CLI for Cloudflare R2
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          aws-region: auto

      - name: Upload to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          FILE_NAME: ${{ steps.pack.outputs.file_name }}
        run: |
          aws s3 cp "build/resource-pack/${FILE_NAME}" "s3://${R2_BUCKET_NAME}/${FILE_NAME}" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --content-type application/zip \
            --cache-control "public,max-age=31536000,immutable"

      - name: Update plugin URL and SHA-1
        env:
          PACK_URL: ${{ steps.pack.outputs.url }}
          PACK_SHA1: ${{ steps.pack.outputs.sha1 }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path(os.environ.get("CONFIG_FILE", "src/main/resources/config.yml"))
          text = path.read_text(encoding="utf-8")
          url = os.environ["PACK_URL"]
          sha1 = os.environ["PACK_SHA1"]

          text, url_count = re.subn(
              r'(?m)^(  url: )"[^"]*"$',
              lambda match: f'{match.group(1)}"{url}"',
              text,
              count=1,
          )
          text, hash_count = re.subn(
              r'(?m)^(  sha1: )"[0-9a-fA-F]*"$',
              lambda match: f'{match.group(1)}"{sha1}"',
              text,
              count=1,
          )
          if url_count != 1 or hash_count != 1:
              raise SystemExit("Could not uniquely update resource-pack.url and resource-pack.sha1")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit generated pack metadata
        env:
          PACK_SHA1: ${{ steps.pack.outputs.sha1 }}
        run: |
          if git diff --quiet -- "$CONFIG_FILE"; then
            echo "Plugin metadata already points at this pack."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$CONFIG_FILE"
          git commit -m "Update resource pack to ${PACK_SHA1}"
          git push
