name: Publish resource pack to R2

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "resource-pack/**"
      - "!resource-pack/README.md"
      - "scripts/resource_pack.py"
      - "scripts/test_resource_pack.py"
      - ".github/workflows/resource-pack-r2.yml"

permissions:
  contents: write

concurrency:
  group: resource-pack-r2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PACK_DIR: resource-pack
      PACK_OUTPUT: build/resource-pack/icesmp.zip
      METADATA_FILE: src/main/resources/resource-pack.properties
      PUBLIC_BASE_URL: https://assets.icesmp.taliann.dev
      OBJECT_PREFIX: resource-packs
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REGION: auto
      AWS_EC2_METADATA_DISABLED: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RESOURCE_PACK_PUSH_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test pack tooling
        run: python3 scripts/test_resource_pack.py

      - name: Build deterministic ZIP and SHA-1
        id: pack
        run: |
          python3 scripts/resource_pack.py build \
            --source "$PACK_DIR" \
            --output "$PACK_OUTPUT" \
            --public-base-url "$PUBLIC_BASE_URL" \
            --object-prefix "$OBJECT_PREFIX" \
            --github-output "$GITHUB_OUTPUT"

      - name: Validate R2 credentials and bucket access
        shell: bash
        run: |
          set -euo pipefail
          for variable in R2_ACCOUNT_ID R2_BUCKET_NAME AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            if [[ -z "${!variable:-}" ]]; then
              echo "::error::Missing required GitHub Actions secret for ${variable}."
              exit 1
            fi
          done

          aws --version
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3api list-objects-v2 \
            --bucket "$R2_BUCKET_NAME" \
            --max-keys 1 \
            --endpoint-url "$ENDPOINT" \
            >/dev/null

      - name: Upload immutable pack version
        env:
          OBJECT_KEY: ${{ steps.pack.outputs.object_key }}
          PACK_SIZE: ${{ steps.pack.outputs.size }}
        shell: bash
        run: |
          set -euo pipefail
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

          aws s3 cp "$PACK_OUTPUT" "s3://${R2_BUCKET_NAME}/${OBJECT_KEY}" \
            --endpoint-url "$ENDPOINT" \
            --content-type application/zip \
            --cache-control "public,max-age=31536000,immutable" \
            --only-show-errors

          REMOTE_SIZE="$(aws s3api head-object \
            --bucket "$R2_BUCKET_NAME" \
            --key "$OBJECT_KEY" \
            --endpoint-url "$ENDPOINT" \
            --query ContentLength \
            --output text)"
          if [[ "$REMOTE_SIZE" != "$PACK_SIZE" ]]; then
            echo "::error::R2 object size mismatch: expected ${PACK_SIZE}, got ${REMOTE_SIZE}."
            exit 1
          fi

      - name: Verify the public immutable URL end to end
        env:
          PACK_URL: ${{ steps.pack.outputs.url }}
          PACK_SHA1: ${{ steps.pack.outputs.sha1 }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 6 --retry-all-errors --retry-delay 5 \
            "$PACK_URL" --output build/resource-pack/public-copy.zip
          echo "${PACK_SHA1}  build/resource-pack/public-copy.zip" | sha1sum --check --strict

      - name: Publish latest alias and manifest
        env:
          PACK_URL: ${{ steps.pack.outputs.url }}
          PACK_SHA1: ${{ steps.pack.outputs.sha1 }}
          PACK_SIZE: ${{ steps.pack.outputs.size }}
        shell: bash
        run: |
          set -euo pipefail
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          MANIFEST="build/resource-pack/manifest.json"

          # Human-friendly alias only. The plugin deliberately never uses this mutable URL.
          aws s3 cp "$PACK_OUTPUT" "s3://${R2_BUCKET_NAME}/${OBJECT_PREFIX}/latest.zip" \
            --endpoint-url "$ENDPOINT" \
            --content-type application/zip \
            --cache-control "no-cache,max-age=0,must-revalidate" \
            --only-show-errors

          python3 scripts/resource_pack.py manifest \
            --output "$MANIFEST" \
            --url "$PACK_URL" \
            --sha1 "$PACK_SHA1" \
            --size "$PACK_SIZE" \
            --commit "$GITHUB_SHA"

          aws s3 cp "$MANIFEST" "s3://${R2_BUCKET_NAME}/${OBJECT_PREFIX}/manifest.json" \
            --endpoint-url "$ENDPOINT" \
            --content-type application/json \
            --cache-control "no-cache,max-age=0,must-revalidate" \
            --only-show-errors

      - name: Update bundled plugin fallback metadata
        env:
          PACK_URL: ${{ steps.pack.outputs.url }}
          PACK_SHA1: ${{ steps.pack.outputs.sha1 }}
        run: |
          python3 scripts/resource_pack.py update-metadata \
            --metadata "$METADATA_FILE" \
            --url "$PACK_URL" \
            --sha1 "$PACK_SHA1"

      - name: Commit generated fallback metadata
        env:
          PACK_SHA1: ${{ steps.pack.outputs.sha1 }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- "$METADATA_FILE"; then
            echo "Bundled plugin metadata already points at this immutable pack."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$METADATA_FILE"
          git commit -m "Update resource pack to ${PACK_SHA1}"

          # A concurrent merge must not make the generated metadata push non-fast-forward.
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master
