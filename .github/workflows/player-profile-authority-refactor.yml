name: PlayerProfile full authority refactor

on:
  pull_request:
    branches:
      - profile/player-profile-platform
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  authority-contract:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'profile/player-profile-full-authority'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact authority branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Apply pending asynchronous authority cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_player_profile_async_bridge_cleanup.py
          git diff --check

      - name: Enforce asynchronous PlayerProfile mutation boundaries
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n --include='*.java' -E \
            'jobManager\.(unlockSpell|revokeGrant|revokeGrantsFrom|clearSpellGrants)\(' \
            src/main/java; then
            echo 'Synchronous JobManager spell mutation call remains.' >&2
            exit 1
          fi
          if grep -n -E 'public (boolean|void|List<String>) (unlockSpell|revokeGrant|revokeGrantsFrom|clearSpellGrants)\(' \
            src/main/java/hu/taliann/icesmp/managers/JobManager.java; then
            echo 'Temporary synchronous spell compatibility API remains.' >&2
            exit 1
          fi

      - name: Rebuild exact authority contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_player_profile_authority.py \
            --root . \
            --update-allowlist \
            --reclassify-all
          python3 scripts/check_player_profile_authority.py \
            --root . \
            --write-report build/player-profile-authority-current.json
          python3 scripts/check_player_profile_transitions.py \
            --root . \
            --json-output build/player-profile-transition-report.json || true

      - name: Java 21 clean build and regressions
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean build --console=plain --no-daemon --stacktrace | tee /tmp/player-profile-authority-gradle.log
          grep -F 'PlayerProfile section extension regression suite passed.' \
            /tmp/player-profile-authority-gradle.log
          grep -F 'Spell mastery transaction regression suite passed.' \
            /tmp/player-profile-authority-gradle.log
          grep -F 'Profession profile state regression suite passed.' \
            /tmp/player-profile-authority-gradle.log

      - name: Commit validated authority cleanup
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          TARGET_BRANCH: profile/player-profile-full-authority
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$EXPECTED_HEAD"
          git add -- \
            src/main/java/hu/taliann/icesmp/classspec/integration/BukkitClassSpecRuntimeAdapter.java \
            src/main/java/hu/taliann/icesmp/managers/JobManager.java \
            src/main/java/hu/taliann/icesmp/managers/TalentManager.java \
            src/main/java/hu/taliann/icesmp/managers/SpecializationManager.java \
            src/main/java/hu/taliann/icesmp/commands/job/JobAdminSubcommand.java \
            src/main/java/hu/taliann/icesmp/listeners/ProfessionRecipeBookListener.java \
            scripts/player_profile_authority_allowlist.json
          if git diff --cached --quiet; then
            echo 'Async authority cleanup is already current.'
            exit 0
          fi
          git diff --cached --check
          git commit -m 'feat(profile): remove synchronous PlayerProfile authority bridges'
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
