name: PlayerProfile full authority refactor

on:
  pull_request:
    branches:
      - profile/player-profile-platform
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  authority-contract:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'profile/player-profile-full-authority'
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - name: Checkout exact authority branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Apply pending authority waves
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_player_profile_intro_onboarding_wave.py
          python3 scripts/apply_player_profile_intro_regression.py
          python3 scripts/apply_player_profile_repository_enumeration_wave.py
          python3 scripts/apply_player_profile_statistics_wave.py
          git diff --check

      - name: Enforce removed legacy stores and new contracts
        shell: bash
        run: |
          set -euo pipefail
          if grep -n -E 'getPersistentDataContainer|intro_(seen|cinematic|prev_gamemode)|PersistentDataType|NamespacedKey' \
            src/main/java/hu/taliann/icesmp/managers/IntroManager.java; then
            echo 'Legacy intro PDC authority remains.' >&2
            exit 1
          fi
          if grep -n -E 'leaderboard\.yml|YamlConfiguration|ConcurrentHashMap<UUID, Stat>|AtomicInteger' \
            src/main/java/hu/taliann/icesmp/managers/StatsManager.java; then
            echo 'Legacy leaderboard authority remains.' >&2
            exit 1
          fi
          grep -F 'CompletionStage<Set<UUID>> listPlayerIds()' \
            src/main/java/hu/taliann/icesmp/playerprofile/persistence/PlayerProfileRepository.java
          grep -F 'PlayerProfileStatisticsStore' \
            src/main/java/hu/taliann/icesmp/managers/StatsManager.java

      - name: Rebuild exact authority contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_player_profile_authority.py \
            --root . \
            --update-allowlist \
            --reclassify-all
          python3 scripts/check_player_profile_authority.py \
            --root . \
            --write-report build/player-profile-authority-current.json
          python3 scripts/check_player_profile_transitions.py \
            --root . \
            --json-output build/player-profile-transition-report.json || true

      - name: Java 21 clean build and regressions
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean build --console=plain --no-daemon --stacktrace | tee /tmp/player-profile-authority-gradle.log
          grep -F 'PlayerProfile intro onboarding regression suite passed.' \
            /tmp/player-profile-authority-gradle.log
          grep -F 'PlayerProfile repository enumeration regression suite passed.' \
            /tmp/player-profile-authority-gradle.log
          grep -F 'PlayerProfile statistics regression suite passed.' \
            /tmp/player-profile-authority-gradle.log
          grep -F 'PlayerProfile section extension regression suite passed.' \
            /tmp/player-profile-authority-gradle.log

      - name: Commit validated pending authority waves
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          TARGET_BRANCH: profile/player-profile-full-authority
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$EXPECTED_HEAD"
          git add -- \
            src/main/java/hu/taliann/icesmp/playerprofile/application/PlayerProfileIntroStore.java \
            src/main/java/hu/taliann/icesmp/playerprofile/application/PlayerProfileStatisticsStore.java \
            src/main/java/hu/taliann/icesmp/playerprofile/persistence/PlayerProfileRepository.java \
            src/main/java/hu/taliann/icesmp/playerprofile/persistence/YamlPlayerProfileRepository.java \
            src/main/java/hu/taliann/icesmp/managers/IntroManager.java \
            src/main/java/hu/taliann/icesmp/managers/StatsManager.java \
            src/main/java/hu/taliann/icesmp/listeners/IntroListener.java \
            src/regression/java/hu/taliann/icesmp/playerprofile/application/PlayerProfileIntroStoreRegressionSuite.java \
            src/regression/java/hu/taliann/icesmp/playerprofile/application/PlayerProfileStatisticsStoreRegressionSuite.java \
            src/regression/java/hu/taliann/icesmp/playerprofile/persistence/PlayerProfileRepositoryEnumerationRegressionSuite.java \
            build.gradle.kts \
            scripts/player_profile_authority_allowlist.json
          if git diff --cached --quiet; then
            echo 'Pending authority waves are already current.'
            exit 0
          fi
          git diff --cached --check
          git commit -m 'feat(profile): move onboarding enumeration and statistics to PlayerProfile'
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
