name: Runtime hardening authenticated audit

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/runtime-hardening-workspace-export.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'fix/runtime-hardening-audit-20260803'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Validate exact branch checkout
        shell: bash
        run: |
          set -euo pipefail
          test -d .git
          git cat-file -e 52cc62ac3b463679f28656f82cf1f7d17db486e8^{commit}
          git merge-base --is-ancestor 52cc62ac3b463679f28656f82cf1f7d17db486e8 HEAD
          git status --short --branch
          find . -name AGENTS.md -print

      - name: Inventory affected runtime surfaces
        shell: bash
        run: |
          set -euo pipefail
          echo '=== VANISH ==='
          git grep -n -E 'VanishManager|isVanished|hidePlayer|showPlayer|allow-damage|setInvulnerable' -- src/main src/regression || true
          echo '=== DARK MOB / DAYLIGHT ==='
          git grep -n -E 'no-daylight-burn|setShouldBurnInDay|setImmuneToZombification|MobScalingManager|EventSpawnGuard|CreatureSpawnEvent|EntitiesLoadEvent|ChunkLoadEvent' -- src/main src/regression || true
          echo '=== CLAIM / BORDER ==='
          git grep -n -E 'pos1|pos2|claim.*particle|Particle\.|spawnParticle|draw.*claim|visuali|boundary|border' -- src/main/java src/regression/java | head -1200 || true
          echo '=== GUI ICONS ==='
          git grep -n -E 'ITEM_MODEL|item-model|CustomModelData|custom-model-data|applyItemModel|ConfigMenuGUI|InventoryGUI|MenuGUI' -- src/main/java src/main/resources src/regression/java | head -1800 || true
          echo '=== EVENT SPAWN ==='
          git grep -n -E 'EventSpawnGuard|spawn-rules|find.*spawn|random.*location|min.*distance|distanceSquared|world-events|MajorEventGate' -- src/main/java src/main/resources src/regression/java | head -1800 || true
          echo '=== PROFESSION / RECIPES ==='
          git grep -n -E 'Profession|profession|Recipe|recipe|ShapedRecipe|ShapelessRecipe|ExactChoice|addRecipe|removeRecipe' -- src/main/java src/main/resources src/regression/java | head -2500 || true
          echo '=== CONFIG GUI / SCHEMA ==='
          git grep -n -E 'ConfigMenuGUI|applyOverride|CONFIG_FILES|config path|restart-required|live reload|schema' -- src/main/java src/main/resources src/regression/java | head -1800 || true

      - name: Print key source files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/main/java/hu/taliann/icesmp/managers/VanishManager.java
            src/main/java/hu/taliann/icesmp/listeners/VanishListener.java
            src/main/java/hu/taliann/icesmp/managers/MobScalingManager.java
            src/main/java/hu/taliann/icesmp/managers/EventSpawnGuard.java
            src/main/java/hu/taliann/icesmp/managers/ClaimManager.java
            src/main/java/hu/taliann/icesmp/gui/ConfigMenuGUI.java
            src/main/java/hu/taliann/icesmp/gui/ConfigMenuGUIListener.java
            src/main/java/hu/taliann/icesmp/managers/ConfigManager.java
            src/main/resources/config/world-events.yml
            src/main/resources/config/general.yml
            src/main/resources/config/factions.yml
          )
          for file in "${files[@]}"; do
            if [[ -f "$file" ]]; then
              echo "=== FILE $file ==="
              sed -n '1,1200p' "$file"
            fi
          done
