name: Runtime hardening implementation gate

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/runtime-hardening-workspace-export.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runtime-hardening-implementation
  cancel-in-progress: false

jobs:
  implement:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'fix/runtime-hardening-audit-20260803'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authenticated feature branch with full history
        uses: actions/checkout@v4
        with:
          ref: fix/runtime-hardening-audit-20260803
          fetch-depth: 0
          lfs: true

      - name: Verify patch input and base ancestry
        shell: bash
        run: |
          set -euo pipefail
          test -d .git
          git merge-base --is-ancestor 595d6daf523351e8a0283f88c7c8b64fa649396c HEAD
          git merge-base --is-ancestor 52cc62ac3b463679f28656f82cf1f7d17db486e8 HEAD
          find . -name AGENTS.md -print
          git status --short --branch

      - name: Apply asserted runtime patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_runtime_hardening_stage1.py
          git diff --check

      - name: Compile and run targeted regression
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew compileJava runtimeHardeningRegressionTest --console=plain --no-daemon --stacktrace

      - name: Run repository consistency gate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_consistency.py | tee /tmp/consistency.log
          ! grep -E '^FAIL|\bFAIL\b' /tmp/consistency.log

      - name: Commit and push without force
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/main/java/hu/taliann/icesmp/data/ClaimFootprint.java \
            src/main/java/hu/taliann/icesmp/managers/ClaimManager.java \
            src/main/java/hu/taliann/icesmp/commands/ClaimCommand.java \
            src/main/java/hu/taliann/icesmp/managers/VanishManager.java \
            src/main/java/hu/taliann/icesmp/listeners/VanishListener.java \
            src/main/java/hu/taliann/icesmp/managers/EventSpawnGuard.java \
            src/main/java/hu/taliann/icesmp/managers/MobScalingManager.java \
            src/main/java/hu/taliann/icesmp/listeners/MobScalingListener.java \
            src/main/resources/config/moderation.yml \
            src/regression/java/hu/taliann/icesmp/runtime/RuntimeHardeningRegressionSuite.java \
            build.gradle.kts
          git commit -m "Fix claim, vanish and DARK mob lifecycle regressions" \
            -m "Normalize personal claims to one X-Z footprint, reassert vanish visibility after retracking, and make DARK daylight/zombification protection reversible across load, move and teleport." \
            -m "Adds targeted runtime hardening regressions." \
            -m "Co-Authored-By: ChatGPT <noreply@openai.com>" \
            -m "Claude-Session: runtime-hardening-audit-20260803"
          git push origin HEAD:fix/runtime-hardening-audit-20260803
