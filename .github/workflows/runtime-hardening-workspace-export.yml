name: Final runtime hardening cleanup gate

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/runtime-hardening-workspace-export.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runtime-hardening-final-cleanup
  cancel-in-progress: false

jobs:
  validate-and-clean:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'fix/runtime-hardening-audit-20260803'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authenticated feature branch with full history
        uses: actions/checkout@v4
        with:
          ref: fix/runtime-hardening-audit-20260803
          fetch-depth: 0
          lfs: true

      - name: Verify branch ancestry and clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test -d .git
          git merge-base --is-ancestor d407044c8de2d6f03d6faf931d5e96c3c3d3c63e HEAD
          git merge-base --is-ancestor 52cc62ac3b463679f28656f82cf1f7d17db486e8 HEAD
          find . -name AGENTS.md -print
          git status --short --branch

      - name: Remove temporary implementation scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/apply_runtime_hardening_docs_drift.py
          rm -f .github/scripts/apply_runtime_hardening_stage1.py
          rm -f .github/scripts/apply_stage3_*.py
          rm -f .github/scripts/event-stage2.b64.*
          rm -f .github/workflows/runtime-hardening-workspace-export.yml
          test -z "$(find .github/scripts -maxdepth 1 -type f \( -name 'apply_runtime_hardening*' -o -name 'apply_stage3_*' -o -name 'event-stage2.b64.*' \) -print -quit)"
          test ! -e .github/workflows/runtime-hardening-workspace-export.yml
          git diff --check
          git status --short

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run full clean build and regressions
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean check --console=plain --no-daemon --stacktrace

      - name: Validate GUI and resource-pack item models
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_gui_icons.py | tee /tmp/gui-icons.log

      - name: Run repository consistency gate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet pyyaml
          python3 scripts/check_consistency.py | tee /tmp/consistency.log

      - name: Commit and push cleanup without force
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Remove temporary runtime hardening scaffolding" \
            -m "Delete the implementation-only workflow, asserted patch scripts and encoded payloads after a successful Java 21 clean check, item-model validation and repository consistency gate." \
            -m "Co-Authored-By: ChatGPT <noreply@openai.com>"
          git push origin HEAD:fix/runtime-hardening-audit-20260803
