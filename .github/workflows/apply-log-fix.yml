name: Apply log-derived fixes

on:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/apply-log-fix.yml'

permissions:
  contents: write

jobs:
  apply-fixes:
    if: github.head_ref == 'fix/log-errors-2026-08-02'
    runs-on: ubuntu-latest
    steps:
      - name: Check out writable feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/log-errors-2026-08-02
          fetch-depth: 0

      - name: Configure commit identity
        shell: bash
        run: |
          git config user.name 'Csik Milán'
          git config user.email '81396861+MilCsik09@users.noreply.github.com'

      - name: Reconstruct reviewed patches
        shell: bash
        run: |
          cat > /tmp/relics.patch.gz.b64 <<'PATCH1'

PATCH1

          cat > /tmp/npcs.patch.gz.b64 <<'PATCH2'

PATCH2

          cat > /tmp/docs.patch.gz.b64 <<'PATCH3'

PATCH3

          cat > /tmp/cleanup.patch.gz.b64 <<'PATCH4'

PATCH4

          for name in relics npcs docs cleanup; do
            base64 -d "/tmp/${name}.patch.gz.b64" | gunzip > "/tmp/${name}.patch"
          done

      - name: Apply reviewed logical commits
        shell: bash
        run: |
          git am --3way /tmp/relics.patch
          git am --3way /tmp/npcs.patch
          git am --3way /tmp/docs.patch
          git apply --index /tmp/cleanup.patch
          git rm .github/workflows/apply-log-fix.yml
          git diff --cached --check
          git commit -m 'chore(ci): remove temporary checkout export'

      - name: Verify and publish fast-forward history
        shell: bash
        run: |
          git status --short
          test -z "$(git status --porcelain)"
          git log --oneline -6
          git push origin HEAD:fix/log-errors-2026-08-02
