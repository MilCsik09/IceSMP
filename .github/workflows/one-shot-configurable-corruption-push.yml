name: One-shot configurable corruption push

on:
  push:
    branches:
      - fix/pet-lore-corruption-spectator-menu

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply staged configurable corruption migration
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          manager = Path("src/main/java/hu/taliann/icesmp/managers/CorruptionManager.java")
          source = manager.read_text()
          if "effectiveMobCap()" not in source and "absolute-mob-cap" not in source:
              print("Configurable corruption migration already applied.")
              raise SystemExit(0)

          lines = Path(".github/workflows/one-shot-configurable-corruption.yml").read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python3 <<'PY'") + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == "PY")
          body = lines[start:end]
          nonblank = [line for line in body if line.strip()]
          indent = min(len(line) - len(line.lstrip()) for line in nonblank)
          script = "\n".join(line[indent:] for line in body)
          exec(compile(script, "configurable-corruption-migration", "exec"), {})
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main src/regression
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: make corruption scaling fully configurable"
          git push origin HEAD:fix/pet-lore-corruption-spectator-menu
