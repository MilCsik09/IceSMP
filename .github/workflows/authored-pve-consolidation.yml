name: Authored PvE Creature Consolidation

on:
  push:
    branches:
      - feature/authored-pve-creature-consolidation
  pull_request:
    branches:
      - feature/unified-creature-combat-profiles

permissions:
  contents: read

jobs:
  exact-head-authored-pve:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout exact child head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 256
          persist-credentials: false

      - name: Verify exact stacked parent and merge-base
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PARENT: feature/unified-creature-combat-profiles
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"
          git fetch --no-tags --depth=256 origin "${PARENT}:refs/remotes/origin/${PARENT}"
          parent_sha=$(git rev-parse "refs/remotes/origin/${PARENT}")
          merge_base=$(git merge-base HEAD "refs/remotes/origin/${PARENT}")
          read behind ahead < <(git rev-list --left-right --count "refs/remotes/origin/${PARENT}...HEAD")
          test "${merge_base}" = "${parent_sha}"
          test "${behind}" = "0"
          test "${ahead}" -gt "0"
          mkdir -p build/reports/authored-pve
          printf '{"child":"%s","parent":"%s","merge_base":"%s","behind":0,"ahead":%s}\n' \
            "${EXPECTED_HEAD}" "${parent_sha}" "${merge_base}" "${ahead}" \
            > build/reports/authored-pve/final-topology.json
          echo "AUTHORED_PVE_PARENT_SHA=${parent_sha}" >> "${GITHUB_ENV}"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install report dependencies
        run: python -m pip install --disable-pip-version-check 'PyYAML>=6.0,<7.0' 'Pillow==11.3.0'

      - name: Validate authored PvE evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_authored_pve_consolidation.py --check \
            --output build/reports/authored-pve
          python3 scripts/audit_unified_creature_combat.py --check \
            --output build/reports/authored-pve
          python3 scripts/audit_combat_encounter_foundation.py --check \
            --output build/reports/authored-pve
          python3 scripts/test_progression_balance.py
          python3 scripts/check_consistency.py

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Full build and cumulative combat regressions
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean build authoredPveConsolidationAudit unifiedCreatureCombatAudit \
            combatEncounterFoundationAudit mobEncounterDomainRegressionTest \
            mobRuntimeSourceRegressionTest itemizationDomainRegressionTest \
            equipmentDomainRegressionTest targetFrameRegressionTest \
            --no-daemon --console=plain | tee gradle-authored-pve.log

      - name: Paper 1.21.11 authored creature runtime proof
        shell: bash
        timeout-minutes: 12
        env:
          JAVA_TOOL_OPTIONS: >-
            -Dicesmp.authored-pve-runtime=true
            -Dicesmp.combat-evidence-dir=${{ github.workspace }}/build/reports/authored-pve
        run: |
          set -euo pipefail
          rm -rf run
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          set +e
          timeout --signal=INT --kill-after=20s 180s ./gradlew --no-daemon --console=plain \
            --init-script scripts/source_integrity_runtime.init.gradle runServer \
            2>&1 | tee paper-authored-pve.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ ${status} -ne 0 && ${status} -ne 124 && ${status} -ne 130 ]]; then
            exit "${status}"
          fi
          grep -E "Running the server|Starting minecraft server version 1\.21\.11|Done \(" \
            paper-authored-pve.log
          grep -F 'ICESMP_SOURCE_INTEGRITY_RUNTIME_PROBE_PASS' paper-authored-pve.log
          ! grep -F 'ICESMP_SOURCE_INTEGRITY_RUNTIME_PROBE_FAIL' paper-authored-pve.log
          ! grep -E "Could not load.*IceSMP|Error occurred while enabling IceSMP|Exception.*IceSMP" \
            paper-authored-pve.log
          test -s build/reports/authored-pve/authored-pve-runtime-report.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("build/reports/authored-pve/authored-pve-runtime-report.json").read_text())
          assert report["runtime"] == "Paper 1.21.11"
          assert set(report["templates"]) == {
              "ring_warden", "invasion_chaos_champion", "prologue_finale_boss"
          }
          assert report["common_runtime"] == "MobAbilityRuntime"
          assert set(report["controls"]) == {
              "COW:PASSIVE", "ZOMBIE:HOSTILE", "SKELETON:HOSTILE"
          }
          assert all(level > 0 for level in report["control_levels"])
          assert report["passive_control_initial_target"] is False
          assert report["boss_slam_executions"] > 0
          assert report["threshold_transitions"] == 1
          assert report["world_boss_stat_provenance"].startswith("runtime_probe:participants;")
          assert report["duplicate_participant_modifier_rejected"] is True
          assert report["pause_resume_exercised"] is True
          PY
          cp paper-authored-pve.log build/reports/authored-pve/runtime-proof.log

      - name: Recreate exact-head closure and repository checks
        shell: bash
        run: |
          set -euo pipefail
          child_sha=$(git rev-parse HEAD)
          merge_base=$(git merge-base HEAD "${AUTHORED_PVE_PARENT_SHA}")
          read behind ahead < <(git rev-list --left-right --count "${AUTHORED_PVE_PARENT_SHA}...HEAD")
          test "${merge_base}" = "${AUTHORED_PVE_PARENT_SHA}"
          test "${behind}" = "0"
          printf '{"child":"%s","parent":"%s","merge_base":"%s","behind":0,"ahead":%s}\n' \
            "${child_sha}" "${AUTHORED_PVE_PARENT_SHA}" "${merge_base}" "${ahead}" \
            > build/reports/authored-pve/final-topology.json
          python3 scripts/audit_authored_pve_consolidation.py --check \
            --output build/reports/authored-pve
          python3 scripts/audit_unified_creature_combat.py --check \
            --output build/reports/authored-pve
          python3 scripts/check_consistency.py
          python3 scripts/check_documentation_coverage.py
          python3 scripts/check_markdown_links.py

      - name: Assemble immutable evidence bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle=build/reports/authored-pve/bundle
          mkdir -p "${bundle}"
          cp docs/development/combat-balance-authority.json "${bundle}/"
          cp build/reports/authored-pve/*.json "${bundle}/"
          cp build/reports/authored-pve/runtime-proof.log "${bundle}/"
          cp gradle-authored-pve.log "${bundle}/"
          find "${bundle}" -type f -print0 | sort -z | xargs -0 sha256sum > "${bundle}/SHA256SUMS"

      - name: Upload exact-head authored PvE evidence
        id: evidence-upload
        uses: actions/upload-artifact@v4
        with:
          name: authored-pve-consolidation-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/reports/authored-pve/bundle
          if-no-files-found: error
          retention-days: 30

      - name: Report immutable artifact identity
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.evidence-upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.evidence-upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          test -n "${ARTIFACT_ID}"
          test -n "${ARTIFACT_DIGEST}"
          echo "artifact-id=${ARTIFACT_ID}"
          echo "sha256=${ARTIFACT_DIGEST}"

      - name: Prove tracked checkout remains clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
