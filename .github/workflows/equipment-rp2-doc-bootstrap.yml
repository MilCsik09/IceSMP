name: Equipment RP2 Docs Bootstrap

on:
  push:
    branches:
      - feature/equipment-rp2-asset-foundation
    paths:
      - "scripts/generate_equipment_rp2_docs.py"
      - ".github/workflows/equipment-rp2-doc-bootstrap.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: feature/equipment-rp2-asset-foundation
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install generator dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML>=6.0,<7.0'

      - name: Generate canonical RP2-A authority
        run: python3 scripts/generate_equipment_rp2_docs.py --write

      - name: Commit only generated authority documents
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            docs/development/equipment-rp2-asset-manifest.json \
            docs/development/equipment-rp2-armor-matrix.json \
            docs/development/equipment-rp2-gear-lines.json \
            docs/development/equipment-rp2-materials.json \
            docs/development/equipment-rp2-worn-fallback.json \
            docs/development/equipment-rp2-safe-delete.json \
            docs/development/equipment-rp2-required-new.json \
            docs/development/equipment-rp2-final-authority.json
          if git diff --cached --quiet; then
            echo "Generated authority already current."
            exit 0
          fi
          git commit -m "docs(rp2): publish canonical asset authority"
          git push origin HEAD:feature/equipment-rp2-asset-foundation
