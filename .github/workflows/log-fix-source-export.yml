name: Publish reviewed log fixes

on:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/log-fix-source-export.yml'

permissions:
  contents: write

jobs:
  publish-fixes:
    if: github.head_ref == 'fix/log-errors-2026-08-02'
    runs-on: ubuntu-latest
    steps:
      - name: Check out writable feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/log-errors-2026-08-02
          fetch-depth: 0

      - name: Configure commit identity
        shell: bash
        run: |
          git config user.name 'Csik Milán'
          git config user.email '81396861+MilCsik09@users.noreply.github.com'

      - name: Extract reviewed patches from staging workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/apply-log-fix.yml').read_text(encoding='utf-8')
          for marker, name in (
              ('PATCH1', 'relics'),
              ('PATCH2', 'npcs'),
              ('PATCH3', 'docs'),
          ):
              start_token = "<<'" + marker + "'\n"
              start = source.index(start_token) + len(start_token)
              end = source.index('\n' + marker, start)
              encoded = source[start:end].strip()
              Path('/tmp/' + name + '.patch.gz.b64').write_text(encoded + '\n', encoding='ascii')
          PY

          for name in relics npcs docs; do
            base64 -d "/tmp/${name}.patch.gz.b64" | gunzip > "/tmp/${name}.patch"
          done

      - name: Apply reviewed logical commits
        shell: bash
        run: |
          git am --3way /tmp/relics.patch
          git am --3way /tmp/npcs.patch
          git am --3way /tmp/docs.patch
          git rm .github/workflows/log-fix-source-export.yml
          git rm .github/workflows/apply-log-fix.yml
          git diff --cached --check
          git commit -m 'chore(ci): remove temporary checkout export'

      - name: Verify and push without force
        shell: bash
        run: |
          test -z "$(git status --porcelain)"
          git log --oneline -8
          git push origin HEAD:fix/log-errors-2026-08-02
