name: Materialize Long-Term Equipment Catalog

on:
  push:
    branches:
      - feature/equipment-catalog-expansion

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout authored head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check 'PyYAML>=6.0,<7.0'

      - name: Materialize canonical production YAML
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate_long_term_equipment_catalog.py --write
          if git diff --quiet -- src/main/resources/config/equipment-catalog-expansion.yml; then
            echo "Catalog already materialized at exact head."
            exit 0
          fi
          python3 scripts/generate_long_term_equipment_catalog.py --check
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/resources/config/equipment-catalog-expansion.yml
          git commit -m 'generated(equipment): materialize 160-armor production catalog'
          git push origin HEAD:feature/equipment-catalog-expansion
