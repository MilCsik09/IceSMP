name: Agent profile-v2 source export

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - master

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Warm dependencies
        run: ./gradlew classes --no-daemon --stacktrace
      - name: Create archives
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=build --exclude=.gradle -czf /tmp/icesmp-profile-v2-source.tgz .
          tar --exclude='.gradle/daemon' --exclude='.gradle/notifications' --exclude='.gradle/.tmp' -czf /tmp/icesmp-profile-v2-gradle-home.tgz -C "$HOME" .gradle
          sha256sum /tmp/icesmp-profile-v2-source.tgz /tmp/icesmp-profile-v2-gradle-home.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: icesmp-profile-v2-source-${{ github.event.pull_request.head.sha }}
          path: /tmp/icesmp-profile-v2-source.tgz
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: icesmp-profile-v2-gradle-home-${{ github.event.pull_request.head.sha }}
          path: /tmp/icesmp-profile-v2-gradle-home.tgz
          retention-days: 1
