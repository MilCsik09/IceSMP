name: Codex exact source export

on:
  push:
    branches:
      - audit/class-spell-cast-hardening
  pull_request:
    branches:
      - staging

permissions:
  contents: read

jobs:
  export:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout exact feature commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Archive exact checkout
        shell: bash
        run: |
          git rev-parse HEAD
          git archive --format=zip --output=icesmp-exact-source.zip HEAD
      - name: Upload exact checkout
        uses: actions/upload-artifact@v4
        with:
          name: icesmp-exact-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: icesmp-exact-source.zip
          if-no-files-found: error
          retention-days: 1
