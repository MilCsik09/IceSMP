name: Codex exact source export

on:
  push:
    branches:
      - audit/class-spell-cast-hardening

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact pushed commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Archive exact checkout
        shell: bash
        run: git archive --format=zip --output=icesmp-exact-source.zip HEAD
      - name: Upload exact checkout
        uses: actions/upload-artifact@v4
        with:
          name: icesmp-exact-source-${{ github.sha }}
          path: icesmp-exact-source.zip
          if-no-files-found: error
          retention-days: 1
