name: Bootstrap DEV-item simplification

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  simplify-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MASTER_SHA: b6db9d21d12a2944b67925a5fe9228b4e76b9b04
      FINAL_BRANCH: agent/simplify-dev-item-recovery
      BOOTSTRAP_BRANCH: agent/bootstrap-simplify-dev-item-20260727
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare exact master baseline
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/bootstrap_simplify_dev_item.py /tmp/bootstrap_simplify_dev_item.py
          cp scripts/bootstrap_postprocess_audit.py /tmp/bootstrap_postprocess_audit.py
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git switch --detach "$MASTER_SHA"
          echo "BASE_MANAGER_LINES=$(wc -l < src/main/java/hu/taliann/icesmp/managers/DevItemManager.java)" >> "$GITHUB_ENV"
          echo "BASE_STATE_LINES=$(wc -l < src/main/java/hu/taliann/icesmp/managers/DevItemStateData.java)" >> "$GITHUB_ENV"

      - name: Baseline clean build
        run: ./gradlew clean build --no-daemon --stacktrace

      - name: Record baseline consistency
        shell: bash
        run: |
          set +e
          python3 scripts/check_consistency.py 2>&1 | tee /tmp/baseline-consistency.log
          STATUS=${PIPESTATUS[0]}
          set -e
          grep '^✗ FAIL:' /tmp/baseline-consistency.log | sort > /tmp/baseline-consistency.failures || true
          FAILS=$(sed -n 's/.*Összegzés: \([0-9][0-9]*\) FAIL, \([0-9][0-9]*\) WARN.*/\1/p' /tmp/baseline-consistency.log | tail -1)
          WARNS=$(sed -n 's/.*Összegzés: \([0-9][0-9]*\) FAIL, \([0-9][0-9]*\) WARN.*/\2/p' /tmp/baseline-consistency.log | tail -1)
          test -n "$FAILS" && test -n "$WARNS"
          echo "BASE_CONSISTENCY_STATUS=$STATUS" >> "$GITHUB_ENV"
          echo "BASE_CONSISTENCY_FAILS=$FAILS" >> "$GITHUB_ENV"
          echo "BASE_CONSISTENCY_WARNS=$WARNS" >> "$GITHUB_ENV"

      - name: Baseline DEV regression
        run: python3 scripts/test_dev_item_state.py

      - name: Apply focused simplification
        shell: bash
        run: |
          set -euo pipefail
          git switch -c "$FINAL_BRANCH"
          python3 /tmp/bootstrap_simplify_dev_item.py
          python3 /tmp/bootstrap_postprocess_audit.py
          git diff --check

      - name: Branch clean build
        run: ./gradlew clean build --no-daemon --stacktrace

      - name: Compare branch consistency with baseline
        shell: bash
        run: |
          set +e
          python3 scripts/check_consistency.py 2>&1 | tee /tmp/branch-consistency.log
          STATUS=${PIPESTATUS[0]}
          set -e
          grep '^✗ FAIL:' /tmp/branch-consistency.log | sort > /tmp/branch-consistency.failures || true
          FAILS=$(sed -n 's/.*Összegzés: \([0-9][0-9]*\) FAIL, \([0-9][0-9]*\) WARN.*/\1/p' /tmp/branch-consistency.log | tail -1)
          WARNS=$(sed -n 's/.*Összegzés: \([0-9][0-9]*\) FAIL, \([0-9][0-9]*\) WARN.*/\2/p' /tmp/branch-consistency.log | tail -1)
          test -n "$FAILS" && test -n "$WARNS"
          NEW_FAILURES=$(comm -13 /tmp/baseline-consistency.failures /tmp/branch-consistency.failures || true)
          if [ -n "$NEW_FAILURES" ]; then
            echo "New consistency drift introduced:"
            echo "$NEW_FAILURES"
            exit 1
          fi
          if [ "$FAILS" -gt "$BASE_CONSISTENCY_FAILS" ] || [ "$WARNS" -gt "$BASE_CONSISTENCY_WARNS" ]; then
            echo "Consistency counts regressed: baseline ${BASE_CONSISTENCY_FAILS}/${BASE_CONSISTENCY_WARNS}, branch ${FAILS}/${WARNS}"
            exit 1
          fi
          echo "BRANCH_CONSISTENCY_STATUS=$STATUS" >> "$GITHUB_ENV"
          echo "BRANCH_CONSISTENCY_FAILS=$FAILS" >> "$GITHUB_ENV"
          echo "BRANCH_CONSISTENCY_WARNS=$WARNS" >> "$GITHUB_ENV"

      - name: Branch DEV regression
        run: python3 scripts/test_dev_item_state.py

      - name: Publish verified branch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH_MANAGER_LINES=$(wc -l < src/main/java/hu/taliann/icesmp/managers/DevItemManager.java)
          BRANCH_STATE_LINES=$(wc -l < src/main/java/hu/taliann/icesmp/managers/DevItemStateData.java)
          ADDED_LINES=$(git diff --numstat "$MASTER_SHA" | awk '{a += $1} END {print a + 0}')
          DELETED_LINES=$(git diff --numstat "$MASTER_SHA" | awk '{d += $2} END {print d + 0}')
          export BRANCH_MANAGER_LINES BRANCH_STATE_LINES ADDED_LINES DELETED_LINES
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path('docs/audits/IceSMP_audit_update_b6db9d2.md')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '{{BASE_MANAGER_LINES}}': os.environ['BASE_MANAGER_LINES'],
              '{{BRANCH_MANAGER_LINES}}': os.environ['BRANCH_MANAGER_LINES'],
              '{{BASE_STATE_LINES}}': os.environ['BASE_STATE_LINES'],
              '{{BRANCH_STATE_LINES}}': os.environ['BRANCH_STATE_LINES'],
              '{{ADDED_LINES}}': os.environ['ADDED_LINES'],
              '{{DELETED_LINES}}': os.environ['DELETED_LINES'],
              '{{BASE_BUILD}}': 'PASS',
              '{{BASE_CONSISTENCY}}': f"{os.environ['BASE_CONSISTENCY_FAILS']} FAIL / {os.environ['BASE_CONSISTENCY_WARNS']} WARN (baseline, exit {os.environ['BASE_CONSISTENCY_STATUS']})",
              '{{BASE_DEV_TEST}}': 'PASS',
              '{{BRANCH_BUILD}}': 'PASS',
              '{{BRANCH_CONSISTENCY}}': f"{os.environ['BRANCH_CONSISTENCY_FAILS']} FAIL / {os.environ['BRANCH_CONSISTENCY_WARNS']} WARN (no new drift, exit {os.environ['BRANCH_CONSISTENCY_STATUS']})",
              '{{BRANCH_DEV_TEST}}': 'PASS',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          if '{{' in text:
              raise SystemExit('Unresolved audit placeholder remains')
          path.write_text(text, encoding='utf-8')
          PY
          git add \
            src/main/java/hu/taliann/icesmp/managers/DevItemManager.java \
            src/main/java/hu/taliann/icesmp/managers/DevItemStateData.java \
            src/regression/java/hu/taliann/icesmp/managers/DevItemStateDataRegressionTest.java \
            scripts/test_dev_item_state.py \
            docs/ARCHITECTURE.md \
            docs/audits/IceSMP_audit_update_b6db9d2.md
          git commit -m "Simplify DEV-item reward recovery"
          git push origin "HEAD:refs/heads/$FINAL_BRANCH"
          git push origin --delete "$BOOTSTRAP_BRANCH" || true
