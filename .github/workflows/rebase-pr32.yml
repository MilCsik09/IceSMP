name: Rebase PR 32 onto master

on:
  pull_request:
    branches: [master]
    types: [synchronize]

permissions:
  contents: write

jobs:
  rebase-and-verify:
    if: github.event.pull_request.head.ref == 'fix/dev-item-recovery'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dev-item-recovery
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Merge current master and resolve reviewed overlap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenAI GPT-5.6 Thinking'
          git config user.email 'noreply@openai.com'
          git fetch origin master
          if ! git merge --no-commit --no-ff origin/master; then
            if git diff --name-only --diff-filter=U | grep -qx 'docs/ARCHITECTURE.md'; then
              git checkout --ours -- docs/ARCHITECTURE.md
              python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/ARCHITECTURE.md')
          text = path.read_text(encoding='utf-8').replace('a 32 fájlt-író store', 'a 33 fájlt-író store')
          path.write_text(text, encoding='utf-8')
          PY
              git add docs/ARCHITECTURE.md
            fi
            test -z "$(git diff --name-only --diff-filter=U)"
          fi
          git rm .github/workflows/rebase-pr32.yml
          git add -A
          git commit -m 'Merge master into DEV item recovery fix'
      - name: Verify targeted regression
        run: python3 scripts/test_dev_item_state.py
      - name: Verify full build
        run: ./gradlew clean build --no-daemon --stacktrace
      - name: Push updated branch
        run: git push origin HEAD:fix/dev-item-recovery
