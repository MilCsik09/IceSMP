          # --- Closure scripts become fail-closed authority verifiers instead of rewriting the plan. ---
          Path('scripts/apply_professions_2_closure.py').write_text(r'''#!/usr/bin/env python3
"""Fail-closed idempotent Professions 2.0 closure authority verifier."""
from pathlib import Path
ROOT = Path(__file__).resolve().parents[1]

def source(path): return (ROOT / path).read_text(encoding='utf-8')
def require(path, *tokens):
    text = source(path)
    for token in tokens:
        if token not in text: raise RuntimeError(f'{path}: missing closure token: {token}')
    return text

def main():
    tx = require('src/main/java/hu/taliann/icesmp/professions/ProfessionCraftTransaction.java',
        'ProfessionEffectiveCraftPlan plan', 'preflight(final Player player', 'preflightStorage',
        'plan.materialInputs()', 'plan.uniqueInputs()', 'PERSISTENCE_FAILED',
        'inventory.setStorageContents(cloneContents(before));')
    if 'ProfessionSpecializationEconomyPolicy.effectFor(player, recipe)' in tx:
        raise RuntimeError('transaction must not recompute specialization outside CraftPlan')
    require('src/main/java/hu/taliann/icesmp/itemization/ItemSalvageService.java',
        'familyScrapId', 'szovet_foszlany', 'bor_hulladek', 'lanc_toredek', 'femhulladek')
    listener = require('src/main/java/hu/taliann/icesmp/listeners/ProfessionRecipeBookListener.java',
        'ProfessionEffectiveCraftPlan.of(recipe, specialization, batches)',
        'craftTransaction.preflight(player, plan, outputs)', 'craftTransaction.apply(player, plan, outputs)')
    if 'craftTransaction.apply(player, recipe, batches, outputs)' in listener:
        raise RuntimeError('legacy transaction admission still present')
    require('src/main/java/hu/taliann/icesmp/gui/ProfessionRecipeGUI.java',
        'ProfessionEffectiveCraftPlan.of(recipe, specialization, 1)', 'transaction.preflight(player, plan, previewOutputs)',
        'plan.materialInputs()', 'plan.uniqueInputs()', 'maxCraftableBatches')
    require('src/regression/java/hu/taliann/icesmp/professions/Professions2RegressionSuite.java',
        'effectiveCraftPlanHasNoBatchRoundingArbitrage', 'blueprintRecoveryMatrixIsExact')
    print('Professions 2.0 final closure authority: OK')

if __name__ == '__main__': main()
''')

          Path('scripts/apply_professions_2_specialization_closure.py').write_text(r'''#!/usr/bin/env python3
"""Fail-closed specialization economy closure verifier; CraftPlan is the sole arithmetic owner."""
from pathlib import Path
import json
ROOT = Path(__file__).resolve().parents[1]

def main():
    policy = (ROOT / 'src/main/java/hu/taliann/icesmp/professions/ProfessionSpecializationEconomyPolicy.java').read_text()
    for token in ('PlayerProfileSpecializationProgressStore', 'roleOf', 'PROCESSING_EFFICIENCY', 'BLUEPRINT_EFFICIENCY'):
        if token not in policy: raise RuntimeError('specialization policy incomplete: ' + token)
    tx = (ROOT / 'src/main/java/hu/taliann/icesmp/professions/ProfessionCraftTransaction.java').read_text()
    if 'ProfessionEffectiveCraftPlan plan' not in tx or 'effectFor(player, recipe)' in tx:
        raise RuntimeError('specialization arithmetic escaped CraftPlan authority')
    cfg = (ROOT / 'src/main/resources/config.yml').read_text()
    for token in ('economy-efficiency-percent: 0.10', 'economy-yield-percent: 0.10'):
        if token not in cfg: raise RuntimeError('specialization config missing: ' + token)
    report = json.loads((ROOT / 'docs/development/professions-2-specializations.json').read_text())
    if report.get('schema') != 1 or len(report.get('specializations', [])) != 16:
        raise RuntimeError('specialization handoff drift')
    if len({row['role'] for row in report['specializations']}) < 6:
        raise RuntimeError('specialization role diversity drift')
    print('Professions 2.0 specialization economy authority: OK')

if __name__ == '__main__': main()
''')

