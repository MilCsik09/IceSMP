            final org.bukkit.inventory.ItemStack stack = recipe.uniqueResult() == null
                    ? new org.bukkit.inventory.ItemStack(recipe.result(), recipe.resultAmount())
                    : uniqueMaterials.create(recipe.uniqueResult(), recipe.resultAmount());
