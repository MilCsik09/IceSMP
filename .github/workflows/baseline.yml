name: External branch verification

on:
  push:
    branches:
      - audit/baseline-14addda
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout verification assets
        uses: actions/checkout@v4
        with:
          ref: audit/baseline-14addda
          path: runner

      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: fix/store-health-fail-closed
          path: work
          fetch-depth: 0

      - name: Apply and publish the reviewed store-health patch
        shell: bash
        run: |
          set -euo pipefail
          cat runner/.github/audit-patches/store-health.patch.b64.* \
            | base64 --decode > /tmp/store-health.patch
          echo '229f0850b38e378ccc6ff94c42f8f76b10bbc8f02772c3858ce21654c722d484  /tmp/store-health.patch' \
            | sha256sum --check --strict
          cd work
          if git apply --check /tmp/store-health.patch; then
            git apply /tmp/store-health.patch
            git config user.name 'IceSMP audit bot'
            git config user.email 'actions@users.noreply.github.com'
            git add build.gradle.kts docs/ARCHITECTURE.md \
              src/main/java/hu/taliann/icesmp/core/IceSMPCore.java \
              src/main/java/hu/taliann/icesmp/storage/PersistentStore.java \
              src/main/java/hu/taliann/icesmp/storage/PersistentStoreCoordinator.java \
              src/test/java/hu/taliann/icesmp/storage/PersistentStoreCoordinatorRegressionTest.java
            git diff --cached --check
            git commit -m 'Fail closed on persistent store load failures'
            git push origin HEAD:fix/store-health-fail-closed
          elif git apply --reverse --check /tmp/store-health.patch; then
            echo 'Store-health patch is already present on the target branch.'
          else
            echo 'Patch is neither applicable nor already applied.' >&2
            exit 1
          fi
          test "$(git rev-list --count 14addda17fb5a6c3dfec6a8320a8bfd0aa98e6fb..HEAD)" -eq 1

      - name: Apply PR 26 prerequisite for verification only
        shell: bash
        working-directory: work
        run: |
          set -euo pipefail
          git fetch origin fix/core-persistent-store-wiring
          git cherry-pick --no-commit 2137554455f7748cd3e67935a4af110387d16bbb
          git diff --check

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
        with:
          root-directory: work

      - name: Build and run all checks
        shell: bash
        working-directory: work
        run: |
          set -o pipefail
          ./gradlew clean build --no-daemon --stacktrace 2>&1 | tee /tmp/store-health-build.log

      - name: Upload complete Gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: store-health-gradle-log
          path: /tmp/store-health-build.log
          if-no-files-found: error
          retention-days: 1

      - name: Consistency checks (compare with six baseline documentation drifts)
        shell: bash
        working-directory: work
        run: |
          set -euo pipefail
          set +e
          python3 scripts/check_consistency.py | tee /tmp/consistency.log
          result=${PIPESTATUS[0]}
          set -e
          test "$result" -eq 1
          test "$(grep -c '^✗ FAIL:' /tmp/consistency.log)" -eq 6
          ! grep -q 'persistent-store registry:' /tmp/consistency.log
          ! grep -q 'storage/` 6 fajlt' /tmp/consistency.log

      - name: Verify coherent target-branch scope
        shell: bash
        working-directory: work
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -fd
          mapfile -t files < <(git diff --name-only 14addda17fb5a6c3dfec6a8320a8bfd0aa98e6fb..fix/store-health-fail-closed | sort)
          printf '%s\n' "${files[@]}"
          test "${#files[@]}" -eq 6
          test "${files[0]}" = 'build.gradle.kts'
          test "${files[1]}" = 'docs/ARCHITECTURE.md'
          test "${files[2]}" = 'src/main/java/hu/taliann/icesmp/core/IceSMPCore.java'
          test "${files[3]}" = 'src/main/java/hu/taliann/icesmp/storage/PersistentStore.java'
          test "${files[4]}" = 'src/main/java/hu/taliann/icesmp/storage/PersistentStoreCoordinator.java'
          test "${files[5]}" = 'src/test/java/hu/taliann/icesmp/storage/PersistentStoreCoordinatorRegressionTest.java'
