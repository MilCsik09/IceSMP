name: External branch verification

on:
  push:
    branches:
      - audit/baseline-14addda
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout fixed DEV-item recovery head
        uses: actions/checkout@v4
        with:
          ref: fix/dev-item-recovery
          fetch-depth: 0

      - name: Verify exact ancestry, commits and branch scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '92b12140318f412932766603ab905d44c259774e'
          test "$(git rev-list --count 14addda17fb5a6c3dfec6a8320a8bfd0aa98e6fb..HEAD)" -eq 2
          git log --reverse --format='%s' 14addda17fb5a6c3dfec6a8320a8bfd0aa98e6fb..HEAD > /tmp/dev-item-subjects
          printf '%s\n' \
            'Fail closed on corrupt DEV-item state' \
            'Add DEV-item state regression coverage' > /tmp/expected-subjects
          diff -u /tmp/expected-subjects /tmp/dev-item-subjects
          git diff --check 14addda17fb5a6c3dfec6a8320a8bfd0aa98e6fb..HEAD

          mapfile -t files < <(git diff --name-only 14addda17fb5a6c3dfec6a8320a8bfd0aa98e6fb..HEAD | sort)
          printf '%s\n' "${files[@]}"
          test "${#files[@]}" -eq 5
          test "${files[0]}" = 'docs/ARCHITECTURE.md'
          test "${files[1]}" = 'scripts/test_dev_item_state.py'
          test "${files[2]}" = 'src/main/java/hu/taliann/icesmp/managers/DevItemManager.java'
          test "${files[3]}" = 'src/main/java/hu/taliann/icesmp/managers/DevItemStateData.java'
          test "${files[4]}" = 'src/regression/java/hu/taliann/icesmp/managers/DevItemStateDataRegressionTest.java'

      - name: Apply PR 26 prerequisite for verification only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/core-persistent-store-wiring
          git cherry-pick --no-commit 2137554455f7748cd3e67935a4af110387d16bbb
          git diff --check

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Run targeted DEV-item state regression
        run: python3 scripts/test_dev_item_state.py

      - name: Build and run repository checks
        shell: bash
        run: |
          set -o pipefail
          ./gradlew clean build --no-daemon --stacktrace 2>&1 | tee /tmp/dev-item-build.log

      - name: Upload complete Gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-item-recovery-gradle-log
          path: /tmp/dev-item-build.log
          if-no-files-found: warn
          retention-days: 1

      - name: Consistency checks against the recorded baseline
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 scripts/check_consistency.py | tee /tmp/consistency.log
          result=${PIPESTATUS[0]}
          set -e
          test "$result" -eq 1
          test "$(grep -c '^✗ FAIL:' /tmp/consistency.log)" -eq 5
          grep -Fq 'Összegzés: 5 FAIL, 0 WARN' /tmp/consistency.log
          ! grep -q 'csomagterkep-drift: ARCHITECTURE.md `managers/`' /tmp/consistency.log
