name: Baseline verification

on:
  push:
    branches:
      - audit/baseline-14addda
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Archive checkout for local verification
        run: tar --exclude=.git -czf /tmp/icesmp-source.tar.gz .

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: icesmp-source-14addda
          path: /tmp/icesmp-source.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build and test
        run: ./gradlew clean build --no-daemon --stacktrace

      - name: Consistency checks
        run: python3 scripts/check_consistency.py
