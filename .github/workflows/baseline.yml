name: External branch verification

on:
  push:
    branches:
      - audit/baseline-14addda
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout fixed store-health head
        uses: actions/checkout@v4
        with:
          ref: fix/store-health-fail-closed
          fetch-depth: 0

      - name: Verify branch ancestry and scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '239b3eb5da3544c0bd21f47c542aa8f179fa5e4d'
          test "$(git rev-list --count 14addda17fb5a6c3dfec6a8320a8bfd0aa98e6fb..HEAD)" -eq 2
          mapfile -t files < <(git diff --name-only 14addda17fb5a6c3dfec6a8320a8bfd0aa98e6fb..HEAD | sort)
          printf '%s\n' "${files[@]}"
          test "${#files[@]}" -eq 6
          test "${files[0]}" = 'build.gradle.kts'
          test "${files[1]}" = 'docs/ARCHITECTURE.md'
          test "${files[2]}" = 'src/main/java/hu/taliann/icesmp/core/IceSMPCore.java'
          test "${files[3]}" = 'src/main/java/hu/taliann/icesmp/storage/PersistentStore.java'
          test "${files[4]}" = 'src/main/java/hu/taliann/icesmp/storage/PersistentStoreCoordinator.java'
          test "${files[5]}" = 'src/regression/java/hu/taliann/icesmp/storage/PersistentStoreCoordinatorRegressionTest.java'

      - name: Apply PR 26 prerequisite for verification only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/core-persistent-store-wiring
          git cherry-pick --no-commit 2137554455f7748cd3e67935a4af110387d16bbb
          git diff --check

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build and run all checks
        shell: bash
        run: |
          set -o pipefail
          ./gradlew clean build --no-daemon --stacktrace 2>&1 | tee /tmp/store-health-build.log

      - name: Upload complete Gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: store-health-gradle-log
          path: /tmp/store-health-build.log
          if-no-files-found: error
          retention-days: 1

      - name: Consistency checks (compare with six baseline documentation drifts)
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 scripts/check_consistency.py | tee /tmp/consistency.log
          result=${PIPESTATUS[0]}
          set -e
          test "$result" -eq 1
          test "$(grep -c '^✗ FAIL:' /tmp/consistency.log)" -eq 6
          ! grep -q 'persistent-store registry:' /tmp/consistency.log
          ! grep -q 'storage/` 6 fajlt' /tmp/consistency.log
