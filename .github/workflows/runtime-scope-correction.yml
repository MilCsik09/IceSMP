name: Polygon claim integration gate

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/runtime-scope-correction.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runtime-scope-correction
  cancel-in-progress: false

jobs:
  integrate-polygon-claims:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'fix/runtime-hardening-audit-20260803'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authenticated feature branch with full history
        uses: actions/checkout@v4
        with:
          ref: fix/runtime-hardening-audit-20260803
          fetch-depth: 0
          lfs: true

      - name: Verify branch and immutable ancestry
        shell: bash
        run: |
          set -euo pipefail
          test -d .git
          git merge-base --is-ancestor d9db45615a76cb56c668ea6cf4a9672140357037 HEAD
          git merge-base --is-ancestor c3df598655ccf3032cf20795b9d47de8d66b4637 HEAD
          git merge-base --is-ancestor 52cc62ac3b463679f28656f82cf1f7d17db486e8 HEAD
          git status --short --branch

      - name: Apply asserted polygon integration patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/scripts/claim-polygon-stage.py.gz.b64 \
            | gzip -d > .github/scripts/apply_claim_polygon_stage.py
          python3 .github/scripts/apply_claim_polygon_stage.py
          rm .github/scripts/apply_claim_polygon_stage.py
          git diff --check
          git diff --stat

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run full clean build and regressions
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean check --console=plain --no-daemon --stacktrace

      - name: Run item-model and repository consistency gates
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_gui_icons.py
          python3 -m pip install --disable-pip-version-check --quiet pyyaml
          python3 scripts/check_consistency.py

      - name: Commit and push polygon claim integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/main/java/hu/taliann/icesmp/managers/ClaimManager.java \
            src/main/resources/config/general.yml \
            src/regression/java/hu/taliann/icesmp/runtime/RuntimeHardeningRegressionSuite.java \
            docs/RUNTIME_HARDENING_AUDIT.md
          git diff --cached --check
          git commit -m "Integrate territory-style polygon claims" \
            -m "Use one immutable exact-column ClaimShape for rectangle and multi-point claims, including concave membership, overlap, pricing, row-span protected-region checks, persistence and boundary rendering." \
            -m "Keep quick and two-corner claim flows compatible while adding point, undo, polygon and polygon-wand workflows." \
            -m "Co-Authored-By: ChatGPT <noreply@openai.com>"
          git push origin HEAD:fix/runtime-hardening-audit-20260803
