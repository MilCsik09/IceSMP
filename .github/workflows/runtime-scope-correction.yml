name: Runtime scope correction gate

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/runtime-scope-correction.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runtime-scope-correction
  cancel-in-progress: false

jobs:
  correct-runtime-scope:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'fix/runtime-hardening-audit-20260803'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authenticated feature branch with full history
        uses: actions/checkout@v4
        with:
          ref: fix/runtime-hardening-audit-20260803
          fetch-depth: 0
          lfs: true

      - name: Verify branch and immutable ancestry
        shell: bash
        run: |
          set -euo pipefail
          test -d .git
          git merge-base --is-ancestor 7ca02bc5a9876261a701ee37bdcac244f9913823 HEAD
          git merge-base --is-ancestor 52cc62ac3b463679f28656f82cf1f7d17db486e8 HEAD
          git status --short --branch

      - name: Apply asserted scope correction
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_scope_correction_stage_a.py
          git diff --check
          git diff --stat

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run full clean build and regressions
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean check --console=plain --no-daemon --stacktrace

      - name: Run item-model and repository consistency gates
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_gui_icons.py
          python3 -m pip install --disable-pip-version-check --quiet pyyaml
          python3 scripts/check_consistency.py

      - name: Commit and push corrected implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/main/java/hu/taliann/icesmp/core/Permissions.java \
            src/main/java/hu/taliann/icesmp/managers/VanishManager.java \
            src/main/java/hu/taliann/icesmp/utils/DisplayFxUtil.java \
            src/main/java/hu/taliann/icesmp/managers/ClaimManager.java \
            src/main/java/hu/taliann/icesmp/managers/EventSpawnGuard.java \
            src/main/java/hu/taliann/icesmp/managers/DarkUndeadAmbienceManager.java \
            src/main/resources/config/world.yml \
            src/regression/java/hu/taliann/icesmp/runtime/RuntimeHardeningRegressionSuite.java \
            docs/RUNTIME_HARDENING_AUDIT.md
          git diff --cached --check
          git commit -m "Correct vanish, claim wall and DARK mob spawning" \
            -m "Make vanish-see explicit instead of inherited by every operator, remove vanished subjects from both entity tracking and per-viewer player lists, render the complete claim wall from terrain-owned columns, and require stable solid footing with bounded retries for DARK undead." \
            -m "Adds regressions for the actual reported failure modes." \
            -m "Co-Authored-By: ChatGPT <noreply@openai.com>"
          git push origin HEAD:fix/runtime-hardening-audit-20260803
