name: Polygon claim hardening gate

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/runtime-scope-correction.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runtime-scope-correction
  cancel-in-progress: false

jobs:
  harden-polygon-claims:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'fix/runtime-hardening-audit-20260803'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authenticated feature branch with full history
        uses: actions/checkout@v4
        with:
          ref: fix/runtime-hardening-audit-20260803
          fetch-depth: 0
          lfs: true

      - name: Verify branch and immutable ancestry
        shell: bash
        run: |
          set -euo pipefail
          test -d .git
          git merge-base --is-ancestor 1c49194e9dc831f20b6a3c1e9bf0181ecf5b3244 HEAD
          git merge-base --is-ancestor 9926576f2f649de06545688dca36ed4e2a202787 HEAD
          git merge-base --is-ancestor 52cc62ac3b463679f28656f82cf1f7d17db486e8 HEAD
          git status --short --branch

      - name: Apply asserted adversarial hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/scripts/apply_polygon_claim_hardening.py')
          text = source.read_text(encoding='utf-8')
          marker = '\nreplace_once(\n    "docs/RUNTIME_HARDENING_AUDIT.md",'
          if text.count(marker) != 1:
              raise SystemExit('stale docs assertion marker not found exactly once')
          executable = text[:text.index(marker)] + '\nprint("polygon claim adversarial hardening applied")\n'
          scope = {'__file__': str(source.resolve()), '__name__': '__main__'}
          exec(compile(executable, str(source), 'exec'), scope)
          PY
          python3 - <<'PY'
          from pathlib import Path

          test = Path('src/regression/java/hu/taliann/icesmp/runtime/RuntimeHardeningRegressionSuite.java')
          text = test.read_text(encoding='utf-8')
          old = '&& claim.contains("shape.overlaps(ClaimFootprint.between"),'
          new = '&& claim.contains("shape.overlaps(")\n                        && claim.contains("ClaimFootprint.between(oMinX"),'
          if text.count(old) != 1:
              raise SystemExit(f'polygon source assertion substring count={text.count(old)}')
          test.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git diff --stat

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run full clean build and regressions
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean check --console=plain --no-daemon --stacktrace

      - name: Run item-model and repository consistency gates
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_gui_icons.py
          python3 -m pip install --disable-pip-version-check --quiet pyyaml
          python3 scripts/check_consistency.py

      - name: Commit and push polygon hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/main/java/hu/taliann/icesmp/data/ClaimShape.java \
            src/main/java/hu/taliann/icesmp/managers/ClaimManager.java \
            src/main/java/hu/taliann/icesmp/commands/ClaimCommand.java \
            src/main/java/hu/taliann/icesmp/listeners/SelectionWandListener.java \
            src/regression/java/hu/taliann/icesmp/runtime/RuntimeHardeningRegressionSuite.java
          git diff --cached --check
          git commit -m "Harden polygon claim rasterization and persistence" \
            -m "Bound polygon points, perimeter, continuous area and exact filled columns before publication. Replace bounding-box scanning with row scanlines, avoid materializing large rectangle conflicts, and reject malformed stored polygons instead of widening them to a rectangle." \
            -m "Adds adversarial long-thin polygon, concave footprint and source-contract regressions." \
            -m "Co-Authored-By: ChatGPT <noreply@openai.com>"
          git push origin HEAD:fix/runtime-hardening-audit-20260803
