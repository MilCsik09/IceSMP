name: Rebase PR 31 onto master

on:
  pull_request:
    branches: [master]
    types: [synchronize]

permissions:
  contents: write

jobs:
  rebase-and-verify:
    if: github.event.pull_request.head.ref == 'fix/store-health-fail-closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/store-health-fail-closed
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Merge current master and resolve reviewed overlap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenAI GPT-5.6 Thinking'
          git config user.email 'noreply@openai.com'
          git fetch origin master
          if ! git merge --no-commit --no-ff origin/master; then
            git checkout --ours -- src/main/java/hu/taliann/icesmp/core/IceSMPCore.java docs/ARCHITECTURE.md
            python3 - <<'PY'
          from pathlib import Path
          core = Path('src/main/java/hu/taliann/icesmp/core/IceSMPCore.java')
          text = core.read_text(encoding='utf-8')
          text = text.replace('                raidManager);\n                devItemManager);', '                raidManager,\n                devItemManager);')
          core.write_text(text, encoding='utf-8')
          docs = Path('docs/ARCHITECTURE.md')
          text = docs.read_text(encoding='utf-8').replace('a 32 fájlt-író store', 'a 33 fájlt-író store')
          docs.write_text(text, encoding='utf-8')
          PY
            git add src/main/java/hu/taliann/icesmp/core/IceSMPCore.java docs/ARCHITECTURE.md
            test -z "$(git diff --name-only --diff-filter=U)"
          fi
          git rm .github/workflows/rebase-pr31.yml
          git add -A
          git commit -m 'Merge master into store lifecycle fix'
      - name: Verify
        run: ./gradlew clean build --no-daemon --stacktrace
      - name: Push updated branch
        run: git push origin HEAD:fix/store-health-fail-closed
