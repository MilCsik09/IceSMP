name: PR 76 CI fix publisher

on:
  pull_request:
    branches:
      - automation/pr76-publisher-base3
    types:
      - reopened

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  publish:
    if: github.event.pull_request.head.ref == 'balance/faction-passives-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          repository: MilCsik09/IceSMP
          ref: automation/pr76-publisher-base3
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Retrieve verified CI fix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import urllib.request

          comment_id = 5160101566
          expected_sha = "3758a048af996f08b0b821dcd40285aa1509b59d23cbf5427c22213258a5356e"
          request = urllib.request.Request(
              f"https://api.github.com/repos/MilCsik09/IceSMP/issues/comments/{comment_id}",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "pr76-ci-fix-publisher",
              },
          )
          with urllib.request.urlopen(request) as response:
              body = json.load(response)["body"]
          lines = body.splitlines()
          marker = re.fullmatch(
              r"<!-- pr76-ci-fix-v2 sha256=([0-9a-f]{64}) -->",
              lines[0].strip(),
          )
          if marker is None or marker.group(1) != expected_sha:
              raise RuntimeError("Invalid CI fix marker")
          patch = "\n".join(lines[1:]) + "\n"
          actual_sha = hashlib.sha256(patch.encode("utf-8")).hexdigest()
          if actual_sha != expected_sha:
              raise RuntimeError(f"CI fix SHA mismatch: {actual_sha}")
          pathlib.Path("/tmp/pr76-ci-fix.patch").write_text(patch)
          print(f"Verified {len(patch.encode())} byte CI fix")
          PY

      - name: Apply, test and expose result object
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/heads/balance/faction-passives-v2:refs/remotes/origin/balance/faction-passives-v2
          BASE_SHA="$(git rev-parse refs/remotes/origin/balance/faction-passives-v2)"
          test "$BASE_SHA" = "8ab8796cbcee415424e75e65e8e8c6cbb4d6d800"
          git switch --detach "$BASE_SHA"
          git apply --check /tmp/pr76-ci-fix.patch
          git apply --index /tmp/pr76-ci-fix.patch
          git diff --cached --check
          ./gradlew factionPassiveRegressionTest --console=plain --no-daemon --stacktrace
          git config user.name "OpenAI Codex"
          git config user.email "noreply@openai.com"
          git commit -m "Fix faction passive source contracts"
          echo "CI_FIX_RESULT_BEGIN"
          git log -1 --format='RESULT_COMMIT %H parent=%P tree=%T subject=%s'
          echo "CI_FIX_RESULT_END"
          git push origin HEAD:refs/heads/automation/pr76-ci-fix-result-v2
