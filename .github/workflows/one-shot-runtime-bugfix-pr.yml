name: One-shot runtime bugfix PR trigger

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply embedded patch once
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          sentinel = Path("src/regression/java/hu/taliann/icesmp/runtime/RuntimeBugfixRegressionSuite.java")
          if sentinel.exists():
              print("Runtime bugfix already applied.")
              raise SystemExit(0)

          workflow = Path(".github/workflows/one-shot-runtime-bugfix.yml").read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if line.strip() == "python3 <<'PY'") + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == "PY")
          body = workflow[start:end]
          nonblank = [line for line in body if line.strip()]
          indent = min(len(line) - len(line.lstrip()) for line in nonblank)
          script = "\n".join(line[indent:] for line in body)

          original_helper = '''def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))'''
          tolerant_helper = '''import re

          def _loose_pattern(value: str) -> re.Pattern[str]:
              lines = value.splitlines()
              parts = []
              for index, line in enumerate(lines):
                  if index:
                      parts.append(r"\\r?\\n")
                  stripped = line.strip()
                  parts.append(r"[ \\t]*" + re.escape(stripped) + r"[ \\t]*")
              return re.compile("".join(parts))

          def _render_replacement(path: str, value: str, base: int) -> str:
              lines = value.splitlines()
              if path.endswith((".yml", ".yaml")):
                  return "\\n".join((" " * base) + line.strip() if line.strip() else "" for line in lines)
              rendered = []
              depth = 0
              for line in lines:
                  stripped = line.strip()
                  if not stripped:
                      rendered.append("")
                      continue
                  if stripped.startswith("}"):
                      depth = max(0, depth - 1)
                  rendered.append((" " * (base + depth * 4)) + stripped)
                  if stripped.endswith("{"):
                      depth += 1
              return "\\n".join(rendered)

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count == 1:
                  p.write_text(text.replace(old, new, 1))
                  return
              pattern = _loose_pattern(old)
              matches = list(pattern.finditer(text))
              if len(matches) != 1:
                  raise SystemExit(f"{path}: expected one loose match, found {len(matches)}: {old[:100]!r}")
              match = matches[0]
              first_line = match.group(0).splitlines()[0]
              base = len(first_line) - len(first_line.lstrip())
              replacement = _render_replacement(path, new, base)
              p.write_text(text[:match.start()] + replacement + text[match.end():])'''
          if original_helper not in script:
              raise SystemExit("Embedded replace_once helper shape changed unexpectedly")
          script = script.replace(original_helper, tolerant_helper, 1)
          exec(compile(script, "embedded-runtime-bugfix", "exec"), {})
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build.gradle.kts src/main src/regression
          if git diff --cached --quiet; then
            echo "No patch changes to commit."
            exit 0
          fi
          git commit -m "fix: harden pets, lore, corruption and spectator menus"
          git push origin HEAD:${{ github.head_ref }}
