name: One-shot runtime bugfix PR trigger

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply embedded patch once
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          sentinel = Path("src/regression/java/hu/taliann/icesmp/runtime/RuntimeBugfixRegressionSuite.java")
          if sentinel.exists():
              print("Runtime bugfix already applied.")
              raise SystemExit(0)

          workflow = Path(".github/workflows/one-shot-runtime-bugfix.yml").read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if line.strip() == "python3 <<'PY'") + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == "PY")
          body = workflow[start:end]
          nonblank = [line for line in body if line.strip()]
          indent = min(len(line) - len(line.lstrip()) for line in nonblank)
          script = "\n".join(line[indent:] for line in body)

          original_helper = '''def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))'''
          tolerant_helper = '''def _restore_literal_baseline(value: str) -> str:
              lines = value.splitlines()
              if not lines:
                  return value
              baseline = len(lines[0]) - len(lines[0].lstrip())
              if baseline <= 0:
                  return value
              return "\\n".join([lines[0]] + [((" " * baseline) + line) if line else line for line in lines[1:]])

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              candidate_old = old
              candidate_new = new
              count = text.count(candidate_old)
              if count == 0:
                  candidate_old = _restore_literal_baseline(old)
                  candidate_new = _restore_literal_baseline(new)
                  count = text.count(candidate_old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {candidate_old[:100]!r}")
              p.write_text(text.replace(candidate_old, candidate_new, 1))'''
          if original_helper not in script:
              raise SystemExit("Embedded replace_once helper shape changed unexpectedly")
          script = script.replace(original_helper, tolerant_helper, 1)
          exec(compile(script, "embedded-runtime-bugfix", "exec"), {})
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build.gradle.kts src/main src/regression
          if git diff --cached --quiet; then
            echo "No patch changes to commit."
            exit 0
          fi
          git commit -m "fix: harden pets, lore, corruption and spectator menus"
          git push origin HEAD:${{ github.head_ref }}
