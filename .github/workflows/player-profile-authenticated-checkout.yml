name: PlayerProfile authenticated checkout (temporary)

on:
  pull_request:
    branches:
      - rework/class-spec-profile-v2

permissions:
  contents: read

jobs:
  export:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'profile/player-profile-platform'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout complete authenticated repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Build genuine shallow Git checkout
        shell: bash
        run: |
          set -euo pipefail
          PROFILE_HEAD='b6f4492766675f718f73fd947bf92a388a3090fb'
          PROFILE_BASE='62ad99b74b7bb63420cb8e5e821f0321c5d84d48'
          test "$(git rev-parse HEAD^)" = "$PROFILE_HEAD"
          test "$(git merge-base "$PROFILE_HEAD" "$PROFILE_BASE")" = "$PROFILE_BASE"
          mkdir -p build/player-profile-checkout
          git -c protocol.version=2 clone --quiet --filter=blob:none --no-checkout --depth=10 \
            --single-branch --branch profile/player-profile-platform \
            "file://$GITHUB_WORKSPACE" build/player-profile-checkout/repo
          cd build/player-profile-checkout/repo
          git sparse-checkout init --no-cone
          cat > .git/info/sparse-checkout <<'PATTERNS'
/*
!/*/
/.github/
/docs/
/gradle/
/scripts/
/src/
/AGENTS.md
/CLAUDE.md
/LICENSE
/README.md
/ROADMAP.md
/build.gradle.kts
/gradle.properties
/gradlew
/gradlew.bat
/settings.gradle.kts
PATTERNS
          git checkout --quiet "${{ github.event.pull_request.head.sha }}"
          git switch --quiet -c profile/player-profile-platform "${{ github.event.pull_request.head.sha }}"
          git remote set-url origin https://github.com/MilCsik09/IceSMP.git
          git config --unset-all http.https://github.com/.extraheader || true
          test -d .git/objects
          test -f .git/shallow
          git fsck --connectivity-only
          git status --short --branch > ../status.txt
          git show-ref > ../refs.txt
          git log --decorate --oneline --graph --all > ../history.txt
          git rev-list --count HEAD > ../commit-count.txt
          git count-objects -vH > ../object-size.txt
          cd ..
          tar -czf authenticated-checkout.tar.gz repo
          sha256sum authenticated-checkout.tar.gz > SHA256SUMS
          printf 'head=%s\nprofile-root=%s\nprofile-base=%s\n' \
            "${{ github.event.pull_request.head.sha }}" "$PROFILE_HEAD" "$PROFILE_BASE" > manifest.txt
          du -h authenticated-checkout.tar.gz

      - name: Upload authenticated checkout
        uses: actions/upload-artifact@v4
        with:
          name: player-profile-authenticated-checkout-${{ github.run_id }}
          path: build/player-profile-checkout/
          retention-days: 1
          if-no-files-found: error
