name: Verify DEV pending reward fix

on:
  push:
    branches:
      - audit/baseline-14addda
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact pending-reward head
        uses: actions/checkout@v4
        with:
          ref: fix/dev-item-pending-reward
          fetch-depth: 0

      - name: Verify exact dependency, commit and scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '13bb625d063830afe766bd397954cf8a9cf30d41'
          test "$(git rev-parse HEAD^)" = '92b12140318f412932766603ab905d44c259774e'
          test "$(git rev-list --count 92b12140318f412932766603ab905d44c259774e..HEAD)" -eq 1
          test "$(git log -1 --format='%s')" = 'Make DEV reward delivery crash-replay safe'
          git diff --check 92b12140318f412932766603ab905d44c259774e..HEAD

          mapfile -t files < <(git diff --name-only 92b12140318f412932766603ab905d44c259774e..HEAD | sort)
          printf '%s\n' "${files[@]}"
          test "${#files[@]}" -eq 5
          test "${files[0]}" = 'docs/ARCHITECTURE.md'
          test "${files[1]}" = 'scripts/test_dev_item_state.py'
          test "${files[2]}" = 'src/main/java/hu/taliann/icesmp/managers/DevItemManager.java'
          test "${files[3]}" = 'src/main/java/hu/taliann/icesmp/managers/DevItemStateData.java'
          test "${files[4]}" = 'src/regression/java/hu/taliann/icesmp/managers/DevItemStateDataRegressionTest.java'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Run targeted DEV reward protocol regression
        run: python3 scripts/test_dev_item_state.py

      - name: Archive exact published source
        run: tar --exclude=.git -czf /tmp/dev-item-pending-source.tar.gz .

      - name: Upload exact published source
        uses: actions/upload-artifact@v4
        with:
          name: dev-item-pending-source
          path: /tmp/dev-item-pending-source.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Apply PR 26 prerequisite for verification only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/core-persistent-store-wiring
          git cherry-pick --no-commit 2137554455f7748cd3e67935a4af110387d16bbb
          git diff --check

      - name: Full Gradle build and tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew clean build --no-daemon --stacktrace 2>&1 | tee /tmp/dev-item-pending-build.log

      - name: Upload complete Gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-item-pending-gradle-log
          path: /tmp/dev-item-pending-build.log
          if-no-files-found: warn
          retention-days: 1

      - name: Consistency checks against the recorded branch baseline
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 scripts/check_consistency.py | tee /tmp/consistency.log
          result=${PIPESTATUS[0]}
          set -e
          test "$result" -eq 1
          test "$(grep -c '^✗ FAIL:' /tmp/consistency.log)" -eq 5
          grep -Fq 'Összegzés: 5 FAIL, 0 WARN' /tmp/consistency.log
