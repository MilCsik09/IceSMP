name: Publish and verify DEV pending reward fix

on:
  push:
    branches:
      - audit/baseline-14addda
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout patch source
        uses: actions/checkout@v4
        with:
          ref: audit/baseline-14addda
          path: patch-source
          fetch-depth: 1

      - name: Extract reviewed patch payload
        shell: bash
        run: |
          set -euo pipefail
          grep -m1 '^H4s' patch-source/.github/workflows/baseline.yml > /tmp/dev-item-pending.patch.gz.b64
          base64 --decode /tmp/dev-item-pending.patch.gz.b64 > /tmp/dev-item-pending.patch.gz
          test "$(sha256sum /tmp/dev-item-pending.patch.gz | cut -d' ' -f1)" = 'e6bda9280d096438b177e480c6ecbeeb74cbaf3e3609f64222817b59f9e259c8'
          gzip --decompress --stdout /tmp/dev-item-pending.patch.gz > /tmp/dev-item-pending.patch
          test "$(sha256sum /tmp/dev-item-pending.patch | cut -d' ' -f1)" = '7327a043da22f1a1b5ac87b4f2d2b2dc36e69fee65c0a8c612818ad5eb0a5023'

      - name: Checkout stacked target branch
        uses: actions/checkout@v4
        with:
          ref: fix/dev-item-pending-reward
          path: target
          fetch-depth: 0

      - name: Verify exact dependency head
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '92b12140318f412932766603ab905d44c259774e'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply reviewed DEV reward patch
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/dev-item-pending.patch
          git apply /tmp/dev-item-pending.patch
          git diff --check

      - name: Run targeted protocol regression before publishing
        working-directory: target
        run: python3 scripts/test_dev_item_state.py

      - name: Commit and push the reviewed branch
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only | sort)
          printf '%s\n' "${files[@]}"
          test "${#files[@]}" -eq 5
          test "${files[0]}" = 'docs/ARCHITECTURE.md'
          test "${files[1]}" = 'scripts/test_dev_item_state.py'
          test "${files[2]}" = 'src/main/java/hu/taliann/icesmp/managers/DevItemManager.java'
          test "${files[3]}" = 'src/main/java/hu/taliann/icesmp/managers/DevItemStateData.java'
          test "${files[4]}" = 'src/regression/java/hu/taliann/icesmp/managers/DevItemStateDataRegressionTest.java'
          git config user.name 'OpenAI'
          git config user.email 'noreply@openai.com'
          git add -- "${files[@]}"
          git diff --cached --check
          git commit -m 'Make DEV reward delivery crash-replay safe'
          git push origin HEAD:fix/dev-item-pending-reward
          git rev-parse HEAD | tee /tmp/published-head

      - name: Archive exact published source
        working-directory: target
        run: tar --exclude=.git -czf /tmp/dev-item-pending-source.tar.gz .

      - name: Upload exact published source
        uses: actions/upload-artifact@v4
        with:
          name: dev-item-pending-source
          path: /tmp/dev-item-pending-source.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Apply PR 26 prerequisite for verification only
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/core-persistent-store-wiring
          git cherry-pick --no-commit 2137554455f7748cd3e67935a4af110387d16bbb
          git diff --check

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
        with:
          build-root-directory: target

      - name: Build and test
        working-directory: target
        shell: bash
        run: |
          set -o pipefail
          ./gradlew clean build --no-daemon --stacktrace 2>&1 | tee /tmp/dev-item-pending-build.log

      - name: Upload complete Gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-item-pending-gradle-log
          path: /tmp/dev-item-pending-build.log
          if-no-files-found: warn
          retention-days: 1

      - name: Consistency checks against the recorded baseline
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 scripts/check_consistency.py | tee /tmp/consistency.log
          result=${PIPESTATUS[0]}
          set -e
          test "$result" -eq 1
          test "$(grep -c '^✗ FAIL:' /tmp/consistency.log)" -eq 5
          grep -Fq 'Összegzés: 5 FAIL, 0 WARN' /tmp/consistency.log
