name: Rebase PR 34 after DEV recovery merge

on:
  pull_request:
    branches: [master]
    types: [synchronize]

permissions:
  contents: write

jobs:
  rebase-and-verify:
    if: github.event.pull_request.head.ref == 'fix/season-community-transition'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/season-community-transition
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Merge latest master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenAI GPT-5.6 Thinking'
          git config user.email 'noreply@openai.com'
          git fetch origin master
          if ! git merge --no-commit --no-ff origin/master; then
            for path in docs/ARCHITECTURE.md src/main/java/hu/taliann/icesmp/core/IceSMPCore.java; do
              if git diff --name-only --diff-filter=U | grep -qx "$path"; then git checkout --ours -- "$path"; fi
            done
            python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/ARCHITECTURE.md')
          t=p.read_text(encoding='utf-8').replace('a 32 fájlt-író store','a 33 fájlt-író store').replace('| `storage/` | 6 |','| `storage/` | 7 |')
          p.write_text(t,encoding='utf-8')
          core=Path('src/main/java/hu/taliann/icesmp/core/IceSMPCore.java')
          t=core.read_text(encoding='utf-8').replace('                raidManager);\n                devItemManager);','                raidManager,\n                devItemManager);')
          core.write_text(t,encoding='utf-8')
          PY
            git add docs/ARCHITECTURE.md src/main/java/hu/taliann/icesmp/core/IceSMPCore.java
            test -z "$(git diff --name-only --diff-filter=U)"
          fi
          git rm .github/workflows/rebase-pr34.yml
          git add -A
          git commit -m 'Merge DEV recovery master into season transition fix'
      - run: python3 scripts/test_season_community_transition.py
      - run: ./gradlew clean build --no-daemon --stacktrace
      - run: git push origin HEAD:fix/season-community-transition
