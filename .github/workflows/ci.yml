name: IceSMP CI

on:
  pull_request:
    branches:
      - master
      - rework/class-spec-1.21.11-compatibility
      - claude/projekt-audit-u0hkcz
      - feature/native-moderation-suite
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
  PUSH_BEFORE_SHA: ${{ github.event.before }}

jobs:
  consistency:
    name: Consistency delta
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Resolve base and head commits
        id: refs
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA=$(git rev-parse HEAD)
          if [[ -n "${PR_BASE_SHA:-}" ]]; then
            BASE_SHA=$PR_BASE_SHA
          elif [[ -n "${PUSH_BEFORE_SHA:-}" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            BASE_SHA=$PUSH_BEFORE_SHA
          else
            BASE_SHA=$(git rev-parse HEAD^)
          fi
          git cat-file -e "${BASE_SHA}^{commit}"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "Base commit: $BASE_SHA"
          echo "Head commit: $HEAD_SHA"

      - name: Check patch whitespace
        run: >-
          git diff --check
          "${{ steps.refs.outputs.base_sha }}...${{ steps.refs.outputs.head_sha }}"

      - name: Compare consistency with base
        run: >-
          python3 scripts/check_consistency_delta.py
          --base-ref "${{ steps.refs.outputs.base_sha }}"
          --head-ref "${{ steps.refs.outputs.head_sha }}"

  build:
    name: Java 21 build and regressions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate deterministic resource pack build
        run: |
          python3 scripts/test_resource_pack.py
          python3 scripts/resource_pack.py build \
            --source resource-pack \
            --output build/resource-pack/ci-pack.zip

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Clean build
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean build --no-daemon --stacktrace | tee gradle-build.log

      - name: Verify stacked regressions ran inside Gradle check
        shell: bash
        run: |
          set -euo pipefail
          grep -F "MOTD regression suite passed." gradle-build.log
          grep -F "Moderation regression suite passed." gradle-build.log
          grep -F "Moderation review regression suite passed." gradle-build.log
          grep -F "PersistentStoreCoordinator regression tests passed." gradle-build.log
          grep -F "DEV-item reward regression suite passed." gradle-build.log
          grep -F "AFK regression suite passed." gradle-build.log
          grep -F "HUD regression suite passed." gradle-build.log
          grep -F "Pause-menu dialog regression suite passed." gradle-build.log
          grep -F "ClassProfile v2 domain/codec regression tests passed." gradle-build.log
          grep -F "Class/spec application regression suite passed." gradle-build.log
          grep -F "YamlClassProfileRepository regression tests passed." gradle-build.log
          grep -F "Class profile lifecycle regression suite passed." gradle-build.log
          grep -F "Respec transaction regression suite passed." gradle-build.log
          grep -F "Spell grant ledger regression suite passed." gradle-build.log

      - name: Run targeted DEV regression driver
        run: python3 scripts/test_dev_item_state.py

      - name: Package authenticated Git checkout (temporary)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          TESTED_HEAD=$(git rev-parse HEAD)
          PROFILE_BASE='62ad99b74b7bb63420cb8e5e821f0321c5d84d48'
          EXPORT_BRANCH='player-profile-authenticated-export'
          rm -rf build/player-profile-checkout
          mkdir -p build/player-profile-checkout
          git branch --force "$EXPORT_BRANCH" "$TESTED_HEAD"
          git clone --quiet --depth=32 --single-branch --branch "$EXPORT_BRANCH" \
            "file://$GITHUB_WORKSPACE" build/player-profile-checkout/repo
          cd build/player-profile-checkout/repo
          git branch -m rework/class-spec-profile-v2
          git remote set-url origin https://github.com/MilCsik09/IceSMP.git
          git config --unset-all http.https://github.com/.extraheader || true
          test "$(git rev-parse HEAD)" = "$TESTED_HEAD"
          test "$(git merge-base HEAD "$PROFILE_BASE")" = "$PROFILE_BASE"
          test -f .git/shallow
          git fsck --full
          git status --short --branch > ../git-status.txt
          git show-ref > ../git-refs.txt
          git log --decorate --oneline --graph --all > ../git-history.txt
          git count-objects -vH > ../object-size.txt
          cd ..
          tar -czf authenticated-checkout.tar.gz repo
          sha256sum authenticated-checkout.tar.gz > SHA256SUMS
          printf 'head=%s\nbase=%s\nmerge-base=%s\n' \
            "$TESTED_HEAD" "$PROFILE_BASE" \
            "$(git -C "$GITHUB_WORKSPACE" merge-base "$TESTED_HEAD" "$PROFILE_BASE")" \
            > manifest.txt
          du -h authenticated-checkout.tar.gz

      - name: Upload authenticated Git checkout (temporary)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-profile-checkout-${{ github.run_id }}
          path: build/player-profile-checkout/
          retention-days: 1
          if-no-files-found: error
