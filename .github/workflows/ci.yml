name: IceSMP CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Java 21 build and regressions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PUSH_BEFORE_SHA: ${{ github.event.before }}
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve base and head commits
        id: refs
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA=$(git rev-parse HEAD)
          if [[ -n "${PR_BASE_SHA:-}" ]]; then
            BASE_SHA=$PR_BASE_SHA
          elif [[ -n "${PUSH_BEFORE_SHA:-}" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            BASE_SHA=$PUSH_BEFORE_SHA
          else
            BASE_SHA=$(git rev-parse HEAD^)
          fi
          git cat-file -e "${BASE_SHA}^{commit}"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "Base commit: $BASE_SHA"
          echo "Head commit: $HEAD_SHA"

      - name: Check patch whitespace
        run: >-
          git diff --check
          "${{ steps.refs.outputs.base_sha }}...${{ steps.refs.outputs.head_sha }}"

      - name: Clean build
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean build --no-daemon --stacktrace | tee gradle-build.log

      - name: Verify DEV regressions ran inside Gradle check
        shell: bash
        run: |
          set -euo pipefail
          grep -F "DEV-item reward regression suite passed." gradle-build.log
          echo "Gradle check executed the DEV-item reward regression suite."

      - name: Run targeted DEV regression driver
        run: python3 scripts/test_dev_item_state.py

      - name: Compare consistency with base
        run: >-
          python3 scripts/check_consistency_delta.py
          --base-ref "${{ steps.refs.outputs.base_sha }}"
          --head-ref "${{ steps.refs.outputs.head_sha }}"
