name: IceSMP CI

on:
  pull_request:
    branches:
      - master
      - claude/projekt-audit-u0hkcz
      - feature/native-moderation-suite
      - fix/pet-lore-corruption-spectator-menu
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
  PUSH_BEFORE_SHA: ${{ github.event.before }}

jobs:
  consistency:
    name: Consistency delta
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Resolve base and head commits
        id: refs
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA=$(git rev-parse HEAD)
          if [[ -n "${PR_BASE_SHA:-}" ]]; then
            BASE_SHA=$PR_BASE_SHA
          elif [[ -n "${PUSH_BEFORE_SHA:-}" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            BASE_SHA=$PUSH_BEFORE_SHA
          else
            BASE_SHA=$(git rev-parse HEAD^)
          fi
          git cat-file -e "${BASE_SHA}^{commit}"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "Base commit: $BASE_SHA"
          echo "Head commit: $HEAD_SHA"

      - name: Check patch whitespace
        run: >-
          git diff --check
          "${{ steps.refs.outputs.base_sha }}...${{ steps.refs.outputs.head_sha }}"

      - name: Compare consistency with base
        run: >-
          python3 scripts/check_consistency_delta.py
          --base-ref "${{ steps.refs.outputs.base_sha }}"
          --head-ref "${{ steps.refs.outputs.head_sha }}"

  build:
    name: Java 21 build and regressions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate deterministic resource pack build
        run: |
          python3 scripts/test_resource_pack.py
          python3 scripts/resource_pack.py build \
            --source resource-pack \
            --output build/resource-pack/ci-pack.zip

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Clean build
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean build --console=plain --no-daemon --stacktrace | tee gradle-build.log

      - name: Verify stacked regressions ran inside Gradle check
        shell: bash
        run: |
          set -euo pipefail
          grep -F "MOTD regression suite passed." gradle-build.log
          grep -F "Moderation regression suite passed." gradle-build.log
          grep -F "Moderation review regression suite passed." gradle-build.log
          grep -F "PersistentStoreCoordinator regression tests passed." gradle-build.log
          grep -F "DEV-item reward regression suite passed." gradle-build.log
          grep -F "AFK regression suite passed." gradle-build.log
          grep -F "HUD regression suite passed." gradle-build.log
          grep -F "Pause-menu dialog regression suite passed." gradle-build.log
          grep -F "Faction passive regression suite passed." gradle-build.log
          grep -F "Faction passive hardening regression suite passed." gradle-build.log
          grep -F "Faction tax debt regression suite passed." gradle-build.log

      - name: Run faction regressions explicitly
        run: ./gradlew factionPassiveRegressionTest factionPassiveHardeningRegressionTest factionTreasuryRegressionTest --console=plain --no-daemon --stacktrace

      - name: Run full repository consistency
        run: python3 scripts/check_consistency.py

      - name: Run targeted DEV regression driver
        run: python3 scripts/test_dev_item_state.py
