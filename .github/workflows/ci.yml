name: IceSMP CI

on:
  pull_request:
    branches:
      - master
      - staging
      - integration/master-candidate
      - rework/class-relic-framework
    paths-ignore:
      - "**/*.md"
  push:
    branches:
      - master
      - staging
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: icesmp-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
  PUSH_BEFORE_SHA: ${{ github.event.before }}

jobs:
  consistency:
    name: Consistency delta
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Resolve base and head commits
        id: refs
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA=$(git rev-parse HEAD)
          if [[ -n "${PR_BASE_SHA:-}" ]]; then
            BASE_SHA=$PR_BASE_SHA
          elif [[ -n "${PUSH_BEFORE_SHA:-}" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            BASE_SHA=$PUSH_BEFORE_SHA
          else
            BASE_SHA=$(git rev-parse HEAD^)
          fi
          git cat-file -e "${BASE_SHA}^{commit}"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "Base commit: $BASE_SHA"
          echo "Head commit: $HEAD_SHA"

      - name: Check patch whitespace
        run: >-
          git diff --check
          "${{ steps.refs.outputs.base_sha }}...${{ steps.refs.outputs.head_sha }}"

      - name: Compare consistency with base
        run: >-
          python3 scripts/check_consistency_delta.py
          --base-ref "${{ steps.refs.outputs.base_sha }}"
          --head-ref "${{ steps.refs.outputs.head_sha }}"

  build:
    name: Java 21 build and regressions
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install repository build dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          'PyYAML>=6.0,<7.0'
          'Pillow==11.3.0'

      - name: Validate PlayerProfile authority contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_player_profile_authority.py
          python3 scripts/tests/test_player_profile_transition_gate.py
          python3 scripts/check_player_profile_authority.py \
            --root . \
            --write-report build/player-profile-authority-current.json
          python3 scripts/check_player_profile_transitions.py \
            --root . \
            --json-output build/player-profile-transition-report.json

      - name: Validate resource-pack bindings
        run: python3 scripts/test_resource_pack.py

      - name: Validate FancyNpcs deployment snapshot
        run: python3 scripts/validate_fancynpcs_snapshot.py

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Validate first-party resource-pack contract
        run: ./gradlew validateIceSmpHudPackage iceSmpHudRegressionTest playerProfileHudLayoutRegressionTest resourcePackRegressionTest --no-daemon --console=plain

      - name: Clean build
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean build --console=plain --no-daemon --stacktrace | tee gradle-build.log

      - name: Verify stacked regressions ran inside Gradle check
        shell: bash
        run: |
          set -euo pipefail
          grep -F "MOTD regression suite passed." gradle-build.log
          grep -F "Moderation regression suite passed." gradle-build.log
          grep -F "Moderation review regression suite passed." gradle-build.log
          grep -F "PersistentStoreCoordinator regression tests passed." gradle-build.log
          grep -F "DEV-item reward regression suite passed." gradle-build.log
          grep -F "AFK regression suite passed." gradle-build.log
          grep -F "HUD regression suite passed." gradle-build.log
          grep -F "Pause-menu dialog regression suite passed." gradle-build.log
          grep -F "Faction passive regression suite passed." gradle-build.log
          grep -F "Faction passive hardening regression suite passed." gradle-build.log
          grep -F "Faction tax debt regression suite passed." gradle-build.log
          grep -F "Relic refresh regression suite passed." gradle-build.log
          grep -F "Relic refresh pipeline regression suite passed." gradle-build.log
          grep -F "Lifecycle shutdown regression suite passed." gradle-build.log
          grep -F "Quest NPC validation regression suite passed." gradle-build.log
          grep -F "Resource pack regression suite passed." gradle-build.log
          grep -F "ClassSpecSection v2 domain regression tests passed." gradle-build.log
          grep -F "Class/spec application regression suite passed." gradle-build.log
          grep -F "PlayerProfile YAML regression suite passed." gradle-build.log
          grep -F "ClassSpecSection lifecycle regression suite passed." gradle-build.log
          grep -F "Respec transaction regression suite passed." gradle-build.log
          grep -F "Spell grant ledger regression suite passed." gradle-build.log
          grep -F "PlayerProfile full authority regression suite passed." gradle-build.log
          grep -F "PlayerProfile HTTP contract regression suite passed." gradle-build.log
          grep -F "PlayerProfile lifecycle teardown regression suite passed." gradle-build.log
          grep -F "Bestiary regression suite passed." gradle-build.log
          grep -F "Class relic regression suite passed." gradle-build.log
          grep -F "Quest framework v2 regression suite passed." gradle-build.log
          grep -F "Onboarding dialog regression suite passed." gradle-build.log
          grep -F "Warrior gameplay regression suite passed." gradle-build.log
          grep -F "Warrior profile regression suite passed." gradle-build.log
          grep -F "Evoker gameplay regression suite passed." gradle-build.log
          grep -F "Evoker profile regression suite passed." gradle-build.log
          grep -F "Archer gameplay regression suite passed." gradle-build.log
          grep -F "Archer profile regression suite passed." gradle-build.log
          grep -F "Shaman gameplay regression suite passed." gradle-build.log
          grep -F "Shaman profile regression suite passed." gradle-build.log
          grep -F "Monk gameplay regression suite passed." gradle-build.log
          grep -F "Monk profile regression suite passed." gradle-build.log
          grep -F "Paladin gameplay regression suite passed." gradle-build.log
          grep -F "Paladin profile regression suite passed." gradle-build.log
          grep -F "Demon Hunter gameplay regression suite passed." gradle-build.log
          grep -F "Demon Hunter profile regression suite passed." gradle-build.log
          grep -F "Druid gameplay regression suite passed." gradle-build.log
          grep -F "Druid profile regression suite passed." gradle-build.log
          grep -F "Priest gameplay regression suite passed." gradle-build.log
          grep -F "Priest profile regression suite passed." gradle-build.log
          grep -F "Death Knight gameplay regression suite passed." gradle-build.log
          grep -F "Death Knight profile regression suite passed." gradle-build.log
          grep -F "Assassin gameplay regression suite passed." gradle-build.log
          grep -F "Assassin profile regression suite passed." gradle-build.log
          grep -F "Warlock gameplay regression suite passed." gradle-build.log
          grep -F "Warlock profile regression suite passed." gradle-build.log
          grep -F "Wizard gameplay regression suite passed." gradle-build.log
          grep -F "Wizard profile regression suite passed." gradle-build.log

      - name: Run full repository consistency
        run: python3 scripts/check_consistency.py

      - name: Verify DEV state source contract
        shell: bash
        run: |
          python3 - <<'PY'
          from scripts.test_dev_item_state import verify_removed_paths
          verify_removed_paths()
          PY

      - name: Upload plugin JAR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: IceSMP-plugin-${{ github.run_number }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
