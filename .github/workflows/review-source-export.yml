name: PR 76 review source export

on:
  pull_request:
    branches:
      - fix/pet-lore-corruption-spectator-menu
    paths:
      - .github/workflows/review-source-export.yml

permissions:
  contents: write

jobs:
  export:
    if: github.event.pull_request.head.ref == 'balance/faction-passives-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: MilCsik09/IceSMP
          ref: balance/faction-passives-v2
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Export exact review tree
        run: git archive --format=zip --output=icesmp-review-source.zip HEAD

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: icesmp-review-source
          path: icesmp-review-source.zip
          if-no-files-found: error
          retention-days: 1

      - name: Remove one-shot exporter
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/review-source-export.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(review): remove source exporter"
          git push origin HEAD:balance/faction-passives-v2
