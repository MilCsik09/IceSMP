name: Review patch publisher

on:
  push:
    branches:
      - feature/native-afk-zones

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staged review patch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and apply AFK scheduler patch
        run: |
          test -f .review/afk-core-fix.patch
          base64 --decode .review/afk-core-fix.patch > "$RUNNER_TEMP/afk-core-fix.patch"
          git apply --check --whitespace=error-all "$RUNNER_TEMP/afk-core-fix.patch"
          git apply "$RUNNER_TEMP/afk-core-fix.patch"

      - name: Run required build and regressions
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon --stacktrace
          ./gradlew afkRegressionTest --no-daemon --stacktrace
          python3 scripts/check_consistency.py
          git diff --check

      - name: Publish reviewed source changes
        run: |
          git rm .review/afk-core-fix.patch
          git add src/main/java/hu/taliann/icesmp/core/IceSMPCore.java \
                  src/main/java/hu/taliann/icesmp/managers/AfkManager.java \
                  src/main/java/hu/taliann/icesmp/managers/AfkZoneCatalog.java \
                  src/regression/java/hu/taliann/icesmp/managers/AfkZoneRegressionSuite.java
          git diff --cached --check
          git config user.name "IceSMP review automation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix(afk): decouple driver and bound global timers"
          git push origin HEAD:feature/native-afk-zones
