name: Professions 2.0 Adversarial Hardening

on:
  push:
    branches:
      - feature/professions-2

permissions:
  contents: write

jobs:
  harden:
    if: contains(github.event.head_commit.message, '[professions-2-hardening]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout child head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check 'PyYAML>=6.0,<7.0'

      - name: Apply and validate adversarial hardening
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_professions_2_hardening.py
          python scripts/check_professions_2_reports.py
          python scripts/test_professions_2_economy.py

      - name: Publish hardening commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'IceSMP Professions 2.0 Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f .github/workflows/professions-2-hardening.yml
          git add -A
          git commit -m 'fix(professions): close family salvage and Masterwork boundaries [professions-2-final]'
          git push origin HEAD:feature/professions-2
