name: Repository Docs Inventory

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  VALIDATION_BRANCH: agent/player-profile-root-reconstruct-20260803-v6
  RECOVERY_BRANCH: agent/player-profile-root-recovered-20260803-v4
  EXPECTED_RECOVERY_HEAD: 258ea27e0ba96cbbae0d9f7e39c6b20ee444d480
  TARGET_BRANCH: rework/class-spec-profile-v2
  EXPECTED_TARGET_HEAD: f25e7e600f418724dd2341e39387a0fa5c0625de

jobs:
  inventory:
    name: PlayerProfile authority cleanup driver
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Check out authenticated validation history
        uses: actions/checkout@v4
        with:
          ref: ${{ env.VALIDATION_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Execute reviewed authority-cleanup run steps in order
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import os
          from pathlib import Path
          import subprocess

          workflow_path = Path('.github/workflows/player-profile-root-v6-suite-restore.yml')
          lines = workflow_path.read_text(encoding='utf-8').splitlines()
          scripts: list[tuple[str, str]] = []
          current_name: str | None = None
          index = 0
          while index < len(lines):
              line = lines[index]
              if line.startswith('      - name: '):
                  current_name = line.removeprefix('      - name: ').strip()
                  index += 1
                  continue
              if line == '        run: |':
                  if not current_name:
                      raise SystemExit(f'Unnamed run block at line {index + 1}')
                  index += 1
                  block: list[str] = []
                  while index < len(lines) and not lines[index].startswith('      - name: '):
                      raw = lines[index]
                      block.append(raw[10:] if raw.startswith('          ') else raw)
                      index += 1
                  script = '\n'.join(block).rstrip() + '\n'
                  if not script.strip():
                      raise SystemExit(f'Empty run block: {current_name}')
                  scripts.append((current_name, script))
                  continue
              index += 1

          if len(scripts) < 8:
              raise SystemExit(f'Unexpected cleanup run-step count: {len(scripts)}')
          if scripts[-1][0] != 'Commit and fast-forward push after every gate succeeds':
              raise SystemExit(
                  'Cleanup commit/push is not the final run step: ' + scripts[-1][0]
              )
          expected_names = {
              'Extract reviewed PlayerProfile regression sources',
              'Check out exact recovery head and prepare authority cleanup',
              'Java 21 clean build and all regressions',
              'Verify PlayerProfile regression markers',
              'Run PlayerProfile and repository gates',
              'Audit stale documentation claims',
              'Commit and fast-forward push after every gate succeeds',
          }
          observed_names = {name for name, _ in scripts}
          missing = sorted(expected_names - observed_names)
          if missing:
              raise SystemExit('Missing cleanup run steps: ' + ', '.join(missing))

          env = os.environ.copy()
          for step_index, (name, script) in enumerate(scripts, 1):
              print(f'::group::{step_index}/{len(scripts)} {name}', flush=True)
              subprocess.run(
                  ['bash', '--noprofile', '--norc', '-e', '-o', 'pipefail', '-c', script],
                  check=True,
                  cwd=Path.cwd(),
                  env=env,
              )
              print('::endgroup::', flush=True)
          PY
