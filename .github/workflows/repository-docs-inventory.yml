name: Repository Docs Inventory

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  diagnose:
    name: Diagnose PlayerProfile stack integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out full authenticated repository
        uses: actions/checkout@v4
        with:
          ref: agent/player-profile-root-reconstruct-20260803-v6
          fetch-depth: 0
          persist-credentials: true

      - name: Diagnose exact recovery merge
        id: merge
        shell: bash
        env:
          PROFILE_V2_HEAD: 4390202fd1a3f5bbc5ec98b80322a5713ccda200
          RECOVERY_HEAD: f2250d279b27bdd65f030ff5c715db01f0e1094d
          OLD_PLATFORM_HEAD: 553f0e1afa62b6e88d9ff613ce8a233e242b1146
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/rework/class-spec-profile-v2:refs/remotes/origin/rework/class-spec-profile-v2" \
            "+refs/heads/profile/player-profile-platform:refs/remotes/origin/profile/player-profile-platform" \
            "+refs/heads/agent/player-profile-root-recovered-20260803-v4:refs/remotes/origin/agent/player-profile-root-recovered-20260803-v4"
          test "$(git rev-parse refs/remotes/origin/rework/class-spec-profile-v2)" = "$PROFILE_V2_HEAD"
          test "$(git rev-parse refs/remotes/origin/profile/player-profile-platform)" = "$OLD_PLATFORM_HEAD"
          test "$(git rev-parse refs/remotes/origin/agent/player-profile-root-recovered-20260803-v4)" = "$RECOVERY_HEAD"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --detach "$RECOVERY_HEAD"
          git switch -c local-player-profile-integration

          set +e
          git merge --no-ff --no-commit "$PROFILE_V2_HEAD"
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"

          conflicts="$(git diff --name-only --diff-filter=U | sort)"
          {
            echo "<!-- player-profile-conflict-report -->"
            echo "### PlayerProfile integration conflict report"
            echo
            echo "- Profile v2: \`$PROFILE_V2_HEAD\`"
            echo "- Recovery: \`$RECOVERY_HEAD\`"
            echo "- Current #78: \`$OLD_PLATFORM_HEAD\`"
            echo "- Merge status: \`$status\`"
            echo
            echo '```text'
            if [[ -n "$conflicts" ]]; then
              printf '%s\n' "$conflicts"
            else
              echo '(no unmerged paths)'
            fi
            echo '```'
          } > /tmp/player-profile-conflicts.md

          {
            echo "<!-- player-profile-conflict-hunks -->"
            echo "### PlayerProfile semantic conflict hunks"
            echo
            while IFS= read -r file; do
              [[ -n "$file" ]] || continue
              [[ "$file" = "docs/documentation-manifest.yml" ]] && continue
              echo "#### \`$file\`"
              echo '```diff'
              git diff --cc -- "$file" || true
              echo '```'
              echo
            done <<< "$conflicts"
          } | head -c 60000 > /tmp/player-profile-conflict-hunks.md

          tar -czf /tmp/player-profile-integration-checkout.tar.gz \
            --exclude='./.gradle' --exclude='./build' .

          echo "=== STATUS ==="
          git status --short
          echo "=== CONFLICTS ==="
          printf '%s\n' "$conflicts"
          echo "=== STAGED STAT ==="
          git diff --cached --stat || true

      - name: Publish exact conflict reports
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for report in /tmp/player-profile-conflicts.md /tmp/player-profile-conflict-hunks.md; do
            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments" \
              -f body="$(cat "$report")"
          done

      - name: Upload authenticated conflicted checkout
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-profile-conflicted-checkout-${{ github.run_id }}
          path: /tmp/player-profile-integration-checkout.tar.gz
          retention-days: 1
          if-no-files-found: error

      - name: Preserve diagnostic failure on conflicts
        if: steps.merge.outputs.status != '0'
        run: exit 1
