name: Repository Docs Inventory

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    name: Diagnose strict documentation coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out authenticated integration history
        uses: actions/checkout@v4
        with:
          ref: agent/player-profile-root-reconstruct-20260803-v6
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install workflow parser
        run: python -m pip install --disable-pip-version-check 'PyYAML>=6.0,<7.0'

      - name: Reproduce synchronization and expose coverage findings
        shell: bash
        env:
          SOURCE_WORKFLOW_COMMIT: 3d1c5d7b17e43f6221d0b23ba8375623125a0ffa
          DRIVER_COMMIT: a4bc10d010d7ccdb07971fec6d78c4d800b61d8f
          UPDATED_BASE_HEAD: 854248d530d417aca49906616f6e3ac458b231ca
          CLEAN_PROFILE_HEAD: b6f4492766675f718f73fd947bf92a388a3090fb
          OLD_PROFILE_HEAD: f25e7e600f418724dd2341e39387a0fa5c0625de
          TARGET_BRANCH: rework/class-spec-profile-v2
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import subprocess
          from collections import Counter
          from pathlib import Path

          import yaml

          workflow_text = subprocess.check_output(
              ["git", "show", f"{os.environ['SOURCE_WORKFLOW_COMMIT']}:.github/workflows/repository-docs-inventory.yml"],
              text=True,
              encoding="utf-8",
          )
          workflow = yaml.safe_load(workflow_text)
          source = next(
              step["run"] for step in workflow["jobs"]["integrate"]["steps"]
              if isinstance(step, dict)
              and step.get("name") == "Execute reviewed integration, manifest synchronization, gates and push"
          )
          loop = "for index, step in enumerate(run_steps, 1):\n"
          if source.count(loop) != 1:
              raise SystemExit(f"Publishing loop drift: {source.count(loop)}")
          source = source.replace(loop, "for index, step in enumerate(run_steps[:2], 1):\n", 1)
          subprocess.run(
              ["bash", "--noprofile", "--norc", "-e", "-o", "pipefail", "-c", source],
              check=True,
              env=os.environ.copy(),
          )

          output = Path("build/post-sync-coverage")
          subprocess.run([
              "python3", "scripts/generate_repository_inventory.py",
              "--root", ".", "--output", str(output), "--mode", "report",
          ], check=True)
          inventory = json.loads((output / "repository-inventory.json").read_text(encoding="utf-8"))
          coverage = inventory.get("documentation_coverage", {})
          findings = coverage.get("findings", [])
          blocking_in_strict = [item for item in findings if item.get("severity") in {"WARN", "FAIL"}]
          codes = Counter(str(item.get("code", "<no-code>")) for item in blocking_in_strict)
          print("STRICT_COVERAGE_FINDINGS=" + str(len(blocking_in_strict)))
          print("STRICT_COVERAGE_CODES=" + json.dumps(dict(sorted(codes.items())), ensure_ascii=False, sort_keys=True))
          for index, item in enumerate(blocking_in_strict, 1):
              print(f"STRICT_COVERAGE_{index:03d}=" + json.dumps(item, ensure_ascii=False, sort_keys=True, separators=(",", ":")))
          raise SystemExit(1 if blocking_in_strict else 0)
          PY
