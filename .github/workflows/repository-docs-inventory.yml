name: Repository Docs Inventory

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  VALIDATION_BRANCH: agent/player-profile-root-reconstruct-20260803-v6
  RECOVERY_BRANCH: agent/player-profile-root-recovered-20260803-v4
  EXPECTED_RECOVERY_HEAD: 258ea27e0ba96cbbae0d9f7e39c6b20ee444d480
  TARGET_BRANCH: rework/class-spec-profile-v2
  EXPECTED_TARGET_HEAD: f25e7e600f418724dd2341e39387a0fa5c0625de

jobs:
  inventory:
    name: PlayerProfile authority cleanup driver
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Check out authenticated validation history
        uses: actions/checkout@v4
        with:
          ref: ${{ env.VALIDATION_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Install workflow parser
        run: python -m pip install --disable-pip-version-check 'PyYAML>=6.0,<7.0'

      - name: Execute reviewed authority-cleanup run steps in order
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import os
          from pathlib import Path
          import subprocess
          import yaml

          workflow_path = Path('.github/workflows/player-profile-root-v6-suite-restore.yml')
          workflow = yaml.safe_load(workflow_path.read_text(encoding='utf-8'))
          jobs = workflow.get('jobs', {})
          cleanup = jobs.get('cleanup')
          if not isinstance(cleanup, dict):
              raise SystemExit('Registered PlayerProfile workflow has no cleanup job')
          steps = cleanup.get('steps', [])
          scripts = [step for step in steps if isinstance(step, dict) and 'run' in step]
          if len(scripts) < 8:
              raise SystemExit(f'Unexpected cleanup run-step count: {len(scripts)}')
          if 'Commit and fast-forward push after every gate succeeds' != scripts[-1].get('name'):
              raise SystemExit('Cleanup commit/push is not the final run step')

          env = os.environ.copy()
          for index, step in enumerate(scripts, 1):
              name = step.get('name', f'run-step-{index}')
              script = step['run']
              if not isinstance(script, str) or not script.strip():
                  raise SystemExit(f'Invalid run script for {name}')
              print(f'::group::{index}/{len(scripts)} {name}', flush=True)
              subprocess.run(
                  ['bash', '--noprofile', '--norc', '-e', '-o', 'pipefail', '-c', script],
                  check=True,
                  cwd=Path.cwd(),
                  env=env,
              )
              print('::endgroup::', flush=True)
          PY
