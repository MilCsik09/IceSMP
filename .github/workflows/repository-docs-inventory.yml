name: Repository Docs Inventory

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish validated Profile v2 code tree
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out authenticated integration history
        uses: actions/checkout@v4
        with:
          ref: agent/player-profile-root-reconstruct-20260803-v6
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Install workflow parser
        run: python -m pip install --disable-pip-version-check 'PyYAML>=6.0,<7.0'

      - name: Reuse the validated publisher without its workflow push
        shell: bash
        env:
          VALIDATED_PUBLISHER_COMMIT: eb85a7616a3432fdd8cf1095fc8c84d3f9af8b63
          SOURCE_WORKFLOW_COMMIT: 3d1c5d7b17e43f6221d0b23ba8375623125a0ffa
          DRIVER_COMMIT: a4bc10d010d7ccdb07971fec6d78c4d800b61d8f
          UPDATED_BASE_HEAD: 854248d530d417aca49906616f6e3ac458b231ca
          CLEAN_PROFILE_HEAD: b6f4492766675f718f73fd947bf92a388a3090fb
          OLD_PROFILE_HEAD: f25e7e600f418724dd2341e39387a0fa5c0625de
          TARGET_BRANCH: rework/class-spec-profile-v2
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import os
          import subprocess

          import yaml

          workflow_text = subprocess.check_output(
              [
                  "git", "show",
                  f"{os.environ['VALIDATED_PUBLISHER_COMMIT']}:.github/workflows/repository-docs-inventory.yml",
              ],
              text=True,
              encoding="utf-8",
          )
          workflow = yaml.safe_load(workflow_text)
          source = next(
              step["run"] for step in workflow["jobs"]["publish"]["steps"]
              if isinstance(step, dict)
              and step.get("name") == "Resolve, complete contracts, validate and publish"
          )
          original = '"for index, step in enumerate(run_steps[2:], 3):\\n"'
          replacement = '"for index, step in enumerate(run_steps[2:5], 3):\\n"'
          if source.count(original) != 1:
              raise SystemExit(f"Validated publisher slice drift: {source.count(original)}")
          source = source.replace(original, replacement, 1)
          subprocess.run(
              ["bash", "--noprofile", "--norc", "-e", "-o", "pipefail", "-c", source],
              check=True,
              env=os.environ.copy(),
          )
          PY

          test "$(git ls-remote origin refs/heads/rework/class-spec-1.21.11-compatibility | awk '{print $1}')" = "$UPDATED_BASE_HEAD"
          test "$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')" = "$OLD_PROFILE_HEAD"

          sha256sum .github/workflows/ci.yml .github/workflows/repository-docs-inventory.yml
          git checkout "$OLD_PROFILE_HEAD" -- \
            .github/workflows/ci.yml \
            .github/workflows/repository-docs-inventory.yml
          test -z "$(git diff --cached --name-only "$OLD_PROFILE_HEAD" -- .github/workflows)"
          git diff --cached --check

          tree_sha=$(git write-tree)
          code_commit=$(printf '%s\n\n%s\n' \
            "Merge current compatibility base into greenfield Profile v2" \
            "Publish the fully validated code and documentation tree; validated workflow updates follow as direct GitHub commits." \
            | git commit-tree "$tree_sha" -p "$OLD_PROFILE_HEAD" -p "$UPDATED_BASE_HEAD")
          git push origin "${code_commit}:refs/heads/${TARGET_BRANCH}"
          echo "PROFILE_V2_CODE_HEAD=${code_commit}"
