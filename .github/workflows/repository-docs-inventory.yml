name: Repository Docs Inventory

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base Git ref for the release inventory
        required: true
        default: 49cb32740629f3d91a08b753436f3e16d33a494d
        type: string
      head_ref:
        description: Head Git ref for the release inventory
        required: true
        default: master
        type: string
      strict_docs:
        description: Enforce 100% documentation coverage and zero review-required findings
        required: true
        default: false
        type: boolean
      generate_release_delta:
        description: Generate the full base/head release inventory
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  pull-requests: read

jobs:
  inventory:
    name: Repository and documentation inventory
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout tested head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head_ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install repository consistency dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML>=6.0,<7.0'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve base and head commits
        id: refs
        shell: bash
        env:
          DISPATCH_BASE: ${{ inputs.base_ref }}
          DISPATCH_HEAD: ${{ inputs.head_ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          resolve_ref() {
            local requested="$1"
            local candidate
            for candidate in "$requested" "origin/$requested"; do
              if git rev-parse --verify --quiet "${candidate}^{commit}" >/dev/null; then
                git rev-parse --verify "${candidate}^{commit}"
                return 0
              fi
            done
            echo "Unresolvable Git ref: $requested" >&2
            return 1
          }

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            BASE_SHA=$(resolve_ref "$DISPATCH_BASE")
            HEAD_SHA=$(resolve_ref "$DISPATCH_HEAD")
            RELEASE_HEAD_SHA="$HEAD_SHA"
          elif [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            HEAD_SHA=$(resolve_ref "$PR_HEAD_SHA")
            if [[ "$PR_HEAD_REF" == "docs/full-release-and-team-guide" ]]; then
              BASE_SHA=$(resolve_ref "49cb32740629f3d91a08b753436f3e16d33a494d")
              RELEASE_HEAD_SHA=$(resolve_ref "4643ab53586f0c1ee7352df16dcd477013e6fad4")
            else
              BASE_SHA=$(resolve_ref "$PR_BASE_SHA")
              RELEASE_HEAD_SHA="$HEAD_SHA"
            fi
          else
            HEAD_SHA=$(git rev-parse HEAD)
            RELEASE_HEAD_SHA="$HEAD_SHA"
            if [[ -n "${PUSH_BEFORE_SHA:-}" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
              BASE_SHA=$(resolve_ref "$PUSH_BEFORE_SHA")
            else
              BASE_SHA=$(git rev-parse HEAD^)
            fi
          fi

          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "release_head_sha=$RELEASE_HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "Base: $BASE_SHA"
          echo "Tested head: $HEAD_SHA"
          echo "Documented release head: $RELEASE_HEAD_SHA"

      - name: Check patch whitespace
        id: diff_check
        continue-on-error: true
        run: git diff --check "${{ steps.refs.outputs.base_sha }}...${{ steps.refs.outputs.head_sha }}"

      - name: Java 21 clean build
        id: gradle_build
        continue-on-error: true
        run: ./gradlew clean build --no-daemon --stacktrace

      - name: Repository consistency check
        id: consistency
        continue-on-error: true
        run: python3 scripts/check_consistency.py

      - name: Tooling self-tests
        id: tests
        continue-on-error: true
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Generate head repository inventory
        id: repository_inventory
        continue-on-error: true
        run: >-
          python3 scripts/generate_repository_inventory.py
          --root .
          --output build/repository-inventory
          --mode report

      - name: Check documentation coverage (report mode)
        id: report_coverage
        continue-on-error: true
        run: >-
          python3 scripts/check_documentation_coverage.py
          --root .
          --inventory build/repository-inventory/repository-inventory.json
          --output build/repository-inventory
          --mode report

      - name: Generate pull request or manual release delta
        id: release_inventory
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.generate_release_delta)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/generate_release_inventory.py
          --root .
          --base-ref "${{ steps.refs.outputs.base_sha }}"
          --head-ref "${{ steps.refs.outputs.release_head_sha }}"
          --output build/release-inventory

      - name: Package read-only source snapshot
        id: source_snapshot
        if: github.event_name == 'pull_request' && github.head_ref == 'docs/full-release-and-team-guide'
        shell: bash
        env:
          HEAD_SHA: ${{ steps.refs.outputs.head_sha }}
        run: |
          set -euo pipefail
          mkdir -p build/source-snapshot
          git ls-files | grep -v '^Other/' > build/source-snapshot/files.txt
          tar -czf "build/source-snapshot/IceSMP-source-${HEAD_SHA}.tar.gz" \
            -T build/source-snapshot/files.txt
          sha256sum "build/source-snapshot/IceSMP-source-${HEAD_SHA}.tar.gz" \
            > build/source-snapshot/SHA256SUMS

      - name: Check documentation coverage (strict mode)
        id: strict_coverage
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.strict_docs)
          || (github.event_name == 'pull_request' && github.head_ref == 'docs/full-release-and-team-guide')
        continue-on-error: true
        run: >-
          python3 scripts/check_documentation_coverage.py
          --root .
          --inventory build/repository-inventory/repository-inventory.json
          --output build/repository-inventory
          --mode strict

      - name: Check generated JSON
        id: json_integrity
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          files = sorted(Path("build").rglob("*.json"))
          if not files:
              raise SystemExit("No JSON artifact was generated")
          for path in files:
              with path.open(encoding="utf-8") as handle:
                  json.load(handle)
          print(f"Validated {len(files)} JSON files")
          PY

      - name: Write mobile-friendly Actions Summary
        if: always()
        shell: bash
        env:
          ARTIFACT_NAME: repository-docs-inventory-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          {
            if [[ -f build/repository-inventory/summary.md ]]; then
              cat build/repository-inventory/summary.md
            else
              echo "# Repository Documentation Inventory"
              echo
              echo "**Result: FAIL**"
              echo
              echo "Repository inventory summary was not generated."
            fi
            echo
            echo "## Compared refs"
            echo
            echo "- Base: \`${{ steps.refs.outputs.base_sha }}\`"
            echo "- Tested documentation head: \`${{ steps.refs.outputs.head_sha }}\`"
            echo "- Documented release head: \`${{ steps.refs.outputs.release_head_sha }}\`"
            echo "- Artifact: \`${ARTIFACT_NAME}\`"
            if [[ -f build/release-inventory/summary.md ]]; then
              echo
              cat build/release-inventory/summary.md
            fi
            echo
            echo "## Workflow checks"
            echo
            echo "| Check | Outcome |"
            echo "| --- | --- |"
            echo "| Patch whitespace | ${{ steps.diff_check.outcome }} |"
            echo "| Java 21 clean build | ${{ steps.gradle_build.outcome }} |"
            echo "| Consistency check | ${{ steps.consistency.outcome }} |"
            echo "| Tooling self-tests | ${{ steps.tests.outcome }} |"
            echo "| Repository inventory | ${{ steps.repository_inventory.outcome }} |"
            echo "| Coverage report | ${{ steps.report_coverage.outcome }} |"
            echo "| Release inventory | ${{ steps.release_inventory.outcome || 'skipped' }} |"
            echo "| Strict coverage | ${{ steps.strict_coverage.outcome || 'skipped' }} |"
            echo "| JSON integrity | ${{ steps.json_integrity.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload inventory artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-docs-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce blocking policy
        if: always()
        shell: bash
        env:
          DIFF_CHECK: ${{ steps.diff_check.outcome }}
          GRADLE_BUILD: ${{ steps.gradle_build.outcome }}
          CONSISTENCY: ${{ steps.consistency.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          INVENTORY: ${{ steps.repository_inventory.outcome }}
          REPORT: ${{ steps.report_coverage.outcome }}
          RELEASE: ${{ steps.release_inventory.outcome }}
          STRICT: ${{ steps.strict_coverage.outcome }}
          JSON: ${{ steps.json_integrity.outcome }}
        run: |
          set -euo pipefail
          failed=0
          for outcome in "$DIFF_CHECK" "$GRADLE_BUILD" "$CONSISTENCY" "$TESTS" "$INVENTORY" "$REPORT" "$JSON"; do
            [[ "$outcome" == "success" ]] || failed=1
          done
          if [[ -n "$RELEASE" && "$RELEASE" != "success" && "$RELEASE" != "skipped" ]]; then failed=1; fi
          if [[ -n "$STRICT" && "$STRICT" != "success" && "$STRICT" != "skipped" ]]; then failed=1; fi
          exit "$failed"
