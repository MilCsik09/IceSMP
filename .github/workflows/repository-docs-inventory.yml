name: Repository Docs Inventory

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  VALIDATION_BRANCH: agent/player-profile-root-reconstruct-20260803-v6
  RECOVERY_BRANCH: agent/player-profile-root-recovered-20260803-v4
  EXPECTED_RECOVERY_HEAD: 258ea27e0ba96cbbae0d9f7e39c6b20ee444d480
  TARGET_BRANCH: rework/class-spec-profile-v2
  EXPECTED_TARGET_HEAD: f25e7e600f418724dd2341e39387a0fa5c0625de
  REVIEWED_DRIVER_COMMIT: 475d2f75f3643aedeaec4c4b2fcbf4d1387ead7d

jobs:
  cleanup:
    name: PlayerProfile authority cleanup driver
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Check out authenticated validation history
        uses: actions/checkout@v4
        with:
          ref: ${{ env.VALIDATION_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install repository consistency dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML>=6.0,<7.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Execute reviewed cleanup with semantic documentation audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import os
          from pathlib import Path
          import re
          import subprocess
          import yaml

          reviewed = os.environ['REVIEWED_DRIVER_COMMIT']
          raw = subprocess.check_output(
              ['git', 'show', f'{reviewed}:.github/workflows/repository-docs-inventory.yml'],
              text=True,
          )
          workflow = yaml.safe_load(raw)
          steps = workflow['jobs']['cleanup']['steps']
          run_by_name = {
              step.get('name'): step.get('run')
              for step in steps
              if step.get('name') and step.get('run')
          }
          expected = [
              'Prepare exact recovery cleanup',
              'Java 21 clean build and all regressions',
              'Verify PlayerProfile regression markers',
              'Run PlayerProfile and repository gates',
              'Audit stale documentation claims',
              'Commit and fast-forward push after every gate succeeds',
          ]
          missing = [name for name in expected if not run_by_name.get(name)]
          if missing:
              raise SystemExit('Missing reviewed cleanup steps: ' + ', '.join(missing))

          def audit_documentation() -> None:
              pattern = re.compile(
                  r'\b(?:YamlClassProfileRepository|ClassProfileCodec|ClassProfileRepository)\b'
                  r'|\bClassProfile\s+v2\b|\bICS2\b',
                  re.IGNORECASE,
              )
              negation = re.compile(
                  r'\b(?:no|not|without|nincs|nem|nincs\s+külön|nem\s+létezik)\b',
                  re.IGNORECASE,
              )
              candidates = [Path('README.md'), Path('CLAUDE.md')]
              candidates.extend(sorted(Path('docs').rglob('*')))
              stale: list[str] = []
              for path in candidates:
                  if not path.is_file() or path.suffix.lower() not in {'.md', '.yml', '.yaml'}:
                      continue
                  for number, line in enumerate(path.read_text(encoding='utf-8', errors='replace').splitlines(), 1):
                      if pattern.search(line) and not negation.search(line):
                          stale.append(f'{path.as_posix()}:{number}:{line}')
              if stale:
                  print('\n'.join(stale))
                  raise SystemExit('Affirmative stale class-profile-only documentation remains.')
              print('Semantic stale class-profile documentation audit: PASS')

          env = os.environ.copy()
          for index, name in enumerate(expected, 1):
              print(f'::group::{index}/{len(expected)} {name}', flush=True)
              if name == 'Audit stale documentation claims':
                  audit_documentation()
              else:
                  subprocess.run(
                      ['bash', '--noprofile', '--norc', '-e', '-o', 'pipefail', '-c', run_by_name[name]],
                      check=True,
                      cwd=Path.cwd(),
                      env=env,
                  )
              print('::endgroup::', flush=True)
          PY
