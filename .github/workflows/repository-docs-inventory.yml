name: Repository Docs Inventory

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    name: Publish validated Profile v2 integration
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out authenticated integration history
        uses: actions/checkout@v4
        with:
          ref: agent/player-profile-root-reconstruct-20260803-v6
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Install workflow parser
        run: python -m pip install --disable-pip-version-check 'PyYAML>=6.0,<7.0'

      - name: Execute unchanged synchronized publishing workflow
        shell: bash
        env:
          SOURCE_WORKFLOW_COMMIT: 3d1c5d7b17e43f6221d0b23ba8375623125a0ffa
          DRIVER_COMMIT: a4bc10d010d7ccdb07971fec6d78c4d800b61d8f
          UPDATED_BASE_HEAD: 854248d530d417aca49906616f6e3ac458b231ca
          CLEAN_PROFILE_HEAD: b6f4492766675f718f73fd947bf92a388a3090fb
          OLD_PROFILE_HEAD: f25e7e600f418724dd2341e39387a0fa5c0625de
          TARGET_BRANCH: rework/class-spec-profile-v2
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import os
          import subprocess

          import yaml

          source_commit = os.environ["SOURCE_WORKFLOW_COMMIT"]
          workflow_text = subprocess.check_output(
              ["git", "show", f"{source_commit}:.github/workflows/repository-docs-inventory.yml"],
              text=True,
              encoding="utf-8",
          )
          workflow = yaml.safe_load(workflow_text)
          source_steps = workflow["jobs"]["integrate"]["steps"]
          source = next(
              step["run"] for step in source_steps
              if isinstance(step, dict)
              and step.get("name") == "Execute reviewed integration, manifest synchronization, gates and push"
          )
          subprocess.run(
              ["bash", "--noprofile", "--norc", "-e", "-o", "pipefail", "-c", source],
              check=True,
              env=os.environ.copy(),
          )
          PY
