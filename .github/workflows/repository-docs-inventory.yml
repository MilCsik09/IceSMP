name: Repository Docs Inventory

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Validate completed Profile v2 manifest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out authenticated integration history
        uses: actions/checkout@v4
        with:
          ref: agent/player-profile-root-reconstruct-20260803-v6
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install workflow parser
        run: python -m pip install --disable-pip-version-check 'PyYAML>=6.0,<7.0'

      - name: Complete manifest classifications and enforce strict inventory
        shell: bash
        env:
          SOURCE_WORKFLOW_COMMIT: 3d1c5d7b17e43f6221d0b23ba8375623125a0ffa
          DRIVER_COMMIT: a4bc10d010d7ccdb07971fec6d78c4d800b61d8f
          UPDATED_BASE_HEAD: 854248d530d417aca49906616f6e3ac458b231ca
          CLEAN_PROFILE_HEAD: b6f4492766675f718f73fd947bf92a388a3090fb
          OLD_PROFILE_HEAD: f25e7e600f418724dd2341e39387a0fa5c0625de
          TARGET_BRANCH: rework/class-spec-profile-v2
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          import yaml

          workflow_text = subprocess.check_output(
              ["git", "show", f"{os.environ['SOURCE_WORKFLOW_COMMIT']}:.github/workflows/repository-docs-inventory.yml"],
              text=True,
              encoding="utf-8",
          )
          workflow = yaml.safe_load(workflow_text)
          source_step = next(
              step["run"] for step in workflow["jobs"]["integrate"]["steps"]
              if isinstance(step, dict)
              and step.get("name") == "Execute reviewed integration, manifest synchronization, gates and push"
          )
          loop = "for index, step in enumerate(run_steps, 1):\n"
          if source_step.count(loop) != 1:
              raise SystemExit(f"Publishing loop drift: {source_step.count(loop)}")
          source_step = source_step.replace(loop, "for index, step in enumerate(run_steps[:2], 1):\n", 1)
          subprocess.run(
              ["bash", "--noprofile", "--norc", "-e", "-o", "pipefail", "-c", source_step],
              check=True,
              env=os.environ.copy(),
          )

          manifest_path = Path("docs/documentation-manifest.yml")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          components = manifest.setdefault("components", {})
          component_entries = {
              "component.hu.taliann.icesmp.crates.CrateSoundResolver": (
                  "feature.crate", "Configured crate sound resolution helper."
              ),
              "component.hu.taliann.icesmp.data.BlockCuboid": (
                  "feature.territory", "Immutable block-cuboid value object used by territory and claim geometry."
              ),
              "component.hu.taliann.icesmp.listeners.ResourcePackListener": (
                  "feature.resource-pack", "Player resource-pack lifecycle listener."
              ),
              "component.hu.taliann.icesmp.managers.HudSidebarLayout": (
                  "feature.hud", "Deterministic HUD sidebar layout model."
              ),
              "component.hu.taliann.icesmp.managers.ProfessionIngredientParser": (
                  "feature.profession", "Profession recipe ingredient parser."
              ),
              "component.hu.taliann.icesmp.moderation.ModerationPlayerPage": (
                  "feature.moderation", "Moderation player-page model."
              ),
              "component.hu.taliann.icesmp.utils.ConfigMaterialResolver": (
                  "feature.config", "Fail-closed material resolver for configuration values."
              ),
              "component.hu.taliann.icesmp.utils.TerritoryDestination": (
                  "feature.territory", "Validated territory destination value object."
              ),
          }
          for stable_id, (feature_id, description) in component_entries.items():
              if stable_id in components:
                  raise SystemExit(f"Component manifest entry unexpectedly already exists: {stable_id}")
              components[stable_id] = {
                  "feature": feature_id,
                  "classification": "INTERNAL_HELPER",
                  "description": description,
                  "docs": [],
              }

          config_sections = manifest.setdefault("config-sections", {})
          config_entries = {
              "config.plugins": ["docs/ADMIN_GUIDE.md"],
              "config.resource-pack": ["docs/RESOURCE_PACK_CMD.md"],
              "config.schema-version": ["docs/ARCHITECTURE.md"],
              "config.target": ["docs/ARCHITECTURE.md"],
              "config.verified-on": ["docs/ARCHITECTURE.md"],
          }
          for stable_id, docs in config_entries.items():
              if stable_id in config_sections:
                  raise SystemExit(f"Config-section manifest entry unexpectedly already exists: {stable_id}")
              config_sections[stable_id] = {"docs": docs}

          features = manifest.setdefault("features", {})
          feature_entries = {
              "feature.resource-pack": {
                  "description": "Resource-pack publication, delivery, acceptance and player lifecycle integration.",
                  "audience": ["PLAYER", "ADMIN"],
                  "docs": ["docs/RESOURCE_PACK_CMD.md"],
              },
              "feature.moderation": {
                  "description": "Native moderation commands, operator workflows and player-page administration.",
                  "audience": ["MODERATOR", "ADMIN"],
                  "docs": ["docs/ADMIN_GUIDE.md"],
              },
          }
          for feature_id, entry in feature_entries.items():
              if feature_id in features:
                  raise SystemExit(f"Feature manifest entry unexpectedly already exists: {feature_id}")
              features[feature_id] = entry

          for section_name in ("commands", "permissions", "config-sections", "components"):
              section = manifest.get(section_name)
              if not isinstance(section, dict):
                  continue
              policy = section.get("_contract")
              if isinstance(policy, dict) and "entries_sha256" in policy:
                  entries = {
                      key: value for key, value in section.items()
                      if not str(key).startswith("_") and isinstance(value, dict)
                  }
                  policy["entries_sha256"] = hashlib.sha256(
                      json.dumps(entries, ensure_ascii=False, sort_keys=True,
                                 separators=(",", ":")).encode("utf-8")
                  ).hexdigest()
          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
              newline="\n",
          )

          markers = {
              Path("docs/RESOURCE_PACK_CMD.md"): "<!-- icesmp-doc-id: feature.resource-pack -->",
              Path("docs/ADMIN_GUIDE.md"): "<!-- icesmp-doc-id: feature.moderation -->",
          }
          for doc_path, marker in markers.items():
              doc = doc_path.read_text(encoding="utf-8")
              if marker in doc:
                  raise SystemExit(f"Feature marker unexpectedly already exists: {marker}")
              lines = doc.splitlines()
              if not lines or not lines[0].startswith("#"):
                  raise SystemExit(f"Documentation heading marker drift: {doc_path}")
              lines.insert(1, "")
              lines.insert(2, marker)
              doc_path.write_text(
                  "\n".join(lines).rstrip("\n") + "\n",
                  encoding="utf-8",
                  newline="\n",
              )
          subprocess.run(
              [
                  "git", "add",
                  "docs/documentation-manifest.yml",
                  "docs/RESOURCE_PACK_CMD.md",
                  "docs/ADMIN_GUIDE.md",
              ],
              check=True,
          )
          print("Added 8 component classifications, 5 config sections and 2 feature contracts.")

          sys.path.insert(0, str(Path("scripts").resolve()))
          from repository_inventory.inventory import generate_inventory

          inventory = generate_inventory(Path(".").resolve(), "strict")
          failures = [item for item in inventory.get("findings", []) if item.get("severity") == "FAIL"]
          print(f"FINAL_STRICT_FINDINGS={len(failures)}")
          for item in failures:
              print(json.dumps(item, ensure_ascii=False, sort_keys=True, separators=(",", ":")))
          raise SystemExit(1 if failures else 0)
          PY
