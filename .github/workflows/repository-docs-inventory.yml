name: Repository Docs Inventory

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  stage:
    name: Stage validated workflow blobs
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out authenticated repository
        uses: actions/checkout@v4
        with:
          ref: agent/player-profile-root-reconstruct-20260803-v6
          fetch-depth: 0
          persist-credentials: true

      - name: Preserve integration driver
        run: cp .github/scripts/player_profile_integration_driver.py /tmp/player_profile_integration_driver.py

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reconstruct and stage exact validated workflow blobs
        shell: bash
        env:
          PROFILE_V2_HEAD: 4390202fd1a3f5bbc5ec98b80322a5713ccda200
          RECOVERY_HEAD: f2250d279b27bdd65f030ff5c715db01f0e1094d
          OLD_PLATFORM_HEAD: 553f0e1afa62b6e88d9ff613ce8a233e242b1146
          CURRENT_TARGET_HEAD: 6b2cc869605c8e15aac5a73c45ebbfb18ac8e70f
          TARGET_BRANCH: profile/player-profile-platform
        run: |
          set -euo pipefail
          python3 /tmp/player_profile_integration_driver.py
          cp .github/workflows/ci.yml /tmp/final-ci.yml
          cp .github/workflows/repository-docs-inventory.yml /tmp/final-repository-docs-inventory.yml
          printf '%s  %s\n' "$(sha256sum /tmp/final-ci.yml | awk '{print $1}')" ci.yml
          printf '%s  %s\n' "$(sha256sum /tmp/final-repository-docs-inventory.yml | awk '{print $1}')" repository-docs-inventory.yml

          git fetch --no-tags origin "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$CURRENT_TARGET_HEAD"
          git switch --detach "$CURRENT_TARGET_HEAD"
          git switch -c local-workflow-staging
          mkdir -p .github/workflow-staging
          cp /tmp/final-ci.yml .github/workflow-staging/ci.yml
          cp /tmp/final-repository-docs-inventory.yml .github/workflow-staging/repository-docs-inventory.yml
          git add .github/workflow-staging
          git diff --cached --check
          git commit -m "chore(ci): stage validated workflow blobs"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          remote="$(git ls-remote --heads origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote" = "$(git rev-parse HEAD)"
