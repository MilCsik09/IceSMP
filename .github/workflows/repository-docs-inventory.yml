name: Repository Docs Inventory

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  diagnose:
    name: Diagnose strict inventory review findings
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out authenticated repository
        uses: actions/checkout@v4
        with:
          ref: agent/player-profile-root-reconstruct-20260803-v6
          fetch-depth: 0
          persist-credentials: true

      - name: Preserve temporary integration drivers
        run: |
          cp .github/scripts/player_profile_integration_driver.py /tmp/player_profile_integration_driver.py
          cp .github/scripts/player_profile_candidate_hardening.py /tmp/player_profile_candidate_hardening.py

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check 'PyYAML>=6.0,<7.0'

      - name: Prepare exact hardened candidate
        id: prepare
        env:
          PROFILE_V2_HEAD: 4390202fd1a3f5bbc5ec98b80322a5713ccda200
          RECOVERY_HEAD: f2250d279b27bdd65f030ff5c715db01f0e1094d
          OLD_PLATFORM_HEAD: 553f0e1afa62b6e88d9ff613ce8a233e242b1146
        run: |
          python3 /tmp/player_profile_integration_driver.py
          python3 /tmp/player_profile_candidate_hardening.py

      - name: Generate exact inventory findings
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate_repository_inventory.py \
            --root . \
            --output build/repository-inventory \
            --mode report
          python3 - <<'PY' | tee /tmp/repository-inventory-findings.json
          import json
          from pathlib import Path

          inventory = json.loads(
              Path("build/repository-inventory/repository-inventory.json")
              .read_text(encoding="utf-8")
          )
          findings = [
              finding
              for finding in inventory.get("findings", [])
              if finding.get("severity") in {"FAIL", "REVIEW_REQUIRED"}
          ]
          print(json.dumps(findings, ensure_ascii=False, indent=2))
          PY

      - name: Publish exact inventory findings
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo '<!-- player-profile-inventory-findings -->'
            echo '### PlayerProfile strict inventory findings'
            echo
            echo '```json'
            cat /tmp/repository-inventory-findings.json
            echo '```'
          } | head -c 60000 > /tmp/player-profile-inventory-findings.md
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments" \
            -f body="$(cat /tmp/player-profile-inventory-findings.md)"

      - name: Preserve diagnostic failure while findings remain
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          findings = json.loads(
              Path('/tmp/repository-inventory-findings.json').read_text(encoding='utf-8')
          )
          raise SystemExit(1 if findings else 0)
          PY
