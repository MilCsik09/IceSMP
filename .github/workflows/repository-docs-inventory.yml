name: Repository Docs Inventory

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose PlayerProfile stack integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out full authenticated repository
        uses: actions/checkout@v4
        with:
          ref: agent/player-profile-root-reconstruct-20260803-v6
          fetch-depth: 0
          persist-credentials: false

      - name: Diagnose exact recovery merge
        shell: bash
        env:
          PROFILE_V2_HEAD: 4390202fd1a3f5bbc5ec98b80322a5713ccda200
          RECOVERY_HEAD: f2250d279b27bdd65f030ff5c715db01f0e1094d
          OLD_PLATFORM_HEAD: 553f0e1afa62b6e88d9ff613ce8a233e242b1146
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/rework/class-spec-profile-v2:refs/remotes/origin/rework/class-spec-profile-v2" \
            "+refs/heads/profile/player-profile-platform:refs/remotes/origin/profile/player-profile-platform" \
            "+refs/heads/agent/player-profile-root-recovered-20260803-v4:refs/remotes/origin/agent/player-profile-root-recovered-20260803-v4"
          test "$(git rev-parse refs/remotes/origin/rework/class-spec-profile-v2)" = "$PROFILE_V2_HEAD"
          test "$(git rev-parse refs/remotes/origin/profile/player-profile-platform)" = "$OLD_PLATFORM_HEAD"
          test "$(git rev-parse refs/remotes/origin/agent/player-profile-root-recovered-20260803-v4)" = "$RECOVERY_HEAD"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --detach "$RECOVERY_HEAD"
          git switch -c local-player-profile-integration

          set +e
          git merge --no-ff --no-commit "$PROFILE_V2_HEAD"
          status=$?
          set -e
          echo "MERGE_STATUS=$status"
          echo "=== STATUS ==="
          git status --short
          echo "=== CONFLICTS ==="
          git diff --name-only --diff-filter=U | sort
          echo "=== STAGED STAT ==="
          git diff --cached --stat || true
          echo "=== CONFLICT HUNKS ==="
          while IFS= read -r file; do
            [[ -n "$file" ]] || continue
            echo "--- $file ---"
            git diff --cc -- "$file" || true
          done < <(git diff --name-only --diff-filter=U | sort)
          exit "$status"
