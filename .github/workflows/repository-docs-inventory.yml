name: Repository Docs Inventory

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  TARGET_BRANCH: rework/class-spec-1.21.11-compatibility
  EXPECTED_TARGET_HEAD: 62ad99b74b7bb63420cb8e5e821f0321c5d84d48
  EXPECTED_MASTER_HEAD: 52cc62ac3b463679f28656f82cf1f7d17db486e8

jobs:
  integrate:
    name: Rebase class/spec compatibility onto current master
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out authenticated validation history
        uses: actions/checkout@v4
        with:
          ref: agent/player-profile-root-reconstruct-20260803-v6
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install repository consistency dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML>=6.0,<7.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Replay, validate and publish non-workflow merge
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}" \
            "+refs/heads/master:refs/remotes/origin/master"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$EXPECTED_TARGET_HEAD"
          test "$(git rev-parse refs/remotes/origin/master)" = "$EXPECTED_MASTER_HEAD"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch --detach "$EXPECTED_MASTER_HEAD"
          git switch -c local-class-spec-replay
          if ! git cherry-pick --no-commit "$EXPECTED_TARGET_HEAD"; then
            echo '=== Cherry-pick conflicts ===' >&2
            git status --short >&2
            git diff --name-only --diff-filter=U >&2
            for file in $(git diff --name-only --diff-filter=U); do
              echo "=== $file ===" >&2
              git diff --cc -- "$file" >&2 || true
            done
            exit 1
          fi
          git add -A
          git diff --cached --check
          git commit -m "replay(class-spec): apply compatibility base to current master"
          REPLAY_HEAD=$(git rev-parse HEAD)
          git diff --check "$EXPECTED_MASTER_HEAD...$REPLAY_HEAD"

          ./gradlew clean build --no-daemon --stacktrace | tee /tmp/class-spec-base-build.log
          grep -F "Class/spec compatibility regression suite passed." /tmp/class-spec-base-build.log
          python3 scripts/check_consistency.py
          python3 scripts/check_markdown_links.py --root .
          python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

          git switch --detach "$EXPECTED_TARGET_HEAD"
          git switch -c local-class-spec-final
          git merge --no-ff --no-commit -s ours "$REPLAY_HEAD"
          git read-tree --reset -u "$REPLAY_HEAD"
          git restore --source="$EXPECTED_TARGET_HEAD" --staged --worktree -- \
            .github/workflows/ci.yml \
            .github/workflows/repository-docs-inventory.yml
          git add -A
          git diff --cached --check
          if git diff --cached --name-only | grep -E '^\.github/workflows/'; then
            echo 'Workflow files leaked into app-pushed merge.' >&2
            exit 1
          fi
          test "$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')" = "$EXPECTED_TARGET_HEAD"
          test "$(git ls-remote origin refs/heads/master | awk '{print $1}')" = "$EXPECTED_MASTER_HEAD"
          git commit -m "merge(class-spec): integrate current master without history rewrite"
          NEW_HEAD=$(git rev-parse HEAD)
          test "$(git rev-parse HEAD^)" = "$EXPECTED_TARGET_HEAD"
          test "$(git rev-parse HEAD^2)" = "$REPLAY_HEAD"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          test "$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')" = "$NEW_HEAD"
          echo "CLASS_SPEC_BASE_NON_WORKFLOW_HEAD=$NEW_HEAD"
          echo "CLASS_SPEC_REPLAY_HEAD=$REPLAY_HEAD"
