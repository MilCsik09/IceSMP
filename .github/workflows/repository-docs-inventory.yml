name: Repository Docs Inventory

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  validate:
    name: Validate merge-ready PlayerProfile candidate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out authenticated repository
        uses: actions/checkout@v4
        with:
          ref: agent/player-profile-root-reconstruct-20260803-v6
          fetch-depth: 0
          persist-credentials: true

      - name: Preserve temporary integration drivers
        run: |
          cp .github/scripts/player_profile_integration_driver.py /tmp/player_profile_integration_driver.py
          cp .github/scripts/player_profile_candidate_hardening.py /tmp/player_profile_candidate_hardening.py

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check 'PyYAML>=6.0,<7.0'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare exact hardened candidate
        id: prepare
        env:
          PROFILE_V2_HEAD: 4390202fd1a3f5bbc5ec98b80322a5713ccda200
          RECOVERY_HEAD: f2250d279b27bdd65f030ff5c715db01f0e1094d
          OLD_PLATFORM_HEAD: 553f0e1afa62b6e88d9ff613ce8a233e242b1146
        run: |
          python3 /tmp/player_profile_integration_driver.py
          python3 /tmp/player_profile_candidate_hardening.py
          git status --short
          git diff --check 4390202fd1a3f5bbc5ec98b80322a5713ccda200...HEAD

      - name: Validate resource-pack and deployment snapshots
        id: assets
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_resource_pack.py 2>&1 | tee /tmp/assets.log
          python3 scripts/resource_pack.py build --source resource-pack --output build/resource-pack/validation-pack.zip 2>&1 | tee -a /tmp/assets.log
          python3 scripts/validate_fancynpcs_snapshot.py 2>&1 | tee -a /tmp/assets.log

      - name: Java 21 clean build and all regressions
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean build --console=plain --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-build.log

      - name: Verify every stacked regression marker
        id: markers
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          markers=(
            "MOTD regression suite passed."
            "Moderation regression suite passed."
            "Moderation review regression suite passed."
            "PersistentStoreCoordinator regression tests passed."
            "DEV-item reward regression suite passed."
            "AFK regression suite passed."
            "HUD regression suite passed."
            "Pause-menu dialog regression suite passed."
            "Faction passive regression suite passed."
            "Faction passive hardening regression suite passed."
            "Faction tax debt regression suite passed."
            "Relic refresh regression suite passed."
            "Relic refresh pipeline regression suite passed."
            "Lifecycle shutdown regression suite passed."
            "Quest NPC validation regression suite passed."
            "Resource pack regression suite passed."
            "Class/spec compatibility regression suite passed."
            "ClassSpecSection v2 domain regression tests passed."
            "Class/spec application regression suite passed."
            "ClassSpecSection lifecycle regression suite passed."
            "PlayerProfile domain regression suite passed."
            "PlayerProfile YAML regression suite passed."
            "PlayerProfile transaction regression suite passed."
            "PlayerProfile API regression suite passed."
            "Respec transaction regression suite passed."
            "Spell grant ledger regression suite passed."
          )
          for marker in "${markers[@]}"; do
            grep -F "$marker" /tmp/gradle-build.log
          done

      - name: PlayerProfile authority and API guards
        id: profile_guards
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_player_profile_authority.py --root . --write-report build/player-profile-authority.json 2>&1 | tee /tmp/profile-guards.log
          python3 scripts/check_player_profile_openapi.py 2>&1 | tee -a /tmp/profile-guards.log
          python3 scripts/test_player_profile_authority.py 2>&1 | tee -a /tmp/profile-guards.log

      - name: Repository consistency
        id: consistency
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_consistency.py 2>&1 | tee /tmp/consistency.log

      - name: Markdown links
        id: markdown
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_markdown_links.py --root . 2>&1 | tee /tmp/markdown.log

      - name: Tooling self-tests
        id: tooling
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v 2>&1 | tee /tmp/tooling.log

      - name: Strict repository and documentation inventory
        id: inventory
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate_repository_inventory.py \
            --root . \
            --output build/repository-inventory \
            --mode strict 2>&1 | tee /tmp/inventory.log
          python3 scripts/check_documentation_coverage.py \
            --root . \
            --inventory build/repository-inventory/repository-inventory.json \
            --output build/repository-inventory \
            --mode strict 2>&1 | tee -a /tmp/inventory.log
          python3 - <<'PY' | tee -a /tmp/inventory.log
          import json
          from pathlib import Path

          inventory = json.loads(
              Path('build/repository-inventory/repository-inventory.json')
              .read_text(encoding='utf-8')
          )
          unresolved = [
              finding for finding in inventory.get('findings', [])
              if finding.get('severity') in {'FAIL', 'REVIEW_REQUIRED'}
          ]
          print(json.dumps(unresolved, ensure_ascii=False, indent=2))
          raise SystemExit(1 if unresolved else 0)
          PY

      - name: Publish validation summary
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ steps.prepare.outputs.candidate_sha }}
          ASSETS: ${{ steps.assets.outcome }}
          BUILD: ${{ steps.build.outcome }}
          MARKERS: ${{ steps.markers.outcome }}
          PROFILE_GUARDS: ${{ steps.profile_guards.outcome }}
          CONSISTENCY: ${{ steps.consistency.outcome }}
          MARKDOWN: ${{ steps.markdown.outcome }}
          TOOLING: ${{ steps.tooling.outcome }}
          INVENTORY: ${{ steps.inventory.outcome }}
        run: |
          set -euo pipefail
          cat > /tmp/player-profile-full-validation.md <<EOF
          <!-- player-profile-full-validation -->
          ### PlayerProfile full merge-readiness validation

          - Candidate: \`$CANDIDATE\`
          - Exact base: \`4390202fd1a3f5bbc5ec98b80322a5713ccda200\`
          - Exact recovery: \`f2250d279b27bdd65f030ff5c715db01f0e1094d\`
          - Exact old #78 head: \`553f0e1afa62b6e88d9ff613ce8a233e242b1146\`

          | Gate | Outcome |
          | --- | --- |
          | Resource/deployment snapshots | $ASSETS |
          | Java 21 clean build | $BUILD |
          | 26 regression markers | $MARKERS |
          | PlayerProfile authority/OpenAPI | $PROFILE_GUARDS |
          | Repository consistency | $CONSISTENCY |
          | Markdown links | $MARKDOWN |
          | Tooling self-tests | $TOOLING |
          | Strict repository/documentation inventory | $INVENTORY |
          EOF
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments" \
            -f body="$(cat /tmp/player-profile-full-validation.md)"

      - name: Enforce every merge-readiness gate
        if: always()
        shell: bash
        env:
          ASSETS: ${{ steps.assets.outcome }}
          BUILD: ${{ steps.build.outcome }}
          MARKERS: ${{ steps.markers.outcome }}
          PROFILE_GUARDS: ${{ steps.profile_guards.outcome }}
          CONSISTENCY: ${{ steps.consistency.outcome }}
          MARKDOWN: ${{ steps.markdown.outcome }}
          TOOLING: ${{ steps.tooling.outcome }}
          INVENTORY: ${{ steps.inventory.outcome }}
        run: |
          set -euo pipefail
          for outcome in \
            "$ASSETS" "$BUILD" "$MARKERS" "$PROFILE_GUARDS" \
            "$CONSISTENCY" "$MARKDOWN" "$TOOLING" "$INVENTORY"; do
            test "$outcome" = success
          done
