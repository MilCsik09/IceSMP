name: Repository Docs Inventory

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    name: Retry exact Profile v2 integration
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out authenticated integration history
        uses: actions/checkout@v4
        with:
          ref: agent/player-profile-root-reconstruct-20260803-v6
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Install workflow parser
        run: python -m pip install --disable-pip-version-check 'PyYAML>=6.0,<7.0'

      - name: Execute reviewed integration steps with EOF normalization
        shell: bash
        env:
          DRIVER_COMMIT: a4bc10d010d7ccdb07971fec6d78c4d800b61d8f
          UPDATED_BASE_HEAD: 854248d530d417aca49906616f6e3ac458b231ca
          CLEAN_PROFILE_HEAD: b6f4492766675f718f73fd947bf92a388a3090fb
          OLD_PROFILE_HEAD: f25e7e600f418724dd2341e39387a0fa5c0625de
          TARGET_BRANCH: rework/class-spec-profile-v2
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import os
          import subprocess
          from pathlib import Path

          import yaml

          driver_commit = os.environ["DRIVER_COMMIT"]
          workflow_text = subprocess.check_output(
              ["git", "show", f"{driver_commit}:.github/workflows/repository-docs-inventory.yml"],
              text=True,
              encoding="utf-8",
          )
          workflow = yaml.safe_load(workflow_text)
          steps = workflow["jobs"]["integrate"]["steps"]
          run_steps = [step for step in steps if isinstance(step, dict) and isinstance(step.get("run"), str)]
          expected_names = [
              "Install repository tooling dependencies",
              "Resolve the exact stacked integration",
              "Java 21 clean build and all regressions",
              "Verify base and Profile v2 regression markers",
              "Run repository gates and inventory",
              "Commit and fast-forward push after every gate succeeds",
          ]
          actual_names = [step.get("name") for step in run_steps]
          if actual_names != expected_names:
              raise SystemExit(f"Reviewed integration step drift: {actual_names}")

          resolution = run_steps[1]["run"]
          marker = "          git add -- \\\n"
          if resolution.count(marker) != 1:
              raise SystemExit("Unexpected resolution staging marker count")
          normalizer = """          python3 - <<'EOF_NORMALIZE'
          from pathlib import Path
          for raw in (
              'src/main/java/hu/taliann/icesmp/commands/faction/FactionJoinSubcommand.java',
              'src/main/java/hu/taliann/icesmp/commands/faction/FactionLeaveSubcommand.java',
          ):
              path = Path(raw)
              path.write_text(path.read_text(encoding='utf-8').rstrip('\\n') + '\\n',
                              encoding='utf-8', newline='\\n')
          EOF_NORMALIZE

"""
          run_steps[1]["run"] = resolution.replace(marker, normalizer + marker, 1)

          env = os.environ.copy()
          for index, step in enumerate(run_steps, 1):
              name = step["name"]
              print(f"::group::{index}/{len(run_steps)} {name}", flush=True)
              subprocess.run(
                  ["bash", "--noprofile", "--norc", "-e", "-o", "pipefail", "-c", step["run"]],
                  check=True,
                  cwd=Path.cwd(),
                  env=env,
              )
              print("::endgroup::", flush=True)
          PY
