name: Repository Docs Inventory

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    name: Diagnose remaining Profile v2 inventory drift
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out authenticated integration history
        uses: actions/checkout@v4
        with:
          ref: agent/player-profile-root-reconstruct-20260803-v6
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Install workflow parser
        run: python -m pip install --disable-pip-version-check 'PyYAML>=6.0,<7.0'

      - name: Reproduce synchronized tree and print every remaining FAIL
        shell: bash
        env:
          SOURCE_WORKFLOW_COMMIT: 3d1c5d7b17e43f6221d0b23ba8375623125a0ffa
          UPDATED_BASE_HEAD: 854248d530d417aca49906616f6e3ac458b231ca
          CLEAN_PROFILE_HEAD: b6f4492766675f718f73fd947bf92a388a3090fb
          OLD_PROFILE_HEAD: f25e7e600f418724dd2341e39387a0fa5c0625de
          TARGET_BRANCH: rework/class-spec-profile-v2
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import os
          import subprocess

          import yaml

          source_commit = os.environ["SOURCE_WORKFLOW_COMMIT"]
          workflow_text = subprocess.check_output(
              ["git", "show", f"{source_commit}:.github/workflows/repository-docs-inventory.yml"],
              text=True,
              encoding="utf-8",
          )
          workflow = yaml.safe_load(workflow_text)
          source_steps = workflow["jobs"]["integrate"]["steps"]
          source = next(
              step["run"] for step in source_steps
              if isinstance(step, dict)
              and step.get("name") == "Execute reviewed integration, manifest synchronization, gates and push"
          )

          insertion_marker = "          env = os.environ.copy()\n"
          if source.count(insertion_marker) != 1:
              raise SystemExit(f"Source execution marker drift: {source.count(insertion_marker)}")
          iteration_marker = "          for index, step in enumerate(run_steps, 1):\n"
          if source.count(iteration_marker) != 1:
              raise SystemExit(f"Source iteration marker drift: {source.count(iteration_marker)}")

          diagnostic_lines = [
              "          gate = run_steps[4]['run']",
              "          strict_marker = '--root . --output build/repository-inventory --mode strict'",
              "          if gate.count(strict_marker) != 1:",
              "              raise SystemExit(f'Final strict marker drift: {gate.count(strict_marker)}')",
              "          gate = gate.replace(",
              "              strict_marker,",
              "              '--root . --output build/repository-inventory --mode report',",
              "              1,",
              "          )",
              "          gate += \"\"\"",
              "python3 - <<'REMAINING_FINDINGS'",
              "import json",
              "from collections import Counter",
              "from pathlib import Path",
              "inventory = json.loads(Path('build/repository-inventory/repository-inventory.json').read_text(encoding='utf-8'))",
              "findings = [item for item in inventory.get('findings', []) if item.get('severity') == 'FAIL']",
              "codes = Counter(str(item.get('code', '<no-code>')) for item in findings)",
              "print('REMAINING_BLOCKING_FINDINGS=' + str(len(findings)))",
              "print('REMAINING_BLOCKING_CODES=' + json.dumps(dict(sorted(codes.items())), ensure_ascii=False, sort_keys=True))",
              "for index, item in enumerate(findings, 1):",
              "    print(f'REMAINING_FAIL_{index:03d}=' + json.dumps(item, ensure_ascii=False, sort_keys=True, separators=(',', ':')))",
              "raise SystemExit(1 if findings else 0)",
              "REMAINING_FINDINGS",
              "\"\"\"",
              "          run_steps[4]['run'] = gate",
              "",
          ]
          source = source.replace(insertion_marker, "\n".join(diagnostic_lines) + insertion_marker, 1)
          source = source.replace(
              iteration_marker,
              "          for index, step in enumerate(run_steps[:5], 1):\n",
              1,
          )
          subprocess.run(
              ["bash", "--noprofile", "--norc", "-e", "-o", "pipefail", "-c", source],
              check=True,
              env=os.environ.copy(),
          )
          PY
