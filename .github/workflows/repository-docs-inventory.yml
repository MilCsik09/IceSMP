name: Repository Docs Inventory

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  UPDATED_BASE_HEAD: 854248d530d417aca49906616f6e3ac458b231ca
  CLEAN_PROFILE_HEAD: b6f4492766675f718f73fd947bf92a388a3090fb
  OLD_PROFILE_HEAD: f25e7e600f418724dd2341e39387a0fa5c0625de
  TARGET_BRANCH: rework/class-spec-profile-v2

jobs:
  diagnose:
    name: Diagnose clean Profile v2 integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out authenticated history
        uses: actions/checkout@v4
        with:
          ref: agent/player-profile-root-reconstruct-20260803-v6
          fetch-depth: 0
          persist-credentials: true

      - name: Diagnose exact merge
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/rework/class-spec-1.21.11-compatibility:refs/remotes/origin/rework/class-spec-1.21.11-compatibility" \
            "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/rework/class-spec-1.21.11-compatibility)" = "$UPDATED_BASE_HEAD"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$OLD_PROFILE_HEAD"
          test "$(git merge-base "$CLEAN_PROFILE_HEAD" "$OLD_PROFILE_HEAD")" = "$CLEAN_PROFILE_HEAD"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --detach "$CLEAN_PROFILE_HEAD"
          git switch -c local-profile-v2-integration
          if git merge --no-ff --no-commit "$UPDATED_BASE_HEAD"; then
            echo 'PROFILE_V2_INTEGRATION_CONFLICTS=none'
            git diff --cached --check
            exit 0
          fi

          echo '=== Profile v2 integration conflicts ===' >&2
          git status --short >&2
          CONFLICTS=$(git diff --name-only --diff-filter=U)
          printf '%s\n' "$CONFLICTS" >&2
          for file in $CONFLICTS; do
            echo "=== $file ===" >&2
            git diff --cc -- "$file" >&2 || true
          done
          exit 1
