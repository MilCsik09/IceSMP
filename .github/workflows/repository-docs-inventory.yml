name: Repository Docs Inventory

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  publish:
    name: Publish validated PlayerProfile code tree
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Check out authenticated repository
        uses: actions/checkout@v4
        with:
          ref: agent/player-profile-root-reconstruct-20260803-v6
          fetch-depth: 0
          persist-credentials: true

      - name: Preserve temporary integration drivers
        run: |
          cp .github/scripts/player_profile_integration_driver.py /tmp/player_profile_integration_driver.py
          cp .github/scripts/player_profile_candidate_hardening.py /tmp/player_profile_candidate_hardening.py
          cp .github/scripts/player_profile_code_only_publisher.sh /tmp/player_profile_code_only_publisher.sh
          chmod +x /tmp/player_profile_code_only_publisher.sh

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check 'PyYAML>=6.0,<7.0'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Rebuild, validate and publish code-only head
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_V2_HEAD: 4390202fd1a3f5bbc5ec98b80322a5713ccda200
          RECOVERY_HEAD: f2250d279b27bdd65f030ff5c715db01f0e1094d
          OLD_PLATFORM_HEAD: 553f0e1afa62b6e88d9ff613ce8a233e242b1146
          TARGET_BRANCH: profile/player-profile-platform
          REPORT_PR: '85'
        run: /tmp/player_profile_code_only_publisher.sh

      - name: Report workflow-safe publication result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.publish.outcome }}
          CODE_HEAD: ${{ steps.publish.outputs.code_head }}
          VALIDATED_CANDIDATE: ${{ steps.publish.outputs.validated_candidate }}
        run: |
          set -euo pipefail
          cat > /tmp/player-profile-publisher-result.md <<EOF
          <!-- player-profile-code-publisher-result -->
          ### PlayerProfile code publisher result

          - Outcome: **$OUTCOME**
          - Validated candidate: \`${VALIDATED_CANDIDATE:-not-created}\`
          - Published code head: \`${CODE_HEAD:-not-published}\`
          - Merge performed: **no**
          - Force push used: **no**
          EOF
          gh api --method POST -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/issues/85/comments" \
            -f body="$(cat /tmp/player-profile-publisher-result.md)"
