name: Verify PR 28 v2

on:
  pull_request:
    branches:
      - fix/dev-item-state-validation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Full Gradle build and JUnit tests
        id: gradle
        shell: bash
        run: |
          set +e
          ./gradlew clean build --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr28-v2-gradle-log
          path: /tmp/gradle.log
          if-no-files-found: error
          retention-days: 1

      - name: Require successful Gradle build
        run: test "${{ steps.gradle.outputs.status }}" -eq 0

      - name: Consistency delta against branch baseline
        shell: bash
        run: |
          set +e
          python3 scripts/check_consistency.py | tee /tmp/consistency.log
          status=${PIPESTATUS[0]}
          set -e
          grep -F "Összegzés: 5 FAIL, 0 WARN" /tmp/consistency.log
          test "$status" -eq 1
