name: IceSMP crate merge publisher

on:
  pull_request:
    branches:
      - claude/projekt-audit-u0hkcz

permissions:
  contents: write

jobs:
  publish:
    name: Rebuild, verify and publish crate branch
    if: github.head_ref == 'agent/crate-merge-publisher'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout publisher transport
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Rebuild exact semantic merge and publish with lease
        shell: bash
        run: |
          set -euo pipefail
          TARGET_BRANCH=claude/projekt-audit-u0hkcz
          CRATE_BRANCH=feature/native-crates-completion
          BASE_SHA=f4e82263d35c645a053eccac09a3ad254a36ed90
          TARGET_SHA=2dede0eee5513a9102be6d22140d572aa7ee1513
          CRATE_SHA=2262705680a98ac25c7df2dc880ca20af9583b47
          SCRIPT_B64_SHA=129bc98905fadc34409585f307e140639f211496f46f2b15ff455c6618614037
          SCRIPT_SHA=e231f9a5337b53cf078e5529353737bdb93b56aab1e0b61c1c012d4bc9bba370
          EXPECTED_CODE_TREE=b1ec9c7af9d0eea5e25d735b8baa5ab47494917d
          EXPECTED_FINAL_TREE=6b40a3723b5ce9988d9ac8381dce66804e601157

          remote_target=$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')
          remote_crate=$(git ls-remote origin "refs/heads/$CRATE_BRANCH" | awk '{print $1}')
          printf 'remote-target=%s\nremote-crate=%s\n' "$remote_target" "$remote_crate"
          test "$remote_target" = "$TARGET_SHA"
          test "$remote_crate" = "$CRATE_SHA"

          echo "$SCRIPT_B64_SHA  .review/rebuild-crate.py.gz.b64" | sha256sum --check --strict
          base64 --decode .review/rebuild-crate.py.gz.b64 > /tmp/rebuild-crate.py.gz
          gzip --decompress --stdout /tmp/rebuild-crate.py.gz > /tmp/rebuild-crate.py
          echo "$SCRIPT_SHA  /tmp/rebuild-crate.py" | sha256sum --check --strict

          git fetch origin \
            "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH" \
            "+refs/heads/$CRATE_BRANCH:refs/remotes/origin/$CRATE_BRANCH"
          git cat-file -e "$BASE_SHA^{commit}"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$TARGET_SHA"
          test "$(git rev-parse origin/$CRATE_BRANCH)" = "$CRATE_SHA"

          git config user.name "IceSMP review automation"
          git config user.email "noreply@github.com"
          git checkout -B crate-reviewed "$TARGET_SHA"
          CRATE_BASE="$BASE_SHA" CRATE_TARGET="$TARGET_SHA" CRATE_HEAD="$CRATE_SHA" \
            python3 /tmp/rebuild-crate.py

          git add .github/workflows/ci.yml build.gradle.kts src/main src/regression
          git commit -m "fix(crates): reconcile reviewed settlement with current target"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_CODE_TREE"
          git add CHANGELOG.md CLAUDE.md PLAYTEST.md docs
          git commit -m "docs(crates): align review and runtime rollout boundary"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_FINAL_TREE"
          test "$(git merge-base HEAD "$TARGET_SHA")" = "$TARGET_SHA"
          test "$(git rev-list --count "$TARGET_SHA..HEAD")" = "2"

          ./gradlew crateRegressionTest --no-daemon --stacktrace
          ./gradlew clean build --no-daemon --stacktrace
          python3 scripts/check_consistency.py
          git diff --check "$TARGET_SHA...HEAD"

          remote_target=$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')
          remote_crate=$(git ls-remote origin "refs/heads/$CRATE_BRANCH" | awk '{print $1}')
          test "$remote_target" = "$TARGET_SHA"
          test "$remote_crate" = "$CRATE_SHA"
          git push origin "HEAD:refs/heads/$CRATE_BRANCH" \
            --force-with-lease="refs/heads/$CRATE_BRANCH:$CRATE_SHA"
