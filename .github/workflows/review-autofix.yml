name: PR 76 review autofix

on:
  push:
    branches:
      - balance/faction-passives-v2
    paths:
      - .github/workflows/review-autofix.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact review head
        uses: actions/checkout@v4
        with:
          ref: balance/faction-passives-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply evidence-based review patch
        run: python3 scripts/review_autofix.py

      - name: Remove one-shot patch machinery
        run: rm scripts/review_autofix.py .github/workflows/review-autofix.yml

      - name: Verify complete source and documentation gates
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          ./gradlew clean build --console=plain --no-daemon --stacktrace
          ./gradlew check --console=plain --no-daemon --stacktrace
          ./gradlew factionPassiveRegressionTest factionTreasuryRegressionTest --console=plain --no-daemon --stacktrace
          python3 scripts/check_consistency.py

      - name: Commit verified fixes to the existing draft branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(review): harden faction passive runtime and persistence"
          git push origin HEAD:balance/faction-passives-v2
