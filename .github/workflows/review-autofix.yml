name: PR 76 review autofix

on:
  pull_request:
    branches:
      - fix/pet-lore-corruption-spectator-menu
    paths:
      - .github/workflows/review-autofix.yml

permissions:
  contents: write

concurrency:
  group: pr-76-review-autofix
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.ref == 'balance/faction-passives-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact review head
        uses: actions/checkout@v4
        with:
          repository: MilCsik09/IceSMP
          ref: balance/faction-passives-v2
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install consistency dependencies
        run: python3 -m pip install --disable-pip-version-check pyyaml

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply evidence-based review patch
        run: python3 scripts/review_autofix.py

      - name: Repair generated literals and architecture inventory
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          treasury = Path("src/main/java/hu/taliann/icesmp/managers/FactionTreasuryManager.java")
          lines = treasury.read_text(encoding="utf-8").splitlines()
          for index, line in enumerate(lines):
              if "expected a finite non-negative number" in line:
                  lines[index] = '                + "); expected a finite non-negative number — this branch is disabled at 0.0, "'
              elif "expected a non-negative integer" in line:
                  lines[index] = '                + "); expected a non-negative integer — this branch is disabled at 0, "'
              elif "not silently clamped" in line:
                  lines[index] = '                + "not silently clamped.");'
          treasury.write_text("\n".join(lines) + "\n", encoding="utf-8")

          architecture = Path("docs/ARCHITECTURE.md")
          text = architecture.read_text(encoding="utf-8")
          old = "| `factions/` | 8 | Explicit tagsági értékobjektum, immutable passzív-config snapshot, tiszta damage/exhaustion/target policy, központi combat-marker katalógus, mobkontextus-resolver, mulandó retaliation state és frakcióeredetű adósság-ledger. |"
          new = "| `factions/` | 9 | Explicit tagsági értékobjektum és rollbackelhető membership-mutation, immutable passzív-config snapshot, tiszta damage/exhaustion/target policy, központi combat-marker katalógus, mobkontextus-resolver, mulandó retaliation state és frakcióeredetű adósság-ledger. |"
          if text.count(old) != 1:
              raise SystemExit("Unexpected factions/ architecture row")
          architecture.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Remove one-shot patch machinery
        run: rm scripts/review_autofix.py .github/workflows/review-autofix.yml

      - name: Verify complete source and documentation gates
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          ./gradlew clean build --console=plain --no-daemon --stacktrace
          ./gradlew check --console=plain --no-daemon --stacktrace
          ./gradlew factionPassiveRegressionTest factionTreasuryRegressionTest --console=plain --no-daemon --stacktrace
          python3 scripts/check_consistency.py

      - name: Commit verified fixes to the existing draft branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(review): harden faction passive runtime and persistence"
          git push origin HEAD:balance/faction-passives-v2
