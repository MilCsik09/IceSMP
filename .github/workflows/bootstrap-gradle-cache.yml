name: Bootstrap Gradle offline cache

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve and verify exact baseline dependencies
        run: ./gradlew clean build --no-daemon --stacktrace

      - name: Package Gradle wrapper and dependency caches
        shell: bash
        run: |
          set -euo pipefail
          test -d "$HOME/.gradle/caches"
          test -d "$HOME/.gradle/wrapper"
          tar -C "$HOME" \
            --exclude='.gradle/daemon' \
            --exclude='.gradle/notifications' \
            -czf /tmp/icesmp-gradle-home.tar.gz \
            .gradle/caches \
            .gradle/wrapper
          test -s /tmp/icesmp-gradle-home.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: icesmp-gradle-offline-f9e1db97
          path: /tmp/icesmp-gradle-home.tar.gz
          if-no-files-found: error
          retention-days: 1
