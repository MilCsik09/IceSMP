{
  "openapi": "3.1.0",
  "info": {
    "title": "IceSMP PlayerProfile Read API",
    "version": "1.0.0",
    "description": "Read-only PlayerProfile API. Public endpoints respect profile visibility; private endpoints require bearer scope."
  },
  "servers": [
    {
      "url": "http://127.0.0.1:8765"
    }
  ],
  "paths": {
    "/api/v1/health": {
      "get": {
        "summary": "Health",
        "responses": {
          "200": {
            "description": "Healthy"
          }
        }
      }
    },
    "/api/v1/players/{uuid}": {
      "get": {
        "summary": "Authenticated self/admin profile",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "parameters": [
          {
            "name": "uuid",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Profile"
          },
          "403": {
            "description": "Forbidden"
          },
          "404": {
            "description": "Not found"
          },
          "409": {
            "description": "Quarantined"
          }
        }
      }
    },
    "/api/v1/players/{uuid}/public": {
      "get": {
        "summary": "Public profile",
        "parameters": [
          {
            "name": "uuid",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Public DTO"
          },
          "403": {
            "description": "Hidden"
          },
          "404": {
            "description": "Not found"
          },
          "304": {
            "description": "ETag unchanged"
          }
        }
      }
    },
    "/api/v1/players/{uuid}/sections/{section}": {
      "get": {
        "summary": "Read a section",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "parameters": [
          {
            "name": "uuid",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "section",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Section snapshot"
          },
          "403": {
            "description": "Insufficient scope"
          },
          "404": {
            "description": "Not found"
          },
          "409": {
            "description": "Section quarantined"
          }
        }
      }
    },
    "/api/v1/players/by-name/{name}": {
      "get": {
        "summary": "Resolve a last known name to a self DTO (SELF: only the caller's own profile; ADMIN: any profile)",
        "description": "Authentication is resolved before any storage read. A SELF bearer token loads only the token-bound profile and answers 404 unless the requested name matches its last known name; no global name scan runs for SELF callers. An ADMIN bearer token may resolve any last known name.",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "parameters": [
          {
            "name": "name",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "maxLength": 64
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Self DTO"
          },
          "403": {
            "description": "Missing or insufficient bearer token"
          },
          "404": {
            "description": "Not found, or the name does not match the SELF token's own profile"
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "opaque deployment secret"
      }
    },
    "schemas": {
      "Revision": {
        "type": "object",
        "properties": {
          "profileRevision": {
            "type": "integer",
            "format": "int64"
          },
          "sectionRevisions": {
            "type": "object",
            "additionalProperties": {
              "type": "integer",
              "format": "int64"
            }
          },
          "updatedAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "Error": {
        "type": "object",
        "required": [
          "code",
          "message"
        ],
        "properties": {
          "code": {
            "type": "string"
          },
          "message": {
            "type": "string"
          }
        }
      }
    }
  }
}
