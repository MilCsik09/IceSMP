# Optional hook for server owners: invoke this popup through BetterHud's documented command/API
# when %icesmp_class_proc% changes. IceSMP intentionally does not call BetterHud or grant authority.
icesmp_class_proc_popup:
  move:
    duration: 4
    pixel:
      x-equation: 0
      y-equation: -2t
  push: true
  key-mapping: true
  layouts:
    1:
      name: icesmp_class_layout
      gui:
        x: 50
        y: 50
      pixel:
        x: 0
        y: 28
  duration: 30
