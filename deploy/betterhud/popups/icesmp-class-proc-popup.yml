# Display-only proc toast. IceSMP emits BetterHud's custom event from the player's Folia region
# thread after a new non-empty immutable proc snapshot appears.
icesmp_class_proc_popup:
  move:
    duration: 4
    pixel:
      x-equation: 0
      y-equation: -2t
  push: true
  key-mapping: true
  triggers:
    1:
      class: custom
      name: icesmp_class_proc
  layouts:
    1:
      name: icesmp_class_proc_layout
      gui:
        x: 50
        y: 68
      pixel:
        x: 0
        y: 0
  duration: 24
