# One contract/layout serves Warrior, Evoker, Archer, Shaman, Monk, Paladin, Demon Hunter,
# Druid, Priest, Death Knight, Assassin, Warlock and Wizard without class-specific placeholders.
icesmp_class_hud:
  conditions:
    enabled:
      first: "boolean:icesmp_hud_visible"
      second: true
      operation: "=="
  layouts:
    1:
      name: icesmp_main_layout
      gui: &icesmp_anchor
        x: 100
        y: 0
      pixel: &icesmp_pixel
        x: 0
        y: 0
