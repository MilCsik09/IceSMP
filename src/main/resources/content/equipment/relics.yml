# ===== Nekromanta lélek-erőforrás =====
# A Nekromanta-spec játékosok ölésenként lélekszilánkot kapnak, amiből
# megerősített Wither-csontváz bajnokot idézhetnek (/souls champion).
souls:
  shards-per-kill: 1
  # Az élőhalottban nincs learatható lélek (a Néma Királynő szava mozgatja) — élőhalott
  # ölésből NEM jár szilánk; a szilánk az ÉLŐ szörnyek lelkéből jön. true = régi viselkedés.
  shards-from-undead: false
  champion-cost: 10
  champion-health: 60.0
  champion-lifespan-seconds: 60

  # ===== E25 — Pakt-oltár (Boszorkánymester): tartós +20% max Lélekerő =====
  # Ára: 1× Első Csend Szilánkja a táskából (pakt.material) — nem halmozható.
  pakt_oltar:
    type: "pakt"
    altar-block: "SOUL_LANTERN"
    cooldown-seconds: 600
    structure:
      - "-1,-1,-1:OBSIDIAN"
      - "0,-1,-1:OBSIDIAN"
      - "1,-1,-1:OBSIDIAN"
      - "-1,-1,0:OBSIDIAN"
      - "0,-1,0:CRYING_OBSIDIAN"
      - "1,-1,0:OBSIDIAN"
      - "-1,-1,1:OBSIDIAN"
      - "0,-1,1:OBSIDIAN"
      - "1,-1,1:OBSIDIAN"

# ===== E25 — Warlock-paktum pool-bónusz (élő kulcsok) =====
# A Sárkányidéző Eszencia-bónusza már NEM itt él: a Class Relic Framework adja a
# relics.class-relics.sarkany_tojas.base-power.max-resource-percent kulcson át.
pakt:
  bonus-percent: 20.0
  material: "elso_csend_szilankja"
