# IceSMP konfiguráció — relics (a ConfigManager a támogatott CONFIG_FILES-listát tölti be)
relics:
  enabled: true
  # Inaktivitás-kezelés: a megadott számú nap után a relikvia törlődik
  # a tulajdonos inventoryjából belépéskor, és újra megszerezhetővé válik.
  inactivity:
    enabled: true
    expiry-days: 14
    # Halálban ELVESZETT (reclaim-módú) relikvia rövidített lejárata: ha a tulaj ennyi
    # napon belül nem idézi újra az oltárnál, a relikvia MINDENKINEK felszabadul.
    lost-expiry-days: 3
  # Fegyver-relikviák: PvP-ben gazdát cserélhetnek (a passzívak védettek).
  weapon-relics:
    - "metelytepo"
  # Frakció-szárnyak: idegen frakció tagja a földről sem veheti fel őket (a szárny
  # "elutasítja"); a rituáléjuk is frakció-kapus (requires-faction). Élőben olvasódik.
  wings:
    faction-locked-pickup: true
  pvp-transfer:
    enabled: true
  # Passzív (nem-fegyver) relikviák sorsa halálkor (a fegyver-relikviák PvP-átvétele
  # változatlan). Módok:
  #   reclaim - a tárgy MEGSEMMISÜL, de a tulajdon marad: csak a tulaj idézheti újra az
  #             oltárnál (áldozattal), az inactivity.lost-expiry-days lejártáig — utána
  #             a relikvia mindenkinek felszabadul (ez a default)
  #   keep    - respawnkor visszakerül a tulajhoz
  #   drop    - vanília: leesik a földre (idegen frakció így sem veheti fel)
  passive-death:
    mode: "reclaim"
  messages:
    cooldown: "&cA relikvia pihen: &f%seconds%s &cmaradék"
    expired: "&5A(z) &f%relic_name% &5relikvia a hosszú tétlenség miatt elenyészett, és újra megszerezhetővé vált."
  definitions:
    metelytepo:
      display-name: "Mételytépő"
      display-color: "&5"
      # A material itt dokumentáció: a tényleges értéket a kód adja (RelicManager.registerRelic).
      # A megjelenés ITEM_MODEL-lel megy (icesmp:relic_<id>) — a RelicItemFactory állítja.
      material: "GOLDEN_AXE"
      item-model: "icesmp:relic_metelytepo"
      lore:
        - "&7A Mélység Népének — a rég letűnt törp"
        - "&7civilizációnak — ősi relikviája."
        - ""
        - "&7Ősi ítélet-mágia lakik benne: e harci"
        - "&7fejsze lesújt a bűnösökre, s igazságot tesz"
        - "&7ott, ahol a Káoszkor rendje szertefoszlott."
        - ""
        - "&dHasználat"
        - "&7Csákányként bányászik; élőholtakra erősebben sújt."
        - "&7Nem bűnös célpont ellen a sebzése feleződik."
        - "&7Védett lény megölése bűnössé teheti a forgatót."
        - "&fShift + bal katt: &7Justice — közeli bűnös célpont."
        - "&fShift + jobb katt: &7Honor Eye — felfedés és élőholt-fagyasztás."
        - "&7Ha PvP-ben elesel, a fegyver a legyőződre száll."
    phoenix_wing:
      display-name: "Főnix-szárny"
      display-color: "&c"
      lore:
        - "&7Perinfernicitas lángoló ereklyéje,"
        - "&7Soleil főnixeinek tollából szőve."
        - "&7Viselőjét nem égeti tűz, és zuhanása"
        - "&7lángviharban végződik."
    frost_wing:
      display-name: "Zúzmara-szárny"
      display-color: "&b"
      lore:
        - "&7Cryghaliris jeges ereklyéje, Kallan"
        - "&7jégsárkányainak leheletével átitatva."
        - "&7Szárnyra kapva megfagyasztja"
        - "&7a körülötte lévőket."
    wander_wind:
      display-name: "Vándorszél"
      display-color: "&f"
      lore:
        - "&7Ryanora & Caldestera szabad szele,"
        - "&7Arkynn békés örökségének fuvallata."
        - "&7Felszálláskor széllökés repíti, és a föld"
        - "&7sosem üti meg viselőjét."
    eleftheria_konnye:
      display-name: "Eleftheria Könnye"
      display-color: "&5"
      lore:
        - "&7Megkövült, éjfekete csepp; a Néma Királynő"
        - "&7első suttogása hozta létre, magába zárva"
        - "&7a Fa kínjait és a magányt."
    sarkany_tojas:
      display-name: "Sárkánytojás-töredék"
      display-color: "&d"
      material: "DRAGON_EGG"
      item-model: "icesmp:relic_sarkany_tojas"
      lore:
        - "&7Egy sosem kelt sárkány álma, kőbe zárva."
        - "&7A Sárkányidéző kezében az Eszencia"
        - "&7medre kitágul — másnak csak hideg kő."
    bone_wing:
      display-name: "Csontszárny"
      display-color: "&8"
      lore:
        - "&7A Káoszkor csontból szőtt szárnya, a"
        - "&7Néma Királynő élőhalottainak maradványa."
        - "&7Éjjel a viselője maga is"
        - "&7árnyékká válik."

  # ===== Class Relic Framework =====
  # Kaszthoz kötött világ-egyedi relikviák KÜLÖN domainrétege: a fenti generikus
  # definition-ök érintetlenek, a kaszt-fogalmak (class, resonance, awakening) csak itt
  # élnek. A betöltés fail-fast: ismeretlen class/spec, parent-eltérés vagy duplikált
  # class/relic kötés a TELJES szekció elutasítását jelenti (a korábbi katalógus marad).
  # A class/spec authority a Profile v2; a relic-ownership a világ-szintű relics-store.
  # true esetén 13/13 class → 1 relic és 35/35 spec → 1 resonance kötelező (a teljes
  # class rework kapuja) — addig false marad, csak az Evoker pilot él.
  require-complete-catalog: false
  class-relics:
    sarkany_tojas:
      class: evoker
      activation:
        # Az ownership önmagában NEM elég: a használható fizikai tárgynak a
        # játékosnál kell lennie (lost/reclaim állapotban a bónusz szünetel).
        requires-physical-possession: true
      base-power:
        id: dragon_essence
        # A Sárkányidéző max-Eszencia bónusza (%): a kanonikus és egyetlen forrás.
        max-resource-percent: 10.0
      resonances:
        devastation:
          id: dragon_echo
          enabled: false
        preservation:
          id: temporal_echo
          enabled: false
      awakening:
        id: unborn_dragon
        enabled: false
        cooldown-seconds: 120

# ===== Rituálé-oltárok (multi-block szentélyek) =====
# Egy oltár egy MAG-BLOKK (altar-block), amit SHIFT+jobb kattal aktiválsz. A 'structure' a mag
# köré megépítendő szentély: minden elem egy "dx,dy,dz:MATERIAL" eltolás a mag-blokkhoz képest,
# és MINDNEK stimmelnie kell. Az alapminta egy 3x3 alapzat (y=-1) + 4 két-magas saroktorony.
# A kimenetet a 'type' dönti el:
#   relic   (alap): egy relikviát idéz meg (a relic-egyediség szabálya érvényes). A 'relic' mező
#           adja a relic-id-t (alapból a rituálé kulcsa).
#   cleanse: leveszi a bűnös-jelet és nullázza a bűn-számlálót (a lezárt sötét paktumot NEM oldja fel).
#   buff:   a megadott effekteket rakja fel ('effects': "TÍPUS:tick:erősség").
#   home:   a frakciód fővárosába teleportál (hazatérés-kő).
# Kapuk (opcionális): 'requires-class' (kaszt-id) és 'requires-faction' (RED/BLUE/NEUTRAL/DARK).
# Minden rituálénak EGYEDI a mag-blokkja (különben az első találat nyerne). A kaszt-oltárok
# ('*_szentely') tematikus buffot adnak a saját kasztjuknak — másold/hangold őket kedvedre.
# cooldown-seconds: az ismétlés korlátja (memóriában, újraindításkor nullázódik).
