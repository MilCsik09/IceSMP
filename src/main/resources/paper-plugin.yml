name: IceSMP
description: $description
version: '$version'

main: hu.taliann.icesmp.IceSMP
bootstrapper: hu.taliann.icesmp.IceSMPBootstrap
loader: hu.taliann.icesmp.IceSMPLoader
api-version: '1.21.11'
load: POSTWORLD

folia-supported: true

authors: [ Taliann ]

# Opcionális integrációk (mind soft-depend, required: false — nélkülük is fut):
#  - LibsDisguises: a Druida formák vizuális átalakulása (mob-disguise). A reflexiós híd
#    (DruidDisguise) join-classpath-tal éri el az osztályait futásidőben.
#  - PlaceholderAPI: a %icesmp_...% placeholderek (pl. a TAB megjeleníti az Erő-csíkot,
#    frakciót, kasztot, party-HUD-ot). load: BEFORE, hogy a regisztrációkor már elérhető legyen.
#  - FancyNpcs: a TALK_TO_NPC quest-objektívák (kaszt-mester próbák). A reflexiós híd
#    (FancyNpcsQuestBridge) join-classpath-tal éri el az API-ját futásidőben.
#  - WorldEdit/FastAsyncWorldEdit: a WorldGuard-híd Bukkit-adapterét és vektortípusait
#    adja. A FAWE a WorldEdit nevet provides-aliasként biztosítja.
#  - WorldGuard: a blokkot helyező események (meteor, kincs) kerülik a WG-régiókat, a
#    személyes claimek pedig nem metszhetnek WG-régiót. A ProtectionBridge mindkét
#    plugint opcionális, csatlakoztatott classpathon éri el.
#  - LuckPerms: a natív chat-formázó a LP prefix/suffix-et jeleníti meg. A reflexiós híd
#    (LuckPermsBridge) join-classpath-tal éri el az API-ját futásidőben; LP nélkül is fut.
#  - TAB: csak load-order (az indulási kompatibilitás-tanácsadó megbízhatóan észlelje);
#    az IceSMP nem hívja az API-ját.
#  - A class/spec tartalmi motorjai is opcionális integrációk. A
#    class-spec-dependencies.lock.yml verzió-pin + dev-provisioning authority; a runtime
#    preflight kizárólag explicit `required-runtime` lock-bejegyzést tehet startup-fatalra.
#    A jelenlegi 1.21.11 lockban nincs ilyen külső plugin. Production induláskor az IceSMP
#    soha nem tölt le plugint; az automatikus provisioning kizárólag a Gradle runServer feladata.
dependencies:
  server:
    LibsDisguises:
      load: BEFORE
      required: false
      join-classpath: true
    PlaceholderAPI:
      load: BEFORE
      required: false
    FancyNpcs:
      load: BEFORE
      required: false
      join-classpath: true
    WorldEdit:
      load: BEFORE
      required: false
      join-classpath: true
    WorldGuard:
      load: BEFORE
      required: false
      join-classpath: true
    LuckPerms:
      load: BEFORE
      required: false
      join-classpath: true
    TAB:
      load: BEFORE
      required: false
    CraftEngine:
      load: BEFORE
      required: false
      join-classpath: true
    ModelEngine:
      load: BEFORE
      required: false
      join-classpath: true
    BetterHud:
      load: BEFORE
      required: false
      join-classpath: true
    MythicMobs:
      load: BEFORE
      required: false
      join-classpath: true
    FancyDialogs:
      load: BEFORE
      required: false
      join-classpath: true
    packetevents:
      load: BEFORE
      required: false
      join-classpath: true
