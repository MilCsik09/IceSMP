# IceSMP üzenetek — pet alrendszer (a MessageManager az összes messages/*.yml-t betölti)
messages:
  pet-captured: <green>Új társat fogadtál be!</green>
  pet-died: <gray>A társad elesett a harcban. <dark_gray>(/pet summon az új idézéshez)</dark_gray></gray>
  pet-dismissed: '&7A társad eltűnt.'
  pet-info: '<dark_green>🐺 Társ: <white>{name}</white> &7| Szint: <white>{level}</white> &7| XP: <white>{xp}</white> &8(/pet summon|dismiss|name)</dark_green>'
  pet-invalid-target: <red>Ezt a lényt nem tudod befogni (rossz típus, vagy már másé).</red>
  pet-item-given: '&aMegkaptad a befogó eszközt — jobb katt egy lényen!'
  pet-level-up: '<dark_green>🐺 A társad szintet lépett: <white>{level}</white></dark_green>'
  pet-name-invalid: '&cÉrvénytelen név (max 24 karakter).'
  pet-name-usage: '&cHasználat: /pet name <név>'
  pet-named: '&aA társad neve mostantól: &f%s'
  pet-none: '&7Nincs aktív társad.'
  pet-none-captured: '&7Még nincs befogott társad — szerezz befogó eszközt: /pet item'
  pet-not-allowed: '&cCsak Vadmester, Nekromanta, Szentségtelen vagy Boszorkánymester tarthat társat.'
  pet-not-beastmaster: '&cCsak Vadmesterként idézhetsz állandó társat.'
  pet-released: '&7A társad visszatért a vadonba; az Istálló-hely felszabadult.'
  pet-stable-full: '&cAz Istállód megtelt: előbb engedj el egy társat (/pet release).'
  pet-stance: '<gray>Társ parancs: <gold>{stance}</gold></gray>'
  pet-summoned: '&aA társad megjelent melletted.'
  pet-wrong-spec: <red>Ezt az itemet nem a te specializációd használja.</red>
