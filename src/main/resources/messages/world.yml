  events-bloodmoon-already: '&7Már tombol a vérhold.'
  events-bloodmoon-forced: '&cVérhold elindítva!'
  events-bloodmoon-inactive: '&7Jelenleg nincs vérhold.'
  events-bloodmoon-not-active: '&7Most nincs vérhold.'
  events-bloodmoon-stopped: '&aVérhold leállítva.'
  events-bloodmoon-usage: '&cHasználat: /events bloodmoon [start|stop]'
  events-intro-replayed: '&aIntro lejátszva: &f%s'
  events-invasion-failed: '&7Nem sikerült (nincs online játékos).'
  events-invasion-started: '&cInvázió elindítva!'
  events-season-header: '&6Szezon-állás:'
