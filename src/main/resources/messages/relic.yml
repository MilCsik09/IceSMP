# IceSMP üzenetek — relic alrendszer (a MessageManager az összes messages/*.yml-t betölti)
messages:
  admin:
    icesmp:
      reload:
        success: <green>A konfiguráció sikeresen újratöltve!</green>
        usage: '&cHasználat: /icesmp reload'
        quest-invalid: '&cA quest-definíciók érvénytelenek (%s hiba) — a korábbi registry maradt élőben, részletek a szerver-logban.'
    job:
      description: Adminisztrációs segédparancsok.
      invalid-usage: '&cHasználat: %s'
      reset-cooldowns:
        notify: '&eEgy adminisztrátor törölte a varázslataid visszatöltési idejét.'
        success: '&aVarázslat cooldownok törölve: &f%s'
      reset-skills:
        notify: '&eEgy adminisztrátor alaphelyzetbe állította a varázslataidat.'
        success: '&aMinden varázslat és állapot alaphelyzetbe állítva: &f%s'
      unlock-all:
        notify: '&eEgy adminisztrátor minden varázslatot feloldott neked.'
        success: '&aAz összes varázslat feloldva: &f%s'
      usage: /job admin <resetcd|unlockallskills|resetskills|resetclass> <játékos>
  crafting:
    restricted: '&cEhhez a tárgyhoz &f{job} &ckaszt szükséges (min. &f{level}&c. szint).'
    restricted-any: '&cEhhez a tárgyhoz legalább &f{level}&c. szintű kaszt szükséges.'
    restricted-profession: '&cEhhez a tárgyhoz &f{profession} &cszakma szükséges (min. &f{level}&c. szint).'
  relic:
    death-escrow-full: <yellow>A megőrzött relikviád kézbesítéséhez üríts helyet a tárgytáradban, majd lépj vissza.</yellow>
    death-kept: <gold>✦ A relikviád hű maradt hozzád — a halál sem választott el tőle.</gold>
    death-lost: '<dark_purple>✦ A(z) <white>{relic}</white> köddé vált a halálodban — a kötés él: idézd újra az oltárnál, mielőtt végleg elhagyna ({days} nap).</dark_purple>'
    pvp-claimed: '<gold>⚔ A(z) <white>{relic}</white> új gazdát választott: mostantól téged szolgál!</gold>'
    pvp-lost: <red>A(z) <white>{relic}</white> elhagyott — legyőződ kezébe került.</red>
    wing-rejected: <red>A szárny nem ismer el gazdájának — csak a(z) {faction} frakció hű tagját szolgálja.</red>
  relic-disabled: '&cA relikvia rendszer jelenleg ki van kapcsolva.'
  relic-list-empty: '&eJelenleg nincs regisztrált relikvia.'
  relic-list-header: '&6Regisztrált relikviák: %s'
  relic-unknown-subcommand: '&cIsmeretlen relikvia alparancs: &f%s'
  ritual-missing-sacrifice: <red>Hiányoznak az áldozati tárgyak a rituáléhoz.</red>
  ritual-relic-unavailable: <red>A relikvia jelenleg nem idézhető meg (már van élő tulajdonosa).</red>
  ritual-success: <gold>A rituálé sikeres — a relikvia testet öltött a kezedben!</gold>
  ritual-cooldown: <red>Az oltár még nem töltődött fel — várj még {seconds} másodpercet.</red>
  ritual-cleanse-nothing: <gray>Nincs mit feloldoznod — a lelked már tiszta.</gray>
  ritual-cleanse-blocked: <red>A sötét paktum köt — ezt az oltár nem oldhatja fel, csak a vezeklés útja.</red>
  ritual-cleanse-success: <gold>Az oltár feloldozott — bűneid lemosattak, a fejvadászok lekerülnek a nyomodról.</gold>
  ritual-buff-success: <gold>Az oltár áldása átjár — a rituálé ereje végigfut a testeden!</gold>
  ritual-home-success: <gold>Az oltár fénye hazaröpít a fővárosodba.</gold>
  ritual-home-no-capital: <red>A frakciódnak nincs fővárosa, ahová hazatérhetnél.</red>
  ritual-structure-incomplete: <red>Az oltár szerkezete hiányos — építsd meg a teljes szentélyt a mag-blokk köré.</red>
  ritual-wrong-class: <red>Ez az oltár nem a te kasztodhoz szól.</red>
  ritual-wrong-faction: <red>Ez az oltár nem a te frakciódhoz szól.</red>
  souls-balance: '<dark_purple>Lélekszilánkjaid: <white>{shards}</white> <gray>(/souls champion — bajnok idézése)</gray></dark_purple>'
  souls-champion-cap: '&cElérted a maximális idézett társ-számot.'
  souls-champion-insufficient: '&cNincs elég lélekszilánkod a bajnokhoz.'
  souls-champion-summoned: <dark_purple>Lélekszilánkjaidból bajnok támad fel ({cost} szilánk).</dark_purple>
