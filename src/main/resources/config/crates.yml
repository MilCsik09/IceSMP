# Natív láda (crate) rendszer — a CrazyCrates kiváltása (IDEAS B8).
#
# Minden láda egy fizikai blokk-hely (lásd /crate set), amit egy hozzá tartozó
# kulcs-itemmel lehet kinyitni. A kulcs ÁRA (key-price) a valuta-sink: a
# /crate buy paranccsal levont pénz VÉGLEGESEN elég, nem kerül vissza a
# gazdaságba. Az ELÉG a bevétel a rendszernek — a láda-jutalom maga SOSEM
# pénz, mindig nyers item (ritkán parancs-jutalom, ha a config úgy definiálja).
#
# rewards: súlyozott lista — egy tétel esélye = weight / (az adott láda összes
# weight-jének összege). Egy tétel vagy "material" (+ "amount"), vagy "command"
# (konzolként lefuttatva, {player} helyettesítéssel) — pontosan egyet adj meg.
#
# Kulcs-források (IDEAS A48):
#   - Bolt: /crate buy <láda> [darab] — a key-price valuta-sinkje (lásd fent).
#   - Quest-jutalom: config/quests.yml — egy quest rewards blokkjában a
#     "crate-key: \"<ládaId>:<darab>\"" mező (lásd pl. onboarding_gather).
#   - Jövőbeli forrás (még nincs bekötve): napi/heti kihívás jutalma.
crates-settings:
  # IDEAS A47: kozmetikus "pörgős" reveal-animáció (gui/CrateSpinGUI) a láda kinyitásakor —
  # a nyeremény sorsolása és jóváírása EZTŐL FÜGGETLENÜL mindig azonnal megtörténik, ez a
  # kapcsoló csak azt dönti el, hogy a visszajelzés (hang/részecske/chat) azonnal jön-e,
  # vagy az animáció végén. Globális kapcsoló (nem láda-specifikus) — egyszerűbb, mint
  # minden ládánál külön beállítani, és a kozmetika amúgy is szerver-szintű ízlés kérdése.
  spin-animation: true

crates:

  koznapi:
    display-name: "Caldesterai Kereskedőláda"
    key-name: "&fKereskedő Kulcs"
    key-material: TRIPWIRE_HOOK
    key-item-model: "icesmp:cratekey_koznapi"
    # A kulcs ára valuta-sinkként ELÉG — nem megy vissza a gazdaságba.
    key-price:
      currency: NEUTRAL
      amount: 25.0
    rewards:
      - {weight: 40, material: IRON_INGOT, amount: 8}
      - {weight: 25, material: GOLDEN_APPLE, amount: 2}
      - {weight: 20, material: DIAMOND, amount: 2}
      - {weight: 10, material: NETHERITE_SCRAP, amount: 1}
      - {weight: 5, material: DIAMOND_BLOCK, amount: 1, description: "&bDiamond blokk"}

  ritka:
    display-name: "&5Caldesterai Kincsesláda"
    key-name: "&5Kincses Kulcs"
    key-material: TRIPWIRE_HOOK
    key-item-model: "icesmp:cratekey_ritka"
    # A kulcs ára valuta-sinkként ELÉG — nem megy vissza a gazdaságba.
    key-price:
      currency: NEUTRAL
      amount: 100.0
    rewards:
      - {weight: 30, material: NETHERITE_INGOT, amount: 1}
      - {weight: 25, material: DIAMOND_BLOCK, amount: 3}
      - {weight: 20, material: ENCHANTED_GOLDEN_APPLE, amount: 1}
      - {weight: 15, material: NETHER_STAR, amount: 1}
      - {weight: 7, material: TOTEM_OF_UNDYING, amount: 1}
      - {weight: 3, material: NETHERITE_BLOCK, amount: 1, description: "&5Netherite blokk"}
