# IceSMP natív ládarendszer. Ez a végleges saját séma; CrazyCrates-config és legacy kulcs nem támogatott.
# A világban 16 fizikai ládaállomás fér el. Az alapcsomag az alsó szint 8
# állomását használja; a felső 8 hely szezonális, frakciós és eventládáknak marad.
# A random-blueprint pool szakma (`profession`), szinttartomány és opcionális
# `include-loot-only` alapján a betöltött profession-receptekből sorsol.
# ELYTRA sem itemként, sem recept/tervrajz eredményeként nem engedélyezett;
# repülőszárnyat kizárólag a relikviarendszer kezelhet.
crates-settings:
  enabled: true

crates:
  koznapi:
    enabled: true
    display-name: "&aKöznapi Láda"
    key-material: TRIPWIRE_HOOK
    key-name: "&aKöznapi Kulcs"
    key-item-model: "icesmp:crate_key_common"
    key-price: { currency: NEUTRAL, amount: 250 }
    # Az üres permission azt jelenti, hogy minden játékos nyithatja.
    # Az icesmp.* jogosultsági gate adminopcióként továbbra is támogatott.
    permission: ""
    worlds: []
    required-key-count: 1
    cooldown-seconds: 5
    mass-open: { enabled: true, max-openings: 10 }
    opening-sound: { sound: "minecraft:entity.player.levelup", volume: 1.0, pitch: 1.2 }
