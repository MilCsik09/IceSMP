# IceSMP natív ládarendszer. Ez a végleges saját séma; CrazyCrates-config és legacy kulcs nem támogatott.
crates-settings:
  enabled: true
  # Az egyetlen nyitás jutalmát kozmetikai pörgős GUI mutatja. Többszörös nyitás összegzést használ.
  spin-animation: true

crates:
  koznapi:
    enabled: true
    display-name: "&aKöznapi Láda"
    key-material: TRIPWIRE_HOOK
    key-name: "&aKöznapi Kulcs"
    key-item-model: "icesmp:crate_key_common"
    key-price:
      currency: NEUTRAL
      amount: 250
    # Üres: csak az általános icesmp.crate.use jog kell. Egyedi gate csak icesmp.* lehet.
    permission: ""
    # Üres: minden betöltött világban használható. Ismeretlen világnév a crate-et letiltja.
    worlds: []
    required-key-count: 1
    cooldown-seconds: 5
    mass-open:
      enabled: true
      max-openings: 10
    opening-sound:
      sound: ENTITY_PLAYER_LEVELUP
      volume: 1.0
      pitch: 1.2
    broadcast:
      enabled: false
      message: "&6[Láda] &f{player} &ekinyitotta: &f{crate} &7({amount}×)"
    rewards:
      - type: item
        weight: 55.0
        material: IRON_INGOT
        amount: 8
        description: "&f8× Vasrúd"
      - type: currency
        weight: 25.0
        currency: NEUTRAL
        amount: 125
        description: "&e125 Creutzér"
      - type: unique-item
        weight: 12.0
        id: emlekszilank
        amount: 2
        description: "&b2× Emlékszilánk"
      - type: crate-key
        weight: 8.0
        id: ritka
        amount: 1
        description: "&dRitka ládakulcs"

  ritka:
    enabled: true
    display-name: "&dRitka Láda"
    key-material: TRIPWIRE_HOOK
    key-name: "&dRitka Kulcs"
    key-item-model: "icesmp:crate_key_rare"
    key-price:
      currency: NEUTRAL
      amount: 1200
    permission: "icesmp.crate.ritka"
    worlds: []
    required-key-count: 2
    cooldown-seconds: 30
    mass-open:
      enabled: true
      max-openings: 5
    opening-sound:
      sound: UI_TOAST_CHALLENGE_COMPLETE
      volume: 0.8
      pitch: 1.1
    broadcast:
      enabled: true
      message: "&d[Láda] &f{player} &7kinyitotta: &d{crate} &7({amount}×)"
    rewards:
      - type: item
        weight: 35.0
        material: DIAMOND
        amount: 4
        description: "&b4× Gyémánt"
      - type: recipe-item
        weight: 20.0
        id: netherit_torzsalek_otvozet
        amount: 1
        description: "&6Netherit ötvözet"
      - type: blueprint
        weight: 15.0
        id: netherit_torzsalek_otvozet
        amount: 1
        description: "&bNetherit Ötvözés tervrajz"
      - type: currency
        weight: 20.0
        currency: NEUTRAL
        amount: 1000
        description: "&e1000 Creutzér"
      - type: command
        weight: 10.0
        # Csak {player}, {uuid}, {crate}, {amount} használható. Kezdő / és sortörés tiltott.
        command: "xp add {player} 10 levels"
        description: "&a10 tapasztalati szint"
