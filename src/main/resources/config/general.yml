# IceSMP konfiguráció — general (a ConfigManager az összes config/*.yml-t betölti)
# ===== IceSMP Teljes Konfiguráció =====
# Beállítások, HUD, Valuta és Lokalizáció

settings:
  default-faction: "NEUTRAL"
  debug: true
  # Kliens-gamerule-ök, amiket a plugin minden világra ráállít (indításkor + világ-betöltéskor).
  # A 'locator-bar' a vanilla 1.21.6+ Locator Bar (az XP-sáv felett megjelenő pötty/nyíl, ami a
  # közeli játékosok irányát mutatja forgáskor) — alapból KI, mert ütközik a saját HUD-dal és
  # zavaró. Állítsd false-ra, ha meg akarod hagyni a vanilla viselkedést.
  disable-locator-bar: true

# Ülés (a GSit plugin kiváltása): /sit parancs + jobb-katt a lépcsőre/fél-lapra üres kézzel.
sit:
  enabled: true
  click-to-sit: true

# Apró világ-szabályok (a leszedett mini-pluginok natív kiváltása).
world-tweaks:
  # Warden-halál XP-drop felülírása (ICEsmpadditions.jar kiváltása).
  warden-death-xp:
    enabled: true
    min: 80
    max: 125
  # Termés-taposás védelem (FarmProtect.jar kiváltása): a szántóföld nem törik fel.
  crop-trample-protection:
    players: true
    mobs: true

hud:
  # Élő játékos-HUD: oldalsáv (frakció, valuta, kaszt+szint, Erő-csík, esemény, party),
  # és boss-bar a raid / vérhold / világboss alatt. A tab-listát (header/footer, nevek,
  # nametag+rendezés, ping-oszlop) a NATÍV tablist-réteg viszi: config/tablist.yml.
  # A TAB plugin többé NEM szükséges — leszedhető; a teljes megjelenés house-ban van.
  enabled: true
  # Az IceSMP saját scoreboard-oldalsávja. Ha mégis külső scoreboard-plugint futtatsz
  # (pl. TAB), kapcsold false-ra ezt ÉS a tablist.enabled-et a tablist.yml-ben — az
  # IceSMP-adatok akkor a %icesmp_...% placeholderekkel jeleníthetők meg
  # (docs/SERVER_INTEGRATION.md).
  sidebar-enabled: true
  sidebar:
    # Az oldalsáv címe (legacy &-kódokkal; a ㍐ a resource pack glyph-je — RP nélkül
    # cseréld pl. "&b&l✦ Ice SMP ✦"-re).
    title: "㍐"
  # Egyszerű frakció-színes tab-név FALLBACK — csak akkor él, ha a natív tablist
  # (tablist.enabled) KI van kapcsolva; egyébként a TablistManager adja a teljes
  # (LP-prefixes) nevet, és ez a kapcsoló hatástalan.
  tablist-enabled: true
  refresh-ticks: 20
  # ===== Dinamikus oldalsáv =====
  dynamic:
    # Harc-fókusz: harcban (adott VAGY kapott találat a türelmi időn belül) csak a felsorolt
    # szekciók látszanak — a HUD kitisztul, az Erő-csík és a party-frame-ek maradnak.
    combat-focus: true
    combat-grace-seconds: 8
    combat-visible-sections: [eroforras, csapat]
    # Rotáló infósor az esemény-sor helyén: esemény-állapot ↔ szezon-visszaszámláló ↔ napi
    # kihívás állása váltakozik; nyugalomban az esemény-frame kimarad.
    rotating-line: true
    rotation-seconds: 4
  profile:
    enabled: true
    update-interval-ticks: 5
    lifetime-ticks: 200
    distance: 3.0
    height-offset: -0.25

# WoW-stílusú csapat (party) rendszer: max 5 fő, teljesen frakció-független (bármelyik
# frakcióból lehet egy csapatban), meghívó/elfogadás alapú tagság. A közeli mob-ölésekből
# járó XP a közelben lévő párttagok közt FEJENKÉNT oszlik meg (minél többen vannak, annál
# kisebb rész jut mindenkinek). A plugin saját loot-eseményeinél (pl. Vad Hajsza, elrejtett
# kincs) nem egy közös zsákmány esik le, hanem minden közeli párttag a SAJÁT (personal)
# jutalmát kapja. Párton belül nincs friendly fire — a tagok sem közelharccal, sem
# lövedékkel (nyíl stb.) nem tudják sebezni egymást.
party:
  enabled: true          # A party-rendszer be/ki kapcsolása
  max-size: 5            # Egy csapat maximális létszáma
  invite-expire-seconds: 60  # Ennyi másodperc után jár le a meghívó, ha nincs válasz
  share-radius: 50       # Ilyen sugarú körben (blokk) számítanak "közelinek" a párttagok XP/loot szempontjából
  xp-share: true         # A mob-ölésből járó XP fejenként oszlik meg a közeli párttagok közt
  personal-loot: true    # A plugin loot-eseményeinél (Vad Hajsza, elrejtett kincs) mindenki saját jutalmat kap
  block-friendly-fire: true  # Párttagok nem sebezhetik egymást (közelharc és lövedék sem)
  hud-enabled: true      # Party-frame-ek a HUD-oldalsávon: tagok neve + színkódolt élet-sáv (👑 = vezető)

# Natív, BLOKK-PONTOS 3D terület-claim rendszer — a SimpleClaimSystem KIVÁLTÁSA. A claim egy
# doboz: pontos blokk-téglalap alapterület + korlátos függőleges sáv (alapból a létrehozási
# Y-tól 20 blokk fel és 20 le — a menüből pénzért bővíthető). /claim egy quick-size oldalú
# négyzetet foglal a játékos körül; /claim pos1 + pos2 + area pontos téglalapot a két
# sarokpont között. Az ár OSZLOPONKÉNT (1×1 blokk alapterület) számolódik a JÁTÉKOS SAJÁT
# frakció-valutájában (money sink — az ár ELÉG, unclaimkor sem jár vissza). A tulaj
# /claim trust <név> paranccsal megbízottakat adhat (teljes hozzáférés MINDEN claimjéhez).
# Frakció-territóriumba és WorldGuard-régióba nem lehet claimelni. Védelem: blokk-törés/-rakás,
# konténerek, vödör, képkeret, robbanás, blokk-evő mobok — de csak a claim Y-sávján BELÜL!
# PvP-t a claim NEM tiltja (háborús szerver). Raid alatt a `raid-lootable` dönti el, hogy a
# jelentkezett támadók kinyithatják-e az ellenséges claim-ládákat.
# Admin megkerülő jog: icesmp.admin.territory.bypass.
claims:
  enabled: true
  quick-size: 16              # a /claim gyorsfoglalás négyzetének oldalhossza (blokk)
  default-height: 20          # a claim teteje: létrehozási Y + ennyi blokk
  default-depth: 20           # a claim alja: létrehozási Y - ennyi blokk
  free-columns: 768           # összesen ennyi oszlop ingyenes (768 ≈ 3 chunknyi terület)
  column-cost: 0.5            # minden további oszlop ára (saját frakció-valuta, ELÉG)
  max-columns-per-player: 8192   # claim-plafon játékosonként, oszlopban (≈ 32 chunknyi)
  area-max-columns: 6400      # a pos1+pos2 kijelölés max alapterülete (6400 = 80×80 blokk)
  y-extend-step: 5            # a magasítás/mélyítés lépésköze (blokk)
  y-extend-cost-per-column: 0.1  # bővítés ára lépésenként: a claim oszlopai × ez az összeg
  protect-containers: true    # konténerek (láda, hordó, kemence…) védelme idegenektől
  protect-explosions: true    # robbanás sosem tör claimelt blokkot
  protect-fire: true          # tűz nem gyullad/terjed/éget claimelt blokkon (játékos-gyújtás = build-szabály)
  protect-terrain: true       # idegen dugattyú nem tolhat/húzhat blokkot a claimben; folyadék nem folyik be kívülről
  block-in-protected-zone: true    # VÉDETT zónában (főváros, védett város/frakcióterület) SOSEM lehet claimelni
  block-in-territory: false   # ha true: még a NORMÁL frakcióterületen sem lehet claimelni (alapból szabad — a claim mehet a territory rendszerrel)
  block-in-protected-region: true  # WorldGuard-régióban nem lehet claimelni
  raid-lootable: false        # raid alatt a jelentkezett támadók nyithatják-e az ellenséges claim-ládákat
  border:
    show-seconds: 8           # a /claim show határrajz ennyi másodpercig ismétlődik
    radius: 2                 # ekkora chunk-sugárban rajzolja ki a környező claimek pereméit
    enter-notice: true        # action-bar értesítés claim-határ átlépésekor (kié a birtok)

# Natív chat-formázó — a LuckPermsChatFormatterFolia plugin KIVÁLTÁSA. A chat-üzenetet a plugin maga
# formázza "[LP-prefix] Név [LP-suffix]: üzenet" alakra, a névben a beszélő FRAKCIÓJÁNAK színével
# (piros/kék/szürke/sötétszürke) — LuckPerms NÉLKÜL is működik (akkor prefix/suffix egyszerűen
# nincs). FONTOS: ha a régi LuckPermsChatFormatterFolia plugin még fent van a szerveren, kapcsold KI
# ezt (vagy a régit), különben DUPLA formázás történik.
chat:
  format-enabled: true        # natív chat-formázó ([LP-prefix] Név [suffix]: üzenet)
  name-faction-color: true    # a beszélő neve a frakciója színében

# Közösségi adomány-láda: bárki bedobhat egy tárgyat (a kezében tartott teljes stack-et), bárki
# elveheti — nincs ár, nincs valuta, tiszta ajándékozás. Szerver-szintű, közös lista, nem
# frakciónkénti. A max-items a GUI teljes kapacitása (270 = 6 oldal × 45 slot); a
# max-per-player az EGY adományozó élő (még el nem vitt) tételeinek plafonja (0 = nincs limit).
donation-chest:
  enabled: true
  max-items: 270          # a láda teljes kapacitása (élő tételek összesen)
  max-per-player: 27      # egy adományozó élő tételeinek plafonja (0 = korlátlan)

# Spell-VFX: a spell-effektek formázott, palettázott változata (SpellVfx). A ~390 deklaratív spell
# a formátlan gömb-puff helyett a targeting-jellegének megfelelő formát kap (SELF→hélix,
# TARGET→sugár a cél felé, AOE→gyűrű), szín-átmenetes porral. A spell saját accent-particle-je a
# gócponton megmarad. Kikapcsolva a régi puff-visszajelzés fut.
spell-vfx:
  enabled: true             # formázott spell-effektek (false = régi gömb-puff)
  max-points: 48            # egy forma maximális pontszáma (particle-fék; kisebb = takarékosabb)
  # Paletta = a spell-effekt szín-témája. Kaszt/spec szinten adjuk meg: a paletta a
  # classes.<kaszt/spec>.spell-unlocks ÖSSZES spelljére ráterjed (nem kell 390 külön bejegyzés).
  # Választható paletták: FIRE, FROST, HOLY, DECAY, NATURE, ARCANE, BLOOD, STORM, SHADOW, NEUTRAL.
  # Amelyik spell egyik listában sincs, az az accent-particle-jéből kap ésszerű színt.
  class-palettes:
    # --- 13 kaszt (alap-spellek) ---
    wizard: ARCANE
    warrior: STORM
    archer: NATURE
    assassin: SHADOW
    druid: NATURE
    paladin: HOLY
    death_knight: DECAY
    shaman: STORM
    monk: NATURE
    priest: HOLY
    warlock: DECAY
    demon_hunter: DECAY
    evoker: ARCANE
    # --- 31 specializáció (spec-spellek felülírják a kaszt-palettát) ---
    lunar: ARCANE
    feral: NATURE
    guardian: NATURE
    restoration: NATURE
    holy: HOLY
    retribution: HOLY
    protection: STORM
    blood: BLOOD
    frost: FROST
    elemental: STORM
    enhancement: STORM
    tidal: FROST
    windwalker: STORM
    brewmaster: NATURE
    mistweaver: NATURE
    discipline: HOLY
    shadow: SHADOW
    affliction: DECAY
    destruction: FIRE
    havoc: DECAY
    vengeance: DECAY
    devastation: FIRE
    preservation: NATURE
    ironbark: NATURE
    elementalist: STORM
    necromancer: SHADOW
    berserker: BLOOD
    sharpshooter: NATURE
    beast_master: NATURE
    poisoner: DECAY
    phantom: SHADOW
  # Egyedi spell felülbírálás (a kaszt/spec-palettát írja felül). Itt a 31 spec-ULTIMATE (lvl 45)
  # kézzel válogatott palettát kap, hogy a csúcs-spell ránézésre kitűnjön — a legtöbb megerősíti a
  # spec-témát, néhány szándékosan eltér (pl. elemental=STORM, de ascendance_flame=FIRE).
  overrides:
    incarnation_bear: NATURE
    dancing_rune_weapon: BLOOD
    void_torrent: SHADOW
    eternity_breath: FIRE
    the_hunt: DECAY
    doom_winds: STORM
    rewind: ARCANE
    soul_harvest: SHADOW
    king_of_beasts: NATURE
    breath_of_sindragosa: FROST
    final_verdict: HOLY
    fel_blade: DECAY
    the_wild_hunt: NATURE
    invoke_niuzao: NATURE
    summon_infernal: FIRE
    deathcap: DECAY
    celestial_alignment: ARCANE
    elemental_overload: STORM
    masterful_shot: STORM
    revival: HOLY
    final_stand: HOLY
    berserk: BLOOD
    evangelism: HOLY
    last_stand: NATURE
    avenging_wrath: HOLY
    ascendance_flame: FIRE
    spirit_tide: FROST
    spectre: SHADOW
    darkglare: DECAY
    flourish: NATURE
    serenity: HOLY
  # Forma = az effekt geometriája. Alapból a célzásból jön (önmagad→HELIX, célzott→BEAM, körzet→RING),
  # és egy óvatos kulcsszó-heurisztika finomítja: közelharci csapás (*_strike/_kick/_smash…)→IMPACT,
  # dobott (*_dart/_throw…)→ARC, lehelet (*_breath/roar…)→CONE. Itt spell-id szerint felül lehet írni.
  # Választható formák: BEAM, ARC, IMPACT, RING, HELIX, CONE (AUTO/üres = a fenti automatika).
  # shapes:
  #   gravity_well: RING
  #   blink: ARC
  shapes: {}

# DisplayFx: display-entity (BlockDisplay/ItemDisplay) effekt-réteg a particle mellé, ahol az
# effekt geometria/tartós/animált. Jelenleg a claim-fényfal használja: a /claim show a particle-
# perem MELLÉ élenként egy megnyújtott, izzó, csak a kérőnek látszó falat állít (saját/trusted=zöld,
# idegen=piros), ami a border.show-seconds letelte után eltűnik.
display-fx:
  claim-wall:
    enabled: true                        # claim-fényfal a /claim show-nál
    material: LIGHT_BLUE_STAINED_GLASS   # a fal blokk-anyaga (áttetsző üveg ajánlott)
    height: 3                            # a fal magassága blokkban
  crate-reveal:
    enabled: true                        # 3D nyeremény-feltárás a láda fölött (ItemDisplay pörgetés)
  boss-telegraph:
    enabled: true                        # world-boss AoE padló-telegraph (növekvő, izzó veszélylap)
    material: RED_STAINED_GLASS          # a telegraph-lap blokk-anyaga (piros áttetsző ajánlott)
  aurora:
    enabled: true                        # északi fény: magasan lebegő, sodródó fény-fátyol (per-nézős)
    material: CYAN_STAINED_GLASS         # a fátyol blokk-anyaga (áttetsző, hideg szín ajánlott)

# ===== K8 — Emlékszilánkok (visszaemlékezés, /emlek) =====
# A Felsők amnéziával érkeztek; az Opálos Emlékszilánk (mob/boss-loot, ritka) emlék-
# töredékekre váltható. Minden kulcs élőben olvasódik (/icesmp reload).
memory-shards:
  xp-amount: 500      # a /emlek xp jóváírt kaszt-XP-je
  costs:
    xp: 3             # szilánk-költség: kaszt-XP csomag
    talent: 5         # szilánk-költség: +1 kaszt-talentpont
    spec: 8           # szilánk-költség: a spec-választás szint-kapujának feloldása
    lore: 1           # szilánk-költség: egy emlék-töredék (hangulat)
