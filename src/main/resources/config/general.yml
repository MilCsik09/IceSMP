# IceSMP konfiguráció — general (a ConfigManager az összes config/*.yml-t betölti)
# ===== IceSMP Teljes Konfiguráció =====
# Beállítások, HUD, Valuta és Lokalizáció

settings:
  default-faction: "NEUTRAL"
  debug: true

hud:
  # Élő játékos-HUD: oldalsáv (frakció, valuta, kaszt+szint, esemény),
  # frakció-színes tab-lista, és boss-bar a raid / vérhold / világboss alatt.
  enabled: true
  refresh-ticks: 20
  profile:
    enabled: true
    update-interval-ticks: 5
    lifetime-ticks: 200
    distance: 3.0
    height-offset: -0.25
