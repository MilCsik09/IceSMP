# IceSMP konfiguráció — pets (a ConfigManager a támogatott CONFIG_FILES-listát tölti be)
# ===== Idézett társak (pet/minion) =====
# max-active: hány ideiglenes varázslat-minionja lehet egyszerre egy játékosnak (spam-védelem);
# talent-health-share: a gazda kaszt "max-health" talentjeinek hányada száll a minionra.
# Társ-parancs: lopakodás + jobb katt a saját minionon → állásmód-váltás.
pets:
  # Rituálé-idézés (Szentségtelen ghúl / Boszorkánymester démon): kellék + éjszaka.
  # A forma a társszinttel automatikusan fejlődik (tier2/tier3-level), az idézett társ
  # bonus-levels erő-prémiumot kap (a nehezebb beszerzés ellentételezése).
  # Az Imp (vex) falakon átrepül — ez szándékos (démon-fantázia), nem hiba.
  # A Vadmester Istállójának kapacitása; a befogás e felett fail-closed elutasít.
  stable:
    maximum: 3
  summon:
    night-only: true
    bonus-levels: 5
    mutation-bonus-levels-per-stage: 2
    tier2-level: 15
    tier3-level: 25
    heart-drop-chance: 0.03   # Nyughatatlan Szív: élőhalott-kill (Szentségtelen)
    seal-drop-chance: 0.06    # Démon-pecsét: boszorka/illager-kill (Boszorkánymester)
  capture:
    # Erő-tiltólista: ezek a lények egyik szereppel sem foghatók be (meta-törők).
    blocklist:
      - WARDEN
      - RAVAGER
      - IRON_GOLEM
      - ELDER_GUARDIAN
      - WITHER
      - ENDER_DRAGON
  max-active: 8
  talent-health-share: 0.5
  # Társvért (ritka szörny-zsákmány a társ-tartó kasztoknak): jobb katt vele a saját
  # társadon → a társ páncélt és életerőt kap; a felszerelés a durable társprofilban él.
  equipment:
    drop-chance: 0.01   # esély szörny-killenként (csak amíg nincs felszerelve)
    armor-bonus: 4.0    # +armor a társnak
    health-bonus: 4.0   # +max életerő a társnak
  # Vadmester / Nekromanta társa (ROADMAP 12. + befogás): bármilyen mob lehet a társ,
  # befogó itemmel (Vadmester = nem ellenséges állat, Nekromanta = ellenséges / élőholt mob).
  # Megnevezett, szintet lépő companion; a nem szelídíthető társakat teleport-követés tartja a gazda mellett.
  companion:
    max-level: 30
    # A társ halála után ennyi másodpercig nem idézhető újra (a halálnak tétje van).
    death-respawn-seconds: 120
    base-xp: 10
    increment-per-level: 5
    xp-per-kill: 2
    health-per-level: 2.0
    damage-per-level: 0.5
    # Ennél messzebb (blokk) a társ visszateleportál a gazdához (lemaradás esetén).
    follow-distance: 16.0
    # Ennél messzebb (blokk) a társ gyalog elindul a gazda után (alap követés minden petnek).
    follow-start-distance: 5.0
    # Idézéskor a játékos körüli, már betöltött és Folia-lokális oszlopokban keres
    # stabil talajt és három blokknyi szabad testteret. Sikertelen keresésnél nincs spawn.
    spawn-search-radius: 4
    spawn-vertical-range: 2
    # Plugin-vezérelt harc (a mob saját AI-jától függetlenül): a társ a célpont felé
    # pathfinderrel megy, és a plugin osztja a sebzést — így bármilyen mob "rendes pet".
    tick-ticks: 5             # milyen sűrűn fusson a társ-vezérlő (tick)
    attack-damage-base: 3.0   # alap sebzés (+ szintenkénti damage-per-level)
    attack-reach: 2.6         # ekkora távolságból üt (blokk)
    attack-cooldown-ticks: 16 # két ütés közti idő (tick)
    chase-speed: 1.3          # üldözési sebesség-szorzó
    aggro-range: 10.0         # ennyiről véd meg automatikusan ellenséges mobtól (blokk)
    leash-range: 24.0         # ennél messzebb levő célpontot elenged (blokk)
