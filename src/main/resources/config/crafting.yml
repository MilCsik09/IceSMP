# IceSMP konfiguráció — crafting (a ConfigManager az összes config/*.yml-t betölti)
# ===== Kaszt/szakma-alapú craftolási korlátozások =====
# required-job: kaszt azonosító (pl. "warrior") vagy "ANY" (bármely kaszt megfelel) + required-level.
# required-profession: szakma azonosító (pl. "armorer") + required-profession-level.
# Ha mindkettő meg van adva, mindkét feltételnek teljesülnie kell.
crafting-restrictions:
  enabled: true
  notify-cooldown-seconds: 3
  rules:
    # === ARMORER: a netherite-felszerelést a páncélkovács kovácsolja (csúcs-tier) ===
    netherite-gear:
      required-profession: "armorer"
      required-profession-level: 25
      materials:
        - "NETHERITE_SWORD"
        - "NETHERITE_PICKAXE"
        - "NETHERITE_AXE"
        - "NETHERITE_SHOVEL"
        - "NETHERITE_HOE"
        - "NETHERITE_HELMET"
        - "NETHERITE_CHESTPLATE"
        - "NETHERITE_LEGGINGS"
        - "NETHERITE_BOOTS"

    # === MINER: a netherite-rúd finomítása (a bányász olvaszt/kohósít; a kovács ebből forgat gear-t) ===
    netherite-refining:
      required-profession: "miner"
      required-profession-level: 20
      materials:
        - "NETHERITE_INGOT"

    # === LUMBERJACK: finom faipari termékek (számszeríj + pajzs); az ÍJat NEM kapuzzuk (íjász alap) ===
    fine-woodwork:
      required-profession: "lumberjack"
      required-profession-level: 8
      materials:
        - "CROSSBOW"
        - "SHIELD"

    # === ALCHEMIST: a főzőállványt csak alkimista építi (alacsony szint = puha kölcsönös függés) ===
    brewing-station:
      required-profession: "alchemist"
      required-profession-level: 5
      materials:
        - "BREWING_STAND"

    # === ENCHANTER: az bűvölő-asztalt csak enchanter építi (alacsony szint) ===
    enchanting-station:
      required-profession: "enchanter"
      required-profession-level: 5
      materials:
        - "ENCHANTING_TABLE"

    # === COOK: összetett ételek (a nyers sültek szabadok maradnak) ===
    fine-cooking:
      required-profession: "cook"
      required-profession-level: 6
      materials:
        - "CAKE"
        - "PUMPKIN_PIE"
        - "RABBIT_STEW"

    # HERBALIST + FISHERMAN: ezeknek a craft-asztali kapuzás erőltetett lenne — az értékük a
    # GYŰJTÉS és a főző-/alkimista-alapanyag-ellátás. Nekik a főzés-hook (brew) vagy egy gyűjtés-
    # oldali mechanika illik jobban — lásd a tervet (ROADMAP/IDEAS), nem ebben a config-körben.

# ===== Signature-item perkek (K2/K3/K4 — frakció-kapus craftolt tárgyak) =====
# Minden kulcs élőben olvasódik (/icesmp reload után restart nélkül él).
signature:
  # Bootstrap-regisztrált EGYEDI enchantok a signature itemeken (Jégfog, Vihartűz,
  # Vérszomj, Fagypáncél, Főnixtoll, Érc-érzék, Bokic Kegye) — a magyar nevük valódi
  # enchant-sorként jelenik meg a tooltipben (kliens-mod és resource pack nélkül).
  # false = a craft nem stampeli rá (a már regisztrált enchantok megmaradnak a registryben).
  custom-enchants: true
  # Cryghaliris (BLUE)
  kallan:
    arrow-velocity-mult: 1.5   # a nyíl sebesség-szorzója
    armor-pierce: 0.15         # páncéltörés: végső sebzés +15%
  jegvert:
    damage-mult: 0.8           # bejövő sebzés-szorzó (0.8 = -20%)
  kantar:
    speed-add: 0.05            # a felkantározott hátas sebesség-bónusza
  # Perinfernicitas (RED)
  tuzkopo:
    arrow-velocity-mult: 1.5
  agyar:
    damage-mult: 1.15          # közelharci sebzés-szorzó
    offhand-axe-mult: 1.3      # ha a másik kézben balta van
  tollkopeny:
    fire-immunity: true        # tűz/láva/izzó blokk sebzés kioltása
  # Ryanora & Caldestera (NEUTRAL) — K4
  csakany:
    bonus-drop-chance: 0.2     # érc-töréskor extra drop esélye (0-1)
    stack-with-event: false    # false = bányász-láz esemény ALATT a perk szünetel (nincs stack)
  horgaszbot:
    bonus-drop-chance: 0.2     # fogáskor dupla zsákmány esélye (0-1)
    stack-with-event: false    # false = halászati láz ALATT a perk szünetel
  bankbetet:
    value: 25.0                # beváltási érték Creutzérben (jobb-katt; a papír elfogy)
  szarvas:
    cooldown-seconds: 120      # Szellemszarvas-hívás visszatöltődése
    duration-seconds: 90       # a hátas élettartama (utána köddé válik)
    speed: 0.3                 # a hátas sebesség-attribútuma (vanília ló: ~0.1-0.34)
    jump: 0.8                  # ugrás-erő
