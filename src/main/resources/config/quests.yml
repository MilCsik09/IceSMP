    repeatable: true
    cooldown-hours: 24
    # Gameplay-audit: a frakció-független napi NPC-questek végre rotálódnak —
    # a napi-npc csoportból naponta 3 elérhető (nap-determinisztikus választás).
    rotation-group: "napi-npc"
    rotation-daily-count: 3
    objectives-mode: "ALL"
    objectives:
      1:
        type: "KILL_MOBS"
        count: 10
        description: "Szörnyek"
      2:
        type: "COLLECT_ITEMS"
        count: 16
