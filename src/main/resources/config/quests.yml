# IceSMP konfiguráció — quests (a ConfigManager az összes config/*.yml-t betölti)
# ===== Napi küldetések (ROADMAP 8.) =====
daily-quests:
  enabled: true
  daily_hunt:
    amount: 20
    reward: 60
  daily_fish:
    amount: 10
    reward: 50
  daily_gather:
    amount: 64
    reward: 40

# ===== Elérések (ROADMAP 8.) =====
achievements:
  enabled: true

# ===== Közösségi célok (frakció-szintű, közös számláló) =====
# Egy megosztott számláló, amibe egy frakció (vagy az egész szerver) minden
# tagja beleszámít — pl. "a Piros frakció együtt gyűjtsön 1000 vasat".
# Teljesítéskor: broadcast + a frakciókasszába jutalom + rövid buff a tagoknak,
# majd a számláló nullázódik (újra hajszolható). A faction: "ALL" = szerver-szintű
# (mind a négy kassza kap + mindenki buffot). Támogatott objective.type-ok:
# KILL_MOBS, COLLECT_ITEMS, BREAK_BLOCKS, KILL_PLAYERS, KILL_WORLDBOSS, WIN_RAID.
community-goals:
  enabled: true
  red_iron_drive:
    faction: "RED"
    display-name: "Vas-gyűjtő Hadjárat"
    objective:
      type: "COLLECT_ITEMS"
      materials:
        - "IRON_INGOT"
      count: 1000
    reward-treasury: 500
    reward-buff-minutes: 15
  server_hunt:
    faction: "ALL"
    display-name: "A Nagy Vadászat"
    objective:
      type: "KILL_MOBS"
      count: 5000
    reward-treasury: 250
    reward-buff-minutes: 10
  blue_fish_market:
    faction: "BLUE"
    display-name: "Kék Halpiac"
    objective:
      type: "COLLECT_ITEMS"
      materials:
        - "COD"
        - "SALMON"
      count: 800
    reward-treasury: 400
    reward-buff-minutes: 12
  neutral_ore_exchange:
    faction: "NEUTRAL"
    display-name: "Semleges Szén-tőzsde"
    objective:
      type: "BREAK_BLOCKS"
      materials:
        - "COAL_ORE"
        - "DEEPSLATE_COAL_ORE"
      count: 2000
    reward-treasury: 300
    reward-buff-minutes: 10
  dark_undead_purge:
    faction: "DARK"
    display-name: "Holtak Tisztogatása"
    objective:
      type: "KILL_MOBS"
      entity-type: "ZOMBIE"
      count: 3000
    reward-treasury: 350
    reward-buff-minutes: 12
  red_raid_conquest:
    faction: "RED"
    display-name: "Piros Hódító Hadjárat"
    objective:
      type: "WIN_RAID"
      count: 20
    reward-treasury: 450
    reward-buff-minutes: 15
  server_worldboss_hunt:
    faction: "ALL"
    display-name: "Világfaló Vadászat"
    objective:
      type: "KILL_WORLDBOSS"
      count: 5
    reward-treasury: 800
    reward-buff-minutes: 20

# ===== Küldetések (quest-keretrendszer) =====
# Objective típusok:
#   KILL_MOBS (count, opcionális entity-type + min-mob-level) • KILL_PLAYERS (count)
#   BREAK_BLOCKS / PLACE_BLOCKS / CRAFT_ITEMS / COLLECT_ITEMS / CONSUME_ITEMS
#     (materials + count) • CATCH_FISH / ENCHANT_ITEMS (count)
#   BREED_ANIMALS (count, opcionális entity-type)
#   VISIT_TERRITORY (territory) • REACH_LEVEL (level)
#   TALK_TO_NPC (npc: a FancyNpcs NPC belső neve — /npc create <név>)
#   DELIVER_ITEMS (npc + materials + count: vidd el a tárgyakat az NPC-nek,
#     aki ÁTVESZI őket — gyűjtő-beszállító questek)
#   PARKOUR_TRIAL (course: a /parkour pálya azonosítója)
#   SMELT_ITEMS (materials + count: kohóból kivét) • TAME_ANIMALS (count,
#     opcionális entity-type) • TRADE_WITH_VILLAGER (count)
#   EXPLORE_BIOME (biome: pl. "cherry_grove" vagy "minecraft:cherry_grove")
#   WIN_RAID (count: nyert raidek JELENTKEZETT harcosként) • KILL_WORLDBOSS (count)
# Feltételek: requires-job, requires-faction, requires-level, requires-quest (lánc).
# Ismétlődés: repeatable: true + cooldown-hours (pl. 24 = napi quest; 0 = azonnal).
# Auto-indulás: auto-start-territory: <territory-id> — a területre lépve a quest
# magától felkerül (ha a feltételek teljesülnek).
# TÖBB OBJEKTÍVA egy questben: a sima "objective:" helyett "objectives:" alá
# számozott feladatok (1, 2, ...), mindegyik saját type/count/materials/stb.
# mezőkkel (opcionális "description" a HUD-címkéhez). Az "objectives-mode":
#   ALL      = párhuzamos (mindet teljesíteni kell, tetszőleges sorrendben) — pl.
#              "ölj 10 mobot ÉS hozz 16 kenyeret";
#   SEQUENCE = sorban (mindig csak az aktuális lépés halad) — story-lánc.
# Egyetlen questben KEVERHETŐK a típusok. Példa: lásd alább a "hero_trial"-t.
# Jutalmak: class-xp, currency {type, amount}, items, unlock-spell, cleanse-sins.
#   A currency.type lehet konkrét valuta (RED/BLUE/NEUTRAL/DARK) vagy "OWN" —
#   utóbbi a játékos SAJÁT frakciójának valutáját adja.
#   items: tárgy-jutalmak "MATERIAL:DARAB" formában, pl. ["IRON_SWORD:1", "BREAD:16"].
# giver-npc: a questet ez a FancyNpcs NPC ADJA — rákattintva automatikusan
# felveszed, ha a feltételek teljesülnek (a /quest accept továbbra is működik).
# dialogue: az NPC "mondja" a story-t — speaker (megjelenő név), give (sorok a
# quest átadásakor), complete (sorok a leadáskor / beszélgetéskor); a sorok
# ~1,5 mp-enként követik egymást. Példa:
#   dialogue:
#     speaker: "Aldric mester"
#     give:
#       - "Üdv, vándor! Régóta várok valakire, aki elég bátor."
#       - "Hozz nekem 10 vasat a bányából — megfizetem."
#     complete:
#       - "Kiváló munka! Fogd a jussod."
# Választós párbeszéd: a dialogue.give sorok után kattintható opciók
# jeleníthetők meg, amelyek egy másik questet vetetnek fel — elágazó story.
#   dialogue:
#     give: ["Két út áll előtted..."]
#     choices:
#       1: { text: "Segítek a földeken", quest: "farm_help" }
#       2: { text: "Inkább harcolok", quest: "monster_hunt" }
# NPC napi rotáció: a rotation-group: <név> csoportba tett questekből naponta
# csak rotation-daily-count darab elérhető (nap-determinisztikus választás),
# így egy NPC minden nap friss felhozatalt kínál a pooljából.
# Adminok JÁTÉKON BELÜL is készíthetnek questeket (/quest admin create|set|delete)
# — azok a plugin-mappa custom-quests.yml fájljába kerülnek, ugyanezzel a sémával,
# és a lentiekkel együtt töltődnek be (azonos id-nél a configbeli nyer). A
# párbeszéd parancsból: /quest admin set <id> dialogue.give Első sor|Második sor
quests:
  # --- Kaszt-próbák (bevezető questek) ---
  warrior_trial:
    display-name: "A Harcos Próbája"
    description: "Bizonyítsd erődet: ejts el 15 szörnyet."
    requires-job: "warrior"
    objective:
      type: "KILL_MOBS"
      count: 15
    rewards:
      class-xp: 200
  archer_trial:
    display-name: "Az Íjász Próbája"
    description: "Vadássz le 12 szörnyet."
    requires-job: "archer"
    objective:
      type: "KILL_MOBS"
      count: 12
    rewards:
      class-xp: 200
  wizard_trial:
    display-name: "A Varázsló Próbája"
    description: "Gyűjts mágikus reagenseket: szedj 10 virágot."
    requires-job: "wizard"
    objective:
      type: "BREAK_BLOCKS"
      count: 10
      materials:
        - "DANDELION"
        - "POPPY"
        - "BLUE_ORCHID"
        - "ALLIUM"
        - "OXEYE_DAISY"
        - "CORNFLOWER"
        - "LILY_OF_THE_VALLEY"
    rewards:
      class-xp: 200
  assassin_trial:
    display-name: "Az Orgyilkos Próbája"
    description: "Némítsd el a sötétség 10 teremtményét."
    requires-job: "assassin"
    objective:
      type: "KILL_MOBS"
      count: 10
    rewards:
      class-xp: 200
  # --- Kaszt-mester próbák (NPC-s láncok a kezdő próbák után) ---
  # A mester-NPC-ket a szerver-csapat helyezi ki FancyNpcs-szel a lenti belső
  # nevekkel (pl. /npc create harcos_mester), a próbapályákat a /parkour
  # paranccsal (pl. /parkour setstart harcos_proba ...). Amíg nincsenek kint,
  # a láncok egyszerűen nem haladnak — semmi nem törik.
  # A mentor-questet a játékos veszi fel (/quest accept vagy a quest GUI), a
  # mester-próbát viszont maga a mester-NPC ADJA (giver-npc): a mentor-quest
  # az NPC-nél teljesül, és ugyanazzal a kattintással megkapod a próbát.
  warrior_mentor:
    dialogue:
      speaker: "Aldric mester"
      complete:
        - "Szóval te volnál az új penge... Lássuk, mit érsz."
    display-name: "A Harcos Mestere"
    description: "Keresd fel a harcos mestert a fővárosban, és jelentkezz a mester-próbára."
    requires-job: "warrior"
    requires-quest: "warrior_trial"
    objective:
      type: "TALK_TO_NPC"
      npc: "harcos_mester"
    rewards:
      class-xp: 100
  warrior_master_trial:
    dialogue:
      speaker: "Aldric mester"
      give:
        - "Az erőpróba-pálya vár. Ha végigmész rajta, harcosnak nevezhetlek."
      complete:
        - "Végigmentél? Akkor mostantól a tanítványom vagy. Büszkeséggel tölt el."
    giver-npc: "harcos_mester"
    display-name: "A Harcos Mester-próbája"
    description: "Teljesítsd a mester erőpróba-pályáját (/parkour start harcos_proba)."
    requires-quest: "warrior_mentor"
    objective:
      type: "PARKOUR_TRIAL"
      course: "harcos_proba"
    rewards:
      class-xp: 400
  archer_mentor:
    dialogue:
      speaker: "Lysa mesterasszony"
      complete:
        - "A szemed éles, de a lábad lassú, vándor."
    display-name: "Az Íjász Mestere"
    description: "Keresd fel az íjász mestert a fővárosban, és jelentkezz a mester-próbára."
    requires-job: "archer"
    requires-quest: "archer_trial"
    objective:
      type: "TALK_TO_NPC"
      npc: "ijasz_mester"
    rewards:
      class-xp: 100
  archer_master_trial:
    dialogue:
      speaker: "Lysa mesterasszony"
      give:
        - "Fuss végig az ügyességi pályámon — az íjász lába a fegyvere fele."
      complete:
        - "Fürge vagy, mint a nyílvessző. Megérdemled a címed."
    giver-npc: "ijasz_mester"
    display-name: "Az Íjász Mester-próbája"
    description: "Teljesítsd a mester ügyességi pályáját (/parkour start ijasz_proba)."
    requires-quest: "archer_mentor"
    objective:
      type: "PARKOUR_TRIAL"
      course: "ijasz_proba"
    rewards:
      class-xp: 400
  wizard_mentor:
    dialogue:
      speaker: "Orvus főmágus"
      complete:
        - "Érzem benned az erőt... de a mágia fegyelem nélkül csak füst."
    display-name: "A Varázsló Mestere"
    description: "Keresd fel a varázsló mestert a fővárosban, és jelentkezz a mester-próbára."
    requires-job: "wizard"
    requires-quest: "wizard_trial"
    objective:
      type: "TALK_TO_NPC"
      npc: "varazslo_mester"
    rewards:
      class-xp: 100
  wizard_master_trial:
    dialogue:
      speaker: "Orvus főmágus"
      give:
        - "A tornyom próbája megtanít összpontosítani. Indulj!"
      complete:
        - "A torony elfogadott. Az elméd immár penge — használd bölcsen."
    giver-npc: "varazslo_mester"
    display-name: "A Varázsló Mester-próbája"
    description: "Teljesítsd a mester tornypróbáját (/parkour start varazslo_proba)."
    requires-quest: "wizard_mentor"
    objective:
      type: "PARKOUR_TRIAL"
      course: "varazslo_proba"
    rewards:
      class-xp: 400
  assassin_mentor:
    dialogue:
      speaker: "A Névtelen"
      complete:
        - "Pszt... a falak is figyelnek. Jó, hogy megtaláltál."
    display-name: "Az Orgyilkos Mestere"
    description: "Keresd fel az orgyilkos mestert az árnyak közt, és jelentkezz a mester-próbára."
    requires-job: "assassin"
    requires-quest: "assassin_trial"
    objective:
      type: "TALK_TO_NPC"
      npc: "orgyilkos_mester"
    rewards:
      class-xp: 100
  assassin_master_trial:
    dialogue:
      speaker: "A Névtelen"
      give:
        - "Az árnypálya elnyeli az ügyetleneket. Te talán túléled."
      complete:
        - "Egy hang nélkül tetted meg. Az árnyak mostantól testvérüknek hívnak."
    giver-npc: "orgyilkos_mester"
    display-name: "Az Orgyilkos Mester-próbája"
    description: "Teljesítsd a mester árnypályáját (/parkour start orgyilkos_proba)."
    requires-quest: "assassin_mentor"
    objective:
      type: "PARKOUR_TRIAL"
      course: "orgyilkos_proba"
    rewards:
      class-xp: 400
  # --- Példa: több-objektívás quest (párhuzamos ALL mód) ---
  # "Ölj 10 mobot ÉS hozz 16 kenyeret" — a két feladat egymástól függetlenül
  # halad, a quest akkor zárul, ha mindkettő kész. Repeatable, napi cooldownnal.
  hero_trial:
    display-name: "A Hős Napi Próbája"
    description: "Tisztítsd meg a vidéket és lásd el a falut."
    repeatable: true
    cooldown-hours: 24
    objectives-mode: "ALL"
    objectives:
      1:
        type: "KILL_MOBS"
        count: 10
        description: "Szörnyek"
      2:
        type: "COLLECT_ITEMS"
        count: 16
        materials:
          - "BREAD"
        description: "Kenyér"
    rewards:
      class-xp: 150
      currency:
        type: "OWN"
        amount: 40
  # --- Nekromanta beavatás: zarándoklat a Sötét romvárosba ---
  necromancer_initiation:
    display-name: "Sötét Beavatás"
    description: "Zarándokolj el a Sötét romvárosba, és hajts végre rituálét az oltárnál."
    requires-faction: "DARK"
    objective:
      type: "VISIT_TERRITORY"
      territory: "dark-capital"
    rewards:
      class-xp: 100
  # --- Vezeklés-lánc: az egyetlen visszaút a sötét paktumból ---
  penance_1:
    display-name: "Vezeklés I. — A Penge"
    description: "Fordítsd erődet a sötétség ellen: pusztíts el 30 erős szörnyet (min. Lvl 2)."
    requires-faction: "DARK"
    objective:
      type: "KILL_MOBS"
      count: 30
      min-mob-level: 2
    rewards:
      class-xp: 150
  penance_2:
    display-name: "Vezeklés II. — Az Alázat"
    description: "Tanulj alázatot: fogj ki 20 halat."
    requires-quest: "penance_1"
    objective:
      type: "CATCH_FISH"
      count: 20
    rewards:
      class-xp: 150
  penance_3:
    display-name: "Vezeklés III. — A Feloldozás"
    description: "Az utolsó próba: győzz le 50 elit szörnyet (min. Lvl 4). A paktum megtörik."
    requires-quest: "penance_2"
    objective:
      type: "KILL_MOBS"
      count: 50
      min-mob-level: 4
    rewards:
      class-xp: 400
      currency:
        type: "NEUTRAL"
        amount: 100
      cleanse-sins: true

  # --- Hiányzó kaszt-próbák (bevezető questek a maradék kasztokhoz) ---
  druid_trial:
    display-name: "A Druida Próbája"
    description: "Kösd össze magad a természettel: párosíts 5 állatot a vadonban."
    requires-job: "druid"
    objective:
      type: "BREED_ANIMALS"
      count: 5
    rewards:
      class-xp: 200
  paladin_trial:
    display-name: "A Paplovag Próbája"
    description: "Bizonyítsd szent eltökéltséged: ejts el 15 szörnyet."
    requires-job: "paladin"
    objective:
      type: "KILL_MOBS"
      count: 15
    rewards:
      class-xp: 200
  death_knight_trial:
    display-name: "A Halállovag Próbája"
    description: "Tisztítsd meg a vidéket a rontástól: pusztíts el 15 erős szörnyet (min. Lvl 1)."
    requires-job: "death_knight"
    objective:
      type: "KILL_MOBS"
      count: 15
      min-mob-level: 1
    rewards:
      class-xp: 200
  shaman_trial:
    display-name: "A Sámán Próbája"
    description: "Faragj totemeket: gyűjts 10 rönköt az erdőből."
    requires-job: "shaman"
    objective:
      type: "BREAK_BLOCKS"
      count: 10
      materials:
        - "OAK_LOG"
        - "BIRCH_LOG"
        - "SPRUCE_LOG"
        - "JUNGLE_LOG"
        - "ACACIA_LOG"
        - "DARK_OAK_LOG"
        - "MANGROVE_LOG"
        - "CHERRY_LOG"
    rewards:
      class-xp: 200
  monk_trial:
    display-name: "A Szerzetes Próbája"
    description: "Fegyelmezd testedet és elmédet: győzz le 15 szörnyet puszta elszántsággal."
    requires-job: "monk"
    objective:
      type: "KILL_MOBS"
      count: 15
    rewards:
      class-xp: 200
  priest_trial:
    display-name: "A Pap Próbája"
    description: "Gyűjts szentfényt a szentély számára: bányássz 10 fénykövet."
    requires-job: "priest"
    objective:
      type: "BREAK_BLOCKS"
      count: 10
      materials:
        - "GLOWSTONE"
    rewards:
      class-xp: 200
  warlock_trial:
    display-name: "A Boszorkánymester Próbája"
    description: "Pecsételd meg paktumod: küldj a mélységbe 15 teremtményt."
    requires-job: "warlock"
    objective:
      type: "KILL_MOBS"
      count: 15
    rewards:
      class-xp: 200
  demon_hunter_trial:
    display-name: "A Démonvadász Próbája"
    description: "Vadássz a sötétség szolgáira: semmisíts meg 15 erős szörnyet (min. Lvl 1)."
    requires-job: "demon_hunter"
    objective:
      type: "KILL_MOBS"
      count: 15
      min-mob-level: 1
    rewards:
      class-xp: 200
  evoker_trial:
    display-name: "A Sárkányidéző Próbája"
    description: "Hangold rá magad a sárkány-mágiára: gyűjts 10 ametisztfürtöt."
    requires-job: "evoker"
    objective:
      type: "BREAK_BLOCKS"
      count: 10
      materials:
        - "AMETHYST_CLUSTER"
    rewards:
      class-xp: 200

  # --- Szakma-questek (nem kaszthoz kötöttek) ---
  miner_ore_haul:
    display-name: "Ércfejtő Norma"
    description: "Bányássz ki 64 érctömböt a mélyben."
    objective:
      type: "BREAK_BLOCKS"
      count: 64
      materials:
        - "IRON_ORE"
        - "DEEPSLATE_IRON_ORE"
        - "GOLD_ORE"
        - "DEEPSLATE_GOLD_ORE"
        - "COPPER_ORE"
        - "DEEPSLATE_COPPER_ORE"
    rewards:
      currency:
        type: "OWN"
        amount: 60
      items:
        - "IRON_PICKAXE:1"
  angler_big_catch:
    display-name: "Nagy Fogás"
    description: "Fogj ki 20 halat a vizekből."
    objective:
      type: "CATCH_FISH"
      count: 20
    rewards:
      currency:
        type: "OWN"
        amount: 50
      items:
        - "FISHING_ROD:1"
  smith_smelt_iron:
    display-name: "Kovács Kaloda"
    description: "Olvassz be 32 vasat a kohóban."
    objective:
      type: "SMELT_ITEMS"
      count: 32
      materials:
