    rewards:
      currency:
        type: "OWN"
        amount: 55
      items:
        - "ANVIL:1"
  farmer_harvest:
    display-name: "Learatás Ideje"
    description: "Takaríts be 96 termést a földekről."
    objective:
      type: "COLLECT_ITEMS"
      count: 96
      materials:
        - "WHEAT"
        - "CARROT"
        - "POTATO"
        - "BEETROOT"
    rewards:
      currency:
        type: "OWN"
        amount: 45
      items:
        - "BREAD:16"

  # --- Story-lánc: A Vándorkereskedő Segélykiáltása (elágazó, NPC: vandor_kereskedo) ---
  merchant_distress:
    dialogue:
      speaker: "Benedek kereskedő"
      give:
        - "Segíts, vándor! A karavánomat rablók fosztották ki az úton."
        - "Gyere közelebb, hadd meséljem el, mi történt!"
      complete:
        - "Hála az égnek, hogy megálltál. Elmondom, mire lenne szükségem."
    display-name: "A Kereskedő Segélykiáltása"
    description: "Keresd fel a bajba jutott vándorkereskedőt az úton."
    objective:
      type: "TALK_TO_NPC"
      npc: "vandor_kereskedo"
    rewards:
      currency:
        type: "OWN"
