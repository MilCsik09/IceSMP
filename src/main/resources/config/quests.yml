    riddle: true
    display-name: "Rejtvény: Az első nyom"
    description: "„Ahol minden út összefut, és a kikiáltó hangja messzebb ér, mint a harangszó — ott vár, aki a neveket jegyzi.” A cél rejtve marad: fejtsd meg a sorokat!"
