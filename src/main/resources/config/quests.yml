  # --- Onboarding-lánc (IDEAS A5): "az új játékos első 10 perce vezetett" ---
  # Az "onboarding.first-quest" (lásd fent) állítja fel a láncot ELSŐ belépéskor;
  # innentől a "next" mező viszi tovább automatikusan, lépésenként:
  #   1) onboarding_herald  — beszélj a hírnökkel (a kattintás ugyanitt nyitja meg
  #      a királyság-választó menüt is, ha a hírnök-NPC /npcbind <npc> faction-nel
  #      be van kötve — nincs külön "válassz királyságot" objektíva-típus).
  #   2) onboarding_hunt    — ölj 5 szörnyet (első harc-lecke).
  #   3) onboarding_gather  — gyűjts 10 rönköt (első gyűjtögetés-lecke).
  # A hírnök-NPC-t a szerver-csapat helyezi ki FancyNpcs-szel "hirnok" belső
  # névvel (/npc create hirnok a semleges fővárosban, opcionálisan
  # /npcbind hirnok faction a királyság-választáshoz) — amíg nincs kint, az 1.
  # lépés egyszerűen nem halad, a lánc nem törik, csak vár.
  onboarding_herald:
    dialogue:
      speaker: "Hírnök"
      give:
        - "Üdvözöllek a szigeten, vándor! Én vagyok a Hírnök."
        - "Mielőtt utadra engednélek, ismerkedjünk meg — gyere közelebb!"
      complete:
        - "Örvendek! Mostantól itthon vagy — válaszd ki, melyik királysághoz csatlakozol."
    display-name: "Beszélj a hírnökkel"
    description: "Keresd fel a hírnököt a semleges fővárosban, és válaszd ki a királyságodat."
    next: "onboarding_hunt"
    objective:
      type: "TALK_TO_NPC"
      npc: "hirnok"
    rewards:
      currency:
        type: "OWN"
        amount: 15
  onboarding_hunt:
    display-name: "Első csata"
    description: "Bizonyítsd, hogy készen állsz: ölj meg 5 szörnyet."
    requires-quest: "onboarding_herald"
    next: "onboarding_gather"
    objective:
      type: "KILL_MOBS"
      count: 5
    rewards:
      currency:
        type: "OWN"
        amount: 20
  onboarding_gather:
    display-name: "Első gyűjtögetés"
    description: "Vágj ki 10 rönköt — kezdő felszerelés vár érte."
    requires-quest: "onboarding_hunt"
    next: "onboarding_utmutatas"
    objective:
      type: "COLLECT_ITEMS"
      count: 10
      materials:
        - "OAK_LOG"
        - "BIRCH_LOG"
        - "SPRUCE_LOG"
        - "JUNGLE_LOG"
        - "ACACIA_LOG"
        - "DARK_OAK_LOG"
        - "MANGROVE_LOG"
        - "CHERRY_LOG"
    rewards:
      currency:
        type: "OWN"
        amount: 25
      crate-key: "koznapi:1"
      items:
        - "WOODEN_PICKAXE:1"
        - "BREAD:8"
  # A lánc zárása (gameplay-audit: eddig itt zsákutca volt): a hírnök elmagyarázza a
  # következő lépéseket — kaszt (/class), szakma (/profession join), kaszt-próba.
  onboarding_utmutatas:
    display-name: "Az utad kezdete"
    description: "Térj vissza a hírnökhöz — elmondja, hogyan válassz kasztot (/class), szakmát (/profession join), és hol vár a kaszt-próbád (/quest list)."
    requires-quest: "onboarding_gather"
    objective:
      type: "TALK_TO_NPC"
      npc: "hirnok"
    dialogue:
      speaker: "A Hírnök"
      complete:
        - "Ügyes vagy, vándor. Most jön a java."
        - "Válassz kasztot a /class paranccsal — ez határozza meg, KI leszel."
        - "Válassz szakmát a /profession join paranccsal — ebből fogsz megélni."
        - "És ha készen állsz: a /quest list mutatja a kasztod próbáját. Sok szerencsét!"
    rewards:
      class-xp: 50
      currency:
        type: "OWN"
        amount: 25

# ===== Quest-NPC markerek =====
# A quest-adó / quest-célpont NPC-k felett részecske-aura jelzi a teendőt —
# KIZÁRÓLAG annak a játékosnak, akit érint (kliens-oldali részecske):
# arany = ez az NPC questet tud adni NEKED; zöld = aktív quested hozzá szól.
quest-npc-markers:
  enabled: true
  range: 48
  interval-ticks: 40
