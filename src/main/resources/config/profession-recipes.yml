# IceSMP konfiguráció — profession-recipes (a ConfigManager a támogatott CONFIG_FILES-listát tölti be)
# ===== WoW-szerű szakma recept-lista =====
# Minden recept egy szakmához tartozik, szintet igényel, és vagy szintre nyílik meg
# (learn: level), vagy tervrajzból tanulható (learn: blueprint — NPC-bolt / mob-drop / admin).
# I22 — loot-only: true (csak blueprint-receptre): a tervrajz KIZÁRÓLAG világboss/nehéz
# esemény lootjából eshet — NPC-bolt/sima mob sosem adja; a recept-könyvben lila zárolt sor.
# A recept-könyv: /profession recipes (a tanult/zárolt receptek + craftolás egy kattintással).
#
# Séma:
#   <recept-id>:
#     profession: miner|herbalist|lumberjack|armorer|alchemist|enchanter|fisherman|cook
#     level: <szükséges szakma-szint>
#     learn: level | blueprint          # blueprint = tervrajz kell hozzá
#     display-name: "<megjelenő név>"
#     category: "<kategória-címke>"
#     result:
#       material: <MATERIAL>
#       amount: <db>                     # alapból 1
#       affix-tier: crafted              # HA szerepel, a kész tárgy egyedi minőséget + affixeket kap (random)
#       attributes: [ "<attr>:<érték>[:<slot>[:<művelet>]]", ... ]   # explicit, DETERMINISZTIKUS stat
#         # attr: attack_damage|attack_speed|attack_knockback|max_health|armor|armor_toughness|
#         #       knockback_resistance|movement_speed|luck
#         # slot (elhagyva a Materialból következik): mainhand|offhand|hand|head|chest|legs|feet|armor|body|any
#         # művelet (alapból add): add | base (add_scalar) | mult (multiply_scalar_1, %)
#         # a stat saját lore-sorként jelenik meg; affix-tier mellett a kettő összeadódik
#     ingredients: [ "MATERIAL:db", ... ]
