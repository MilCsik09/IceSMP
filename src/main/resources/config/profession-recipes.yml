    category: "Sötét mágia"
    result: {material: NETHERITE_SWORD, amount: 1, affix-tier: crafted, signature: ejszaka_pengeje, item-model: "icesmp:ejszaka_pengeje"}
    ingredients: ["NETHERITE_SWORD:1", "unique:arnyekpor:4", "ECHO_SHARD:2", "OBSIDIAN:8"]
