# Gameplay vertical slice-ok (Harcos, Sárkányidéző) — live balance. Nem generic mechanic DSL.
classes:
  specialization:
    # A második megtanult specializáció ezen a szinten nyílik, de kizárólag a kész gameplay-v2
    # classoknál (GameplayV2ClassPolicy allowlist); a többi class SECOND-slotja fail-closed marad.
    second-slot-level: 28
    # Spec-váltás csak harcon kívül és közeli ellenségtől távol.
    switch-combat-grace-seconds: 8
    switch-safe-radius: 12.0

  warrior:
    # A nagyobb spellkönyvtárból egyszerre legfeljebb ennyi spell kerül a gyors harci készletbe.
    # Kedvencek felülírják az alap készletet, de ugyanilyen plafonnal.
    active-kit:
      maximum: 7
      berserker:
        - heroic_leap
        - pommel_strike
        - second_wind
        - reckless_swing
        - bloodbath
        - whirlwind
        - berserk
      guardian:
        - bulwark
        - taunt
        - fortify
        - shield_charge
        - aegis
        - whirlwind
        - last_stand

    # 50+ specialization mastery; nem külön XP-engine, Profile v2 loadout mező.
    mastery:
      experience-per-rank: 100
      # A mastery kizárólag valós harci kontextusban gyűlik: ez az anti-AFK/dummy-farm tanú.
      combat-window-seconds: 10
      safe-dump-xp: 4
      intercept-xp: 4
      guard-spend-xp: 5
      capstone-protection-xp: 8

    # Class core: Düh = spell cost, Csatatempó = külön döntési layer.
    battle-tempo:
      heated-threshold: 35
      overflowing-threshold: 75
      attack-gain: 7
      block-gain: 12
      interrupt-gain: 18
      mobility-gain: 8
      intercept-gain: 15
      execution-gain: 12
      target-switch-gain: 10
      target-switch-cooldown-millis: 1500
      # Rövid megszakítás nem nulláz: előbb türelmi ablak, utána lusta decay.
      decay-delay-millis: 5000
      decay-per-second: 8.0
      # Túlcsorduló finisher után részben visszaenged, más fokozat teljesen levezet.
      overflow-finisher-retain: 25

    berserker:
      fury:
        high-threshold: 70
        dealt-gain-per-damage: 0.9
        dealt-gain-cap: 14
        taken-gain-per-damage: 1.2
        taken-gain-cap: 18
        ability-gain: 12
        execution-gain: 16
      exhaustion:
        high-fury-per-second: 5.0
        overdrive-per-second: 9.0
        recovery-per-second: 7.0
        overdrive-end-add: 25
      safe-dump:
        fury-spend: 55
        exhaustion-reduction: 30
      overdrive:
        duration-millis: 5500
        aftermath-millis: 7000
        max-starting-exhaustion: 70
        pve-damage-percent: 30.0
        pvp-damage-percent: 14.0
      # Explicit PvE/PvP caps; nincs one-shotra skálázódó végtelen bonusz.
      pve-max-bonus-percent: 60.0
      pvp-max-bonus-percent: 25.0
      bloodlust:
        health-threshold: 0.45
        regen-ticks: 80
      titan:
        exhaustion-multiplier: 0.65
      whirlwind:
        fury-per-extra-target: 5
      executioner:
        health-threshold: 0.25
        pve-damage-percent: 18.0
        pvp-damage-percent: 8.0
      # Dacoló: nem szinkron lethal-cancel. Kritikus, de túlélhető találat után előbb durable
      # cooldown-witness commitol, és csak ezután fut a region-thread recovery side effect.
      defiant:
        cooldown-seconds: 300
        trigger-health-ratio: 0.20
        heal-to-health-ratio: 0.35
      kallan:
        duration-millis: 8000
        aftermath-millis: 12000

    guardian:
      guard:
        damage-taken-gain: 7
        block-bonus: 15
        oath-damage-gain-per-damage: 1.2
        oath-hit-gain-cap: 20
        bulwark-gain: 22
        taunt-gain: 14
        defense-gain: 18
        shield-charge-cost: 30
        aegis-cost: 60
        last-stand-cost: 80
      bastion:
        extra-guard: 8
      vanguard:
        intercept-cost-reduction: 8
      shield-wall:
        extra-guard: 10
      shield:
        intercept-duration-ticks: 60
        major-duration-ticks: 100
      war-signal:
        duration-ticks: 60
        radius: 8.0
      for-one:
        absorption-amplifier: 2
      for-all:
        duration-ticks: 70
        absorption-amplifier: 0
        radius: 8.0
      last-stand:
        self-duration-ticks: 100

  evoker:
    # A nagyobb spellkönyvtárból egyszerre legfeljebb ennyi spell kerül a gyors harci készletbe.
    active-kit:
      maximum: 7
      devastation:
        - living_flame
        - azure_strike
        - fire_breath
        - disintegrate
        - pyre
        - eternity_surge
        - eternity_breath
      preservation:
        - emerald_blossom
        - dream_breath
        - spiritbloom
        - reversion
        - echo
        - temporal_anomaly
        - rewind

    # 50+ specialization mastery; Profile v2 loadout mező, csak harci kontextusban gyűlik.
    mastery:
      experience-per-rank: 100
      combat-window-seconds: 10
      empowered-release-xp: 4
      resonance-burst-xp: 5
      echo-heal-xp: 4
      imprint-restore-xp: 5

    # Class core: Felerősítés — első kattintás tölt, második elenged; a tartás fokozatot ad.
    # A találat megszakíthatja a töltést, a túl hosszú tartás elhalványul.
    empower:
      spells:
        - fire_breath
        - eternity_surge
        - dream_breath
        - spiritbloom
      rank2-hold-millis: 1200
      rank3-hold-millis: 2400
      fizzle-millis: 6000
      long-breath-extra-millis: 2000
      interrupt-damage: 4.0
      rank2-power-percent: 20.0
      rank3-power-percent: 40.0

    # A Felerősítés + Izzás együttes plafonja; a globális spells.total-power-cap felette is véd.
    max-power-bonus-percent: 65.0

    devastation:
      # Vörös–Kék Eszencia: váltogatott színek töltik az Izzást; azonos szín újraindítja.
      essence:
        red-spells:
          - living_flame
          - fire_breath
          - pyre
          - firestorm
          - dragonrage
        blue-spells:
          - azure_strike
          - disintegrate
          - eternity_surge
          - shattering_star
        burst-threshold: 4
        burst-power-percent: 25.0
        overheat-extra-percent: 8.0
        ember-retention: 2

    preservation:
      # Visszhang: az előkészített gyógyítás egyszer, késleltetve megismétlődik (jelölt társra is).
      echo:
        heal-spells:
          - emerald_blossom
          - dream_breath
          - spiritbloom
          - verdant_embrace
        window-millis: 6000
        long-echo-extra-millis: 3000
        delay-millis: 2000
        heal-amount: 3.0
        deep-extra-heal: 2.0
      # Időlenyomat: kizárólag életerő-visszaállítás (heal-only, egyszer használatos, ablak-korlátos).
      imprint:
        window-millis: 8000
        timeline-extra-millis: 4000
        anomaly-restore-cap-percent: 30.0
        rewind-restore-cap-percent: 60.0

  archer:
    # A nagyobb spellkönyvtárból egyszerre legfeljebb ennyi spell kerül a gyors harci készletbe.
    active-kit:
      maximum: 7
      sharpshooter:
        - hunters_mark
        - multishot
        - piercing_bolt
        - deadeye
        - headshot
        - perfect_focus
        - masterful_shot
      beast_master:
        - hunters_mark
        - multishot
        - wolf_call
        - primal_bond
        - thick_hide
        - stampede
        - king_of_beasts

    # 50+ specialization mastery; Profile v2 loadout mező, csak harci kontextusban gyűlik.
    mastery:
      experience-per-rank: 100
      combat-window-seconds: 10
      weak-point-xp: 5
      coordination-xp: 3
      bond-spend-xp: 4
      capstone-bond-xp: 8

    # Class core: Szélolvasás — fegyelmezett (teljes felhúzású, ritmusban tartott, valós távú)
    # találat olvassa a szelet; a következő fegyelmezett lövés erősebb. A spam töri az olvasást.
    wind:
      full-draw-force: 0.9
      shot-pacing-millis: 900
      minimum-distance: 12.0
      # A repülő nyilak fegyelem-nyilvántartása korlátos és magától lejár: nincs durable
      # állapot, nincs élő entitás-hivatkozás, és nincs ismétlődő takarító task.
      in-flight-maximum: 32
      in-flight-expiry-millis: 15000
      read-window-millis: 5000
      pve-bonus-percent: 18.0
      pvp-bonus-percent: 8.0

    # Explicit PvE/PvP plafon a szél + gyenge pont együttesére; nincs one-shotra skálázódó bonusz.
    pve-max-bonus-percent: 45.0
    pvp-max-bonus-percent: 20.0

    precision:
      # Mesterlövész: azonos prédán épülő teljes-felhúzású láncból gyenge pont nyílik.
      chain-window-millis: 6000
      calm-extra-millis: 3000
      maximum-chain: 5
      weak-point-threshold: 4
      weak-point-pve-percent: 28.0
      weak-point-pvp-percent: 12.0
      deep-shot-extra-percent: 6.0
      volley-retention: 2

    bond:
      # Vadmester: a társsal közös célpont találatai építik a Köteléket; a spelljei költik.
      assist-gain: 7
      instinct-extra-gain: 3
      primal-cost: 40
      harmony-cost-reduction: 10
      king-cost: 80
      primal-regen-ticks: 120
      caretaker-extra-ticks: 60
      king-pet-regen-ticks: 200
      king-self-speed-ticks: 100
      death-retention: 50

  shaman:
    # A nagyobb spellkönyvtárból egyszerre legfeljebb ennyi spell kerül a gyors harci készletbe.
    active-kit:
      maximum: 7
      elemental:
        - lightning_bolt
        - flame_shock
        - searing_totem
        - healing_stream_totem
        - lava_burst
        - chain_lightning
        - ascendance_flame
      enhancement:
        - stormstrike
        - lava_lash
        - windfury_totem
        - earthbind_totem
        - crash_lightning
        - feral_spirit
        - doom_winds
      tidal:
        - healing_surge
        - riptide
        - healing_stream_totem
        - windfury_totem
        - chain_heal
        - healing_rain
        - spirit_tide

    # 50+ specialization mastery; Profile v2 loadout mező, csak harci kontextusban gyűlik.
    mastery:
      experience-per-rank: 100
      combat-window-seconds: 10
      overload-xp: 5
      maelstrom-spend-xp: 4
      capstone-vent-xp: 8
      tide-xp: 4

    # A Felerősítés/Izzás-hoz hasonlóan a bónuszok a közös power-pipeline-on mennek, kettős sapkával.
    max-power-bonus-percent: 40.0

    # Class core: Totemkerék — a négy totemtípusból egyszerre egy fő + egy kísérő élhet;
    # az azonos kategóriájú új totem a régit váltja. Elemi Rezonancia: a totempár elemeihez
    # illő spellek töltik a Túltöltést.
    resonance:
      vihar-spells:
        - lightning_bolt
        - chain_lightning
        - thunderstorm
        - stormkeeper
        - elemental_blast
      tuz-spells:
        - flame_shock
        - lava_burst
        - ascendance_flame
      fold-spells:
        - earth_shock
        - earthquake
      viz-spells:
        - frost_shock
      charge-gain: 1
      overload-threshold: 4
      overload-bonus-percent: 25.0
      overflow-extra-percent: 8.0
      echo-retention: 2
      favored-speed-ticks: 80

    # Erősítő: a közelharci találatok ritmusa építi a Maelstromot; az ablakban landoló
    # találat váltja a Fegyveráldás-oldalt (Vihar↔Föld) és bónuszt ad.
    maelstrom:
      hit-gain: 4
      rhythm-min-millis: 600
      rhythm-max-millis: 1600
      dense-extra-millis: 400
      rhythm-bonus: 4
      steel-extra-bonus: 2
      dance-extra-bonus: 3
      stormstrike-cost: 30
      stormthroat-reduction: 10
      crash-cost: 45
      doom-cost: 70
      capstone-retention: 25
      quake-strength-ticks: 60

    # Hullámhívó: a közvetlen gyógyítás Dagály felé, a lánc-gyógyítás Apály felé tol;
    # az elért oldal a másik család következő castját erősíti, majd visszaáramlik.
    tide:
      direct-heal-spells:
        - healing_surge
        - healing_wave
        - riptide
      chain-heal-spells:
        - chain_heal
        - healing_rain
        - spirit_link
        - ancestral_guidance
      push: 20
      current-extra: 5
      threshold: 60
      deepwater-reduction: 10
      bonus-percent: 20.0
      lord-extra-percent: 8.0
      spring-retention-percent: 25
      life-vein-ticks: 100

  monk:
    # A nagyobb spellkönyvtárból egyszerre legfeljebb ennyi spell kerül a gyors harci készletbe.
    active-kit:
      maximum: 7
      windwalker:
        - tiger_palm
        - blackout_kick
        - rising_sun_kick
        - flying_kick
        - fists_of_fury
        - whirling_dragon_punch
        - serenity
      brewmaster:
        - tiger_palm
        - keg_smash
        - breath_of_fire
        - purifying_brew
        - ironskin_brew
        - fortifying_brew
        - invoke_niuzao
      mistweaver:
        - vivify
        - soothing_mist
        - renewing_mist
        - enveloping_mist
        - essence_font
        - life_cocoon
        - revival

    # 50+ specialization mastery; Profile v2 loadout mező, csak harci kontextusban gyűlik.
    mastery:
      experience-per-rank: 100
      combat-window-seconds: 10
      finisher-xp: 5
      purify-xp: 4
      ripple-xp: 4

    # Class core: Áramlás — a technika-változatosság épít; az ismételt spell semmit nem ad.
    flow:
      variety-gain: 12
      thousand-extra-gain: 4
      decay-delay-millis: 6000
      decay-per-second: 6.0

    max-power-bonus-percent: 40.0

    # Szélfutó: explicit Harcművészeti Lánc — a lépések sorrendje számít, a befejező consume-ol.
    chain:
      steps:
        - tiger_palm
        - blackout_kick
        - rising_sun_kick
      finishers:
        - fists_of_fury
        - whirling_dragon_punch
        - touch_of_death
        - serenity
      threshold: 3
      window-millis: 5000
      light-step-extra-millis: 2500
      finisher-bonus-percent: 22.0
      panther-extra-percent: 6.0
      dragon-speed-ticks: 80

    # Sörfőző: a kapott sebzés korlátos része halasztva, közvetlen élet-lépésekben csorog le
    # (fél szív a padló — a Stagger önmagában sosem öl); kilépés/spec-váltás azonnal lehívja.
    stagger:
      defer-percent: 35.0
      thick-extra-percent: 5.0
      pool-cap-health-percent: 60.0
      iron-extra-percent: 10.0
      drain-period-ticks: 20
      drain-health-percent: 2.5
      purify-percent: 50.0
      quick-sip-extra-percent: 10.0
      breath-purify-percent: 15.0
      capstone-purify-percent: 60.0

    # Ködszövő: legfeljebb három Ködszál; a gyógyítás a kapcsolt társakra hullámzik tovább.
    mist:
      maximum-links: 3
      heal-spells:
        - vivify
        - expel_harm
        - soothing_mist
        - renewing_mist
        - enveloping_mist
        - essence_font
        - revival
      ripple-heal: 3.0
      deep-extra-heal: 2.0
      weave-heal: 2.0

  paladin:
    # A nagyobb spellkönyvtárból egyszerre legfeljebb ennyi spell kerül a gyors harci készletbe.
    active-kit:
      maximum: 7
      holy:
        - flash_heal
        - holy_light
        - beacon_of_light
        - word_of_glory
        - lay_on_hands
        - divine_shield
        - avenging_wrath
      retribution:
        - smite
        - crusader_strike
        - judgment
        - blade_of_justice
        - holy_fire
        - divine_storm
        - final_verdict
      protection:
        - consecration
        - avengers_shield
        - shield_of_the_righteous
        - blessed_hammer
        - consecrated_ground
        - guardian_of_kings
        - final_stand

    # 50+ specialization mastery; Profile v2 loadout mező, csak harci kontextusban gyűlik.
    mastery:
      experience-per-rank: 100
      combat-window-seconds: 10
      beacon-xp: 4
      verdict-xp: 5
      ground-xp: 5
      capstone-ground-xp: 8

    max-power-bonus-percent: 40.0

    # Class core: Meggyőződés és Eskü — a választott irányhoz illő cselekedet épít; magas
    # Meggyőződésnél az irányba vágó castok erősebbek. Az Eskü ülésen belüli választás
    # (/spec esku), alapértelmezése az aktív spec szerepe.
    conviction:
      mercy-spells:
        - flash_heal
        - radiance
        - lay_on_hands
        - holy_light
        - beacon_of_light
        - word_of_glory
        - guardian_angel
      judgment-spells:
        - smite
        - hammer_of_justice
        - holy_wrath
        - crusader_strike
        - judgment
        - blade_of_justice
        - holy_fire
        - divine_storm
        - wake_of_ashes
        - final_verdict
      protection-spells:
        - devotion_aura
        - divine_protection
        - consecration
        - avengers_shield
        - shield_of_the_righteous
        - blessed_hammer
        - consecrated_ground
        - ardent_defender
        - guardian_of_kings
        - final_stand
      cast-gain: 8
      hit-gain: 4
      blessing-extra-gain: 2
      zeal-extra-gain: 2
      threshold: 70
      blessed-reduction: 10
      bonus-percent: 12.0
      decay-delay-millis: 6000
      decay-per-second: 5.0

    # Szentlélek: egy Fényjelző-célpont; a gyógyítás visszhangja egyetlen, korlátos heal.
    beacon:
      echo-spells:
        - flash_heal
        - holy_light
        - word_of_glory
        - lay_on_hands
        - radiance
      echo-heal: 3.0
      warm-extra-heal: 1.5

    # Megtorló: Bűn (judgment) + Dac (blade_of_justice) + Kárhozat (holy_fire) → Verdict.
    verdict:
      finishers:
        - final_verdict
        - divine_storm
      mark-window-millis: 8000
      swift-extra-millis: 2500
      bonus-percent: 24.0
      wrath-extra-percent: 8.0
      weight-strength-ticks: 60
      holy-war-heal: 4.0

    # Oltalmazó: védekező castok és elszenvedett találatok töltik a Pajzstöltetet;
    # a költése Megszentelt Földet terít (egyszeri, korlátos sugarú védő-hullám).
    shield:
      charge-spells:
        - devotion_aura
        - divine_protection
        - consecration
        - avengers_shield
        - blessed_hammer
        - consecrated_ground
        - hammer_of_the_righteous
        - ardent_defender
      cast-gain: 12
      hit-gain: 6
      steel-extra-gain: 3
      righteous-cost: 30
      kings-cost: 60
      final-stand-cost: 80
      holy-wall-reduction: 10
      area-duration-ticks: 80
      capstone-duration-ticks: 120
      area-radius: 7.0
      extended-extra-radius: 2.0
      steadfast-extra-ticks: 40

  demon_hunter:
    # A nagyobb spellkönyvtárból egyszerre legfeljebb ennyi spell kerül a gyors harci készletbe.
    active-kit:
      maximum: 7
      havoc:
        - demons_bite
        - chaos_strike
        - fel_rush
        - blade_dance
        - eye_beam
        - vengeful_retreat
        - the_hunt
      vengeance:
        - shear
        - immolation_aura
        - soul_cleave
        - demon_spikes
        - fiery_brand
        - sigil_of_flame
        - fel_blade

    # 50+ specialization mastery; Profile v2 loadout mező, csak harci kontextusban gyűlik.
    mastery:
      experience-per-rank: 100
      combat-window-seconds: 10
      collect-threshold: 3
      collect-xp: 4
      sigil-xp: 4
      cleave-xp: 3
      capstone-xp: 8

    max-power-bonus-percent: 40.0

    # Class core: Kárhozat-terhelés — a démoni castok terhelést építenek; az áthevült sáv erősít,
    # a túlterhelt sáv többet ad, de minden kapott találat nagyobbat üt (olvasható, kontrollált
    # kockázat, consume_magic-kel kiszellőztethető; nem random büntetés).
    load:
      demonic-spells:
        - chaos_strike
        - immolation_aura
        - eye_beam
        - fel_barrage
        - essence_break
        - metamorphosis_havoc
        - metamorphosis_veng
        - fel_devastation
        - fel_blade
        - the_hunt
      cast-gain: 9
      heated-threshold: 40
      overload-threshold: 80
      heated-bonus-percent: 10.0
      overload-bonus-percent: 20.0
      overload-taken-penalty-percent: 15.0
      consume-vent: 40
      decay-delay-millis: 5000
      decay-per-second: 6.0

    # Tombolás: a sebző castok könnyűsúlyú Lélektöredék-számlálót építenek (nincs item-entitás);
    # a mobilitás-cast gyűjti be őket gyógyulásért és Momentumért.
    fragments:
      damage-spells:
        - demons_bite
        - chaos_strike
        - throw_glaive
        - blade_dance
        - eye_beam
        - fel_barrage
        - essence_break
        - the_hunt
      mobility-spells:
        - fel_rush
        - vengeful_retreat
      cast-gain: 1
      maximum: 5
      heal-per-fragment: 1.0
      otherworld-extra-heal: 1.0

    momentum:
      window-millis: 4000
      master-extra-millis: 2000
      bonus-percent: 15.0
      dancer-extra-percent: 6.0

    # Bosszú: a kapott sebzés Fájdalmat épít; a Sigilek és a lélekvágás ebből táplálkoznak.
    # Egyszerre legfeljebb két Sigil állhat.
    pain:
      hit-gain: 7
      thick-extra-gain: 2
      sigil-cost: 25
      cheap-seal-reduction: 5
      cleave-cost: 30
      cleave-heal: 4.0
      cutter-extra-heal: 2.0
      capstone-cost: 60

    sigil:
      spells:
        - sigil_of_flame
        - fiery_brand
        - demon_spikes
      duration-millis: 8000
      searing-extra-millis: 2000
