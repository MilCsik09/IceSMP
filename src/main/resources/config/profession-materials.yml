    display-name: "&4A Kapu Parazsa"
    item-model: "icesmp:karhozat_parazs"
    lore:
      - "&7A Kárhozat Kapujából kisodródott parázs —"
      - "&7nem ég, nem alszik ki. Csak vár."
      - "&4Csak világbossból / nehéz eventből esik"
