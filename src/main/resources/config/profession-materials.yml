    material: AMETHYST_SHARD
    display-name: "&dOpálos Emlékszilánk"
    custom-model-data: 6014
    lore:
      - "&7Egy Felső elveszett emlékének kristálya —"
      - "&7romok mélyén, erős szörnyeknél rejtőzik."
      - "&8Beváltás: /emlek (visszaemlékezés)"
