  obszidian_szilank:
    material: FLINT
    display-name: "&8Obszidián-szilánk"
    item-model: "icesmp:obszidian_szilank"
    lore:
      - "&7A Kapu körüli mezőkről pattintott"
      - "&7fekete üveg — a napfényt is elnyeli."
      - "&8Bányász köztes alapanyag"
  arnygomba:
    material: CRIMSON_FUNGUS
    display-name: "&5Mortengradi Árnygomba"
    item-model: "icesmp:arnygomba"
    lore:
      - "&7Csak romok pincéiben nő, fény sosem"
      - "&7érte — a Kitaszítottak kenyérpótlója."
      - "&8Gyógynövényész köztes alapanyag"
  lelekhamu:
    material: GUNPOWDER
    display-name: "&7Lélekhamu"
    item-model: "icesmp:lelekhamu"
    lore:
      - "&7Kihunyt lélektűz maradéka. Hideg,"
      - "&7szürke — és mégis, néha megmoccan."
      - "&8Alkimista köztes alapanyag"
  aranyfust_lemez:
    material: GOLD_NUGGET
    display-name: "&6Aranyfüst-lemez"
    item-model: "icesmp:aranyfust_lemez"
    lore:
      - "&7Leheletvékonyra vert arany, a caldesterai"
      - "&7ötvösnegyed büszkesége."
      - "&8Kovács köztes alapanyag"
  gyongyhaz_pikkely:
    material: PRISMARINE_SHARD
    display-name: "&bGyöngyház-pikkely"
    item-model: "icesmp:gyongyhaz_pikkely"
    lore:
      - "&7A Bokic vén pontyainak pikkelye —"
      - "&7a fény hét színére törik rajta."
      - "&8Halász köztes alapanyag"
  vandorfuszer:
    material: COCOA_BEANS
    display-name: "&6Vándorfűszer"
    item-model: "icesmp:vandorfuszer"
    lore:
      - "&7Hét út pora, hét piac illata egy"
      - "&7zacskóban — a karavánok kincse."
      - "&8Szakács köztes alapanyag"
  # --- CSAK boltból vehető (vendor-only) anyagok: pénz-nyelő + recept-kereslet ---
  viaszpecset:
    material: HONEYCOMB
    display-name: "&6Számvevő-pecsétviasz"
    item-model: "icesmp:viaszpecset"
    lore:
      - "&7A Bankárszövetség hivatalos viasza —"
      - "&7amit ez pecsétel, az megmásíthatatlan."
      - "&eCsak boltból vehető (Bankárszövetség)"
  lampaolaj:
    material: GLOW_INK_SAC
    display-name: "&eFinomított Lámpaolaj"
    item-model: "icesmp:lampaolaj"
    lore:
      - "&7A caldesterai lámpagyújtogatók titkos"
      - "&7keveréke — tisztán, kormozás nélkül ég."
      - "&eCsak boltból vehető"
  folyositoszer:
    material: BLAZE_POWDER
    display-name: "&cKovács-folyósítószer"
    item-model: "icesmp:folyositoszer"
    lore:
      - "&7A Vasművek Akadémiájának adalékszere:"
      - "&7nélküle a netherit nem veszi fel a rúnát."
      - "&eCsak boltból vehető"
  # --- CSAK mobból / bossból eső anyagok (3. hullám) ---
  dermedt_konnycsepp:
    material: GHAST_TEAR
    display-name: "&bDermedt Könnycsepp"
    item-model: "icesmp:dermedt_konnycsepp"
    lore:
