    display-name: "&bSarkfény-cseppkő"
    item-model: "icesmp:sarkfeny_cseppko"
    lore:
      - "&7Az északi fény egy cseppje, ami barlang"
      - "&7mélyén kővé dermedt — még mindig táncol."
      - "&8Bányász köztes alapanyag"
  szavannafu_kotel:
