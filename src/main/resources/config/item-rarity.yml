        - "Eleftheria, Soleil, Kallan és Arkynn korából származó ritkaság."
        - "A Hasadás pillanatában szenvedte el az első repedést — és mégis épen maradt."
        - "A Néma Királynő ébredése előtti világ egyetlen tanúja."
        - "Azelőttről való, hogy a nemesség eltűnt volna a föld színéről."
        - "Kallan és Soleil testvérháborújának egyetlen túlélő ereklyéje."
        - "Arkynn népének utolsó, meg nem fosztott kincse."
        - "A világ három birodalma együtt sem tudná újra megalkotni."
        - "Azt beszélik, maga Aetrinita formálta emberi kézzel."
        - "Régebbi, mint Asterobourgh romjai — régebbi, mint a birodalmak."
        - "A Fa első gyermekeinek korából, mikor a világ még egész volt."
        - "Birtoklása önmagában átírja a világ sorsát."
        - "Nincs olyan hatalom, mely fölé nőhetne."
        - "Az idő nem fog rajta — csak megkerüli."
        - "Egyetlen érintése elég, hogy birodalmak omoljanak vagy emelkedjenek."
        - "A teremtés óta létezik, és túl fogja élni a végét is."
        - "Nem lehet lemásolni, csak megtalálni."
        - "Aki birtokolja, a végzet eszközévé válik."
        - "A világ formálódott körülötte, nem fordítva."
        - "Ereje túlmutat minden halandó fogalmán."
        - "Egyetlen darab létezik belőle — és talán soha nem is lesz több."
        - "A mítosz és valóság határán létezik."
        - "Aki ránéz, megérzi: ez több, mint tárgy — ez történelem."
        - "Még Asterlayna zuhanása előtti csillagfényt őriz magában."
        - "A négy testvér — Eleftheria, Soleil, Kallan, Arkynn — mind ismerte egykor."
        - "A Vasművek Akadémiája sem tudná lemásolni; ez nem emberi kéz műve."
        - "Aetrinita levelei susognak, valahányszor a közelébe kerül valaki."
        - "Túléli a birodalmakat, ahogy túlélte a Hasadást is."
