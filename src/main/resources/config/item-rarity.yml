# IceSMP konfiguráció — item-rarity (a ConfigManager az összes config/*.yml-t betölti)
# ===== Egyedi tárgy-raritás + affix rendszer (rolled loot) =====
# Az affixelhető tárgyak (szakma-craft ÉS mob/boss loot) craftoláskor/dropkor VÉLETLEN raritást
# (Ócska->Ereklye) és random attribútum-affixeket kapnak — minden darab egyedi. NEM csak a
# szakma-mestermunkákra vonatkozik: ez a szerver közös tárgy-raritás rendszere.
#   A raritás adja a színt, a NÉV-JELZŐT, az affixek számát/erejét (value-multiplier) és a negatív-esélyt.
#   A 'tiers' csak azt súlyozza, mely raritások eshetnek forrásonként: drop (mob), crafted (szakma), boss.
#   A fegyver/szerszám kéz-slotos affixet kap (sebzés/gyorsaság), a páncél páncél-slotosat.
item-rarity:
  enabled: true
  affixes:
    max_health:      { name: "Szívósság",  min: 1.0,   max: 4.0,  decimals: 0 }
    armor:           { name: "Vértezet",   min: 1.0,   max: 3.0,  decimals: 0 }
    armor_toughness: { name: "Keménység",  min: 1.0,   max: 3.0,  decimals: 0 }
    movement_speed:  { name: "Fürgeség",   min: 0.005, max: 0.02, decimals: 3 }
    attack_damage:   { name: "Élesség",    min: 0.5,   max: 3.0,  decimals: 1 }
    attack_speed:    { name: "Gyorsaság",  min: 0.1,   max: 0.6,  decimals: 2 }
    # Varázserő: %-pont a spell-erő bónuszhoz (a spells.dynamic-scaling plafonja alatt) —
    # a caster-gear ettől ad sebzést. CSAK a WoW-mód (health.enabled) alatt sorsolódik.
    spell_power:     { name: "Varázserő",  min: 1.0,   max: 4.0,  decimals: 0 }
  # Közös RARITY-LÉTRA (WoW/Terraria-reforge stílus): Ócska (csak negatív!) -> Ereklye.
  # A raritás adja a színt, a NÉV-JELZŐT (a jelző illik a raritáshoz), az affixek SZÁMÁT, az
  # ERŐSSÉGET (value-multiplier — így az affix "fedi" a prefixet) és a negatív-esélyt.
  # A mob-loot neve: [Raritás] <raritás-jelző> <alaptárgy-név>; a craftolté: [Raritás] <tervezett név>.
  rarities:
    ocska:
