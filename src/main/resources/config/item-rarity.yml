        - "Nincs olyan király vagy királynő, aki méltó volna hozzá."
  # Mob-loot alaptárgy-nevek family szerint (a jelző a raritásból jön).
  nouns:
    weapon: [ "Penge", "Kard", "Fog", "Tőr", "Szablya", "Pallos" ]
    armor: [ "Vért", "Páncél", "Sisak", "Pajzs", "Köntös" ]
    tool: [ "Szerszám", "Csákány", "Fejsze", "Véső" ]
  # A tier CSAK azt dönti el, mely raritások eshetnek és milyen súllyal (a raritás adja az erőt).
  #   drop    — mob-loot: eshet Ócska is (átkos), ritkán jó
  #   crafted — szakma-craft: nincs Ócska, kiegyensúlyozott
  #   boss    — világboss / nehéz event: magas raritások
  tiers:
    drop:
      weights: { ocska: 25, kozonseges: 40, nem_mindennapi: 22, ritka: 10, epikus: 3 }
    crafted:
      weights: { kozonseges: 30, nem_mindennapi: 32, ritka: 25, epikus: 10, legendas: 3 }
    boss:
      weights: { ritka: 30, epikus: 40, legendas: 25, ereklye: 5 }

  # B54 — Átkozott felszerelés (az Ócska-átok / Első Csend-érintés): BOSS-forrású gear-loot
  # chance eséllyel Átkozott — darabonként damage-bonus-per-piece kimenő sebzés-bónusz
  # (plafon: damage-bonus-cap), cserébe a páncél FELVÉVE NEM VEHETŐ LE — csak a rituálé-oltár
  # Átok-törése (relics.yml: atok_tores, type: uncurse) oldja. A felvétel kétlépcsős
  # megerősítéshez kötött (első katt figyelmeztet, gyors második erősít meg). Élőben olvasódik.
  cursed:
    enabled: true
    chance: 0.08
    damage-bonus-per-piece: 0.1
    damage-bonus-cap: 0.4
    # Tudatos felvétel: az első felhelyezési kísérlet csak figyelmeztet, és ennyi másodpercen
    # belüli MÁSODIK kísérlet erősíti meg (az átkozott páncél utána már nem vehető le szabadon).
    confirm-seconds: 5
