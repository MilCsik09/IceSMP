# Spell-balansz — MINDEN regisztrált spell explicit entry-vel, a kódbeli alapértékekkel.
# Az itt szereplő érték felülbírálja a kódbelit; ha megegyezik vele, nincs hatása (no-op).
#
# 1. DEKLARATÍV spellek (ConfiguredSpell, SpellCatalog): a felülbírálás szerverindításkor
#    épül be — MÓDOSÍTÁS UTÁN SZERVER-ÚJRAINDÍTÁS KELL.
# 2. STATEFUL (saját osztályú) spellek: cast-időben olvassák a fájlt, a /icesmp reload
#    AZONNAL érvényesíti őket (cooldown és cost-amount ezeknél is állítható).
#
# Felülbírálható kulcsok (deklaratív): cooldown, cost-amount, range, radius, damage,
# self-damage, heal-self, feed-self, ignite-ticks, freeze-ticks, knockback.
# A stateful spelleknél a saját mechanika-kulcsaik + cooldown + cost-amount állíthatók.
#
# --- ERŐFORRÁS (MANA, DÜH, ENERGIA...) ÁRAZÁS ---
# Ha a resource rendszer aktív (spells.resource.enabled: true), a spellek ára
# automatikusan a beállított COOLDOWN (újratöltési idő) alapján számolódik ki,
# NEM a 'cost-amount' alapján:
#   • 0 (azonnali)       -> 15 erőforrás
#   • 1 - 30 másodperc   -> 20 erőforrás
#   • 31 - 90 másodperc  -> 30 erőforrás
#   • 91 - 180 másodperc -> 40 erőforrás
#   • 181+ másodperc     -> 50 erőforrás
# (Tehát ha csökkenteni akarod egy képesség Mana-igényét, a cooldownját kell
# alacsonyabbra állítanod, vagy ki kell kapcsolnod az erőforrás-rendszert.)
#
# Ismeretlen spell id esetén a szerver indításkor WARNING-ot ír a logba.
