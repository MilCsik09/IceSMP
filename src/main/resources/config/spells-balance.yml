# Spell-balansz felülbírálások — CSAK az itt megadott kulcsok írják felül a kódbeli értéket.
#
# A spell id a regisztrációs (SpellRegistry) id — ugyanaz, mint a /spell parancsokban és a
# messages.yml "spell.<id>.name" kulcsaiban használt azonosító.
#
# KÉT spell-csoport van, mindkettő ugyanezt a fájlt olvassa:
#
# 1. DEKLARATÍV spellek (ConfiguredSpell, ~343 db, SpellCatalog): a felülbírálás a
#    szerverindítás egyetlen applySpellBalanceOverrides() lépésénél épül be az újraregisztrált
#    spell-példányba. A spellek csak szerverindításkor regisztrálódnak; a /icesmp reload NEM
#    regisztrálja újra őket, tehát MÓDOSÍTÁS UTÁN SZERVER-ÚJRAINDÍTÁS KELL.
#
# 2. STATEFUL (kódba írt osztályú, saját state-et tartó) spellek — druidformák, totemek,
#    beast master / poisoner / guardian jelspellek stb., a spells/ csomagban, ~29 migrált
#    osztály — cast-időben olvassák ezt a fájlt a BaseSpell.balance()/balanceInt() segédeken
#    keresztül, ezért rájuk a /icesmp reload IS AZONNAL HAT (nem kell újraindítás).
#
# Ismeretlen spell id (elgépelés) esetén a szerver indításkor WARNING-ot ír a logba.
spell-balance:
  # példa (alapból kikommentezve — a kódbeli érték él); mana_dart deklaratív (ConfiguredSpell) spell:
  # mana_dart:
  #   damage: 8.0
  #   cooldown: 12

