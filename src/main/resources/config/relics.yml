# IceSMP konfiguráció — relics (a ConfigManager az összes config/*.yml-t betölti)
relics:
  enabled: true
  # Inaktivitás-kezelés: a megadott számú nap után a relikvia törlődik
  # a tulajdonos inventoryjából belépéskor, és újra megszerezhetővé válik.
  inactivity:
    enabled: true
    expiry-days: 14
  # Fegyver-relikviák: PvP-ben gazdát cserélhetnek (a passzívak védettek).
  weapon-relics:
    - "metelytepo"
  pvp-transfer:
    enabled: true
  messages:
    cooldown: "&cA relikvia pihen: &f%seconds%s &cmaradék"
    expired: "&5A(z) &f%relic_name% &5relikvia a hosszú tétlenség miatt elenyészett, és újra megszerezhetővé vált."
  definitions:
    metelytepo:
      display-name: "Mételytépő"
      display-color: "&5"
      # A material/custom-model-data itt dokumentáció: a tényleges értéket a kód adja
      # (RelicManager.registerRelic) — a kettő szinkronban tartandó (GOLDEN_AXE + 4101).
      material: "GOLDEN_AXE"
      custom-model-data: 4101
      lore:
        - "&7A Mélység Népének — a rég letűnt törp"
        - "&7civilizációnak — ősi relikviája."
        - ""
        - "&7Ősi ítélet-mágia lakik benne: e harci"
        - "&7fejsze lesújt a bűnösökre, s igazságot tesz"
        - "&7ott, ahol a Káoszkor rendje szertefoszlott."
    phoenix_wing:
      display-name: "Főnix-szárny"
      display-color: "&c"
      lore:
        - "&7Perinfernicitas lángoló ereklyéje,"
        - "&7Soleil főnixeinek tollából szőve."
        - "&7Viselőjét nem égeti tűz, és zuhanása"
        - "&7lángviharban végződik."
    frost_wing:
      display-name: "Zúzmara-szárny"
      display-color: "&b"
      lore:
        - "&7Cryghaliris jeges ereklyéje, Kallan"
        - "&7jégsárkányainak leheletével átitatva."
        - "&7Szárnyra kapva megfagyasztja"
        - "&7a körülötte lévőket."
    wander_wind:
      display-name: "Vándorszél"
      display-color: "&f"
      lore:
        - "&7Ryanora & Caldestera szabad szele,"
        - "&7Arkynn békés örökségének fuvallata."
        - "&7Gyorsabb sikló, és a föld"
        - "&7sosem üti meg viselőjét."
    bone_wing:
      display-name: "Csontszárny"
      display-color: "&8"
      lore:
        - "&7A Káoszkor csontból szőtt szárnya, a"
        - "&7Néma Királynő élőhalottainak maradványa."
        - "&7Éjjel a viselője maga is"
        - "&7árnyékká válik."

# ===== Rituálé-oltárok (multi-block szentélyek) =====
# Egy oltár egy MAG-BLOKK (altar-block), amit SHIFT+jobb kattal aktiválsz. A 'structure' a mag
# köré megépítendő szentély: minden elem egy "dx,dy,dz:MATERIAL" eltolás a mag-blokkhoz képest,
# és MINDNEK stimmelnie kell. Az alapminta egy 3x3 alapzat (y=-1) + 4 két-magas saroktorony.
# A kimenetet a 'type' dönti el:
#   relic   (alap): egy relikviát idéz meg (a relic-egyediség szabálya érvényes). A 'relic' mező
#           adja a relic-id-t (alapból a rituálé kulcsa).
#   cleanse: leveszi a bűnös-jelet és nullázza a bűn-számlálót (a lezárt sötét paktumot NEM oldja fel).
#   buff:   a megadott effekteket rakja fel ('effects': "TÍPUS:tick:erősség").
#   home:   a frakciód fővárosába teleportál (hazatérés-kő).
# Kapuk (opcionális): 'requires-class' (kaszt-id) és 'requires-faction' (RED/BLUE/NEUTRAL/DARK).
# Minden rituálénak EGYEDI a mag-blokkja (különben az első találat nyerne). A kaszt-oltárok
# ('*_szentely') tematikus buffot adnak a saját kasztjuknak — másold/hangold őket kedvedre.
# cooldown-seconds: az ismétlés korlátja (memóriában, újraindításkor nullázódik).
