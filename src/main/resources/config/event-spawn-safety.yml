# IceSMP world-event placement: víz, játékos-látótáv, terep és keresési budget.
# A fájl world.yml után töltődik be, ezért a régi telepítések is megkapják az új alapokat.
world-events:
  safety:
    min-horizontal-distance-blocks: 192.0
    min-3d-distance-blocks: 0.0
    ignore-spectators: true
    ignore-vanished: true
    ignore-admins: false
    search-attempts: 32
    search-min-radius-blocks: 256.0
    search-max-radius-blocks: 512.0
    # false = már generált, de inaktív chunk aszinkron visszatölthető; új chunk nem generálódik.
    require-loaded-chunk: false

  placement:
    dynamic-view-distance-enabled: true
    view-distance-margin-blocks: 32.0
    search-clearance-margin-blocks: 32.0
    visibility-cone:
      enabled: true
      max-distance-blocks: 384.0
      angle-degrees: 110.0
    recent-location-cooldown-minutes: 45
    recent-location-distance-blocks: 256.0
    recent-location-share-across-events: true
    max-concurrent-searches: 2
    # A rescue phase can include asynchronous terrain generation, so the watchdog must leave
    # enough time for it without ever permitting an unbounded search.
    search-timeout-millis: 15000
    max-chunks-per-search: 96
    # One selected chunk is checked at several nearby columns while the complete footprint stays
    # inside the same Folia region. This avoids rejecting usable terrain because of one tree.
    max-column-probes-per-candidate: 8
    terrain-expansion:
      # First the guard tries already generated terrain. Only after that phase is exhausted may
      # it generate this strictly bounded number of distant chunks asynchronously.
      enabled: true
      attempts: 24
      max-new-chunks-per-search: 24
      max-radius-blocks: 768.0
      # Older deployed files may still override the outer search timeout to 5 seconds.
      minimum-timeout-millis: 15000
    search-backoff-seconds: 30
    route-attempts: 8
    arrival:
      enabled: true
      delay-seconds: 3
      particles: true
      sound: true
      player-hint: true

  water-safety:
    enabled: true
    enforce-all-events: true
    # 0 = csak a spawnoszlop; 7 = a chunk-középre igazított, egy régión belüli teljes puffer.
    buffer-blocks: 7

  # Eventenkénti footprint, lejtés, biom és láthatósági profilok.
  profiles:
    stranger:
      terrain-expansion-enabled: false
      min-horizontal-distance-blocks: 48.0
      search-min-radius-blocks: 64.0
      search-max-radius-blocks: 96.0
      arrival:
        enabled: false
      whisper-radius: 112.0
      despawn-seconds: 150
      use-dynamic-view-distance: false
      footprint-radius-blocks: 2
      max-height-delta-blocks: 3
      visibility-cone:
        enabled: true
        max-distance-blocks: 128.0
        angle-degrees: 120.0
      denied-biomes: [ocean, deep_ocean, river, frozen_ocean, deep_frozen_ocean]
    animal-migration:
      terrain-expansion-enabled: false
    caravan:
      footprint-radius-blocks: 5
      max-height-delta-blocks: 2
      require-sky: true
      denied-biomes: [ocean, deep_ocean, river, frozen_ocean, deep_frozen_ocean, jagged_peaks]
    player-caravan:
      arrival:
        enabled: false
      footprint-radius-blocks: 5
      max-height-delta-blocks: 2
      require-sky: true
      denied-biomes: [ocean, deep_ocean, river, frozen_ocean, deep_frozen_ocean, jagged_peaks]
    escort:
      footprint-radius-blocks: 5
      max-height-delta-blocks: 2
      require-sky: true
      denied-biomes: [ocean, deep_ocean, river, frozen_ocean, deep_frozen_ocean, jagged_peaks]
    escort-route:
      min-horizontal-distance-blocks: 0.0
      use-dynamic-view-distance: false
      ignore-recent-locations: true
      footprint-radius-blocks: 0
      max-height-delta-blocks: 3
      visibility-cone:
        enabled: false
    escort-wave:
      min-horizontal-distance-blocks: 0.0
      use-dynamic-view-distance: false
      ignore-recent-locations: true
      footprint-radius-blocks: 0
      max-height-delta-blocks: 3
      visibility-cone:
        enabled: false
    meteor:
      footprint-radius-blocks: 7
      max-height-delta-blocks: 4
      require-sky: true
      denied-biomes: [ocean, deep_ocean, river, frozen_ocean, deep_frozen_ocean]
    world-boss:
      footprint-radius-blocks: 7
      max-height-delta-blocks: 4
      require-sky: true
      denied-biomes: [ocean, deep_ocean, river, frozen_ocean, deep_frozen_ocean]
    invasion:
      footprint-radius-blocks: 7
      max-height-delta-blocks: 4
      require-sky: true
      denied-biomes: [ocean, deep_ocean, river, frozen_ocean, deep_frozen_ocean]
    invasion-wave:
      min-horizontal-distance-blocks: 0.0
      use-dynamic-view-distance: false
      ignore-recent-locations: true
      footprint-radius-blocks: 0
      max-height-delta-blocks: 3
      visibility-cone:
        enabled: false
    cultists:
      footprint-radius-blocks: 6
      max-height-delta-blocks: 3
      denied-biomes: [ocean, deep_ocean, river, frozen_ocean, deep_frozen_ocean, mushroom_fields]
    wild-hunt:
      footprint-radius-blocks: 4
      max-height-delta-blocks: 4
      denied-biomes: [ocean, deep_ocean, river, frozen_ocean, deep_frozen_ocean]
