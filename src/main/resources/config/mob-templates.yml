# IceSMP Mob/Encounter 2.0 — authored pilot content.
# Natural vanilla mobs without a matching entry stay on the safe fallback path.

mob-abilities:
  telegraphed_lunge:
    kind: LUNGE
    cooldown-ticks: 120
    telegraph-ticks: 20
    radius: 10.0
    power: 1.15
    max-summons: 0
  glacial_slam:
    kind: GROUND_SLAM
    cooldown-ticks: 180
    telegraph-ticks: 30
    radius: 4.5
    power: 6.0
    max-summons: 0
    tuning: { knockback: 0.8 }
  rime_burst:
    kind: PROJECTILE_BURST
    cooldown-ticks: 140
    telegraph-ticks: 20
    radius: 14.0
    power: 3.0
    max-summons: 0
    tuning: { projectiles: 3 }
  iceguard:
    kind: SHIELD
    cooldown-ticks: 240
    telegraph-ticks: 10
    radius: 2.0
    power: 0.35
    max-summons: 0
  winter_mend:
    kind: HEAL_PULSE
    cooldown-ticks: 260
    telegraph-ticks: 20
    radius: 3.0
    power: 0.12
    max-summons: 0
  call_frozen:
    kind: SUMMON
    cooldown-ticks: 300
    telegraph-ticks: 30
    radius: 5.0
    power: 1.0
    max-summons: 3

# Source relevance is authoritative. Runtime loot may only choose rewards declared by the profile.
mob-loot-profiles:
  frozen_wilderness:
    sources: [ "combat:wilderness:frozen" ]
    rewards: [ "material:dermedt_csont", "authored:fagyott_eskukard" ]
