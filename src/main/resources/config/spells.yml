# IceSMP konfiguráció — spells (a ConfigManager az összes config/*.yml-t betölti)
# ===== Talentek =====
# Két ponttár: a kaszt tár a kaszt szintekből, a szakma tár az összes szakma
# szintjéből termel pontot (points-per-levels szintenként 1 pont).
# Effektek: max-health, movement-speed, attack-damage (attribútum módosítók),
# class-xp-bonus, profession-xp-bonus (százalékos XP bónusz).
# ===== Spell-mesterség és kombók (ROADMAP 3. fázis) =====
spells:
  # Halál-összegzés: halál után rövid lista a legutóbbi sebzés-forrásokról.
  death-recap:
    enabled: true
  # Mágia-ellenállás (Rúnavért enchant vs az icesmp:magia damage-type):
  # a viselt páncél Rúnavért-szintjeinek összege szintenként per-level arányban
  # csökkenti a bejövő SPELL-sebzést, a max-reduction plafonig. Élőben olvasódik.
  magic-resist:
    per-level: 0.08
    max-reduction: 0.6
  # ===== Baráti tűz (party-tudatos célzás) =====
  # Az ellenséges spellek (AoE, splash, sugár, lövedék, csapda-item) kihagyják a szövetségest,
  # a baráti (buff) AoE-k pedig CSAK szövetségest érintenek.
  friendly-fire:
    protect-party: true      # a saját csapattag (party) sosem célpont
    protect-faction: false   # frakciótárs védelme — háborús szerveren alapból KI (az árulás-bűn kezeli)
  # ===== Katalizátor-cooldown a hotbaron =====
  # Cast után a katalizátor itemen a vanília szürke töltődés-overlay mutatja a cooldownt.
  cooldown-overlay:
    enabled: true
  # ===== Lebegő sebzés-számok =====
  # enabled: false = semmilyen sebzés-felirat nem jelenik meg.
  # visibility: attacker-only = csak a sebzést okozó játékos látja (default);
  #             everyone      = minden közeli játékos látja.
  damage-indicators:
    enabled: true
    visibility: attacker-only
  # Kaszt-erőforrás (HIBRID, WoW-szerű): a HUD oldalsávban egy színes sáv (kasztonként névvel/színnel:
  # Mana/Düh/Energia/Fókusz/Csi…). A legtöbb spell EZT FOGYASZTJA (a költség a sáv), és idővel
  # regenerálódik; üres sávnál a spell nem sül el. Az erőforrás-költség a cooldown-szintjéből adódik
  # (rövid CD ~15-20, ulti ~50).
  #
  # HIBRID: minden spell a hozzá illő költséget használja!
  #   - vér-mágia (HP-költségű spellek)               -> marad HP (ön-áldozat)
  #   - nagy rituálé/idézés/időjárás (XP >= küszöb)    -> marad XP
  #   - nehéz fizikai (éhség >= küszöb: állások, totem)-> marad éhség
  #   - minden más (könnyű mágia/stamina)             -> a kaszt-erőforrás (a sáv)
  # Ha enabled=false, MINDEN spell a régi éhség/XP/HP költségre esik vissza.
  resource:
    enabled: true
    max: 100                      # a sáv maximuma (globális default)
    regen-per-second: 8.0         # ennyi erőforrás töltődik vissza másodpercenként (0 = nincs regen)
    xp-ritual-threshold: 80       # ennyi VAGY több XP-költségű spell marad XP (nagy rituálé); alatta erőforrás
    hunger-heavy-threshold: 8     # ennyi VAGY több éhség-költségű spell marad éhség (nehéz fizikai); alatta erőforrás
    # ===== Kasztonkénti erőforrás-profilok (IDEAS A3) =====
    # A tár VISELKEDÉSE kasztonként más, hogy a Düh tényleg dühként, az Energia energiaként
    # működjön. Kulcsonként felülírható; ami nincs megadva, a fenti globális default érvényes.
    #   max                    - a sáv maximuma ennél a kasztnál
    #   regen-per-second       - passzív visszatöltődés (dühnél csak HARCBAN fut!)
    #   combat-gain-per-hit    - ennyi tár jár minden BEVITT ütésért (düh-minta; 0 = kikapcsolva)
    #   idle-decay-per-second  - harcon kívül (5 mp az utolsó ütés után) ennyivel ÜRÜL a tár
    #                            másodpercenként; amíg > 0, harcon kívül regen sincs (0 = normál regen)
    class:
      # Düh-típus: harcban töltődik (ütésenként + lassú regen), harcon kívül lassan elszivárog.
      warrior:
        regen-per-second: 3.0
        combat-gain-per-hit: 8.0
        idle-decay-per-second: 2.0
      death_knight:
        regen-per-second: 3.0
        combat-gain-per-hit: 8.0
        idle-decay-per-second: 2.0
      demon_hunter:
        regen-per-second: 3.0
        combat-gain-per-hit: 8.0
        idle-decay-per-second: 2.0
      # Energia-típus: kisebb tár, de gyorsan visszatöltődik (pörgős rotáció).
      assassin:
        regen-per-second: 14.0
      monk:
        regen-per-second: 14.0
      archer:
        regen-per-second: 11.0
      # Mana-típus: nagyobb tár, lomhább regen (a nagy leadás után tényleg ki kell várni).
      wizard:
        max: 120
        regen-per-second: 7.0
      shaman:
        max: 120
        regen-per-second: 7.0
      priest:
        max: 120
        regen-per-second: 7.0
      warlock:
        max: 120
        regen-per-second: 7.0
      evoker:
        max: 120
        regen-per-second: 7.0
      druid:
        max: 120
        regen-per-second: 7.0
      paladin:
        max: 110
        regen-per-second: 7.0
  # Sámán-totemek: lerakott, rövid életű entitások, amik periodikusan pulzálnak a közeli
  # entitásokra (gyógyítás/buff a szövetségeseknek, sebzés/debuff az ellenségeknek).
  totem:
    lifetime-seconds: 12   # ennyi ideig áll a totem, mielőtt eltűnik
    radius: 6.0            # ekkora körben hat a pulzálás
    pulse-ticks: 30        # ennyi tickenként pulzál (20 tick = 1 mp)
  # Mesterség: frakcióvalutáért fejleszthető rang, ami csökkenti a cooldownt.
  mastery:
    enabled: true
    max-rank: 5
    cooldown-reduction-per-rank: 0.08   # rangonként -8% cooldown
    min-cooldown-multiplier: 0.5        # max 50% csökkenés
    upgrade-base-cost: 50               # a köv. rang ára = base * (jelenlegi rang + 1)
    # A rang a spell EREJÉT is skálázza: a sebzést, az önmagunk gyógyítását és a
    # felrakott effektek IDŐTARTAMÁT (a költséget/self-damage-et NEM).
    power-per-rank: 0.05                # rangonként +5% erő
    max-power-multiplier: 1.5           # max +50% erő (5. rangon)
  # Közelharci katalizátor: a felsorolt kasztok a kezükben tartott kardot/baltát is
  # katalizátorként használhatják (jobb katt = cast, sunyítva jobb katt = varázskönyv,
  # sunyítva karlengetés = spell-váltás). A kaszt-katalizátor item továbbra is működik.
  melee-catalyst:
    enabled: true
    classes: [warrior, paladin, death_knight, monk, demon_hunter]
    materials:
      - WOODEN_SWORD
      - STONE_SWORD
      - IRON_SWORD
      - GOLDEN_SWORD
      - DIAMOND_SWORD
      - NETHERITE_SWORD
      - WOODEN_AXE
      - STONE_AXE
      - IRON_AXE
      - GOLDEN_AXE
      - DIAMOND_AXE
      - NETHERITE_AXE
  # Dinamikus spell-skálázás: a spell-erő a kaszt-szinttel és a 'spell-power' effektű
  # talentekkel nő, a mastery-szorzó FELETT:
  #   erő = mastery * (1 + min(max-bonus-percent, szint*per-level-percent + talent-bónusz) / 100)
  dynamic-scaling:
    enabled: true
    per-level-percent: 0.5     # kaszt-szintenként +0,5% spell-erő
    max-bonus-percent: 50      # a szint+talent bónusz felső korlátja (%)
  # Kombók: ha az adott időablakon belül a 'first' után a 'second' spellt sütöd el,
  # a második gyorsabban épül fel (cooldown-visszatérítés) + látvány.
  combos:
    enabled: true
    window-seconds: 4
    bonus-cooldown-refund-percent: 40
    # ===== 3 lépéses kombó-láncok (IDEAS A16) =====
    # Ha a lánc első két lépését az időablakon belül sütöd el, a 3. (finisher) +X% erővel
    # sül el ÉS a kombó-cooldown-visszatérítést is megkapja. A cast után az action bar
    # mutatja a következő lépést ("Kombó-ablak: ...").
    finisher-power-bonus-percent: 25   # a finisher erő-bónusza (láncnál felülírható)
    chains:
      arcane-execution:
        steps: [frost_touch, arcane_nova, fireball]
      deathfrost:
        steps: [chains_of_ice, frost_strike, obliterate]
      elemental-overload:
        steps: [flame_shock, lava_burst, earth_shock]
      way-of-hundred-fists:
        steps: [rising_sun_kick, fists_of_fury, blackout_kick]
      holy-trinity:
        steps: [holy_smite, mind_blast, holy_nova]
      soul-collapse:
        steps: [corruption, unstable_affliction, chaos_bolt]
    pairs:
      frost-nova:
        first: "frost_touch"
        second: "arcane_nova"
      slow-finish:
        first: "hamstring"
        second: "garrote"
      trap-volley:
        first: "snare"
        second: "arrow_storm"
      shout-spin:
        first: "battle_shout"
        second: "whirlwind"
      plague-spread:
        first: "toxin_dart"
        second: "contagion"
      # Az új kasztok kombói (Holdjós / Paplovag / Halállovag / Sámán / Szerzetes)
      lunar-eclipse:
        first: "moonfire"
        second: "starsurge"
      holy-verdict:
        first: "hammer_of_justice"
        second: "judgment"
      frozen-strike:
        first: "chains_of_ice"
        second: "frost_strike"
      lava-flare:
        first: "flame_shock"
        second: "lava_burst"
      flurry-fists:
        first: "rising_sun_kick"
        second: "fists_of_fury"
      shadow-detonate:
        first: "corruption"
        second: "unstable_affliction"
      fire-chain:
        first: "immolate"
        second: "conflagrate"
      holy-mind:
        first: "holy_smite"
        second: "mind_blast"