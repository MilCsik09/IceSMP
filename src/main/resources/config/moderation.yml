# IceSMP konfiguráció — moderation (a ConfigManager a támogatott CONFIG_FILES-listát tölti be)
# Natív moderációs modul (a SModeration plugin chat-részének kiváltása, IDEAS C17):
# némítás + chat-szűrő + spam-fék.
moderation:
  enabled: true

  # Némított játékos ezekkel a parancsokkal se tudjon máshoz szólni (labelek '/' nélkül).
  muted-blocked-commands: [msg, w, tell, me, r]

  chat-filter:
    enabled: true
    # CENSOR = a tiltott szó csillagozva (azonos hosszú '*'-sor); BLOCK = az egész üzenet elnyelése.
    mode: CENSOR
    # Kis/nagybetű-független RÉSZSZÓ-egyezés — bővítsd a szerver igényei szerint.
    words: [példaszó1, példaszó2]

  spam:
    enabled: true
    # Két üzenet közti minimum idő (ezredmásodperc) — ennél gyorsabb küldés blokkolva.
    min-interval-millis: 1500
    # Ugyanaz az üzenet ennyi másodpercen belül újra elküldve = blokk.
    duplicate-window-seconds: 20

  # IDEAS A52: mute-eszkaláció — /mute <név> [ok...] (perc nélkül) esetén a némítás-történet
  # (hányszor volt már némítva) alapján ennek a listának a megfelelő indexű eleme adja a percet;
  # a listán túl az utolsó érték ismétlődik.
  escalation-minutes: [5, 30, 180, 1440]

  # IDEAS A52: blokkolt/cenzúrázott/némított üzenetek naplózása logs/chat-moderation.log-ba.
  chat-log:
    enabled: true

  # Admin vanish — a state a moderation-data.yml-ben tartós, ezek csak a gameplay-kapuk.
  vanish:
    # Ha true, a MOTD és a natív tablista {online} számlálója nem számolja a vanished játékosokat.
    exclude-from-online-count: true
    # Alapból a vanished admin nem vehet fel tárgyat, nem sebezhet és nem interaktálhat.
    allow-item-pickup: false
    allow-damage: false
    allow-interaction: false
    # Vanished chat would reveal the moderator; opt in explicitly when needed.
    allow-chat: false
