# IceSMP konfiguráció — world (a ConfigManager az összes config/*.yml-t betölti)
# ===== Távolság-alapú mob szintezés =====
# A spawn ponttól távolodva a mobok erősödnek: szint = távolság / blocks-per-level.
mob-scaling:
  enabled: true
  blocks-per-level: 1000
  max-level: 10
  health-per-level: 2.0
  damage-per-level: 1.0
  # Csak ellenséges (Monster) mobok skálázódjanak.
  hostile-only: true
  # Ezekkel az okokkal spawnoló mobok nem skálázódnak (pl. spawner farmok).
  ignored-spawn-reasons:
    - "SPAWNER"
    - "CUSTOM"
    - "COMMAND"
  name:
    enabled: true
    # EGYÉRTELMŰ név: always-visible = a névtábla mindig látszik-e. A vanília "mindig
    # látható" névtáblák FALAKON ÁT és nagyon TÁVOLRÓL is renderelődnek (zavaró lehet).
    # false = a szint-névtábla csak akkor jelenik meg, amikor a játékos RÁNÉZ a mobra
    # (közelről, takarás nélkül) — vanília "hover" viselkedés.
    # (A régi 'visible' kulcs legacy-fallbackként még működik.)
    always-visible: false
    prefix: "&7[Lvl %level%] "
    color: "WHITE"

# ===== Világesemények (7. szekció) =====
# FIGYELEM: a check-interval-seconds EGYETLEN közös időzítő, amely az ÖSSZES
# időszakos rendszert hajtja — vérhold, világboss, invázió, karaván, hangulat-
# esemény, gyűjtögető-buff, kincs, Vad Hajsza, Bőség-idő, szerver-kihívás,
# kíséret, meteor, szezon-lejárat, továbbá az aukció-lejárat, árfolyam-tábla,
# statisztika- és achievement-ellenőrzés ütemét is. Átállítása MINDET érinti.
# Ne emeld 60 mp fölé ok nélkül; az egyes események a saját enabled
# kapcsolójukkal és interval-* kulcsaikkal vezérelhetők.
world-events:
  check-interval-seconds: 60
  # Mester-kapcsoló: false = a lenti spawn-rules mátrix egyáltalán nem fut (mindenhova
  # spawnolhat minden). A kulcsok élőben olvasódnak — /icesmp reload után restart nélkül él.
  # (A régi, félrevezető nevű avoid-territory kulcs legacy-fallbackként még működik.)
  spawn-rules-enabled: true
  # Esemény × védelem mátrix: melyik esemény hol NEM spawnolhat. Oszlopok:
  #   territory = claimelt frakció-territórium | claim = játékos-claim
  #   region    = WorldGuard-régió (városok/spawn) | water = víz-felszín
  # Minden cella alapból true (nem kiírt kulcs = true). A tiltott hely kimarad, az esemény
  # a következő intervallumban máshol próbálkozik. (A meteor saját terep-szabálya —
  # lombkorona/rönk-tető elkerülés — configtól függetlenül mindig él.)
  spawn-rules:
    world-boss: { territory: true, claim: true, region: true, water: true }
    invasion:   { territory: true, claim: true, region: true, water: true }
    wild-hunt:  { territory: true, claim: true, region: true, water: true }
    treasure:   { territory: true, claim: true, region: true, water: true }
    meteor:     { territory: true, claim: true, region: true }
    corruption: { territory: true, claim: true, region: true, water: true }
    archeology: { territory: true, claim: true, region: true, water: true }
  # Vérhold-éjszaka: ritka éjjel a mobok erősebbek, a lélekkő-drop felszorzódik.
  # A sorsolás az éj beállta (13000) és éjfél (18000) közt történik, éjszakánként egyszer.
  blood-moon:
    enabled: true
    chance-percent: 15
    bonus-mob-levels: 2
    soul-drop-multiplier: 2.0
    # Admin /events bloodmoon start esetén ennyi percig tart (a napciklustól függetlenül).
    force-duration-minutes: 10
    # Admin-indításnál nappal is estét csinál (a vérhold éjszakai esemény — a természetes
    # indulása amúgy is csak az éj beálltakor sorsolódik).
    force-night: true
  # Világboss: időnként egy boss-szörny spawnol egy véletlen játékos közelében.
  # Spawnkor VÉLETLEN archetípus kerül kiválasztásra a 10-es rosterből (A Gyűrűk Őre /
  # Lávakohó Behemót / Fagyott Trón Királya / Csontkirály / Mélységi Rém / Méreg
  # Anyakirálynő / Vihar Hírnöke / Dögvész Titán / Vas Őrszem / Pokoli Hadúr) —
  # saját entitással, névvel, stat-
  # szorzókkal, szignatúra-aurával és jutalom-szorzóval. A health/damage a KÖZÖS alap,
  # amit az archetípus szorzói módosítanak. 50% HP alatt a boss feldühödik (2. fázis).
  world-boss:
    enabled: true
    check-interval-minutes: 90
    chance-percent: 35
    lifetime-minutes: 20
    health: 300.0
    damage-multiplier: 2.0
    aura-radius: 12.0          # ennyi blokkon belül kapja a túlélő a boss szignatúra-debuffját
    special-damage: 6.0        # a ~8 mp-enkénti telegrafált képesség (slam/zóna) sebzése (enrage: ×1.5)
    add-lifespan-seconds: 25   # a SUMMON-special által idézett add-ok élettartama (utána eltűnnek)
    treasury-reward: 300.0     # az archetípus reward-szorzója módosítja (pl. Mélységi Rém ×1.5)
    season-points: 10
    buff-minutes: 10
  # Invázió: időnként egy szörnyhorda spawnol egy véletlen játékos köré (ROADMAP 9.).
  # A horda-összetétel VÉLETLEN a 8-as rosterből: Élőhalott Áradat / Csontlégió /
  # Pókfészek / Káosz-horda / Alvilági Roham / Zsivány Hadtest / Boszorkány Gyülekezet /
  # Lángoló Sereg — kevert mob-típusokkal, és minden hullámot egy skálázott, megnevezett
  # mini-boss (bajnok)
  # vezet. A szörnyek skálázottak (XP + lélekkő-eséllyel), admin: /events invasion.
  invasion:
    enabled: true
    check-interval-minutes: 75
    chance-percent: 30
    mob-count: 8
    mob-level: 4
    radius: 8.0
    mini-boss-level-bonus: 6   # a horda bajnoka ennyivel magasabb szintű a hullámnál
    champion-slam-damage: 5.0  # a bajnok ~6 mp-enkénti telegrafált földcsapásának sebzése
  # Szezonális liga: a frakciók pontot gyűjtenek raid- és boss-győzelmekből.
  # A szezon végén a győztes frakció KASSZÁJA treasury-reward-ot kap, az online
  # TAGJAI pedig győzelmi buffot + tárgy-jutalmat + ünneplő tűzijátékot.
  season:
    enabled: true
    length-days: 60
    treasury-reward: 1000.0
    champion-buff-minutes: 30
    champion-firework: true
    # Tárgy-jutalom a bajnok frakció online tagjainak: "MATERIAL:DARAB" lista.
    champion-reward-items:
      - "DIAMOND:8"
      - "GOLDEN_APPLE:4"
  # B33 — Szezonzáró "végítélet-hét" (lore: a Korszakok Könyve lapfordulása). A szezon
  # utolsó `days` napjában napi eszkaláció: a vérhold/világboss/invázió esély-kulcsa
  # (1 + nap × chance-mult-per-day) szorzót kap, az invázió mob-szintje bónuszt
  # (floor(nap × mob-level-bonus-per-day)), a liga-pontok lineárisan futnak fel a
  # league-point-mult-max-ig (utolsó nap = max, alapból dupla). Az utolsó napon EGYSZERI
  # szezonboss spawnol a NEUTRAL főváros falai MELLETT (wall-offset blokkal a zóna-perem
  # után; guard-bypass — szándékosan a városnál áll), emelt élettel; halálakor a boss.loot
  # tábla gurul (loot-rolls-szor) + bonus-season-points liga-pont. Minden kulcs élőben
  # olvasódik. Főváros-zóna híján a boss a sima (guard-os) világboss-úton esik vissza.
  season-finale:
    enabled: true
    days: 7
    chance-mult-per-day: 0.15
    mob-level-bonus-per-day: 0.5
    league-point-mult-max: 2.0
    boss:
      enabled: true
      name: "A Lapforduló Őre"
      lifetime-minutes: 30
      wall-offset: 16
      health-mult: 1.5
      bonus-season-points: 15
      loot-rolls: 6
      # Loot-sorok: "MATERIAL[:MIN[:MAX]]" vagy "unique:<id>[:db]" (LootTable-formátum).
      loot:
        - "DIAMOND:2:5"
        - "NETHERITE_SCRAP:1:2"
        - "GOLDEN_APPLE:1:3"
        - "unique:emlekszilank:2"
        - "unique:runapor:3"
  # Első belépéses bevezető (cím-szekvencia). Sorok: "Cím||Alcím".
  intro:
    enabled: true
    stagger-seconds: 4
    lines:
      - "&b&lIceSMP||&7Üdv a fagyott királyságok földjén"
      - "&6Válassz frakciót||&7Piros, Kék, Semleges vagy Sötét"
      - "&dKovácsold a sorsod||&7Kasztok, szakmák, relikviák várnak"
    # Opcionális filmszerű kameraút (ALAPBÓL KIKAPCSOLVA). Bekapcsoláskor a játékost
    # rövid időre spectator módba teszi, és végigviszi a waypointokon, majd visszaállítja
    # a gamemode-ját (újrabelépéskor is önjavít, ha megszakadna). Waypoint formátum:
    # "x,y,z" vagy "x,y,z,yaw,pitch" vagy "világ,x,y,z,yaw,pitch".
    cinematic:
      enabled: false
      point-seconds: 3
      waypoints: []

# ===== Hangulat-események (ambient) =====
# Ritka, apró, légköri események, amelyek élőbbé teszik a világot — soha nem
# nyúlnak a balanszhoz vagy a gazdasághoz (kozmetikai effekt / apró buff, illetve
# az állat-vándorlásnál passzív állatok = élelem-forrás, sosem valuta). Időnként a
# tick kiválaszt egy ENGEDÉLYEZETT típust, majd ELLENŐRZI a fő világ napszakát/
# időjárását a típushoz tartozó ablakhoz képest — ha nem illik rá, a kör csendben
# kimarad (NEM sorsol új típust). Aki a tűzeléskor a SZABAD ÉG ALATT tartózkodik
# (nincs tető felette), kap egy apró jutalmat: valuta + rövid, ízléshez illő buff.
# Admin: /events ambient (a force teszt-tűzelés figyelmen kívül hagyja az ablakot).
#
# Az egyes típusok napszak/időjárás-ablaka (world-time tick, 0=hajnal, 13000-23000=éjszaka):
#   aurora              — éjszaka (13000-23000) ÉS derült idő (nincs vihar)
#   falling-star        — éjszaka (13000-23000)
#   spectral-wanderers  — éjszaka (13000-23000)
#   fireflies           — alkonyat/kora éjszaka (12000-15000)
#   fog-roll            — hajnal/kora reggel (0-2000) VAGY esik az eső
#   animal-migration    — nappal (1000-11000)
ambient-events:
  enabled: true
  interval-minutes: 40
  chance-percent: 35
  min-online-players: 1              # ennyi játékos legyen fenn, különben a kör kimarad
  reward-amount: 5.0                 # apró valuta-jutalom a szabad ég alatt lévőknek (0 = csak buff, valuta nélkül)
  aurora-nightvision-seconds: 45     # az északi fény rövid, kozmetikai éjjellátása (mindenkinek)
  effect-seconds: 24                 # az elnyújtott hangulat-effektek (köd/lelkek/bogarak/aurora) hossza
  migration-herd-size: 5             # az állat-vándorlás csordamérete
  # Az egyes típusok külön ki/be kapcsolhatók:
  types:
    aurora: true
    falling-star: true
    fog-roll: true
    spectral-wanderers: true
    animal-migration: true
    fireflies: true

# ===== Gyűjtögető buff-események =====
# Időszakos, szerver-szintű bónusz-ablakok, amelyek a hétköznapi gyűjtögetést
# jutalmazzák — kizárólag nyersanyag/XP, SOSEM valuta. Egyszerre egy ablak fut:
# bányász-láz (érc-blokk bónusz drop), termés-óra (beérett termés bónusz drop),
# halászati láz (dupla fogás esély), tapasztalat-óra (XP-szorzó). Admin: /events gathering.
gathering-buffs:
  enabled: true
  interval-minutes: 90           # két ablak közti idő
  duration-minutes: 15           # egy ablak hossza
  chance-percent: 40             # esély, hogy az intervallum végén tényleg megnyílik
  min-online-players: 1          # ennyi online játékos alatt nem nyílik ablak
  bonus-drop-chance-percent: 50  # bányász/termés/halászati bónusz drop esélye blokként/fogásonként
  xp-multiplier: 2.0             # a tapasztalat-óra XP-szorzója
  types:
    mining-rush: true
    harvest-hour: true
    fishing-frenzy: true
    xp-hour: true

# ===== Felfedező kincs-események =====
# Időnként egy megjelölt kincsesláda bukkan fel egy véletlen játékos közelében, és
# a hozzávetőleges helyét broadcast jelzi — az ELSŐ megtaláló, aki jobb-kattint rá,
# viszi a loot-ot, aztán a láda eltűnik. A jutalom nyersanyag (loot-tábla), nem pénz.
# A loot-tábla bejegyzések: "MATERIAL", "MATERIAL:DARAB" vagy "MATERIAL:MIN:MAX".
treasure-events:
  enabled: true
  interval-minutes: 45     # két kincs közti idő
  expire-minutes: 15       # ennyi idő után feltáratlanul eltűnik
  chance-percent: 40       # esély, hogy az intervallum végén tényleg felbukkan
  spawn-radius: 80         # ilyen sugarú körben a horgony-játékos körül
  rolls: 3                 # ennyi tételt húz a loot-táblából
  loot:
    - "DIAMOND:2:5"
    - "GOLD_INGOT:4:9"
    - "IRON_INGOT:6:12"
    - "EMERALD:2:6"
    - "ENCHANTED_GOLDEN_APPLE:1"
    - "EXPERIENCE_BOTTLE:8:16"
    - "NETHERITE_SCRAP:1:2"
    - "GOLDEN_APPLE:2:4"

# ===== Vad Hajsza (harci variáns) =====
# Időnként egy megnevezett, szintre skálázott elit fenevad kóborol be egy véletlen
# játékos közelébe — kóborló mini-fenyegetés az invázió-hordák és a világbossok
# között. Aki leteríti, ritka loot-táblát kap (nyersanyag, sosem valuta); ha időben
# senki nem öli meg, eltűnik. Loot-formátum mint a kincsnél: "MATERIAL[:DARAB|:MIN:MAX]".
wild-hunt:
  enabled: true
  interval-minutes: 70     # két hajsza közti idő
  expire-minutes: 20       # ennyi idő után elszökik, ha nem ölik meg
  chance-percent: 30       # esély, hogy az intervallum végén tényleg felbukkan
  beast-level: 8           # a fenevad skálázott szintje (MobScalingManager)
  rolls: 4                 # ennyi tételt húz a loot-táblából halálkor
  loot:
    - "DIAMOND:3:7"
    - "EMERALD:4:9"
    - "NETHERITE_SCRAP:1:3"
    - "ENCHANTED_GOLDEN_APPLE:1:2"
    - "EXPERIENCE_BOTTLE:12:24"
    - "GOLD_BLOCK:1:3"
    - "DIAMOND_BLOCK:1"

# ===== Bőség-idő (a vérhold pozitív ellenpárja) =====
# Nyugodt, építő/farm-barát időablak: a termés gyorsabban nő, az állatok néha ikret
# ellenek, a természetes szörny-spawnok egy része elmarad, és gyengéd regeneráció leng
# az online játékosokon. Terephez NEM nyúl (csak a már növekvő termést lépteti előrébb).
abundance:
  enabled: true
  interval-minutes: 80             # két Bőség-idő közti idő
  duration-minutes: 15             # egy ablak hossza
  chance-percent: 45               # esély, hogy az intervallum végén tényleg megnyílik
  crop-boost-chance-percent: 40    # esély, hogy egy növekvő termés +1 fázist ugrik
  twin-chance-percent: 25          # esély iker-utódra sikeres szaporodáskor
  calm-spawn-chance-percent: 35    # ennyi eséllyel marad el egy természetes szörny-spawn
  regen-seconds: 8                 # a gyengéd regeneráció-pulzus hossza

# ===== Kollektív szerver-kihívás =====
# Az egész szerver egy közös, időzített célt kap (együtt X szörny / X érc / X termés),
# boss-baron követhető haladással. Ha időben teljesül, MINDEN online játékos jutalmat
# kap (XP + nyersanyag-csomag + rövid Sietség-buff) — sosem valuta. Admin: /events challenge.
server-challenge:
  enabled: true
  interval-minutes: 150      # két kihívás közti idő
  duration-minutes: 30       # egy kihívás időkerete
  chance-percent: 30         # esély, hogy az intervallum végén tényleg indul
  min-online-players: 2      # ennyi online játékos alatt nem indul közös kihívás
  targets:
    slay: 500                # ennyi szörnyet kell közösen leölni
    mine: 800                # ennyi ércet kibányászni
    harvest: 1000            # ennyi termést betakarítani
  reward-xp: 300             # minden online játékosnak siker esetén
  reward-haste-seconds: 45   # rövid Sietség-buff siker esetén
  reward-rolls: 2            # ennyi tételt húz a jutalom-loot-táblából játékosonként
  reward-loot:
    - "DIAMOND:1:3"
    - "GOLD_INGOT:3:6"
    - "EMERALD:1:4"
    - "EXPERIENCE_BOTTLE:4:8"
    - "IRON_INGOT:4:8"
  types:
    slay: true
    mine: true
    harvest: true

# ===== Karaván-kíséret (kooperatív escort) =====
# Egy konvoj (ládás láma) indul útnak egy célpont felé; útközben szörny-hullámok
# támadják — a játékosoknak életben kell tartaniuk, míg célba ér. Siker: közös loot
# a célnál + a kereskedő-karaván boltja bonus-stock-minutes-ig a bonus-items
# készletet is árulja. TEREP-VÉDELEM: a hullám-poolban nincs robbanó mob, és a
# kíséret-mobok robbanása blokkot akkor sem sérthet (listener-védelem).
escort:
  enabled: true
  interval-minutes: 120      # két kíséret közti idő
  max-duration-minutes: 15   # ennyi idő után a konvoj elveszettnek számít
  chance-percent: 30         # esély, hogy az intervallum végén tényleg elindul
  route-distance: 150        # légvonalbeli táv az indulástól a célig (blokk)
  convoy-health: 60          # a konvoj életereje
  wave-interval-seconds: 45  # két támadó hullám közti idő
  wave-size: 4               # mob / hullám
  wave-level: 3              # a hullám-mobok skálázott szintje
  bonus-stock-minutes: 60    # siker után ennyi ideig árul bónusz-készletet a karaván
  reward-rolls: 4            # ennyi tételt húz a loot-táblából célba éréskor
  reward-loot:
    - "DIAMOND:2:5"
    - "EMERALD:3:7"
    - "GOLD_INGOT:5:10"
    - "EXPERIENCE_BOTTLE:8:16"
    - "NETHERITE_SCRAP:1:2"
    - "GOLDEN_APPLE:2:4"

# ===== Meteor-becsapódás (kráter + kibányászható érc) =====
# Időnként egy meteor csapódik be a vadonba: egy kis kráter marad, benne ritka,
# kibányászható érc-blokkokkal, amiért a játékosok versengenek, míg el nem enyészik.
# TEREP-VÉDELEM: a meteor NEM robban — LEHELYEZI a krátert, és MINDEN érintett blokk
# eredeti állapotát elmenti, majd lejáratkor (és leálláskor) VISSZAÁLLÍTJA. Ráadásul
# a world-events.spawn-rules.meteor mátrix szerint territóriumon, játékos-claimen és
# WorldGuard-régión kívülre irányítja magát. Így csak az marad, amit a játékosok
# kibányásznak, mielőtt a kráter elenyészik.
meteor:
  enabled: true
  interval-minutes: 85       # két meteor közti idő
  expire-minutes: 10         # ennyi idő után a kráter visszaáll az eredeti terepre
  chance-percent: 35         # esély, hogy az intervallum végén tényleg becsapódik
  spawn-radius: 90           # ilyen sugarú körben a horgony-játékos körül
  crater-radius: 3           # a kráter sugara (blokk) — kicsi, hogy gyors legyen a visszaállítás
  crater-depth: 2            # a kráter mélysége a közepén
  ore-chance: 0.45           # a kráter-közép blokkjai ekkora eséllyel érc (különben díszes bélés)
  # A becsapódás-hely védelme a world-events.spawn-rules.meteor mátrixba költözött
  # (a régi meteor.avoid-territory kulcs megszűnt).

# ===== H2 — Terjedő korrupt zóna (a Kapu rontása; tisztítása a Fát gyógyítja) =====
# Ritkán rontás-góc nyílik a vadonban: SCULK_CATALYST mag + logikai sugarú zóna, amely
# éjszakánként terjed a plafonig, és korrupt mobokat szül (kemény cap). Tisztítás:
# purge-kills-required korrupt fajzat leölése, majd a mag SHIFT+jobb katt (jutalom-loot +
# regeneráció). A spawn-hely a world-events.spawn-rules.corruption mátrix-sort követi.
# Élőben olvasódik; a zóna restart-álló (corruption.yml).
corruption:
  enabled: true
  interval-minutes: 120
  chance-percent: 25
