  aura:
    enabled: true
    radius: 5.0
    damage: 1.0
    interval-ticks: 40
  contributor-min-kills: 3
  contributor-loot-ratio: 0.5
  interval-minutes: 75
  chance-percent: 35
  spawn-offset: 96
  min-world-spawn-distance: 384 # 0 = nincs spawn-kizárás
  spawn-grace-seconds: 10
  tracking-padding: 16.0
