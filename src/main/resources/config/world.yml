# ===== Világesemények =====
world-events:
  check-interval-seconds: 60
  spawn-rules-enabled: true
  safety:
    enabled: true
    # Every relevant online player must be at least this far away horizontally.
    min-horizontal-distance-blocks: 96.0
    # 0 disables the optional full 3D distance check; horizontal safety still applies.
    min-3d-distance-blocks: 0.0
    ignore-spectators: true
    ignore-vanished: true
    ignore-admins: true
    min-world-spawn-distance-blocks: 128.0
    world-border-margin-blocks: 16.0
    require-loaded-chunk: true
    # Bounded search: no valid candidate means controlled abort, never a close fallback.
    search-attempts: 24
    search-min-radius-blocks: 96.0
    search-max-radius-blocks: 256.0
    # Prevent different events from selecting the same area concurrently.
    reservation-distance-blocks: 64.0
    reservation-seconds: 120
  spawn-rules:
    world-boss: { territory: true, claim: true, region: true, water: true }
    invasion: { territory: true, claim: true, region: true, water: true }
    wild-hunt: { territory: true, claim: true, region: true, water: true }
    treasure: { territory: true, claim: true, region: true, water: true }
    meteor: { territory: true, claim: true, region: true }
    corruption: { territory: true, claim: true, region: true, water: true }
    dark-undead: { territory: false, claim: true, region: true, water: true }
    escort: { territory: true, claim: true, region: true, water: true }
    archeology: { territory: true, claim: true, region: true, water: true }
    stranger: { territory: true, claim: true, region: true, water: true }
    player-caravan: { territory: false, claim: false, region: false, water: false }
    cultists: { territory: true, claim: true, region: true, water: true }
  anchors:
    random-radius: 1500
    world-boss: { mode: "player" }
    escort: { mode: "player" }
    caravan: { mode: "player" }
    cultists: { mode: "player" }
  orchestration:
    enabled: true
    max-active-minutes: 60
    major-events: [ "world-boss", "invasion", "wild-hunt", "escort", "cultists" ]
  season-modifiers:
    enabled: true
    tel:
      blood-moon: 1.4
      wild-hunt: 1.4
      abundance: 0.8
      gathering: 0.9
    tavasz:
      abundance: 1.2
      gathering: 1.1
    nyar:
      abundance: 1.4
      gathering: 1.3
      blood-moon: 0.8
    osz:
      world-boss: 1.2
      invasion: 1.2
  stranger-npc:
    enabled: true
    check-interval-minutes: 90
    chance-percent: 6
    min-distance: 16
    max-distance: 40
    whisper-radius: 24
    despawn-seconds: 45
  blood-moon:
    enabled: true
    chance-percent: 15
    bonus-mob-levels: 2
    soul-drop-multiplier: 2.0
    force-duration-minutes: 10
    force-night: true
  world-boss:
    # Itemization 2.0: contribution-gated, PlayerProfile-receiptes személyes komponens.
    ascension-component: osi_ereklyeszilank
    ascension-component-amount: 1
    display-level: 75
    enabled: true
    check-interval-minutes: 90
    chance-percent: 35
    lifetime-minutes: 20
    health: 300.0
    damage-multiplier: 2.0
    scaling:
      participant-radius: 128.0
      player-coefficient: 0.65
      player-exponent: 0.80
      maximum-health-multiplier: 12.0
      damage-per-doubling: 0.04
      maximum-damage-multiplier: 1.18
      combat-power-influence: 0.20
      tier-reference-power: 250.0
    contribution:
      minimum-score: 25.0
      # A telegráf célpontjának sikeres kitérése csak már aktív résztvevőnek jár,
      # encounterenként bounded darabszámmal; AFK/előharc padding nem kvalifikál.
      maximum-objectives: 5
    aura-radius: 12.0
    special-damage: 6.0
    add-lifespan-seconds: 25
    treasury-reward: 300.0
    season-points: 10
    buff-minutes: 10
  invasion:
    enabled: true
    check-interval-minutes: 75
    chance-percent: 30
    mob-count: 8
    mob-level: 4
    radius: 8.0
    mini-boss-level-bonus: 6
    mob-lifespan-seconds: 600
    champion-slam-damage: 5.0
  season:
    enabled: true
    length-days: 60
    treasury-reward: 1000.0
    champion-buff-minutes: 30
    champion-firework: true
    source-weights:
      raid: { red: 1.0, blue: 1.0, neutral: 0.5, dark: 1.0 }
      world-boss: { red: 1.0, blue: 1.0, neutral: 1.0, dark: 1.0 }
      community: { red: 1.0, blue: 1.0, neutral: 1.5, dark: 0.75 }
      cleanse: { red: 1.0, blue: 1.0, neutral: 1.5, dark: 0.5 }
      duel: { red: 1.0, blue: 1.0, neutral: 1.0, dark: 1.5 }
      spy: { red: 0.75, blue: 0.75, neutral: 0.75, dark: 1.5 }
      cult: { dark: 1.0 }
      war: { red: 1.0, blue: 1.0 }
    champion-reward-items:
      - "DIAMOND:8"
      - "GOLDEN_APPLE:4"
    transition-story:
      enabled: true
      line-delay-seconds: 4
  season-finale:
    enabled: true
    days: 7
    chance-mult-per-day: 0.15
    top2-enabled: true
    top2-window-hours: 48
    top2-point-multiplier: 2.0
    mob-level-bonus-per-day: 0.5
    league-point-mult-max: 2.0
    boss:
      enabled: true
      name: "A Lapforduló Őre"
      lifetime-minutes: 30
      wall-offset: 16
      health-mult: 1.5
      bonus-season-points: 15
      loot-rolls: 6
      loot:
        - "DIAMOND:2:5"
        - "NETHERITE_SCRAP:1:2"
        - "GOLDEN_APPLE:1:3"
        - "unique:emlekszilank:2"
        - "unique:runapor:3"
  intro:
    enabled: true
    first-join-spawn: ""
    join-welcome:
      enabled: true
      title: "<aqua>❄ IceSMP</aqua>"
      subtitle: "<gray>Üdv újra a fagyott királyságok földjén!</gray>"
    stagger-seconds: 4
    lines:
      - "&b&lIceSMP||&7Üdv a fagyott királyságok földjén"
      - "&6Válaszd az utadat||&7A Menedékben kezdesz — a Láng vagy a Fagy hív"
      - "&dKovácsold a sorsod||&7Kasztok, szakmák, relikviák várnak"
    cinematic:
      enabled: false
      point-seconds: 3
      waypoints: []

