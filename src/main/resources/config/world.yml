# IceSMP konfiguráció — world (a ConfigManager az összes config/*.yml-t betölti)
# ===== Távolság-alapú mob szintezés =====
# A spawn ponttól távolodva a mobok erősödnek: szint = távolság / blocks-per-level.
mob-scaling:
  enabled: true
  blocks-per-level: 1000
  max-level: 10
  # Zóna-rámpa (tulaj-kérés): a biztonságos territórium-zónák (városok) PEREMÉTŐL
  # kifelé a szint 0-ról nő egyenletesen (zone-ramp.blocks-per-level blokkonként +1),
  # amíg el nem éri a spawn-táv szerinti normál szintet — így a messzi fővárosok
  # környéke is bejárható. A doom-gate/dungeon nem számít biztonságos zónának.
  zone-ramp:
    enabled: true
    blocks-per-level: 250
  health-per-level: 2.0
  damage-per-level: 1.0
  # Csak ellenséges (Monster) mobok skálázódjanak.
  hostile-only: true
  # Ezekkel az okokkal spawnoló mobok nem skálázódnak (pl. spawner farmok).
  ignored-spawn-reasons:
    - "SPAWNER"
    - "CUSTOM"
    - "COMMAND"
  name:
    enabled: true
    # EGYÉRTELMŰ név: always-visible = a névtábla mindig látszik-e. A vanília "mindig
    # látható" névtáblák FALAKON ÁT és nagyon TÁVOLRÓL is renderelődnek (zavaró lehet).
    # false = a szint-névtábla csak akkor jelenik meg, amikor a játékos RÁNÉZ a mobra
    # (közelről, takarás nélkül) — vanília "hover" viselkedés.
    # (A régi 'visible' kulcs legacy-fallbackként még működik.)
    always-visible: false
    prefix: "&7[Lvl %level%] "
    color: "WHITE"

# ===== Világesemények (7. szekció) =====
# FIGYELEM: a check-interval-seconds EGYETLEN közös időzítő, amely az ÖSSZES
# időszakos rendszert hajtja — vérhold, világboss, invázió, karaván, hangulat-
# esemény, gyűjtögető-buff, kincs, Vad Hajsza, Bőség-idő, szerver-kihívás,
# kíséret, meteor, szezon-lejárat, továbbá az aukció-lejárat, árfolyam-tábla,
# statisztika- és achievement-ellenőrzés ütemét is. Átállítása MINDET érinti.
# Ne emeld 60 mp fölé ok nélkül; az egyes események a saját enabled
# kapcsolójukkal és interval-* kulcsaikkal vezérelhetők.
world-events:
  check-interval-seconds: 60
  # Mester-kapcsoló: false = a lenti spawn-rules mátrix egyáltalán nem fut (mindenhova
  # spawnolhat minden). A kulcsok élőben olvasódnak — /icesmp reload után restart nélkül él.
  # (A régi, félrevezető nevű avoid-territory kulcs legacy-fallbackként még működik.)
  spawn-rules-enabled: true
  # Esemény × védelem mátrix: melyik esemény hol NEM spawnolhat. Oszlopok:
  #   territory = claimelt frakció-territórium | claim = játékos-claim
  #   region    = WorldGuard-régió (városok/spawn) | water = víz-felszín
  # Minden cella alapból true (nem kiírt kulcs = true). A tiltott hely kimarad, az esemény
  # a következő intervallumban máshol próbálkozik. (A meteor saját terep-szabálya —
  # lombkorona/rönk-tető elkerülés — configtól függetlenül mindig él.)
  spawn-rules:
    world-boss: { territory: true, claim: true, region: true, water: true }
    invasion:   { territory: true, claim: true, region: true, water: true }
    wild-hunt:  { territory: true, claim: true, region: true, water: true }
    treasure:   { territory: true, claim: true, region: true, water: true }
    meteor:     { territory: true, claim: true, region: true }
    corruption: { territory: true, claim: true, region: true, water: true }
    # DARK undead-ambiencia: a territórium BELSEJE szándékosan engedett (ott él a nép),
    # de claim/WG-régió/víz védve.
    dark-undead: { territory: false, claim: true, region: true, water: true }
    escort: { territory: true, claim: true, region: true, water: true }
    archeology: { territory: true, claim: true, region: true, water: true }
    stranger:   { territory: true, claim: true, region: true, water: true }
    player-caravan: { territory: false, claim: false, region: false, water: false }
    cultists: { territory: true, claim: true, region: true, water: true }
  # ===== N25 — Esemény-horgonyok: HELY-alapú spawn a játékos-horgony helyett =====
  # Módok eseményenként: player = játékos-horgony (default) • points = admin-kijelölt
  # spawnpontok (/events spawnpoint add — pl. állandó világboss-aréna) • random =
  # véletlen koordináta a fő világ spawnja körül • mixed = pont, ha van; különben random.
  # A spawnpontok restart-állók (event-spawnpoints.yml). Élőben olvasódik.
  anchors:
    random-radius: 1500
    world-boss: { mode: "player" }
    escort: { mode: "player" }
    caravan: { mode: "player" }
    cultists: { mode: "player" }
  # ===== Figyelem-orchestráció (gameplay-audit): egyszerre csak EGY nagy PvE-esemény =====
  # A listás események természetes sorsolása kimarad, amíg egy másik listás esemény fut
  # (az admin /events ... parancsok mindig átmennek). Élő kulcsok.
  orchestration:
    enabled: true
    major-events: [ "world-boss", "invasion", "wild-hunt", "escort", "cultists" ]
  # B19 — Évszakos világ-modifikátorok: a VALÓS naptári évszak finom esély-szorzói a
  # világesemények sorsolására (1.0 = nincs módosítás; a plafon mindig 100%). Évszakok:
  # tel (dec-feb) / tavasz (már-máj) / nyar (jún-aug) / osz (szept-nov). Események:
  # blood-moon, world-boss, invasion, wild-hunt, abundance, gathering. Élőben olvasódik.
  season-modifiers:
    enabled: true
    tel:
      blood-moon: 1.4
      wild-hunt: 1.4
      abundance: 0.8
      gathering: 0.9
    tavasz:
      abundance: 1.2
      gathering: 1.1
    nyar:
      abundance: 1.4
      gathering: 1.3
      blood-moon: 0.8
    osz:
      world-boss: 1.2
      invasion: 1.2
  # D19 — a Rejtélyes Idegen: ritkán, véletlen helyen feltűnő, csuklyás alak (néma,
  # sérthetetlen vándor-sziluett). Mond egy talányos sort a whisper-radius-on belül
  # állóknak, majd despawn-seconds után lélek-köddel eltűnik. SZÁNDÉKOSAN nincs
  # mechanikai jutalma (se bolt, se quest) — tisztán atmoszféra. Admin: /events stranger.
  stranger-npc:
    enabled: true
    check-interval-minutes: 90
    chance-percent: 6
    min-distance: 16
    max-distance: 40
    whisper-radius: 24
    despawn-seconds: 45
  # Vérhold-éjszaka: ritka éjjel a mobok erősebbek, a lélekkő-drop felszorzódik.
  # A sorsolás az éj beállta (13000) és éjfél (18000) közt történik, éjszakánként egyszer.
  blood-moon:
    enabled: true
    chance-percent: 15
    bonus-mob-levels: 2
    soul-drop-multiplier: 2.0
    # Admin /events bloodmoon start esetén ennyi percig tart (a napciklustól függetlenül).
    force-duration-minutes: 10
    # Admin-indításnál nappal is estét csinál (a vérhold éjszakai esemény — a természetes
    # indulása amúgy is csak az éj beálltakor sorsolódik).
    force-night: true
  # Világboss: időnként egy boss-szörny spawnol egy véletlen játékos közelében.
  # Spawnkor VÉLETLEN archetípus kerül kiválasztásra a 10-es rosterből (A Gyűrűk Őre /
  # Lávakohó Behemót / Fagyott Trón Királya / Csontkirály / Mélységi Rém / Méreg
  # Anyakirálynő / Vihar Hírnöke / Dögvész Titán / Vas Őrszem / Pokoli Hadúr) —
  # saját entitással, névvel, stat-
  # szorzókkal, szignatúra-aurával és jutalom-szorzóval. A health/damage a KÖZÖS alap,
  # amit az archetípus szorzói módosítanak. 50% HP alatt a boss feldühödik (2. fázis).
  world-boss:
    enabled: true
    check-interval-minutes: 90
    chance-percent: 35
    lifetime-minutes: 20
    health: 300.0
    damage-multiplier: 2.0
    aura-radius: 12.0          # ennyi blokkon belül kapja a túlélő a boss szignatúra-debuffját
    special-damage: 6.0        # a ~8 mp-enkénti telegrafált képesség (slam/zóna) sebzése (enrage: ×1.5)
    add-lifespan-seconds: 25   # a SUMMON-special által idézett add-ok élettartama (utána eltűnnek)
    treasury-reward: 300.0     # az archetípus reward-szorzója módosítja (pl. Mélységi Rém ×1.5)
    season-points: 10
    buff-minutes: 10
    # A leütő SZEMÉLYES bónusz-zsákmánya (a frakciókassza-jutalom mellett) — tárgy, sosem pénz.
    killer-loot-rolls: 2
    killer-loot:
      - "DIAMOND:2:4"
      - "EXPERIENCE_BOTTLE:6:12"
      - "GOLDEN_APPLE:1:2"
      - "unique:emlekszilank:1"
  # Invázió: időnként egy szörnyhorda spawnol egy véletlen játékos köré (ROADMAP 9.).
  # A horda-összetétel VÉLETLEN a 8-as rosterből: Élőhalott Áradat / Csontlégió /
  # Pókfészek / Káosz-horda / Alvilági Roham / Zsivány Hadtest / Boszorkány Gyülekezet /
  # Lángoló Sereg — kevert mob-típusokkal, és minden hullámot egy skálázott, megnevezett
  # mini-boss (bajnok)
  # vezet. A szörnyek skálázottak (XP + lélekkő-eséllyel), admin: /events invasion.
  invasion:
    enabled: true
    check-interval-minutes: 75
    chance-percent: 30
    mob-count: 8
    mob-level: 4
    radius: 8.0
    mini-boss-level-bonus: 6   # a horda bajnoka ennyivel magasabb szintű a hullámnál
    # A le nem ölt horda-mob ennyi mp után köddé válik (a nappal megszelídülő pók ne
    # vándoroljon be a városba). 0 = örök.
    mob-lifespan-seconds: 600
    champion-slam-damage: 5.0  # a bajnok ~6 mp-enkénti telegrafált földcsapásának sebzése
  # Szezonális liga: a frakciók pontot gyűjtenek raid- és boss-győzelmekből.
  # A szezon végén a győztes frakció KASSZÁJA treasury-reward-ot kap, az online
  # TAGJAI pedig győzelmi buffot + tárgy-jutalmat + ünneplő tűzijátékot.
  season:
    enabled: true
    length-days: 60
    treasury-reward: 1000.0
    champion-buff-minutes: 30
    champion-firework: true
    # ===== Aszimmetrikus liga (tulaj-döntés) — a 2+1+1 frakció-felállás miatt =====
    # Nem csak hadi-liga: minden frakció a SAJÁT identitás-útján pontoz erősebben.
    # A súly a nyers pontra hat (a B33/G16 idő-szorzók utána), 0 = a forrás nem ér
    # pontot annak a frakciónak. Hiányzó kulcs = 1.0. Források:
    #   raid       — raid-győzelem (háború: RED/BLUE/DARK útja, a NEUTRAL fél-súlyú)
    #   world-boss — világboss + szezonzáró boss (univerzális PvE)
    #   community  — közösségi cél teljesítése (a NEUTRAL virágzás-útja)
    #   cleanse    — rontás-góc megtisztítása (a Fa gyógyítása — NEUTRAL-út; a
    #                DARK-nak fél-súlyú: a rontás az övék)
    #   duel       — becsület-párbaj győzelem (a kitaszított-út: DARK-erős)
    #   spy        — sikeres (lebukás nélküli) kém-küldetés (a Suttogók útja: DARK-erős)
    #   other      — forrás-címke nélküli jóváírás (admin/parancs)
    source-weights:
      raid:       { red: 1.0,  blue: 1.0,  neutral: 0.5,  dark: 1.0 }
      world-boss: { red: 1.0,  blue: 1.0,  neutral: 1.0,  dark: 1.0 }
      community:  { red: 1.0,  blue: 1.0,  neutral: 1.5,  dark: 0.75 }
      cleanse:    { red: 1.0,  blue: 1.0,  neutral: 1.5,  dark: 0.5 }
      duel:       { red: 1.0,  blue: 1.0,  neutral: 1.0,  dark: 1.5 }
      spy:        { red: 0.75, blue: 0.75, neutral: 0.75, dark: 1.5 }
      # cult — beteljesült kultista esemény (csak a DARK kapja, a kód oldaláról)
      cult:       { dark: 1.0 }
      # war — hadi-ablak alatti RED↔BLUE ölés (a kód csak a hadviselő feleknek adja)
      war:        { red: 1.0,  blue: 1.0 }
    # Tárgy-jutalom a bajnok frakció online tagjainak: "MATERIAL:DARAB" lista.
    champion-reward-items:
      - "DIAMOND:8"
      - "GOLDEN_APPLE:4"
    # D17 — Korszakváltás-narratíva: szezonzáráskor rövid, krónikás-hangú, késleltetett
    # broadcast-sorozat (title + 4-6 chat-sor: nyitány-variáns, az előző szezon hősei a
    # StatsManager top-1 adataiból, a bajnok megidézése, zárás-variáns). A sorok
    # messages-kulcsokkal felülírhatók (season-story-*).
    transition-story:
      enabled: true
      line-delay-seconds: 4
  # B33 — Szezonzáró "végítélet-hét" (lore: a Korszakok Könyve lapfordulása). A szezon
  # utolsó `days` napjában napi eszkaláció: a vérhold/világboss/invázió esély-kulcsa
  # (1 + nap × chance-mult-per-day) szorzót kap, az invázió mob-szintje bónuszt
  # (floor(nap × mob-level-bonus-per-day)), a liga-pontok lineárisan futnak fel a
  # league-point-mult-max-ig (utolsó nap = max, alapból dupla). Az utolsó napon EGYSZERI
  # szezonboss spawnol a NEUTRAL főváros falai MELLETT (wall-offset blokkal a zóna-perem
  # után; guard-bypass — szándékosan a városnál áll), emelt élettel; halálakor a boss.loot
  # tábla gurul (loot-rolls-szor) + bonus-season-points liga-pont. Minden kulcs élőben
  # olvasódik. Főváros-zóna híján a boss a sima (guard-os) világboss-úton esik vissza.
  season-finale:
    enabled: true
    days: 7
    chance-mult-per-day: 0.15
    # G16 — nagydöntő: a szezon utolsó óráiban (záró hétvége) a top2 frakció
    # minden liga-pontja tovább szorzódik; egyszeri broadcast hirdeti a párosítást.
    top2-enabled: true
    top2-window-hours: 48
    top2-point-multiplier: 2.0
    mob-level-bonus-per-day: 0.5
    league-point-mult-max: 2.0
    boss:
      enabled: true
      name: "A Lapforduló Őre"
      lifetime-minutes: 30
      wall-offset: 16
      health-mult: 1.5
      bonus-season-points: 15
      loot-rolls: 6
      # Loot-sorok: "MATERIAL[:MIN[:MAX]]" vagy "unique:<id>[:db]" (LootTable-formátum).
      loot:
        - "DIAMOND:2:5"
        - "NETHERITE_SCRAP:1:2"
        - "GOLDEN_APPLE:1:3"
        - "unique:emlekszilank:2"
        - "unique:runapor:3"
  # Első belépéses bevezető (cím-szekvencia). Sorok: "Cím||Alcím".
  # A38 — spawn-élmény: first-join-spawn = "world,x,y,z[,yaw,pitch]" — az első belépő ide
  # teleportál (teleportAsync), és CSAK utána indul az intro (üres = nincs teleport).
  # join-welcome = visszatérő játékos rövid, halk üdvözlő title-je + hangja (nem broadcast).
  intro:
    enabled: true
    first-join-spawn: ""
    join-welcome:
      enabled: true
      title: "<aqua>❄ IceSMP</aqua>"
      subtitle: "<gray>Üdv újra a fagyott királyságok földjén!</gray>"
    stagger-seconds: 4
    lines:
      - "&b&lIceSMP||&7Üdv a fagyott királyságok földjén"
      - "&6Válassz frakciót||&7Piros, Kék, Semleges vagy Sötét"
      - "&dKovácsold a sorsod||&7Kasztok, szakmák, relikviák várnak"
    # Opcionális filmszerű kameraút (ALAPBÓL KIKAPCSOLVA). Bekapcsoláskor a játékost
    # rövid időre spectator módba teszi, és végigviszi a waypointokon, majd visszaállítja
    # a gamemode-ját (újrabelépéskor is önjavít, ha megszakadna). Waypoint formátum:
    # "x,y,z" vagy "x,y,z,yaw,pitch" vagy "világ,x,y,z,yaw,pitch".
    cinematic:
      enabled: false
      point-seconds: 3
      waypoints: []

# ===== Hangulat-események (ambient) =====
# Ritka, apró, légköri események, amelyek élőbbé teszik a világot — soha nem
# nyúlnak a balanszhoz vagy a gazdasághoz (kozmetikai effekt / apró buff, illetve
# az állat-vándorlásnál passzív állatok = élelem-forrás, sosem valuta). Időnként a
# tick kiválaszt egy ENGEDÉLYEZETT típust, majd ELLENŐRZI a fő világ napszakát/
# időjárását a típushoz tartozó ablakhoz képest — ha nem illik rá, a kör csendben
# kimarad (NEM sorsol új típust). Aki a tűzeléskor a SZABAD ÉG ALATT tartózkodik
# (nincs tető felette), kap egy apró jutalmat: valuta + rövid, ízléshez illő buff.
# Admin: /events ambient (a force teszt-tűzelés figyelmen kívül hagyja az ablakot).
#
# Az egyes típusok napszak/időjárás-ablaka (world-time tick, 0=hajnal, 13000-23000=éjszaka):
#   aurora              — éjszaka (13000-23000) ÉS derült idő (nincs vihar)
#   falling-star        — éjszaka (13000-23000)
#   spectral-wanderers  — éjszaka (13000-23000)
#   fireflies           — alkonyat/kora éjszaka (12000-15000)
#   fog-roll            — hajnal/kora reggel (0-2000) VAGY esik az eső
#   animal-migration    — nappal (1000-11000)
ambient-events:
  enabled: true
  # Broadcast-diéta: a helyhez kötött hangulat-hírek (hullócsillag, csorda) csak
  # ekkora sugárban hallatszanak — a globális chat a nagy eseményeké.
  local-announce-radius: 192
  interval-minutes: 40
  chance-percent: 35
  min-online-players: 1              # ennyi játékos legyen fenn, különben a kör kimarad
  reward-amount: 5.0                 # apró valuta-jutalom a szabad ég alatt lévőknek (0 = csak buff, valuta nélkül)
  aurora-nightvision-seconds: 45     # az északi fény rövid, kozmetikai éjjellátása (mindenkinek)
  effect-seconds: 24                 # az elnyújtott hangulat-effektek (köd/lelkek/bogarak/aurora) hossza
  migration-herd-size: 5             # az állat-vándorlás csordamérete
  # Az egyes típusok külön ki/be kapcsolhatók:
  types:
    aurora: true
    falling-star: true
    fog-roll: true
    spectral-wanderers: true
    animal-migration: true
    fireflies: true

# ===== Gyűjtögető buff-események =====
# Időszakos, szerver-szintű bónusz-ablakok, amelyek a hétköznapi gyűjtögetést
# jutalmazzák — kizárólag nyersanyag/XP, SOSEM valuta. Egyszerre egy ablak fut:
# bányász-láz (érc-blokk bónusz drop), termés-óra (beérett termés bónusz drop),
# halászati láz (dupla fogás esély), tapasztalat-óra (XP-szorzó). Admin: /events gathering.
gathering-buffs:
  enabled: true
  interval-minutes: 90           # két ablak közti idő
  duration-minutes: 15           # egy ablak hossza
  chance-percent: 40             # esély, hogy az intervallum végén tényleg megnyílik
  min-online-players: 1          # ennyi online játékos alatt nem nyílik ablak
  bonus-drop-chance-percent: 50  # bányász/termés/halászati bónusz drop esélye blokként/fogásonként
  xp-multiplier: 2.0             # a tapasztalat-óra XP-szorzója
  types:
    mining-rush: true
    harvest-hour: true
    fishing-frenzy: true
    xp-hour: true

# ===== Felfedező kincs-események =====
# Időnként egy megjelölt kincsesláda bukkan fel egy véletlen játékos közelében, és
# a hozzávetőleges helyét broadcast jelzi — az ELSŐ megtaláló, aki jobb-kattint rá,
# viszi a loot-ot, aztán a láda eltűnik. A jutalom nyersanyag (loot-tábla), nem pénz.
# A loot-tábla bejegyzések: "MATERIAL", "MATERIAL:DARAB" vagy "MATERIAL:MIN:MAX".
treasure-events:
  enabled: true
  # Personal-loot kiterjesztés: az első megtaláló teljes zsákmánya UTÁN a láda még
  # runner-up-seconds mp-ig nyitva marad — a későn érkezők fejenként EGYSZER,
  # csökkentett gurítást kapnak (ratio), max-claimants plafonnal. 0 mp = régi viselkedés.
  runner-up-seconds: 45
  runner-up-loot-ratio: 0.5
  max-claimants: 12
  interval-minutes: 45     # két kincs közti idő
  expire-minutes: 15       # ennyi idő után feltáratlanul eltűnik
  chance-percent: 40       # esély, hogy az intervallum végén tényleg felbukkan
  spawn-radius: 80         # ilyen sugarú körben a horgony-játékos körül
  rolls: 3                 # ennyi tételt húz a loot-táblából
  loot:
    - "DIAMOND:2:5"
    - "GOLD_INGOT:4:9"
    - "IRON_INGOT:6:12"
    - "EMERALD:2:6"
    - "ENCHANTED_GOLDEN_APPLE:1"
    - "EXPERIENCE_BOTTLE:8:16"
    - "NETHERITE_SCRAP:1:2"
    - "GOLDEN_APPLE:2:4"

# ===== Vad Hajsza (harci variáns) =====
# Időnként egy megnevezett, szintre skálázott elit fenevad kóborol be egy véletlen
# játékos közelébe — kóborló mini-fenyegetés az invázió-hordák és a világbossok
# között. Aki leteríti, ritka loot-táblát kap (nyersanyag, sosem valuta); ha időben
# senki nem öli meg, eltűnik. Loot-formátum mint a kincsnél: "MATERIAL[:DARAB|:MIN:MAX]".
wild-hunt:
  enabled: true
  # Personal-loot kiterjesztés: minden sebző résztvevő csökkentett saját gurítást kap
  # (a leütő és a partyja a teljes zsákmányt viszi, ők kimaradnak a második körből).
  participant-loot-ratio: 0.5
  interval-minutes: 70     # két hajsza közti idő
  expire-minutes: 20       # ennyi idő után elszökik, ha nem ölik meg
  chance-percent: 30       # esély, hogy az intervallum végén tényleg felbukkan
  beast-level: 8           # a fenevad skálázott szintje (MobScalingManager)
  rolls: 4                 # ennyi tételt húz a loot-táblából halálkor
  loot:
    - "DIAMOND:3:7"
    - "EMERALD:4:9"
    - "NETHERITE_SCRAP:1:3"
    - "ENCHANTED_GOLDEN_APPLE:1:2"
    - "EXPERIENCE_BOTTLE:12:24"
    - "GOLD_BLOCK:1:3"
    - "DIAMOND_BLOCK:1"

# ===== Bőség-idő (a vérhold pozitív ellenpárja) =====
# Nyugodt, építő/farm-barát időablak: a termés gyorsabban nő, az állatok néha ikret
# ellenek, a természetes szörny-spawnok egy része elmarad, és gyengéd regeneráció leng
# az online játékosokon. Terephez NEM nyúl (csak a már növekvő termést lépteti előrébb).
abundance:
  enabled: true
  interval-minutes: 80             # két Bőség-idő közti idő
  duration-minutes: 15             # egy ablak hossza
  chance-percent: 45               # esély, hogy az intervallum végén tényleg megnyílik
  crop-boost-chance-percent: 40    # esély, hogy egy növekvő termés +1 fázist ugrik
  twin-chance-percent: 25          # esély iker-utódra sikeres szaporodáskor
  calm-spawn-chance-percent: 35    # ennyi eséllyel marad el egy természetes szörny-spawn
  regen-seconds: 8                 # a gyengéd regeneráció-pulzus hossza

# ===== Kollektív szerver-kihívás =====
# Az egész szerver egy közös, időzített célt kap (együtt X szörny / X érc / X termés),
# boss-baron követhető haladással. Ha időben teljesül, MINDEN online játékos jutalmat
# kap (XP + nyersanyag-csomag + rövid Sietség-buff) — sosem valuta. Admin: /events challenge.
server-challenge:
  enabled: true
  interval-minutes: 150      # két kihívás közti idő
  duration-minutes: 30       # egy kihívás időkerete
  chance-percent: 30         # esély, hogy az intervallum végén tényleg indul
  min-online-players: 2      # ennyi online játékos alatt nem indul közös kihívás
  # Népesség-skálázás: per-player-targets = true esetén a cél a targets-per-player
  # érték × online létszám (a fix targets csak fallback / kikapcsolt módhoz).
  per-player-targets: true
  targets-per-player:
    slay: 40
    mine: 60
    harvest: 80
  targets:
    slay: 500                # ennyi szörnyet kell közösen leölni
    mine: 800                # ennyi ércet kibányászni
    harvest: 1000            # ennyi termést betakarítani
  reward-xp: 300             # minden online játékosnak siker esetén
  reward-haste-seconds: 45   # rövid Sietség-buff siker esetén
  reward-rolls: 2            # ennyi tételt húz a jutalom-loot-táblából játékosonként
  reward-loot:
    - "DIAMOND:1:3"
    - "GOLD_INGOT:3:6"
    - "EMERALD:1:4"
    - "EXPERIENCE_BOTTLE:4:8"
    - "IRON_INGOT:4:8"
  types:
    slay: true
    mine: true
    harvest: true

# ===== Karaván-kíséret (kooperatív escort) =====
# Egy konvoj (ládás láma) indul útnak egy célpont felé; útközben szörny-hullámok
# támadják — a játékosoknak életben kell tartaniuk, míg célba ér. Siker: közös loot
# a célnál + a kereskedő-karaván boltja bonus-stock-minutes-ig a bonus-items
# készletet is árulja. TEREP-VÉDELEM: a hullám-poolban nincs robbanó mob, és a
# kíséret-mobok robbanása blokkot akkor sem sérthet (listener-védelem).
escort:
  enabled: true
  interval-minutes: 120      # két kíséret közti idő
  max-duration-minutes: 15   # ennyi idő után a konvoj elveszettnek számít
  chance-percent: 30         # esély, hogy az intervallum végén tényleg elindul
  route-distance: 150        # légvonalbeli táv az indulástól a célig (blokk)
  convoy-health: 60          # a konvoj életereje
  wave-interval-seconds: 60  # két támadó hullám közti idő (teszter-visszajelzésre lazítva)
  wave-size: 3               # mob / hullám (teszter-visszajelzésre lazítva)
  wave-level: 3              # a hullám-mobok skálázott szintje
  bonus-stock-minutes: 60    # siker után ennyi ideig árul bónusz-készletet a karaván
  reward-rolls: 4            # ennyi tételt húz a loot-táblából célba éréskor
  reward-loot:
    - "DIAMOND:2:5"
    - "EMERALD:3:7"
    - "GOLD_INGOT:5:10"
    - "EXPERIENCE_BOTTLE:8:16"
    - "NETHERITE_SCRAP:1:2"
    - "GOLDEN_APPLE:2:4"

# ===== Meteor-becsapódás (kráter + kibányászható érc) =====
# Időnként egy meteor csapódik be a vadonba: egy kis kráter marad, benne ritka,
# kibányászható érc-blokkokkal, amiért a játékosok versengenek, míg el nem enyészik.
# TEREP-VÉDELEM: a meteor NEM robban — LEHELYEZI a krátert, és MINDEN érintett blokk
# eredeti állapotát elmenti, majd lejáratkor (és leálláskor) VISSZAÁLLÍTJA. Ráadásul
# a world-events.spawn-rules.meteor mátrix szerint territóriumon, játékos-claimen és
# WorldGuard-régión kívülre irányítja magát. Így csak az marad, amit a játékosok
# kibányásznak, mielőtt a kráter elenyészik.
meteor:
  enabled: true
  interval-minutes: 85       # két meteor közti idő
  expire-minutes: 10         # ennyi idő után a kráter visszaáll az eredeti terepre
  chance-percent: 35         # esély, hogy az intervallum végén tényleg becsapódik
  spawn-radius: 90           # ilyen sugarú körben a horgony-játékos körül
  crater-radius: 3           # a kráter sugara (blokk) — kicsi, hogy gyors legyen a visszaállítás
  crater-depth: 2            # a kráter mélysége a közepén
  ore-chance: 0.45           # a kráter-közép blokkjai ekkora eséllyel érc (különben díszes bélés)
  # A becsapódás-hely védelme a world-events.spawn-rules.meteor mátrixba költözött
  # (a régi meteor.avoid-territory kulcs megszűnt).


# ===== N25b — Kultista esemény (a Néma Királynő kósza hívei; teszter-ötlet) =====
# Három változat súlyozott sorsolással: attack = portya (irtsd ki mindet) • rite =
# rítus, amit rite-minutes alatt kell megszakítani, különben rite-corruption-chance
# eséllyel RONTÁS-GÓC nyílik a helyszínen; megszakítva rite-loot hullik • courier =
# csuklyás hírvivő a legközelebbi DARK territórium felé — leölve loot, különben eltűnik.
# Spawn-hely: a spawn-rules.cultists mátrix-sor + world-events.anchors.cultists mód.
cultists:
  enabled: true
  interval-minutes: 100
  chance-percent: 30
  spawn-offset: 48
  mob-level: 5
  variant-weights:
    attack: 40
    rite: 35
    courier: 25
  attack-count: 4
  rite-count: 3
  rite-minutes: 6
  rite-corruption-chance: 60
  rite-loot-rolls: 3
  # LootTable-formátum: "MATERIAL" | "MATERIAL:DB" | "MATERIAL:MIN:MAX"
  rite-loot:
    - "SCULK:2:6"
    - "ECHO_SHARD:1:2"
    - "GOLD_INGOT:2:5"
    - "EXPERIENCE_BOTTLE:3:6"
    # Sötét-mágiájú anyag (a guide ígérte a Suttogóknak): a rítus-zsákmányban és a
    # Suttogó-részesedésben egyaránt gurulhat — a sötét receptek alapanyaga.
    - "unique:arnyekpor:2"
  courier-lifetime-minutes: 8
  # ===== Suttogó-crossover: a BETELJESÜLT esemény (rítus / célba érő hírvivő) =====
  # jutalma a rejtett oldalnak: minden felesküdött Suttogó gyanúja ennyivel csillapodik
  # (privát üzenettel — nem leplez le), a DARK frakció pedig liga-pontot kap ("cult"
  # forrás a season.source-weights mátrixban). A védelem így valódi játék-cél.
  whisper-suspicion-relief: 15.0
  # Suttogó-erősítés: beteljesült eseménykor a felesküdöttek TÁRGY-részesedést is
  # kapnak (a rite-loot táblából gurítva, privátan; 0 = kikapcsolva).
  whisper-loot-rolls: 1
  success-season-points: 3

# ===== H2 — Terjedő korrupt zóna (a Kapu rontása; tisztítása a Fát gyógyítja) =====
# Ritkán rontás-góc nyílik a vadonban: SCULK_CATALYST mag + logikai sugarú zóna, amely
# éjszakánként terjed a plafonig, és korrupt mobokat szül (kemény cap). Tisztítás:
# purge-kills-required korrupt fajzat leölése, majd a mag SHIFT+jobb katt (jutalom-loot +
# regeneráció). A spawn-hely a world-events.spawn-rules.corruption mátrix-sort követi.
# Élőben olvasódik; a zóna restart-álló (corruption.yml).
corruption:
  enabled: true
  # Personal-loot kiterjesztés: aki legalább contributor-min-kills korrupt fajzatot
  # irtott, a tisztításkor csökkentett saját gurítást kap (a mag-törőé a teljes loot).
  contributor-min-kills: 3
  contributor-loot-ratio: 0.5
  interval-minutes: 120
  chance-percent: 25
  spawn-offset: 96           # a horgony-játékostól legfeljebb ennyire nyílik
  initial-radius: 16.0
  radius-cap: 64.0
  spread-per-night: 4.0
  mob-cap: 12                # egyszerre legfeljebb ennyi korrupt mob él (entitás-fék)
  spawn-batch: 2
  mob-level: 6
  purge-kills-required: 15
  reward-rolls: 4
  reward-buff-minutes: 5
  season-points: 6   # liga-pont a tisztító frakciójának ("cleanse" forrás, NEUTRAL-erős súly)
  # A rontás előszeretettel a Kitaszítottak földje felől szivárog: chance-percent
  # eséllyel a góc egy véletlen DARK territórium PEREMÉN TÚL nyílik (a zóna szélétől
  # min..max blokkra, tehát a territóriumon KÍVÜL — a belsejét a spawn-rules amúgy is
  # védi). Ha nincs DARK territórium, vagy a sorsolás nem talál, marad a vadon-út.
  dark-bias:
    chance-percent: 50
    min-edge-distance: 24
    max-edge-distance: 96
  # LootTable-formátum: "MATERIAL" | "MATERIAL:DB" | "MATERIAL:MIN:MAX" (soronként egy tétel).
  loot:
    - "SCULK:4:12"
    - "ECHO_SHARD:1:3"
    - "DIAMOND:2:5"
    - "EXPERIENCE_BOTTLE:4:8"
    - "NETHERITE_SCRAP:1:2"
    - "ENCHANTED_GOLDEN_APPLE:1"

# ===== B42 — Régészet (a Mélység Népe nyomai; vanília ecset-mechanika) =====
# Időnként gyanús homok/kavics lelőhely bukkan fel (broadcast koordinátával); a lelet
# SZERVER-SAJÁT (finds tábla — sosem vanília cserép). Lejáratkor a terep visszaáll.
# finds-formátum: "unique:<id>:<db>" (pl. Emlékszilánk) vagy "MATERIAL[:MIN[:MAX]]".
archeology:
  enabled: true
  interval-minutes: 50
  chance-percent: 35
  spawn-radius: 80
  # Broadcast-diéta: a lelőhely-hír csak ekkora sugárban hallatszik (személyes lépték).
  announce-radius: 160
  expire-minutes: 20
  finds:
    - "unique:emlekszilank:1"
    - "unique:osi_ereklyeszilank:1"
    - "unique:melysegi_borostyan:1"
    - "AMETHYST_SHARD:2:4"
    - "ECHO_SHARD:1:2"
    - "EMERALD:2:5"
    - "GOLD_INGOT:2:4"
    - "BONE:4:8"

# ===== D3 — Szezon-emlékmű (a Korszakok Könyve kőben) =====
# Szezonzáráskor a bajnok frakció banner-blokkja + hologram-lista kerül az admin által
# kijelölt pontra: location = "world,x,y,z" (üres = nincs fizikai emlékmű, de a sorok
# gyűlnek a monument.yml-ben). A hologram a legutóbbi max-lines lezárt korszakot sorolja
# (sorszám + bajnok + a korszak top-3 hőse). Élőben olvasódik.
season-monument:
  enabled: true
  location: ""
  max-lines: 12
  header: "<gold>📖 A Korszakok Könyve</gold>"

# ===== Nether-portál világszabály (tulaj-döntés) =====
# Új nether-portál gyújtása MINDENHOL tilos — a világ egyetlen élő kapuja a
# Kárhozat Kapuja (az admin-csapat gyújtja meg; a zóna-bypass jog átengedi a
# tiltáson). true = vanília viselkedés vissza. A meglévő portálok működnek,
# csak ÚJAT nem lehet gyújtani.
nether-portal:
  allow-creation: false

# ===== D8 — Felfedezhető titkos helyek =====
# Admin-kijelölt rejtett pontok: aki ELSŐKÉNT ér oda, jutalmat kap és broadcast hirdeti;
# a többiek egyszeri, fél-értékű jutalmat kapnak (repeat-reward-ratio), VAGY
# first-finder-only: true esetén csak a "már felfedezett" üzenetet. A rewards sorok
# LootTable-formátumúak ("MATERIAL[:MIN[:MAX]]" / "unique:<id>[:db]"). Élőben olvasódik.
hidden-spots:
  enabled: true
  check-seconds: 30
  first-finder-only: false
  repeat-reward-ratio: 0.5
  spots: {}
  # Példa:
  # spots:
  #   elveszett-kilato:
  #     name: "Az Elveszett Kilátó"
  #     location: "world,120,84,-560"
  #     radius: 5
  #     xp: 30
  #     rewards:
  #       - "DIAMOND:2"
  #       - "unique:emlekszilank:1"

# ===== B6 — Játékos-indított karaván (szállítmány-rablás) =====
# /faction caravan send <összeg> (király): a kasszából rakomány indul egy kihirdetett
# őrzőpontra; window-seconds-ig védhető/rabolható. Túléli -> kassza × success-multiplier;
# ellenség leöli -> a rabló frakció kasszájáé; saját ölés -> elvész. Élő kulcsok.
player-caravan:
  enabled: true
  min-cargo: 100.0
  max-cargo: 1000.0
  window-seconds: 300
  success-multiplier: 1.25
  convoy-hp: 120.0
  site-radius: 300
  cooldown-minutes: 90

# ===== B21 — Bestiárium: mérföldkövek (formátum: "<darab>:<veret>[:broadcast]") =====
bestiary:
  enabled: true
  milestones:
    mobs: [ "10:25", "25:60", "50:150:broadcast" ]
    recipes: [ "10:25", "50:100", "100:250:broadcast" ]
    territories: [ "5:30", "10:80:broadcast" ]
    bosses: [ "1:50", "3:150:broadcast" ]

# ===== DARK undead-népesség: a Kitaszítottak földjének élőholtai (lore-ambiencia) =====
# A DARK territóriumokban magas szintű undead-populáció él, akik a napon SEM égnek
# el (EventSpawnGuard.prepare). A DARK játékosokat a frakció-passzíva miatt békén
# hagyják — a betolakodónak a holtak városa maga a rémálom. Élő kulcsok.
dark-undead:
  enabled: true
  scope: "all"            # capital = csak a DARK főváros | all = MINDEN DARK territórium
  territory-id: ""            # kitöltve: pontosan ez a territórium (a scope-ot felülbírálja)
  max-population: 24
  spawn-batch: 4
  spawn-interval-seconds: 30
  min-level: 4
  max-level: 7
  lifespan-seconds: 600
  types: [ "ZOMBIE", "SKELETON", "HUSK", "STRAY", "WITHER_SKELETON" ]

# ===== H14 — Ritka spawn-variánsok (Albínó / Árnyék) =====
# Kis eséllyel a spawnoló szörny variánssá válik: névtábla + effekt jelzi;
# dupla kaszt-XP, emelt lélekkő-esély, önálló bestiárium-bejegyzés. Élő kulcsok.
rare-variant:
  chance-percent: 1.5
  xp-multiplier: 2.0
  soul-chance-multiplier: 2.0

# ===== D1 — Szezonális ünnepek: valós naptári ablakok (kódex VIII. Időrend) =====
# Az aktív ablak nyíltakor/zártakor broadcast; a managerek a HolidayService.override()
# kulcsain át futásidőben kaphatnak ünnep-skint (a config sosem íródik át).
seasonal-events-enabled: true
seasonal-events:
  remej:
    start: "10-25"
    end: "11-02"
    greeting: "Rém-éj közeleg — a fátyol elvékonyodik, a tökfejek vigyorognak! (Vérhold-virrasztás)"
    # Ünnep-szorzók (HolidayService.override): az ablak alatt sűrűbb vérhold + invázió.
    blood-moon-chance-mult: "2.0"
    invasion-chance-mult: "1.5"
  erkezes_napja:
    start: "12-20"
    end: "12-27"
    greeting: "Az Érkezés Napja — a Kapu fényei kigyúlnak, a kereskedők ajándék-kedvvel mérnek!"
  hasadas_napja:
    start: "03-21"
    end: "03-23"
    greeting: "A Hasadás Napja — emlékezz: egykor egy világ voltunk."
  ultimatum_napja:
    start: "06-21"
    end: "06-22"
    greeting: "Az Ultimátum Napja — a királyok ma keményebben alkusznak."

# ===== D11 — Járőröző városi őrség (v1: plugin-spawnolta őr-NPC-k) =====
# Waypoint-útvonalak őrönként; a léptetés az őr SAJÁT régió-szálán fut, éjjel
# gyorsabb tempóban. Példa (töltsd ki a saját fővárosi koordinátáiddal):
city-guards:
  enabled: true
  step-seconds: 2
  day-step-blocks: 1.5
  night-step-blocks: 3.0
  guards: {}
  # guards:
  #   vamhaz_ore:
  #     name: "A Vámház őre"
  #     world: "world"
  #     route: [ "100,64,100", "120,64,100", "120,64,120", "100,64,120" ]
