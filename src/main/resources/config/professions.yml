# IceSMP konfiguráció — professions (a ConfigManager a támogatott CONFIG_FILES-listát tölti be)
# ===== Szakmák (WoW-szerű: 1 gyűjtögető + 1 készítő főszakma + másodlagosak) =====
# Gyűjtögető: miner (Bányász), herbalist (Gyógynövényész), lumberjack (Favágó)
# Készítő: armorer (Kovács), alchemist (Alkimista), enchanter (Bűvölő)
# Másodlagos (mindenkié, automatikusan): fisherman (Halász), cook (Szakács)
professions:
  leveling:
    base-xp: 100
    increment-per-level: 15
  # Szakma-receptek (ROADMAP 10.): mestermű tárgyak, amiket csak a megfelelő szakma +
  # szint birtokában lehet craftolni. A required-level felülírható receptenként.
  recipes:
    enabled: true
    # A régi, kódba égetett 8 mestermű-recept (Tárnász Csákány, Bástya Pajzs…)
    # alapból KI: numerikusan mindig felülmúlták a recept-katalógus párjukat
    # (két párhuzamos rendszer). A már legyártott példányok érvényesek maradnak;
    # true = a régi receptek is craftolhatók (nem ajánlott).
    legacy-masterworks: false
    tarnasz_csakany:
      required-level: 15
    favago_fejsze:
      required-level: 15
    bastya_pajzs:
      required-level: 15
    bolcs_konyve:
      required-level: 15
  # I7 — Évszakos termés: a Bőség-idő ablakában a Gyógynövényész BETAKARÍTÁS-XP-je
  # (virág/érett termény/harvest) ezzel szorzódik — a bányász/favágó blokk-törést nem érinti.
  seasonal:
    abundance-multiplier: 1.5
  xp:
    # WoW-stílusú skill-up: a recept-könyvi craft XP-je = base + recept-szint × per-level;
    # ha a szakma-szinted (grey-after/2)-vel a recept felett jár → fél XP,
    # grey-after-rel felette → 0 („szürke recept”).
    recipe-craft-base: 8
    recipe-craft-per-level: 2
    recipe-craft-grey-after: 20
    mining-ore: 5
    herbalism-harvest: 3
    logging: 2
    crafting-gear: 8
    smithing: 15
    enchanting: 10
    brewing: 12
    fishing: 4
    cooking: 3
  specialization:
    # A szakma ezen a szinten specializálódhat (/spec choose).
    required-level: 25

# ===== I16 — Szakma-céh heti közös cél (globális, frakció-független) =====
# Egység = a termelt szakma-XP; a hét fordulásakor az elért célok küszöb feletti
# hozzájárulói reward-xp szakma-XP-t kapnak (offline belépéskor). /szakmacel mutatja.
profession-weekly:
  enabled: true
  reward-xp: 300
  min-contribution: 100
  goals:
    miner: 5000
    herbalist: 4000
    lumberjack: 4000
    armorer: 2500
    alchemist: 1800
    enchanter: 1500
    fisherman: 3000
    cook: 1500
