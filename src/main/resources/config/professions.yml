# IceSMP konfiguráció — professions (a ConfigManager az összes config/*.yml-t betölti)
# ===== Szakmák (WoW-szerű: 1 gyűjtögető + 1 készítő főszakma + másodlagosak) =====
# Gyűjtögető: miner (Bányász), herbalist (Gyógynövényész), lumberjack (Favágó)
# Készítő: armorer (Kovács), alchemist (Alkimista), enchanter (Bűvölő)
# Másodlagos (mindenkié, automatikusan): fisherman (Halász), cook (Szakács)
professions:
  leveling:
    base-xp: 100
    increment-per-level: 15
  # Szakma-receptek (ROADMAP 10.): mestermű tárgyak, amiket csak a megfelelő szakma +
  # szint birtokában lehet craftolni. A required-level felülírható receptenként.
  recipes:
    enabled: true
    tarnasz_csakany:
      required-level: 15
    favago_fejsze:
      required-level: 15
    bastya_pajzs:
      required-level: 15
    bolcs_konyve:
      required-level: 15
  xp:
    mining-ore: 5
    herbalism-harvest: 3
    logging: 2
    crafting-gear: 8
    smithing: 15
    enchanting: 10
    brewing: 12
    fishing: 4
    cooking: 3
  specialization:
    # A szakma ezen a szinten specializálódhat (/spec choose).
    required-level: 25
  # Mestermű-affixek: az affixelhető tárgyak (szakma-mestermunkák, később drop/boss loot) craftoláskor
  # VÉLETLEN minőséget és random attribútum-bónuszokat kapnak, így minden darab egyedi. A fegyver/
  # szerszám kéz-slotos affixet kap (sebzés/gyorsaság), a páncél páncél-slotosat (élet/vért/keménység/
  # sebesség). A 'tiers' adja a forrásonkénti BALANSZT:
  #   drop    — mob-drop loot: GYENGÉBB (alacsonyabb minőség-eloszlás + value-multiplier < 1)
  #   crafted — szakma-craft: ERŐS alap (value-multiplier 1.0)
  #   boss    — világboss / nehéz event loot: a crafttal EGY SZINTEN (magas minőség-eloszlás)
  masterwork:
    enabled: true
    affixes:
      max_health:      { name: "Szívósság",  min: 1.0,   max: 4.0,  decimals: 0 }
      armor:           { name: "Vértezet",   min: 1.0,   max: 3.0,  decimals: 0 }
      armor_toughness: { name: "Keménység",  min: 1.0,   max: 3.0,  decimals: 0 }
      movement_speed:  { name: "Fürgeség",   min: 0.005, max: 0.02, decimals: 3 }
      attack_damage:   { name: "Élesség",    min: 0.5,   max: 3.0,  decimals: 1 }
      attack_speed:    { name: "Gyorsaság",  min: 0.1,   max: 0.6,  decimals: 2 }
    # Közös RARITY-LÉTRA (WoW/Terraria-reforge stílus): Ócska (csak negatív!) -> Ereklye.
    # A raritás adja a színt, a NÉV-JELZŐT (a jelző illik a raritáshoz), az affixek SZÁMÁT, az
    # ERŐSSÉGET (value-multiplier — így az affix "fedi" a prefixet) és a negatív-esélyt.
    # A mob-loot neve: [Raritás] <raritás-jelző> <alaptárgy-név>; a craftolté: [Raritás] <tervezett név>.
    rarities:
      ocska:
        name: "Ócska"
        color: "&8"
        affixes: 1
        negative-chance: 1.0        # CSAK negatív affix (átok)
        value-multiplier: 0.4
        adjectives: [ "Rozsdás", "Törött", "Repedezett", "Nyomorult", "Szánalmas", "Csorba" ]
      kozonseges:
        name: "Közönséges"
        color: "&f"
        affixes: 1
        negative-chance: 0.10
        value-multiplier: 0.6
        adjectives: [ "Egyszerű", "Kopott", "Hétköznapi", "Dísztelen", "Régi" ]
      nem_mindennapi:
        name: "Nem mindennapi"
        color: "&a"
        affixes: 2
        negative-chance: 0.05
        value-multiplier: 0.8
        adjectives: [ "Megbízható", "Edzett", "Kovácsolt", "Szolid", "Tartós" ]
      ritka:
        name: "Ritka"
        color: "&9"
        affixes: 2
        negative-chance: 0.0
        value-multiplier: 1.0
        adjectives: [ "Fényes", "Rúnás", "Kiváló", "Nemes", "Csillámló" ]
      epikus:
        name: "Epikus"
        color: "&5"
        affixes: 3
        negative-chance: 0.0
        value-multiplier: 1.2
        adjectives: [ "Ragyogó", "Szentelt", "Hősi", "Viharvert", "Dicső" ]
      legendas:
        name: "Legendás"
        color: "&6"
        affixes: 4
        negative-chance: 0.0
        value-multiplier: 1.4
        adjectives: [ "Legendás", "Isteni", "Fenséges", "Lángoló", "Diadalmas" ]
      ereklye:
        name: "Ereklye"
        color: "&c"
        affixes: 4
        negative-chance: 0.0
        value-multiplier: 1.6
        adjectives: [ "Ősi", "Mennyei", "Halhatatlan", "Mitikus", "Sárkánykovácsolt" ]
    # Mob-loot alaptárgy-nevek family szerint (a jelző a raritásból jön).
    nouns:
      weapon: [ "Penge", "Kard", "Fog", "Tőr", "Szablya", "Kard" ]
      armor: [ "Vért", "Páncél", "Sisak", "Pajzs", "Köntös" ]
      tool: [ "Szerszám", "Csákány", "Fejsze", "Véső" ]
    # A tier CSAK azt dönti el, mely raritások eshetnek és milyen súllyal (a raritás adja az erőt).
    #   drop    — mob-loot: eshet Ócska is (átkos), ritkán jó
    #   crafted — szakma-craft: nincs Ócska, kiegyensúlyozott
    #   boss    — világboss / nehéz event: magas raritások
    tiers:
      drop:
        weights: { ocska: 25, kozonseges: 40, nem_mindennapi: 22, ritka: 10, epikus: 3 }
      crafted:
        weights: { kozonseges: 30, nem_mindennapi: 32, ritka: 25, epikus: 10, legendas: 3 }
      boss:
        weights: { ritka: 30, epikus: 40, legendas: 25, ereklye: 5 }
