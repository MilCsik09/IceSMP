# IceSMP konfiguráció — authored Itemization 2.0 template-ek.
# A template identitása és forrása fix; kizárólag a rolled-stats tartományai sorsolódnak.
itemization:
  stats:
    # Egy Képességerő pont ennyi százalékot ad a cast nagyságához; élőben újratölthető.
    ability-power-percent-per-point: 1.0
    # A felszerelésből származó teljes Képességerő-bónusz plafonja.
    ability-power-max-percent: 50.0
  equipment:
    # Az authored MMORPG család független a backing Materialtól. A profilok az
    # azonos tierű budgetet osztják el, ezért nem alkotnak power-rangsort.
    family-profiles:
      cloth:
        base-armor-coefficient: 0.70
        budget: { offensive: 0.35, defensive: 0.25, utility: 0.40 }
        preferred-stats: [ ability_power, max_health ]
        disfavored-stats: [ armor_toughness ]
      leather:
        base-armor-coefficient: 0.90
        budget: { offensive: 0.40, defensive: 0.25, utility: 0.35 }
        preferred-stats: [ attack_damage, attack_speed, movement_speed ]
        disfavored-stats: [ armor_toughness ]
      mail:
        base-armor-coefficient: 1.10
        budget: { offensive: 0.33, defensive: 0.40, utility: 0.27 }
        preferred-stats: [ ability_power, max_health, armor ]
        disfavored-stats: [ ]
      plate:
        base-armor-coefficient: 1.35
        budget: { offensive: 0.25, defensive: 0.60, utility: 0.15 }
        preferred-stats: [ max_health, armor, armor_toughness ]
        disfavored-stats: [ movement_speed ]
  loot:
    # Az authored combat gear fokozatosan leváltja a régi generikus random-affix gear sort.
    enabled: true
    # A level/class/spec/build/slot/source együttes előnye sem lépheti túl ezt a szorzót.
    max-personalization-multiplier: 1.5
    # Ennyi legutóbbi authored combat drop vesz részt a soft-diversity súlyozásban (1–32).
    history-window: 24
    # Ismétlődő template-enkénti enyhe súlybüntetés.
    repeated-template-penalty: 0.12
    # Azonos rarity/slot/family előzményenkénti enyhe súlybüntetés.
    repeated-category-penalty: 0.035
    # Régen nem látott rarity/slot/family kategóriánkénti enyhe súlybónusz.
    unseen-category-boost: 0.04
  crafting:
    # Additív, plafonozott quality-padló; nem szorozza a tárgy teljes stat-budgetjét.
    base-minimum-quality: 0.10
    quality-per-profession-level: 0.003
    maximum-level-contribution: 0.20
    blueprint-quality-bonus: 0.05
    masterwork-quality-bonus: 0.15
  reroll:
    base-material: runapor
    base-amount: 2
    growth: 1.55
    maximum-amount: 32
    stat-lock-extra-material: folyositoszer
    stat-lock-extra-amount: 1
    quality-amplifier-material: sarkfeny_cseppko
    quality-amplifier-floor: 0.65
    stability-material: viaszpecset
  runes:
    # Canonical policy: remove/replace után a régi rúna nem jár vissza; ez economy sink.
    old-rune-policy: destroy
    remove:
      material: runapor
      amount: 1
    replace:
      material: runapor
      amount: 2
  salvage:
    base-dust: 1
    per-rarity-dust: 1
    rune-dust-per-rune: 1
    signature-dust: 1
    maximum-dust: 8
    output-map:
      salvage_dust: runapor
      rune_dust: runapor
      signature_dust: folyositoszer
  gathering:
    rare-mining:
      enabled: true
      # Egy block legfeljebb egy ritka anyagot ad; a lista összesített esélye és a
      # Profile v2 napi budget is bounded. Silk Touch, regen-pajzs és AFK nem jutalmaz.
      daily-cap: 6
      resources:
        sarkfeny_cseppko:
          chance: 0.0060
          source-blocks: [ DEEPSLATE_DIAMOND_ORE, DEEPSLATE_EMERALD_ORE ]
          minimum-y: -64
          maximum-y: 16
          environment: NORMAL
        viharkvarc:
          chance: 0.0045
          source-blocks: [ DEEPSLATE_REDSTONE_ORE, DEEPSLATE_COPPER_ORE ]
          minimum-y: -64
          maximum-y: 8
          environment: NORMAL
        melysegi_borostyan:
          chance: 0.0035
          source-blocks: [ DEEPSLATE_GOLD_ORE, DEEPSLATE_LAPIS_ORE ]
          minimum-y: -64
          maximum-y: 0
          environment: NORMAL
        nema_kristaly:
          chance: 0.0020
          source-blocks: [ DEEPSLATE_LAPIS_ORE, DEEPSLATE_DIAMOND_ORE ]
          minimum-y: -64
          maximum-y: -24
          environment: NORMAL
        karhozat_parazs:
          chance: 0.0015
          source-blocks: [ NETHER_GOLD_ORE, ANCIENT_DEBRIS ]
          minimum-y: 8
          maximum-y: 96
          environment: NETHER
  ascension:
    glatziendorfi_jegvert:
      awakened:
        materials: { sarkfeny_cseppko: 4, tiszta_vasesszencia: 6, osi_ereklyeszilank: 1, runapor: 8 }
      ascended:
        materials: { sarkfeny_cseppko: 8, tiszta_vasesszencia: 12, osi_ereklyeszilank: 2, runapor: 16 }
    glatziendorfi_jegtoro:
      awakened:
        materials: { sarkfeny_cseppko: 5, viharkvarc: 4, osi_ereklyeszilank: 1, runapor: 10 }
      ascended:
        materials: { sarkfeny_cseppko: 9, viharkvarc: 8, osi_ereklyeszilank: 2, runapor: 18 }
    ostromtoro_mellvert:
      awakened:
        materials: { melysegi_borostyan: 5, tiszta_vasesszencia: 8, osi_ereklyeszilank: 1, runapor: 8 }
    csillagvesz_ritualbot:
      awakened:
        materials: { nema_kristaly: 4, holdezust_huzal: 6, osi_ereklyeszilank: 1, runapor: 10 }
    kallan_szeletelo:
      awakened:
        materials: { sarkanycsont_szilank: 6, sarkfeny_cseppko: 6, osi_ereklyeszilank: 1, runapor: 12 }
    sarkanycsont_ij:
      awakened:
        materials: { sarkanycsont_szilank: 8, szavannafu_kotel: 5, osi_ereklyeszilank: 1, runapor: 12 }
    napfogyatkozas_fokusz:
      awakened:
        materials: { nema_kristaly: 6, karhozat_parazs: 3, osi_ereklyeszilank: 2, runapor: 16 }
  legacy:
    # Legacy random-affix gear tovább használható/kereskedhető, de nem rerollolható,
    # nem ascendelhető és nem salvage-elhető automatikusan.
    market-enabled: true

