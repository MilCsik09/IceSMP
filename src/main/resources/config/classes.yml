# IceSMP konfiguráció — classes (a ConfigManager a támogatott CONFIG_FILES-listát tölti be)
# ===== Kasztok: progresszió és szint-alapú skill feloldás =====
# Az XP mob ölésből érkezik; a skálázott (mob_level) mobok bónusz XP-t adnak.
# A spell-unlocks térkép szerint a kaszt adott szintjén a varázslat automatikusan feloldódik.
classes:
  # Kapcsolható mód: true esetén a Halállovagot csak Kitaszított választhatja
  # (a már meglévő nem-DARK DK-kat nem érinti). Élő kulcs.
  death-knight:
    dark-only: false
  # Kaszt-választás kétlépcsős megerősítése (a döntés végleges, csak admin fordítja
  # vissza): az első kattintás figyelmeztet, ennyi másodpercen belül kell megismételni.
  # 0 = nincs megerősítés (egy kattintás választ).
  select-confirm-seconds: 30
  xp:
    hostile-only: true
    # Rebalansz: a spec-spellek a 25-45. szinten oldódnak fel, ezért a leveling
    # elérhető tempójú legyen. ~10-15 XP/ölés (skálázott mobokra több).
    per-kill: 10
    per-mob-level: 3
  # WoW-szerű progresszív szintgörbe: az n. szintlépés ára base-xp + (n-1) * increment.
  # Laposabb görbe, hogy a 25. (spec) és a 45. (utolsó spec-spell) szint reális grindel elérhető legyen.
  leveling:
    base-xp: 60
    increment-per-level: 10
  specialization:
    # Az elsődleges kaszt ezen a szinten specializálódhat (/spec choose).
    required-level: 25
  wizard:
    spell-unlocks:
      wisplight: 2
      mana_dart: 3
      root: 5
      frost_touch: 7
      arcane_shield: 9
      confusion: 10
      blink: 12
      rain_dance: 15
      arcane_nova: 18
      gravity_well: 21
  warrior:
    spell-unlocks:
      battle_shout: 3
      armament: 5
      heroic_leap: 7
      pommel_strike: 9
      inner_focus: 10
      second_wind: 12
      gust: 15
      whirlwind: 18
      iron_skin: 20
      intimidate: 22
  archer:
    spell-unlocks:
      hunters_mark: 2
      eagle_eye: 3
      disengage: 5
      multishot: 8
      piercing_bolt: 10
      snare: 12
      double_jump: 15
      camouflage: 17
      arrow_storm: 20
      swift_steps: 22
  assassin:
    spell-unlocks:
      dagger_throw: 2
      adrenaline: 4
      shadowstep: 5
      hamstring: 8
      blackout: 10
      smoke_bomb: 12
      evasion: 15
      garrote: 18
      shadow_dash: 20
      death_mark: 24
  # Druida: a természet kasztja. Újrahasznosítja a meglévő természet-spelleket
  # (rain_dance/feast/wisplight) + saját gyógyító/gyökér spellek, és mind a 4
  # shapeshift-forma (medve/párduc/hold/utazó) már alap-szinten elérhető.
  druid:
    spell-unlocks:
      regrowth: 2
      sunfire: 3
      thornlash: 5
      druid_cat_form: 7
      entangling_roots: 9
      barkskin: 11
      druid_bear_form: 13
      wild_mushroom: 15
      druid_travel_form: 17
      cyclone: 19
      druid_moonkin_form: 21
  # Paplovag (Paladin): a szent harci kaszt — sújtás, gyógyítás, áldás-aurák.
  # Támogató/hibrid identitás: a Szentlélek gyógyít, a Megtorló szent sebzést oszt.
  paladin:
    spell-unlocks:
      smite: 2
      flash_heal: 4
      devotion_aura: 6
      hammer_of_justice: 8
      consecration: 11
      blessing_of_might: 13
      holy_wrath: 15
      divine_protection: 17
      radiance: 19
      lay_on_hands: 21
  # Halállovag (Death Knight): rúnikus harcos — fagy és vér. A Vérlovag tankol
  # életszívással, a Fagylovag fagyos közelharci sebzést oszt.
  death_knight:
    spell-unlocks:
      death_strike: 2
      rune_strike: 4
      death_coil: 6
      chains_of_ice: 8
      icy_touch: 11
      bone_shield: 13
      blood_boil: 15
      anti_magic_shell: 17
      dark_command: 19
      frost_fever: 21
  # Sámán (Shaman): elemi mágus — villám/láva/jég + totem-aurák. Az Elemi távolról
  # tüzérkedik, az Erősítő elemekkel feltöltött közelharcot vív.
  shaman:
    spell-unlocks:
      lightning_bolt: 2
      healing_surge: 4
      earth_shock: 6
      flame_shock: 8
      frost_shock: 11
      lightning_shield: 13
      searing_totem: 15
      wind_rush: 17
      healing_stream_totem: 19
      ancestral_spirit: 21
  # Szerzetes (Monk): harcművész — gyors kombók, mozgékonyság, csi-gyógyítás.
  # A Szélfutó kombó-sebzést oszt, a Sörfőző sör-buffokkal tankol.
  monk:
    spell-unlocks:
      tiger_palm: 2
      roll: 4
