      leg_sweep: 21
  # Pap (Priest): szent és árny mágia, gyógyítás. Fegyelem = pajzs/heal, Árnyék = árny-sebzés.
  priest:
    spell-unlocks:
      holy_smite: 2
      heal: 4
      renew: 6
      power_word_shield: 8
      shadow_word_pain: 11
      mind_blast: 13
      dispel: 15
      holy_nova: 17
      fade: 19
      levitate: 21
  # Boszorkánymester (Warlock): átkok, démon-tűz, életszívás. Átok = dot, Pusztítás = tűz.
  warlock:
    spell-unlocks:
      shadow_bolt: 2
      corruption: 4
      drain_life: 6
      curse_of_weakness: 8
      immolate: 11
      shadowburn: 13
      fear: 15
      curse_of_agony: 17
      demon_armor: 19
      demonic_circle: 21
  # Démonvadász (Demon Hunter): fel-mágia, mozgékony közelharc. Tombolás = dps, Bosszú = tank.
  demon_hunter:
    spell-unlocks:
      demons_bite: 2
      fel_rush: 4
      shear: 6
      throw_glaive: 8
      immolation_aura: 11
      chaos_strike: 13
      consume_magic: 15
      torment: 17
      glide: 19
      spectral_sight: 21
  # Sárkányidéző (Evoker): sárkány-mágia (tűz/szél/smaragd). Perzselés = dps, Megőrzés = heal.
  evoker:
    spell-unlocks:
      living_flame: 2
      azure_strike: 4
      emerald_blossom: 6
      wing_buffet: 8
      fire_breath: 11
      tail_swipe: 13
      hover: 15
      obsidian_scales: 17
      deep_breath: 19
      verdant_embrace: 21

