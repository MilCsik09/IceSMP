# IceSMP konfiguráció — classes (a ConfigManager az összes config/*.yml-t betölti)
# ===== Kasztok: progresszió és szint-alapú skill feloldás =====
# Az XP mob ölésből érkezik; a skálázott (mob_level) mobok bónusz XP-t adnak.
# A spell-unlocks térkép szerint a kaszt adott szintjén a varázslat automatikusan feloldódik.
classes:
  xp:
    hostile-only: true
    # Rebalansz: a spec-spellek a 25-45. szinten oldódnak fel, ezért a leveling
    # elérhető tempójú legyen. ~10-15 XP/ölés (skálázott mobokra több).
    per-kill: 10
    per-mob-level: 3
    secondary-share-percent: 50
  # WoW-szerű progresszív szintgörbe: az n. szintlépés ára base-xp + (n-1) * increment.
  # Laposabb görbe, hogy a 25. (spec) és a 45. (utolsó spec-spell) szint reális grindel elérhető legyen.
  leveling:
    base-xp: 60
    increment-per-level: 10
  specialization:
    # Az elsődleges kaszt ezen a szinten specializálódhat (/spec choose).
    required-level: 25
  wizard:
    spell-unlocks:
      wisplight: 2
      mana_dart: 3
      root: 5
      frost_touch: 7
      arcane_shield: 9
      confusion: 10
      blink: 12
      rain_dance: 15
      arcane_nova: 18
      gravity_well: 21
  warrior:
    spell-unlocks:
      battle_shout: 3
      armament: 5
      heroic_leap: 7
      pommel_strike: 9
      inner_focus: 10
      second_wind: 12
      gust: 15
      whirlwind: 18
      iron_skin: 20
      intimidate: 22
  archer:
    spell-unlocks:
      hunters_mark: 2
      eagle_eye: 3
      disengage: 5
      multishot: 8
      piercing_bolt: 10
      snare: 12
      double_jump: 15
      camouflage: 17
      arrow_storm: 20
      swift_steps: 22
  assassin:
    spell-unlocks:
      dagger_throw: 2
      adrenaline: 4
      shadowstep: 5
      hamstring: 8
      blackout: 10
      smoke_bomb: 12
      evasion: 15
      garrote: 18
      shadow_dash: 20
      death_mark: 24

# ===== Specializációk =====
# A nekromanta a varázsló sötét specializációja: csak Sötét frakcióval és
# örök bűnös (dark pact) jelöléssel választható. A spec-spellek a kaszt
# szintjéhez kötve oldódnak fel.
specializations:
  # A /spec respec ára a játékos saját frakcióvalutájában (banki egyenlegből).
  respec-cost: 100
  elementalist:
    spell-unlocks:
      sun_dance: 25
      fireball: 26
      frost_nova: 28
      thunder_strike: 30
      lucky_star: 30
      ember_storm: 33
      riptide_pull: 36
      stone_skin: 39
      gale_burst: 42
      elemental_overload: 45
  necromancer:
    # A Nekromanta beavatása quest-hez kötött (sötét rituálé a romvárosban).
    required-quest: "necromancer_initiation"
    spell-unlocks:
      life_drain: 25
      grave_grasp: 26
      soul_siphon: 28
      bone_chill: 30
      dread_aura: 32
      bone_spear: 34
      plague_touch: 36
      raise_horde: 38
