# ===== E1 — Lélek-kovács (Nekromanta): lélekszilánk-befektetés a minion-seregbe =====
soulforge:
  enabled: true
  rank-costs: [ 5, 8, 12, 18, 25 ]
  health-per-rank: 0.08
  damage-per-rank: 0.06

# ===== HP-rendszer (kaszt-HP-profilok + kijelzés + harcon kívüli regen) =====
# Max HP = 20 (vanília) + (base − 20) + kaszt-szint × per-level (+ talentek).
# 50. szinten: tank ~50, bruiser ~42-43, mozgékony ~37-38, caster ~32-33.
# A szívsor a display.normalize-zal mindig hearts db szív marad (a tényleges
# max nő, a kijelzés nem duzzad). A direkt gyógyítások (heal-self) a maxHP/20
# aránnyal skálázódnak (scale-heals, plafon: scale-heals-cap) — a heal nem
# értéktelenedik el a nagyobb tavak mellett.
health:
  # IDEIGLENESEN KIKAPCSOLVA (tulaj-döntés, 2026-07-22): a kaszt-HP-profilok, a
  # szívsor-normalizálás és a harcon kívüli regen alapból nem él — minden vanília.
  # Visszakapcsolás: enabled: true (+ scale-heals: true) — restart nélkül,
  # /icesmp reload vagy a config-GUI HP-kategóriája is átbillenti.
  enabled: false
  display:
    normalize: true
    hearts: 10
  # Harcon kívüli regen: az utolsó sebzés-kontaktus (adott VAGY kapott) után
  # delay-seconds-szel indul; interval-ticks-enként percent-per-tick %-ot tölt;
  # min-food éhségszint alatt nem fut (az étel harci tét marad).
  ooc-regen:
    enabled: true
    delay-seconds: 8
    interval-ticks: 40
    percent-per-tick: 5.0
    min-food: 6
  scale-heals: false
  # Kaszt-sebzés-profilok (a WoW-érzés másik fele, ugyanezen fő-kapcsoló alatt):
  # fizikai sebzés-bónusz = kaszt-szint × per-level (kézre attribútumként, nyílra/
  # szigonyra a találatkor adódik hozzá). 50. szinten: fizikai kasztok +5, casterek
  # +1.5 — ők a spell-erő szint-skálázást kapják helyette (spells.dynamic-scaling).
  class-damage-profiles:
    warrior: { per-level: 0.10 }
    death_knight: { per-level: 0.10 }
    demon_hunter: { per-level: 0.10 }
    monk: { per-level: 0.09 }
    assassin: { per-level: 0.09 }
    paladin: { per-level: 0.08 }
    archer: { per-level: 0.08 }
    druid: { per-level: 0.07 }
    shaman: { per-level: 0.05 }
    evoker: { per-level: 0.04 }
    wizard: { per-level: 0.03 }
    warlock: { per-level: 0.03 }
    priest: { per-level: 0.03 }
  scale-heals-cap: 2.5
  class-profiles:
    warrior: { base: 20, per-level: 0.6 }
    death_knight: { base: 20, per-level: 0.6 }
    paladin: { base: 20, per-level: 0.55 }
    monk: { base: 20, per-level: 0.45 }
    druid: { base: 20, per-level: 0.45 }
    demon_hunter: { base: 20, per-level: 0.45 }
    shaman: { base: 20, per-level: 0.4 }
    archer: { base: 20, per-level: 0.35 }
    assassin: { base: 20, per-level: 0.35 }
    evoker: { base: 20, per-level: 0.3 }
    wizard: { base: 20, per-level: 0.25 }
    warlock: { base: 20, per-level: 0.25 }
    priest: { base: 20, per-level: 0.25 }
