# IceSMP konfiguráció — örökös, tulajdonoshoz kötött DEV itemek.
dev-items:
  csodalatos_bingulus:
    enabled: true
    owner-uuid: "eb80c20f-092a-4d76-bd44-d168c91ea9e2"

    # Az első példányt admin adja ki: /iceitem dev csodalatos_bingulus 1 <játékos>.
    # Ettől kezdve az instance perzisztens, és elvesztés/halál/restart után visszaállítható.
    auto-restore: true
    check-interval-ticks: 20
    reward-interval-seconds: 600

    item:
      material: HEART_OF_THE_SEA
      display-name: "&d&lCsodálatos Bingulus"
      item-model: "icesmp:csodalatos_bingulus"
      lore:
        - "&7A valóság legcsodálatosabb"
        - "&7és legbingulusabb teremtménye."
        - ""
        - "&d✦ &710 aktív percenként jutalmat ad."
        - "&8Örökös DEV item — nem relikvia."
        - "&8Nem dobható el és nem tárolható el."

    # Először rarity sorsolódik, utána az adott rarity saját súlyozott táblája.
    rarity-weights:
      kozonseges: 60.0
      nem_mindennapi: 27.0
      ritka: 9.0
      epikus: 3.0
      legendas: 0.9
      ereklye: 0.1

    # Balszerencse-védelem: ennyi, a szintet el nem érő jutalom után a következő
    # sorsolás legalább az adott ritkaságú.
    pity:
      ritka:
        after-rolls: 30
      epikus:
        after-rolls: 150
      legendas:
        after-rolls: 1000

