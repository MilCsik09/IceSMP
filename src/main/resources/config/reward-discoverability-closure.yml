# PvE reward and discoverability closure. This extends the existing loot and mob-template
# authorities; it does not introduce a second loot framework.

# Legacy reusable hunting material brought under the same economy metadata contract as the new
# vocabulary. The canonical item id stays unchanged and existing recipes remain authoritative.
profession-materials:
  vad_esszencia:
    tier: SPECIAL
    processing-state: RAW
    source-types:
    - combat:wilderness
    - combat:veteran
    sink-types:
    - leather-equipment
    - cordage-processing
    - alchemy-service
    - market
    economy-managed: true

loot:
  rank-rewards:
    normal:
      source-tags: [combat:wilderness]
      gear-chance-additive: 0.0
      blueprint-chance: 0.002
      special-material: ''
      special-material-chance: 0.0
    veteran:
      source-tags: [combat:veteran, combat:wilderness]
      gear-chance-additive: 0.02
      blueprint-chance: 0.0035
      special-material: vad_esszencia
      special-material-chance: 0.01
    elite:
      source-tags: [combat:elite, combat:veteran, combat:wilderness]
      gear-chance-additive: 0.04
      blueprint-chance: 0.006
      special-material: szorny_szerv
      special-material-chance: 0.015
    champion:
      source-tags: [combat:champion, combat:elite, combat:veteran, combat:wilderness]
      gear-chance-additive: 0.06
      blueprint-chance: 0.01
      special-material: melyvizi_esszencia
      special-material-chance: 0.01
    boss:
      source-tags: [combat:boss]
      gear-chance-additive: 0.0
      blueprint-chance: 0.05
      special-material: ''
      special-material-chance: 0.0

# MobTemplate keeps a stable authored profile id for encounter/source identity, but rewards and
# sources are no longer duplicated here. ConfigManager nulls the legacy leaves from the effective
# tree; MobTemplateRegistry fail-closes if a rewards/sources leaf survives.
mob-loot-profiles:
  frozen_wilderness:
    profile-id: frozen_wilderness
    sources: null
    rewards: null
