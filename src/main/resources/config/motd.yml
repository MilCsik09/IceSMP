# IceSMP natív szerverlista-MOTD.
# MiniMessage-formázás; támogatott dinamikus tokenek: {online}, {max}.
# Nincs MiniMOTD configkompatibilitás vagy proxy/virtual-host réteg.
motd:
  enabled: true

  # TIME: a variánsok sorrendben váltanak. RANDOM: egy időablakon belül stabil,
  # a következő ablakban a seed alapján újrasorsolt variáns jelenik meg.
  selection-mode: TIME
  rotation-seconds: 10
  random-seed: 485838160

  # -1 = a valódi szerverlimit. Nulla nem engedélyezett.
  max-players-override: -1

  # A moderációs VanishManager thread-safe állapotát használja; nem készít külön vanish-registryt.
  exclude-vanished-from-online-count: true

  icons:
    # NONE, DEFAULT, VARIANT vagy RANDOM.
    mode: VARIANT
    default: frost
    # A plugins/IceSMP/icons könyvtárból legfeljebb ennyi PNG töltődik be.
    max-files: 64
    # Egy ikon legnagyobb megengedett fájlmérete. A fájlnak ettől függetlenül pontosan 64×64 PNG-nek kell lennie.
    max-file-bytes: 1048576

  # Elsőbbség: vérhold > világboss > szezonzárás > normál rotáció.
  # Hiányzó vagy kikapcsolt event-variánsnál a normál pool marad aktív.
  event-variants:
    blood-moon:
      enabled: true
      icon: blood_moon
      line1: "<dark_red><b>🌕 VÉRHOLD TOMBOL</b></dark_red> <gray>—</gray> <red>Ice SMP</red>"
      line2: "<gray>A szörnyek megvadultak... mersz belépni?</gray>"
    world-boss:
      enabled: true
      icon: world_boss
      line1: "<dark_purple><b>☠ VILÁGBOSS ÉBREDT</b></dark_purple> <gray>—</gray> <gradient:#4FC3F7:#E1F5FE>Ice SMP</gradient>"
      line2: "<gray>Gyülekező a boss ellen — {online} hős már harcol!</gray>"
    season-end:
      enabled: true
      days-before: 3
      icon: season_end
      line1: "<gold><b>⏳ SZEZONZÁRÁS KÖZELEG</b></gold> <gray>—</gray> <gradient:#4FC3F7:#E1F5FE>Ice SMP</gradient>"
      line2: "<gray>Az utolsó napok — most dől el a liga!</gray>"

  variants:
    frost:
      icon: frost
      line1: "<gradient:#4FC3F7:#E1F5FE><b>❄ Ice SMP ❄</b></gradient> <dark_gray>—</dark_gray> <gray>MMO-kalandszerver</gray>"
      line2: "<gray>13 kaszt • 4 királyság • háború és dicsőség</gray>"
    war:
      icon: war
      line1: "<gradient:#4FC3F7:#E1F5FE><b>❄ Ice SMP ❄</b></gradient> <dark_gray>—</dark_gray> <gray>MMO-kalandszerver</gray>"
      line2: "<red>⚔</red> <gray>Melyik királyságért harcolsz?</gray> <dark_gray>({online} hős online / {max} hely)</dark_gray>"
    konyv:
      icon: book
      line1: "<gradient:#4FC3F7:#E1F5FE><b>❄ Ice SMP ❄</b></gradient> <dark_gray>—</dark_gray> <gray>MMO-kalandszerver</gray>"
      line2: "<gold>📖</gold> <gray>A Korszakok Könyve új lapot nyitott — a tiéd lehet?</gray>"
    suttogas:
      icon: whisper
      line1: "<gradient:#4FC3F7:#E1F5FE><b>❄ Ice SMP ❄</b></gradient> <dark_gray>—</dark_gray> <gray>MMO-kalandszerver</gray>"
      line2: "<dark_purple>🕯</dark_purple> <gray>Azt suttogják, az Idegen ma is járja a vidéket…</gray>"
