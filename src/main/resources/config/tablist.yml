# IceSMP konfiguráció — natív, saját tablista
# A ConfigManager az összes config/*.yml-t betölti; a data-mappa config.yml-je felülírhatja.
#
# Funkciók (mind külön kapcsolható):
#   header-footer  — tablist fejléc/lábléc, {anim:<név>} / {player} / {ping} / {online} / {max} tokenekkel
#   tab-names      — LP-prefix + frakció-színes név + LP-suffix a tablistában (villogásmentes, diff-elt)
#   nametags       — fej fölötti prefix/suffix/név-szín + LP-rang szerinti RENDEZÉS (scoreboard-teamek)
#   playerlist-ping— ping-oszlop a tablistában
#   animations     — frame-listák; a frame-et a rendszeridő választja (nincs külön scheduler);
#                    intervallum-minimum 250 ms (az ennél gyorsabb marquee packet-pazarlás
#                    lenne — a portolt defaultok ritkított frame-ekkel adják ugyanazt a hatást)
#
# A ㍿ / ㍐ karakterek a szerver resource packjének saját glyph-jei —
# RP nélküli szerveren cseréld sima szövegre.
tablist:
  enabled: true
  refresh-ticks: 10           # tablist-tick (10 = 0,5 mp); az animációk ettől függetlenül időalapúak
  # A kilépett/átrendeződött bejegyzések söprése (nézőnként drága ciklus) csak minden
  # N. frissítésen fut — 10 = kb. 5 másodpercenként. A normál frissítés (nevek, ping,
  # színek) minden körben megy, diff-elve.
  sweep-every-refresh: 10
  header-footer:
    enabled: true
    header:
      - "&8&m                                   &r"
      - "&r"
      - "&r"
      - "&r"
      - "㍿"
      - "&r"
      - "&r"
      - "{anim:topinfo}"
      - ""
    footer:
      - ""
      - "&7ᴛᴡɪᴛᴄʜ&8: {anim:logo}"
      - "&7ᴅɪѕᴄᴏʀᴅ&8: {anim:discord}"
      - ""
      - ""
      - "&8&m                                   &r"
  tab-names:
    enabled: true
  nametags:
    enabled: true
    # IDEAS A43: aktív raid alatt a szemben álló hadviselő fél tagjai PIROSAK a néző
    # tablistájában és a fejük fölött (nézőnként relációs szín — a rendezést nem érinti).
    war-colors: true
    # A háborús jelölés szín-értéke (NamedTextColor név). Megjegyzés: a RED frakció ellen
    # harcolóknak a piros nem ad plusz jelet (a RED amúgy is piros) — ilyenkor pl.
    # dark_red vagy gold lehet beszédesebb.
    war-color: red
  playerlist-ping:
    enabled: true
  # IDEAS A61: a {ping} token szín-küszöbei (ms): alatta zöld / sárga / fölötte piros.
  ping-colors:
    good: 80
    ok: 150
  sorting:
    # LP primary-group sorrend a tablistában (elöl a lista eleje); ismeretlen csoport a lista mögé
    # kerül, azonos csoporton belül név szerinti ABC. Az AFK játékosok a TELJES lista végére
    # kerülnek, és az AFK-blokkon belül ugyanez a rang+név sorrend érvényesül.
    group-order: [mod, dev, helper, streamer, vip, default]
  # Frakciónkénti név-szín a tablistában és a fej fölötti nametagen (NamedTextColor nevek:
  # red, blue, green, aqua, gold, yellow, gray, dark_gray, dark_purple, ...). A NEUTRAL zöldje a
  # Smaragdkő/Ryanora lore-színe — szándékosan nem szürke, mert a Menedék-polgár és a
  # Kitaszított (dark_gray) a tablistán összetéveszthető volt. A guest a frakció nélküli vendég.
  faction-colors:
    red: red
    blue: blue
    neutral: green
    dark: dark_gray
    guest: white
  animations:
    topinfo:
      interval-millis: 3000
      frames:
        - "&7ᴘɪɴɢ&8: &#00ff00{ping} ms"
        - "&7ᴏɴʟɪɴᴇ ᴊáᴛéᴋᴏѕᴏᴋ&8: &#00ff00{online}"
    logo:
      interval-millis: 500
      frames:
        - "&#0049FFᴛᴡɪᴛᴄʜ.ᴛᴠ &#0053FF⁄&#0058FFᴛʜᴇɪᴄᴇʙʟᴜᴇʙɪʀᴅ"
        - "&#0053FFᴛᴡɪᴛᴄʜ.ᴛᴠ &#005CFF⁄&#0061FFᴛʜᴇɪᴄᴇʙʟᴜᴇʙɪʀᴅ"
        - "&#005EFFᴛᴡɪᴛᴄʜ.ᴛᴠ &#0066FF⁄&#006BFFᴛʜᴇɪᴄᴇʙʟᴜᴇʙɪʀᴅ"
        - "&#0053FFᴛᴡɪᴛᴄʜ.ᴛᴠ &#005CFF⁄&#0061FFᴛʜᴇɪᴄᴇʙʟᴜᴇʙɪʀᴅ"
    discord:
      interval-millis: 500
      frames:
        - "&#0049FFᴅѕᴄ.ɢɢ&#0052FF⁄&#0058FFɪᴄᴇʙʟᴜᴇʙɪʀᴅ"
        - "&#0054FFᴅѕᴄ.ɢɢ&#005CFF⁄&#0062FFɪᴄᴇʙʟᴜᴇʙɪʀᴅ"
        - "&#005FFFᴅѕᴄ.ɢɢ&#0066FF⁄&#006CFFɪᴄᴇʙʟᴜᴇʙɪʀᴅ"
        - "&#0054FFᴅѕᴄ.ɢɢ&#005CFF⁄&#0062FFɪᴄᴇʙʟᴜᴇʙɪʀᴅ"
    bar:
      # Az oldalsáv elválasztó-vonala (HudManager) — finoman "hullámzó" szürke árnyalat.
      interval-millis: 1000
      frames:
        - "&#676767&m                       &r"
        - "&#5E5E5E&m                       &r"
        - "&#565656&m                       &r"
        - "&#5E5E5E&m                       &r"
