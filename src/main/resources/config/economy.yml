# IceSMP konfiguráció — economy (a ConfigManager az összes config/*.yml-t betölti)
currency:
  default-type: "NEUTRAL"
  symbol: "⛃"
  default-balance: 0
  # Fix árfolyam, csak akkor érvényes, ha a dynamic-exchange ki van kapcsolva.
  exchange-rate: 1.0
  exchange-fee-percent: 0.0
  # ===== Dinamikus, kínálat-alapú árfolyam =====
  # Egy valuta értéke: base-value * clamp((reference-supply / kínálat)^elasticity, min, max).
  # Minél több van egy valutából a szerveren, annál kevesebbet ér a többihez képest.
  # ===== Lélekkő-drop: Sötét valuta magas szintű skálázott mobokból =====
  soul-drop:
    enabled: true
    min-mob-level: 3
    chance-percent: 25
    max-amount: 5
  # ===== Heti gazdasági esemény: véletlen kereslet-sokk =====
  # Időnként egy véletlen valuta base-value-ja átmenetileg megugrik —
  # kereskedési lehetőség a figyelmes játékosoknak.
  economy-event:
    enabled: true
    check-interval-minutes: 60
    chance-percent: 25
    duration-hours: 48
    min-multiplier: 1.2
    max-multiplier: 1.6
  dynamic-exchange:
    enabled: true
    reference-supply: 10000
    elasticity: 0.5
    min-multiplier: 0.25
    max-multiplier: 4.0
    base-values:
      RED: 1.0
      BLUE: 1.0
      NEUTRAL: 1.0
      DARK: 1.5
  item:
    material: "PAPER"
    default-model-data: 1000
    display-name: "&6%currency% Token"
    types:
      RED:
        model-data: 1001
        display-name: "&cPiros Token"
      BLUE:
        model-data: 1002
        display-name: "&9Kék Token"
      NEUTRAL:
        model-data: 1003
        display-name: "&5Semleges Token"
      DARK:
        model-data: 1004
        display-name: "&8Sötét Token"

# ===== Árfolyam-hologramok =====
# A /exchangeboard place paranccsal lerakott TextDisplay táblák a valuták
# élő, kínálat-alapú értékét mutatják, és a világesemény-tick frissíti őket.
exchange-board:
  enabled: true

# ===== Piactér =====
# Eladás: /market sell <ár> [valuta] (a kézben tartott tárgy);
# vásárlás a /market GUI-ból banki egyenlegből. A fee-percent elég (money sink).
market:
  max-listings-per-player: 5
  fee-percent: 10
  # Aukciók: /market auction <kikiáltási ár> [óra] [valuta] [buyout:<ár>]. A licit a
  # bankból zárolódik; túllicitálásnál automatikusan visszajár. Lejáratkor a nyertes
  # licit (fee-percent levonása után) az eladóé, a tárgy a nyertesé — offline
  # nyertes belépéskor vagy /market claim-mel kapja meg. A GUI-ban bal-katt = a
  # minimum következő licit, jobb-katt = nagyobb ugrás (big-increment-percent),
  # shift-katt = azonnali megvétel a buy-out áron (ha van megadva).
  auction:
    default-duration-hours: 24
    max-duration-hours: 72
    min-increment-percent: 10
    # A jobb-kattos „gyors emelés" ennyi százalékkal emel a jelenlegi licit felett.
    big-increment-percent: 25

# ===== Frakció-boltok (NPC money sink) =====
# Egy FancyNpcs NPC-hez kötött bolt: a szerver-csapat kirakja az NPC-t a lenti
# belső névvel (/npc create altalanos_bolt), és jobb-katt megnyitja a vásárló
# GUI-t. A vételár a banki egyenlegből megy és ELÉG (money sink — nem kerül
# senkihez). A currency lehet konkrét valuta (RED/BLUE/NEUTRAL/DARK) vagy "OWN"
# (a vásárló saját frakciója valutája). A faction: "ALL" = bárki vásárolhat,
# vagy egy frakció-név = csak annak tagjai.
faction-shops:
  enabled: true
  altalanos_bolt:
    title: "Általános Bolt"
    faction: "ALL"
    items:
      1:
        material: "BREAD"
        amount: 16
        price: 20
        currency: "OWN"
      2:
        material: "TORCH"
        amount: 32
        price: 15
        currency: "OWN"
      3:
        material: "IRON_INGOT"
        amount: 8
        price: 60
        currency: "OWN"

# ===== Kereskedő-karaván (időszakos világesemény + money sink) =====
# Egy vándorkereskedő időnként felbukkan egy stop-helyszínen (vagy ha nincs stop
# megadva, egy véletlen online játékos közelében), egy ideig marad, majd
# továbbáll. Amíg a városban van, jobb-katt a karaván-NPC-re megnyitja a ritka
# portékák boltját — a vételár a banki egyenlegből ELÉG (money sink, mint a
# frakció-boltoknál). Az items séma azonos a faction-shops-éval (material,
# amount, price, currency; a currency lehet "OWN" vagy konkrét valuta).
# Admin: /events caravan arrive|depart.
caravan:
  enabled: true
  title: "Vándorkereskedő Karaván"
  # Két érkezés közti idő (percben, az érkezéstől számítva) és az ottmaradás ideje.
  interval-minutes: 90
  duration-minutes: 20
  # Rögzített megálló-helyszínek; a karaván sorban járja őket. Ha üres, egy
  # véletlen online játékos közelében jelenik meg (a szerver-csapat töltheti fel).
  stops: []
  # Példa stop:
  #   - {world: world, x: 100, y: 64, z: -200}
  items:
    1:
      material: "ENCHANTED_GOLDEN_APPLE"
      amount: 1
      price: 2500
      currency: "OWN"
    2:
      material: "DIAMOND_BLOCK"
      amount: 1
      price: 1200
      currency: "OWN"
    3:
      material: "NAME_TAG"
      amount: 2
      price: 400
      currency: "OWN"
    4:
      material: "EXPERIENCE_BOTTLE"
      amount: 16
      price: 350
      currency: "OWN"
