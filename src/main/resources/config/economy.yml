# ===== Kereskedő-karaván (időszakos világesemény + money sink) =====
# Egy vándorkereskedő időnként felbukkan egy stop-helyszínen (vagy ha nincs stop
# megadva, egy véletlen online játékos közelében), egy ideig marad, majd
# továbbáll. Amíg a városban van, jobb-katt a karaván-NPC-re megnyitja a ritka
# portékák boltját — a vételár a banki egyenlegből ELÉG (money sink, mint a
# frakció-boltoknál). Az items séma azonos a faction-shops-éval (material,
# amount, price, currency; a currency lehet "OWN" vagy konkrét valuta).
# Admin: /events caravan arrive|depart.
caravan:
  enabled: true
  title: "Vándorkereskedő Karaván"
  # Két érkezés közti idő (percben, az érkezéstől számítva) és az ottmaradás ideje.
  interval-minutes: 90
  duration-minutes: 20
  # Rögzített megálló-helyszínek; a karaván sorban járja őket. Ha üres, egy
  # véletlen online játékos közelében jelenik meg (a szerver-csapat töltheti fel).
  stops: []
  # Példa stop:
  #   - {world: world, x: 100, y: 64, z: -200}
  # ROTÁLÓ KÍNÁLAT: minden érkezéskor a lenti teljes poolból stock-size darab
  # sorsolódik ("ma épp ezt hozta a karaván") — a látogatás alatt stabil, a
  # következő érkezéskor fordul. false = a régi, teljes-lista viselkedés.
  rotation:
    enabled: true
    stock-size: 5
  items:
    1:
      material: "ENCHANTED_GOLDEN_APPLE"
      amount: 1
      price: 2500
      currency: "OWN"
    2:
      material: "DIAMOND_BLOCK"
      amount: 1
      price: 1200
      currency: "OWN"
    3:
      material: "NAME_TAG"
      amount: 2
      price: 400
      currency: "OWN"
    4:
      material: "EXPERIENCE_BOTTLE"
      amount: 16
      price: 350
      currency: "OWN"
    # --- Ritka szakma-alapanyagok a poolban (drágán — alternatív forrás a
    # mob/boss-drop mellett; a `unique:` mező a valódi PDC-s anyagot adja) ---
    5:
      material: "AMETHYST_SHARD"
      unique: "emlekszilank"
      amount: 1
      price: 900
      currency: "OWN"
    6:
      material: "BONE"
      unique: "sarkanycsont_szilank"
      amount: 1
      price: 1100
      currency: "OWN"
    7:
      material: "FEATHER"
      unique: "fonixpihe"
      amount: 2
      price: 500
      currency: "OWN"
    8:
      material: "AMETHYST_SHARD"
      unique: "nema_kristaly"
      amount: 1
      price: 700
      currency: "OWN"
    9:
      material: "RAW_GOLD"
      unique: "melysegi_borostyan"
      amount: 1
      price: 800
      currency: "OWN"
    10:
      material: "QUARTZ"
      unique: "viharkvarc"
      amount: 2
      price: 450
      currency: "OWN"
    11:
      material: "GHAST_TEAR"
      unique: "dermedt_konnycsepp"
      amount: 1
      price: 1000
      currency: "OWN"
    12:
      material: "FIRE_CHARGE"
      unique: "karhozat_parazs"
      amount: 1
      price: 1300
      currency: "OWN"
  # Bónusz-készlet: csak akkor árulja, ha a legutóbbi karaván-kíséret (escort)
  # sikerrel célba ért (world.yml: escort.bonus-stock-minutes ideig).
  bonus-items:
    1:
      material: "NETHERITE_INGOT"
      amount: 1
      price: 4000
      currency: "OWN"
    2:
      material: "TOTEM_OF_UNDYING"
      amount: 1
      price: 3000
      currency: "OWN"
    3:
      material: "GOLDEN_CARROT"
      amount: 32
      price: 600
      currency: "OWN"

# ===== Banki ügyintézés (KP-alapú világ) =====
# A szerveren alapból KÉSZPÉNZ (token item) jár kézről kézre: a player-player kereskedelem
# item-alapú (f2f vagy piac), a player-szerver oldal (boltok, piac, claimek) számláról megy.
banking:
  capital-only: true    # bank be-/kivét és valutaváltás CSAK a fővárosokban
  pay-enabled: false    # /currency pay (közvetlen számla-utalás) — a KP-világban tiltott

# ===== Felvásárló NPC (jövedelem-csap, napi kerettel) =====
# Nevezz el egy FancyNpcs NPC-t "felvasarlo"-nak: a játékos a KÉZBEN tartott terményt/
# nyersanyagot jobb-kattal eladja az itteni fix egységáron (a saját frakció-valutájában
# jóváírva). NAPI KERET (daily-cap) fékezi a farm-inflációt; egyedi (PDC-s) tárgyat nem
# vesz meg. A prices lista szabadon bővíthető/árazható — élőben olvasódik.
buyer:
  enabled: true
  npc-name: "felvasarlo"
  daily-cap: 250.0
  prices:
    WHEAT: 0.5
    CARROT: 0.4
    POTATO: 0.4
    BEETROOT: 0.4
    SWEET_BERRIES: 0.3
    COD: 1.0
    SALMON: 1.2
    IRON_INGOT: 2.5
    GOLD_INGOT: 3.0
    COPPER_INGOT: 0.6
    COAL: 0.8
    LEATHER: 1.5
    BONE: 0.5
    STRING: 0.5
    GUNPOWDER: 1.2
    SPIDER_EYE: 0.6
    ROTTEN_FLESH: 0.2
    HONEY_BOTTLE: 2.0
    EMERALD: 6.0

# ===== Horgász-szerencse (kis passzív jövedelem-csap) =====
# Kis eséllyel a fogás mellé egy "iszapba veszett erszény" is akad: közvetlen
# valuta-jóváírás. AFK-jelölt játékosnak nem jár. Élőben olvasódik.
# Horgász-szerencse: kis eséllyel Kopott erszény (fizikai pénz-tárgy, véletlen
# valutával) akad a horogra a fogás mellé. Beváltás: jobb-katt az erszénnyel.
fishing-windfall:
  enabled: true
  chance-percent: 4.0
  min-amount: 5.0
  max-amount: 15.0

# WoW-stílusú mob pénz-drop: ellenséges mob halálakor (játékos-öléssel) eséllyel
# Kopott erszény esik — az összeg a mob szintjével nő, a valuta véletlen.
# Spawner-mob SOSEM dob (farm-fék). Élő kulcsok (/icesmp reload).
mob-money-drop:
  enabled: true
  chance-percent: 20.0
  min-amount: 1.0
  max-amount: 4.0
  per-level-bonus: 0.5
