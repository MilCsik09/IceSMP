# IceSMP — operator override authority
#
# Canonical gameplay lives under src/main/resources/content/ and is maintained in Git.
# Deployed operator settings live under config/*.yml. This root file is the final override
# layer, but only keys declared operator-editable by ConfigManager are accepted.

# A plugin Paper addResourcePack API-val adja hozzá a packot, ezért nem írja felül a
# server.properties vagy más plugin által kiküldött resource packokat.
resource-pack:
  enabled: true
  required: true
  id: "7c847f1e-d942-3c8f-bd46-5c43bb1a3e67"
  override-url: ""
  override-sha1: ""
  prompt: "&bAz IceSMP egyedi modelljeihez és felületéhez szükséges resource pack."
