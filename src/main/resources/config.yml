# Két ponttár: a kaszt tár a kaszt szintekből, a szakma tár az összes szakma
# szintjéből termel pontot (points-per-levels szintenként 1 pont).
# Effektek: max-health, movement-speed, attack-damage (attribútum módosítók),
# class-xp-bonus, profession-xp-bonus (százalékos XP bónusz).
# WoW-szerű kötések: requires-job / requires-spec / requires-profession —
# csak a feltételt teljesítő játékos látja, költhet rá, és élvezi a hatását.
# Respec után a spec-talentek pontjai automatikusan visszatérülnek.
talents:
  class:
    points-per-levels: 5
    definitions:
      # --- Általános kaszt-talentek ---
      vitality:
        display-name: "Életerő"
        effect: "max-health"
        per-rank: 2.0
        max-rank: 5
      swiftness:
        display-name: "Fürgeség"
        effect: "movement-speed"
        per-rank: 0.005
        max-rank: 5
      power:
        display-name: "Erő"
        effect: "attack-damage"
        per-rank: 0.5
        max-rank: 5
      scholar:
        display-name: "Tudásszomj"
        effect: "class-xp-bonus"
        per-rank: 5.0
        max-rank: 4
      # --- Kaszt-kötött talentek ---
      weapon_mastery:
        display-name: "Fegyvermesteri Fokozat"
        requires-job: "warrior"
        effect: "attack-damage"
        per-rank: 0.5
        max-rank: 3
      fleet_hunter:
        display-name: "Fürge Vadász"
        requires-job: "archer"
        effect: "movement-speed"
        per-rank: 0.005
        max-rank: 3
      # --- Specializáció-kötött talentek (1 / spec) ---
      elemental_attunement:
        display-name: "Elemi Ráhangolódás"
        requires-spec: "elementalist"
        effect: "attack-damage"
        per-rank: 0.5
        max-rank: 4
      soul_pact:
        display-name: "Lélekpaktum"
        requires-spec: "necromancer"
        effect: "max-health"
        per-rank: 2.0
        max-rank: 4
      brutality:
        display-name: "Brutalitás"
        requires-spec: "berserker"
        effect: "attack-damage"
        per-rank: 1.0
        max-rank: 3
      stalwart:
        display-name: "Rendíthetetlen"
        requires-spec: "guardian"
        effect: "max-health"
        per-rank: 3.0
        max-rank: 3
      fleetfoot:
        display-name: "Szélvész Léptek"
        requires-spec: "sharpshooter"
        effect: "movement-speed"
        per-rank: 0.007
        max-rank: 3
      pack_leader:
        display-name: "Falkavezér"
        requires-spec: "beast_master"
        effect: "max-health"
        per-rank: 2.0
        max-rank: 4
      viper_reflexes:
        display-name: "Vipera Reflexek"
        requires-spec: "poisoner"
        effect: "movement-speed"
        per-rank: 0.006
        max-rank: 4
      ghostwalk:
        display-name: "Kísértetjárás"
        requires-spec: "phantom"
        effect: "movement-speed"
        per-rank: 0.007
        max-rank: 3
  profession:
    points-per-levels: 10
    definitions:
      diligence:
        display-name: "Szorgalom"
        effect: "profession-xp-bonus"
        per-rank: 10.0
        max-rank: 5
      vigor:
        display-name: "Kitartás"
        effect: "max-health"
        per-rank: 1.0
        max-rank: 3
      # --- Szakma-kötött talentek ---
      miners_endurance:
        display-name: "Bányász Állóképesség"
        requires-profession: "miner"
        effect: "max-health"
        per-rank: 1.0
        max-rank: 2
      arcane_insight:
        display-name: "Arkán Belátás"
        requires-profession: "enchanter"
        effect: "class-xp-bonus"
        per-rank: 5.0
        max-rank: 2

# ===== Szakmák (WoW-szerű: 1 gyűjtögető + 1 készítő főszakma + másodlagosak) =====
# Gyűjtögető: miner (Bányász), herbalist (Gyógynövényész), lumberjack (Favágó)
# Készítő: armorer (Kovács), alchemist (Alkimista), enchanter (Bűvölő)
# Másodlagos (mindenkié, automatikusan): fisherman (Halász), cook (Szakács)
professions:
  leveling:
    base-xp: 100
    increment-per-level: 15
  xp:
    mining-ore: 5
    herbalism-harvest: 3
    logging: 2
    crafting-gear: 8
    smithing: 15
    enchanting: 10
    brewing: 12
    fishing: 4
    cooking: 3
  specialization:
    # A szakma ezen a szinten specializálódhat (/spec choose).
    required-level: 25

# ===== Küldetések (quest-keretrendszer) =====
# Objective típusok: KILL_MOBS (count, opcionális entity-type + min-mob-level),
# BREAK_BLOCKS / CRAFT_ITEMS (materials + count), CATCH_FISH (count),
# VISIT_TERRITORY (territory), REACH_LEVEL (level).
# Feltételek: requires-job, requires-faction, requires-level, requires-quest (lánc).
# Jutalmak: class-xp, currency {type, amount}, unlock-spell, cleanse-sins.
quests:
  # --- Kaszt-próbák (bevezető questek) ---
  warrior_trial:
    display-name: "A Harcos Próbája"
    description: "Bizonyítsd erődet: ejts el 15 szörnyet."
    requires-job: "warrior"
    objective:
      type: "KILL_MOBS"
      count: 15
    rewards:
      class-xp: 200
  archer_trial:
    display-name: "Az Íjász Próbája"
    description: "Vadássz le 12 szörnyet."
    requires-job: "archer"
    objective:
      type: "KILL_MOBS"
      count: 12
    rewards:
      class-xp: 200
  wizard_trial:
    display-name: "A Varázsló Próbája"
    description: "Gyűjts mágikus reagenseket: szedj 10 virágot."
    requires-job: "wizard"
    objective:
      type: "BREAK_BLOCKS"
      count: 10
      materials:
        - "DANDELION"
        - "POPPY"
        - "BLUE_ORCHID"
        - "ALLIUM"
        - "OXEYE_DAISY"
        - "CORNFLOWER"
        - "LILY_OF_THE_VALLEY"
    rewards:
      class-xp: 200
  assassin_trial:
    display-name: "Az Orgyilkos Próbája"
    description: "Némítsd el a sötétség 10 teremtményét."
    requires-job: "assassin"
    objective:
      type: "KILL_MOBS"
      count: 10
    rewards:
      class-xp: 200
  # --- Nekromanta beavatás: zarándoklat a Sötét romvárosba ---
  necromancer_initiation:
    display-name: "Sötét Beavatás"
    description: "Zarándokolj el a Sötét romvárosba, és hajts végre rituálét az oltárnál."
    requires-faction: "DARK"
    objective:
      type: "VISIT_TERRITORY"
      territory: "dark-capital"
    rewards:
      class-xp: 100
  # --- Vezeklés-lánc: az egyetlen visszaút a sötét paktumból ---
  penance_1:
    display-name: "Vezeklés I. — A Penge"
    description: "Fordítsd erődet a sötétség ellen: pusztíts el 30 erős szörnyet (min. Lvl 2)."
    requires-faction: "DARK"
    objective:
      type: "KILL_MOBS"
      count: 30
      min-mob-level: 2
    rewards:
      class-xp: 150
  penance_2:
    display-name: "Vezeklés II. — Az Alázat"
    description: "Tanulj alázatot: fogj ki 20 halat."
    requires-quest: "penance_1"
    objective:
      type: "CATCH_FISH"
      count: 20
    rewards:
      class-xp: 150
  penance_3:
    display-name: "Vezeklés III. — A Feloldozás"
    description: "Az utolsó próba: győzz le 50 elit szörnyet (min. Lvl 4). A paktum megtörik."
    requires-quest: "penance_2"
    objective:
      type: "KILL_MOBS"
      count: 50
      min-mob-level: 4
    rewards:
      class-xp: 400
      currency:
        type: "NEUTRAL"
        amount: 100
      cleanse-sins: true

# ===== Piactér =====
# Eladás: /market sell <ár> [valuta] (a kézben tartott tárgy);
# vásárlás a /market GUI-ból banki egyenlegből. A fee-percent elég (money sink).
market:
  max-listings-per-player: 5
  fee-percent: 10

# ===== Frakció területek =====
territory:
  notify:
    # Action bar üzenet területhatár átlépésekor.
    enabled: true
  protection:
    # Ha true, idegen frakció területén nem lehet építeni/bontani
    # (bypass: icesmp.admin.territory.bypass jogosultság).
    enabled: false

# ===== Kaszt/szakma-alapú craftolási korlátozások =====
# required-job: kaszt azonosító (pl. "warrior") vagy "ANY" (bármely kaszt megfelel) + required-level.
# required-profession: szakma azonosító (pl. "armorer") + required-profession-level.
# Ha mindkettő meg van adva, mindkét feltételnek teljesülnie kell.
crafting-restrictions:
  enabled: true
  notify-cooldown-seconds: 3
  rules:
    netherite-gear:
      required-profession: "armorer"
      required-profession-level: 25
      materials:
        - "NETHERITE_SWORD"
        - "NETHERITE_PICKAXE"
        - "NETHERITE_AXE"
        - "NETHERITE_SHOVEL"
        - "NETHERITE_HOE"
        - "NETHERITE_HELMET"
        - "NETHERITE_CHESTPLATE"
        - "NETHERITE_LEGGINGS"
        - "NETHERITE_BOOTS"