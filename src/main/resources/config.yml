# ===== Távolság-alapú mob szintezés =====
# A spawn ponttól távolodva a mobok erősödnek: szint = távolság / blocks-per-level.
mob-scaling:
  enabled: true
  blocks-per-level: 1000
  max-level: 10
  health-per-level: 2.0
  damage-per-level: 1.0
  # Csak ellenséges (Monster) mobok skálázódjanak.
  hostile-only: true
  # Ezekkel az okokkal spawnoló mobok nem skálázódnak (pl. spawner farmok).
  ignored-spawn-reasons:
    - "SPAWNER"
    - "CUSTOM"
    - "COMMAND"
  name:
    enabled: true
    visible: true
    prefix: "&7[Lvl %level%] "
    color: "WHITE"

# ===== Kasztok: progresszió és szint-alapú skill feloldás =====
# Az XP mob ölésből érkezik; a skálázott (mob_level) mobok bónusz XP-t adnak.
# A spell-unlocks térkép szerint a kaszt adott szintjén a varázslat automatikusan feloldódik.
classes:
  xp:
    hostile-only: true
    per-kill: 5
    per-mob-level: 2
    secondary-share-percent: 50
  # WoW-szerű progresszív szintgörbe: az n. szintlépés ára base-xp + (n-1) * increment.
  leveling:
    base-xp: 100
    increment-per-level: 20
  specialization:
    # Az elsődleges kaszt ezen a szinten specializálódhat (/spec choose).
    required-level: 25
  wizard:
    spell-unlocks:
      wisplight: 2
      mana_dart: 3
      root: 5
      frost_touch: 7
      arcane_shield: 9
      confusion: 10
      blink: 12
      rain_dance: 15
      arcane_nova: 18
      gravity_well: 21
