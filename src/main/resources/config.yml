factions:
  red:
    display-name: "Piros"
  blue:
    display-name: "Kék"
  neutral:
    display-name: "Semleges"
  dark:
    display-name: "Sötét"
  # Passzív frakció bónuszok:
  # RED: tűz-immunitás | BLUE: fagy-immunitás + lassabb éhség
  # NEUTRAL: lopakodás közben láthatatlanság, nem-ellenséges mobok békések
  # DARK: wither-immunitás, élőhalottak nem támadják
  passives:
    enabled: true
    blue-hunger-slow-chance: 0.5
  # ===== Állampolgári adó (todo: "itt már lenne állampolgári kötelesség") =====
  # Időszakonként a nem mentesített frakciók polgárai a saját frakcióvalutájuk
  # banki egyenlegének rate-percent %-át a frakciókasszába fizetik (money sink).
  tax:
    enabled: true
    interval-minutes: 60
    rate-percent: 2.0
    exempt:
      - "NEUTRAL"
  # ===== Bűn-számláló és száműzetés =====
  # Gyilkosság = +1 bűn; a küszöb elérésekor automatikus száműzetés a Sötét
  # frakcióba (örök sötét paktummal). Raid alatt a hadviselők közti ölés nem bűn.
  sins:
    murder-counts: true
    exile-threshold: 4
  # ===== Királyok és választás =====
  # A frakciótagok a /faction king vote paranccsal szavaznak; min-votes elérése
  # után a listavezető trónra kerül. A ciklus lejártával a szavazatok törlődnek.
  kings:
    min-votes: 2
    term-days: 7
    excluded:
      - "NEUTRAL"
  # ===== Raid =====
  # Csak a király hirdethet raidet; a nevezési díj a kasszából megy (money sink).
  # A győztes (több ölés) a vesztes kasszájának spoils-percent %-át zsákmányolja.
  raid:
    duration-minutes: 15
    entry-cost: 200
    spoils-percent: 20
    protected:
      - "NEUTRAL"

relics:
  enabled: true
  # Inaktivitás-kezelés: a megadott számú nap után a relikvia törlődik
  # a tulajdonos inventoryjából belépéskor, és újra megszerezhetővé válik.
  inactivity:
    enabled: true
    expiry-days: 14
  # Fegyver-relikviák: PvP-ben gazdát cserélhetnek (a passzívak védettek).
  weapon-relics:
    - "metelytepo"
  pvp-transfer:
    enabled: true
  messages:
    cooldown: "&cA relikvia pihen: &f%seconds%s &cmaradék"
    expired: "&5A(z) &f%relic_name% &5relikvia a hosszú tétlenség miatt elenyészett, és újra megszerezhetővé vált."
  definitions:
    metelytepo:
      display-name: "Mételytépő"
      display-color: "&5"
      material: "NETHERITE_AXE"
      custom-model-data: 4101
      lore:
        - "&7A Mételytépő a törpék rejtélyes"
        - "&7civilizációjának ősi relikviája."
        - ""
        - "&7Ősi mágia övezi, melynek segítségével"
        - "&7ez a harci fejsze lesújt a bűnösökre,"
        - "&7igazságot szolgáltatva a világnak."
    phoenix_wing:
      display-name: "Főnix-szárny"
      display-color: "&c"
      lore:
        - "&7A Piros királyság lángoló ereklyéje."
        - "&7Viselőjét nem égeti tűz, és zuhanása"
        - "&7lángviharban végződik."
    frost_wing:
      display-name: "Zúzmara-szárny"
      display-color: "&b"
      lore:
        - "&7A Kék királyság jeges ereklyéje."
        - "&7Szárnyra kapva megfagyasztja"
        - "&7a körülötte lévőket."
    wander_wind:
