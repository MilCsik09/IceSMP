schema-version: 2
verified-on: "2026-08-10"
target:
  minecraft: "1.21.11"
  platform: "Paper/Folia 1.21.11"
  java: 21

# Runtime roles:
#   required-runtime     -> missing/incompatible plugin may block startup when enforcement is enabled
#   optional-integration -> inspected and version-checked when installed, but never startup-fatal
#   dev-only             -> development tooling only; ignored by runtime preflight
#   validation-only      -> compatibility/staging evidence only; ignored by runtime preflight
#
# Development provisioning is consumed only by development tooling. Production IceSMP never
# downloads plugins. Public artifacts use exact Modrinth project + version IDs; licensed/private
# or otherwise non-redistributable artifacts use a local developer directory.
plugins:
  LuckPerms:
    server-name: LuckPerms
    runtime-role: optional-integration
    accepted-versions: ["5.5.53"]
    verification: official-release
    source-page: "https://modrinth.com/plugin/luckperms/version/MBSY8toc"
    artifact-sha256: "REQUIRED_IN_DEPLOYMENT"
    dev-provision: modrinth
    dev-project: "luckperms"
    dev-version-id: "MBSY8toc"
  WorldEdit:
    server-name: WorldEdit
    runtime-role: optional-integration
    accepted-versions: ["7.4.4"]
    verification: official-release-folia
    source-page: "https://modrinth.com/plugin/worldedit/version/qNuPcliz"
    artifact-sha256: "REQUIRED_IN_DEPLOYMENT"
    dev-provision: modrinth
